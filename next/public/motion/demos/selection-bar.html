.sb { position: relative; width: 480px; padding: 20px 12px 0; overflow: hidden; background: #fff; color: #0B0C0D; border-radius: 20px;
  box-shadow: 0 0 0 1px rgba(11, 12, 13, .07), 0 12px 32px -16px rgba(11, 12, 13, .18);

<script data-code>
/* Selection bar. The selection is a Set of row indexes; render() derives the bar, the count, Rename's slot and the foot line from it. */
const sb = document.getElementById('sb'), sbBar = document.getElementById('sb-bar'), sbIn = document.getElementById('sb-in');
const sbLis = [...sb.querySelectorAll('.sb-li')], sbRows = [...sb.querySelectorAll('.sb-row')];
const sbLab = document.getElementById('sb-lab'), sbN = document.getElementById('sb-n'), sbL2 = document.getElementById('sb-l2'), sbRen = document.getElementById('sb-ren');
const sbHint = document.getElementById('sb-hint'), sbDel = document.getElementById('sb-del'), sbDelT = document.getElementById('sb-del-t'), sbLive = document.getElementById('sb-live');
const sel = new Set(); let sbAnchor = -1, sbBusy = null, sbBase = 0, sbRenW = 76;
const sbGone = new Set();

function sbSnap(el, fn) { el.classList.add('snap'); fn(); el.getBoundingClientRect(); el.classList.remove('snap'); }
function sbMeasure() {                              // widths of the bar with and without Rename's slot
  const ren = sbRen.firstElementChild;
  sbRenW = Math.ceil(ren.getBoundingClientRect().width) || 76;
  sbRen.style.setProperty('--rw', sbRenW + 'px');
  const w0 = sbRen.getBoundingClientRect().width;
  sbBase = Math.ceil(sbIn.getBoundingClientRect().width - w0);
}
function sbRoll(n, animate) {                       // the count's digit rolls up when it grows, down when it shrinks
  const old = sbN.lastElementChild, from = Number(old.textContent);
  if (n === from) return;
  if (!animate) { while (sbN.children.length > 1) sbN.firstElementChild.remove(); old.style.transition = 'none'; old.style.transform = 'none'; old.textContent = n; old.getBoundingClientRect(); old.style.transition = ''; return; }
  const up = n > from;
  const nu = document.createElement('b'); nu.textContent = n;
  nu.style.transition = 'none'; nu.style.transform = `translateY(${up ? 110 : -110}%)`;
  sbN.appendChild(nu); nu.getBoundingClientRect();
  nu.style.transition = ''; nu.style.transform = 'none';
  old.style.transform = `translateY(${up ? -110 : 110}%)`;
  setTimeout(() => { if (old.parentNode && old !== sbN.lastElementChild) old.remove(); }, 460);
  while (sbN.children.length > 3) sbN.firstElementChild.remove();
}
function sbLayer(el, show) {                        // a foot line is below, in, or above (left)
  const p = el.dataset.p, now = performance.now();
  if (show) {
    if (p !== 'in') {
      if (p === 'above' && now - (el._left || 0) > 240) sbSnap(el, () => { el.dataset.p = 'below'; });
      el.dataset.p = 'in';
    }
  } else if (p === 'in') { el.dataset.p = 'above'; el._left = now; }
  el.inert = !show;
}
function sbRender() {
  const n = sel.size, on = n > 0, wasOn = sbBar.dataset.s === 'on', one = n === 1;
  if (on) {
    const w = sbBase + (one ? sbRenW : 0);
    const put = () => {
      sbRen.dataset.open = one ? '1' : '0'; sbRen.firstElementChild.tabIndex = one ? 0 : -1;
      sbBar.style.width = w + 'px'; sbBar.style.marginLeft = (-w / 2) + 'px';
      if (!wasOn) { sbLab.classList.remove('is-done'); sbBusy = null; sbRoll(n, false); }
    };
    if (wasOn) { put(); sbRoll(n, true); } else sbSnap(sbBar, put);   // coming up, the bar is already the right width
  }
  sbBar.dataset.s = on ? 'on' : 'off'; sbBar.inert = !on;
  sbLayer(sbHint, !on && !sbGone.size);              // the foot: the hint, or the deleted line, or nothing while the bar is up
  sbLayer(sbDel, !on && sbGone.size > 0);
  sbDelT.textContent = `${sbGone.size} file${sbGone.size === 1 ? '' : 's'} deleted`;
  sbLive.textContent = on ? `${n} file${n === 1 ? '' : 's'} selected` : (sbGone.size ? sbDelT.textContent : '');
}
function sbSet(i, on, delay = 0) {
  const r = sbRows[i];
  r.style.setProperty('--d', delay + 'ms');
  r.setAttribute('aria-checked', String(on));
  on ? sel.add(i) : sel.delete(i);
}
function sbClick(i, shift) {
  if (sbGone.has(i)) return;
  if (sbBusy) { clearTimeout(sbBusy); sbBusy = null; sbLab.classList.remove('is-done'); }
  if (shift && sbAnchor >= 0 && sbAnchor !== i) {
    const a = Math.min(sbAnchor, i), b = Math.max(sbAnchor, i); let k = 0;
    for (let j = a; j <= b; j++) if (!sbGone.has(j)) { if (!sel.has(j)) sbSet(j, true, 30 * k++); }

    sbSet(i, !sel.has(i));
    sbAnchor = i;
  }

}
function sbClear() { clearTimeout(sbBusy); sbBusy = null; [...sel].forEach((j) => sbSet(j, false)); sbAnchor = -1; sbRender(); }
sbRows.forEach((r, i) => r.addEventListener('click', (e) => sbClick(i, e.shiftKey)));
document.getElementById('sb-clear').addEventListener('click', sbClear);
sb.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape' || !sel.size) return;
  e.stopPropagation(); sbClear();
  const r = sbRows.find((_, j) => !sbGone.has(j)); if (r) r.focus({ preventScroll: true });
});
sbBar.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {   // a done label rolls in, then the selection clears
  if (sbBusy || !sel.size) return;
  sbL2.textContent = b.dataset.act === 'Renaming' ? 'Renaming' : `${b.dataset.act} ${sel.size}`;
  sbLab.classList.add('is-done');
  sbBusy = setTimeout(() => { sbBusy = null; sbClear(); }, 1200);
}));
document.getElementById('sb-delete').addEventListener('click', () => {
  if (!sel.size) return;
  [...sel].sort().forEach((j) => { sbGone.add(j); sbSet(j, false); sbLis[j].classList.add('gone'); sbLis[j].inert = true; });
  sbAnchor = -1; sbRender();
});

  [...sbGone].forEach((j, k) => setTimeout(() => { sbLis[j].classList.remove('gone'); sbLis[j].inert = false; }, 30 * k));
  sbGone.clear(); sbRender();
});
document.fonts && document.fonts.ready.then(() => { sbSnap(sbBar, () => { sbMeasure(); sbRender(); }); });
sbMeasure(); sbSnap(sbBar, () => sbRender());
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function tap(my, el, hold = 240, shift = false) {
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + Math.min(r.width * 0.5, 30), r.top + r.height * 0.55, 720))) throw 0;
    if (my !== epoch) throw 0;
    el.classList.add('is-hot');
    await gap(my, 160);
    el.style.transform = 'translateY(1px)';
    await gap(my, 110);
    el.style.transform = '';
    el.classList.remove('is-hot');
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, shiftKey: shift }));
    await gap(my, hold);
  }
  function rest() {                                   // clean list; reduced motion rests with two rows selected
    sb.classList.add('still');
    if (sbBusy) { clearTimeout(sbBusy); sbBusy = null; }
    sbLab.classList.remove('is-done');
    [...sbGone].forEach((j) => { sbLis[j].classList.remove('gone'); sbLis[j].inert = false; });
    sbGone.clear();
    [...sel].forEach((j) => sbSet(j, false)); sbAnchor = -1;
    sbSnap(sbBar, () => sbRender());
    if (reduced) { sbSet(0, true); sbSet(1, true); sbAnchor = 1; sbSnap(sbBar, () => sbRender()); }
    sb.getBoundingClientRect(); sb.classList.remove('still');
    if (document.activeElement && sb.contains(document.activeElement)) document.activeElement.blur();
  }
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      for (;;) {
        await gap(my, 900);
        await tap(my, sbRows[0], 800);                        // one selected: Rename is there
        await tap(my, sbRows[1], 1000);                       // two: the count rolls, Rename closes
        await tap(my, sbRows[3], 1600, true);                 // shift-click: a range of four
        await tap(my, document.getElementById('sb-clear'), 1500);   // the bar goes down
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!sb.matches(':hover') && !sb.contains(document.activeElement)) { rest(); script(); } else { touch({}); } }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(); if (!reduced) script(); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (reduced) rest(); else script(); }, 300));
})();
</script>
