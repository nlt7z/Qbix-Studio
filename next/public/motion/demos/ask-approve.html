<script data-code>
/* The gate: open the request, then fold it into the log line the decision becomes. */
const AA = (() => {
  const $ = (id) => document.getElementById(id);
  const panel = $('aa'), rq = $('aa-rq'), line = $('aa-line'), row = $('aa-row'), stack = $('aa-stack');
  let decided = false;
  const at = (i) => { stack.style.transform = `translateY(${-i * 1.3}em)`; };
  function reset() {
    panel.classList.add('nt');
    rq.classList.remove('is-open', 'is-fold');
    line.classList.add('is-shut');
    row.classList.remove('done', 'stop');
    at(0);
    decided = false;
    void panel.offsetWidth;
    panel.classList.remove('nt');
  }
  const ask = () => rq.classList.add('is-open');
  function decide(ok) {
    if (decided || !rq.classList.contains('is-open')) return;
    decided = true;
    rq.classList.add('is-fold');
    rq.classList.remove('is-open');
    line.classList.remove('is-shut');
    if (ok) {
      at(0);
      setTimeout(() => { at(1); row.classList.add('done'); }, 1900);
    } else {
      at(2);
      row.classList.add('stop');
    }
  }
  $('aa-ok').addEventListener('click', () => decide(true));
  $('aa-deny').addEventListener('click', () => decide(false));
  return { reset, ask, decide };
})();
</script>
<script>
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const okBtn = document.getElementById('aa-ok');
  let run = 0, resumeT = 0;
  async function start() {
    const my = ++run;
    AA.reset();
    if (QM.reduced) { AA.ask(); document.getElementById('aa-rq').style.transition = 'none'; return; }
    QM.ghostShow();
    await w(900); if (my !== run) return;
    AA.ask();
    await w(1500); if (my !== run) return;
    const r = okBtn.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * .55, r.top + r.height * .6, 800))) return;
    if (my !== run) return;
    okBtn.classList.add('press');
    await w(160); if (my !== run) return;
    okBtn.classList.remove('press');
    AA.decide(true);
    await w(300); if (my !== run) return;
    QM.ghostTo(r.left + r.width + 120, r.top + r.height + 60, 900);
    await w(4300); if (my !== run) return;
    start();
  }
  const takeOver = () => { if (QM.tile) return; run++; QM.ghostHide(); clearTimeout(resumeT); resumeT = setTimeout(start, 7000); };
  addEventListener('pointerdown', takeOver, true);
  addEventListener('keydown', takeOver, true);
  QM.demo({ kind: 'loop', restart: start });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(start));
</script>
