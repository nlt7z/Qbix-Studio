<script data-code>
/* Enrich column. ecRun is the run token: starting, stopping or clearing bumps it, so every pending step of an older run just ends.
   A cell is data-s: empty, shim (working), typing, done. */
const ec = document.getElementById('ec'), ecAct = document.getElementById('ec-act'), ecCnt = document.getElementById('ec-cnt');
const ecNum = document.getElementById('ec-n'), ecLive = document.getElementById('ec-live');
const ecCells = [...ec.querySelectorAll('.ec-c')], ecLabels = [...ecAct.querySelectorAll('.ec-al')];
const EC_ROWS = [['Next.js · Vercel', 3], ['Shopify', 3], ['Webflow', 2], ['Framer', 3]];
const EC_LV = ['', 'Low confidence', 'Medium confidence', 'High confidence'];
const EC_STATES = ['idle', 'busy', 'done'];
let ecRun = 0, ecCount = 0, ecState = 'idle', ecWait = [];
const ecSnap = (fn) => { ec.classList.add('snap'); ecAct.classList.add('snap'); fn(); ec.getBoundingClientRect(); ec.classList.remove('snap'); ecAct.classList.remove('snap'); };
const ecW = (my, ms) => new Promise((r) => { const t = setTimeout(() => r(my === ecRun), ms); ecWait.push(t); });

function ecRoll(txt, dir, snap) {                    // dir +1 brings the new number from below
  const last = ecNum.lastElementChild;
  if (last && last.textContent === txt) return;
  if (snap || !last) { ecNum.innerHTML = '<i>' + txt + '</i>'; return; }
  const n = document.createElement('i');
  n.textContent = txt; n.style.transform = `translateY(${dir * 100}%)`;
  ecNum.appendChild(n); ecNum.getBoundingClientRect();
  [...ecNum.children].forEach((c) => { if (c !== n) c.style.transform = `translateY(${-dir * 100}%)`; });
  n.style.transform = 'none';
  setTimeout(() => { [...ecNum.children].forEach((c) => { if (c !== ecNum.lastElementChild) c.remove(); }); }, 460);
}
function ecCount_(n, dir, snap) {
  ecCount = n; ecRoll(String(n), dir, snap);
  ecCnt.classList.toggle('on', n > 0 || ecState === 'busy');
  ecLive.textContent = ecState === 'idle' && n === 0 ? '' : `Stack: ${n} of 4 filled`;
}
/* the one action: its label layers go up when the state advances and down when it goes back; its width follows the label */
function ecSetState(s, snap) {
  const i = EC_STATES.indexOf(s);
  ecState = s; ec.dataset.s = s;
  const lab = ecLabels[i], w = Math.ceil(lab.offsetWidth) + 24;
  ecAct.style.width = w + 'px';
  ecLabels.forEach((l, k) => { l.dataset.p = k === i ? 'in' : k < i ? 'above' : 'below'; });
  ecAct.dataset.s = s;
  ecAct.setAttribute('aria-label', s === 'idle' ? 'Fill Stack with agent' : s === 'busy' ? 'Stop filling' : 'Clear Stack');
  ecCnt.classList.toggle('on', ecCount > 0 || s === 'busy');
}
function ecSet(k, s) { ecCells[k].dataset.s = s; }
function ecFillDots(k) {
  const cf = ecCells[k].querySelector('.ec-cf'), n = EC_ROWS[k][1];
  cf.innerHTML = [0, 1, 2].map((d) => (d < n ? '<i></i>' : '<i class="o"></i>')).join('');
  cf.setAttribute('aria-label', EC_LV[n]);
}
function ecShow(k, snap) {                           // a finished cell, instantly
  const c = ecCells[k];
  c.querySelector('.ec-vt').textContent = EC_ROWS[k][0]; ecFillDots(k); ecSet(k, 'done');
}
function ecWipe(k) {                                 // the value leaves under its clip, then its text goes
  ecSet(k, 'empty');
  setTimeout(() => { if (ecCells[k].dataset.s === 'empty') { ecCells[k].querySelector('.ec-vt').textContent = ''; ecCells[k].querySelector('.ec-cf').innerHTML = ''; } }, 260);
}

async function ecCell(my, k, delay) {
  if (!(await ecW(my, delay))) return;
  ecSet(k, 'shim');
  if (!(await ecW(my, 640))) return;
  const c = ecCells[k], vt = c.querySelector('.ec-vt'), text = EC_ROWS[k][0];
  c.querySelector('.ec-cf').innerHTML = ''; vt.textContent = '';
  ecSet(k, 'typing');                                // the shimmer line leaves first, then the characters
  if (!(await ecW(my, 200))) return;
  for (let i = 1; i <= text.length; i++) {
    vt.textContent = text.slice(0, i);
    if (!(await ecW(my, 22 + (i % 3) * 4))) return;
  }
  if (!(await ecW(my, 90))) return;
  ecFillDots(k); c.getBoundingClientRect(); ecSet(k, 'done');
  ecCount_(ecCount + 1, 1);
}
async function ecStart() {
  if (ecState === 'busy') return;
  ecWait.forEach(clearTimeout); ecWait = [];
  const my = ++ecRun;
  ecSetState('busy'); ecCount_(ecCount, 1);
  const todo = ecCells.map((c, k) => k).filter((k) => ecCells[k].dataset.s !== 'done');
  await Promise.all(todo.map((k, j) => ecCell(my, k, 180 + j * 520)));
  if (my !== ecRun) return;
  ecSetState('done');
  ecLive.textContent = 'Stack filled: 4 of 4';
}
function ecStop() {                                  // busy -> idle: working cells retract, finished ones stay
  ecRun++; ecWait.forEach(clearTimeout); ecWait = [];
  ecCells.forEach((c, k) => { if (c.dataset.s === 'shim' || c.dataset.s === 'typing') ecWipe(k); });
  ecSetState('idle');
}
function ecClear() {                                 // values leave upward, last row first
  ecRun++; ecWait.forEach(clearTimeout); ecWait = [];
  const my = ecRun;
  for (let k = ecCells.length - 1; k >= 0; k--) setTimeout(() => { if (my === ecRun) ecWipe(k); }, (ecCells.length - 1 - k) * 60);
  ecSetState('idle'); ecCount_(0, -1);
}
ecAct.addEventListener('click', () => { if (ecState === 'idle') ecStart(); else if (ecState === 'busy') ecStop(); else ecClear(); });

ecSetState('idle', true); ecAct.style.width = Math.ceil(ecLabels[0].offsetWidth) + 24 + 'px'; ecCount_(0, 1, true);
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0, first = true;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function toEl(my, el, ms, fx = 0.5) { const r = el.getBoundingClientRect(); if (!(await QM.ghostTo(r.left + r.width * fx, r.top + r.height * 0.6, ms)) || my !== epoch) throw 0; }
  function rest() {                                    // reduced motion and a tile: filled (the tile's still); otherwise: empty
    const filled = reduced || QM.tile;
    ecRun++; ecWait.forEach(clearTimeout); ecWait = [];
    ecSnap(() => {
      ecCells.forEach((c, k) => { if (filled) ecShow(k); else { ecSet(k, 'empty'); c.querySelector('.ec-vt').textContent = ''; c.querySelector('.ec-cf').innerHTML = ''; } });
      ecCount = filled ? 4 : 0; ecSetState(filled ? 'done' : 'idle'); ecCount_(ecCount, 1, true);
      if (filled) ecLive.textContent = 'Stack filled: 4 of 4';
    });
    if (document.activeElement && ec.contains(document.activeElement)) document.activeElement.blur();
  }
  async function script() {
    const my = ++epoch;
    try {
      if (QM.tile && first) { first = false; await gap(my, 3600); }
      QM.ghostShow();
      if (ecState === 'done') ecClear(); else if (ecState === 'busy') ecStop();
      for (;;) {
        await gap(my, 1100);
        if (ecCount > 0 && ecState === 'idle') { ecCells.forEach((c, k) => { if (c.dataset.s === 'done') ecWipe(k); }); ecCount_(0, -1); }
        await toEl(my, ecAct, 820, 0.45); await gap(my, 260);
        ecStart();
        while (ecState !== 'done') await gap(my, 120);
        { const r = ec.getBoundingClientRect(); if (!(await QM.ghostTo(r.right - 40, r.bottom + 36, 760)) || my !== epoch) throw 0; }
        await gap(my, 5200);
        await toEl(my, ecAct, 760, 0.5); await gap(my, 260);
        ecClear(); await gap(my, 1200);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!ec.matches(':hover') && !ec.contains(document.activeElement)) script(); else touch({}); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(); if (!reduced) script(); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (reduced || QM.tile) rest(); if (!reduced) script(); }, 300));
})();
</script>
