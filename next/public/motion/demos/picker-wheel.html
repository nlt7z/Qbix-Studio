:where(.pw-card button) { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }

.pw-pt { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #86868b; }

/* the picker: three wheels and one wash across the middle */
.pw-picker { position: relative; height: 168px; margin-top: 14px; display: grid; grid-template-columns: 136px 1fr 56px 14px 56px; padding: 0 18px 0 24px; }
.pw-pill { position: absolute; left: 0; right: 0; top: 50%; height: 40px; margin-top: -20px; border-radius: 10px; background: rgba(0, 0, 0, .05); pointer-events: none;
  transition: transform 100ms cubic-bezier(.4, 0, .2, 1), background 100ms cubic-bezier(.4, 0, .2, 1); }

.pw-colon { grid-column: 4; grid-row: 1; align-self: center; position: relative; z-index: 1; height: 36px; display: grid; place-items: center; pointer-events: none;
  font: 500 21px/36px var(--pw-f); padding-bottom: 3px; }

/* a wheel: one perspective; the drum inside it is turned, the rows sit on it */
.pw-wheel { grid-row: 1; grid-column: var(--c); position: relative; height: 168px; overflow: hidden; perspective: 560px; border-radius: 10px; cursor: grab; touch-action: none; outline: none; }

  backface-visibility: hidden; white-space: nowrap; font: 400 20px/36px var(--pw-f); letter-spacing: -.016em; font-variant-numeric: tabular-nums; }

<script data-code>
/* Picker wheel. Each wheel's position is one float (in rows). draw() turns the drum and sets every row's ink from it.
   Release projects the velocity with d = 0.998 and springs to the nearest row, starting at the release velocity. */
const PW = (() => {
  const ROW = 36, R = 96, STEP = ROW / R, EDGE = 168, SLOP = 6;           // row height at the front, drum radius, radians a row, wheel height, px before a drag
  const DECEL = 0.998, LOOK = DECEL / (1 - DECEL) / 1000;                 // 0.499 s: where a release would coast to
  const OMEGA = (2 * Math.PI) / 0.4;                                      // spring response 0.4 s
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const pad = (n) => String(n).padStart(2, '0');

  // weekdays from Fri 20 Nov 2026 (Thu 19 is today, the first row)
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const days = [];
  for (let t = Date.UTC(2026, 10, 19); days.length < 14; t += 864e5) {
    const d = new Date(t), w = d.getUTCDay();
    if (w > 0 && w < 6) days.push(`${WD[w]} ${d.getUTCDate()} ${MO[d.getUTCMonth()]}`);
  }
  const hours = Array.from({ length: 11 }, (_, i) => 8 + i), mins = Array.from({ length: 12 }, (_, i) => i * 5);
  const DATA = [
    { name: 'Day', labels: days, vals: days.map((_, i) => i + 1), start: 1, part: 's-d' },
    { name: 'Hour', labels: hours.map(pad), vals: hours, start: 2, part: 's-h' },
    { name: 'Minute', labels: mins.map(pad), vals: mins, start: 6, part: 's-m' },
  ];
  const picker = document.getElementById('pw-picker'), book = document.getElementById('pw-book'), msg = document.getElementById('pw-msg');
  const $ = (id) => document.getElementById('pw-' + id);

  const wheels = ['day', 'hour', 'min'].map((id, k) => {
    const el = $(id), D = DATA[k];
    const w = { el, k, n: D.labels.length, labels: D.labels, vals: D.vals, name: D.name, sum: $(D.part), idx: D.start, target: D.start, pos: D.start, vel: 0, mode: 'rest', s: null, wt: 0 };
    el.innerHTML = '<div class="pw-drum">' + D.labels.map((l, i) =>
      `<div class="pw-row" data-i="${i}" aria-hidden="true" style="transform:rotateX(${(-i * STEP).toFixed(5)}rad) translateZ(${R}px)"><span>${l}</span></div>`).join('') + '</div>';
    w.drum = el.firstChild;
    w.rows = [...el.querySelectorAll('.pw-row')];
    w.spans = w.rows.map((r) => r.firstChild);
    w.st = w.rows.map(() => ({ o: -1, sc: -1, sel: null, v: true }));
    el.setAttribute('aria-valuemin', String(w.vals[0])); el.setAttribute('aria-valuemax', String(w.vals[w.n - 1]));
    aria(w);
    return w;
  });
  function aria(w) {
    w.el.setAttribute('aria-valuenow', String(w.vals[w.idx]));
    w.el.setAttribute('aria-valuetext', w.labels[w.idx]);
  }

  // shown position: past the first or last row the drum resists (x·D·0.55)/(D + 0.55·|x|), in px
  const rb = (x) => (x * ROW * EDGE * 0.55) / (EDGE + 0.55 * x * ROW) / ROW;
  const disp = (w, p) => (p < 0 ? -rb(-p) : p > w.n - 1 ? w.n - 1 + rb(p - (w.n - 1)) : p);

  function draw(w) {
    const p = disp(w, w.pos);
    w.drum.style.transform = `translateZ(${-R}px) rotateX(${(p * STEP).toFixed(5)}rad)`;
    for (let i = 0; i < w.n; i++) {
      const d = Math.abs(i - p), st = w.st[i], row = w.rows[i];
      if (d > 3.1) { if (st.v) { row.style.visibility = 'hidden'; st.v = false; } continue; }
      if (!st.v) { row.style.visibility = ''; st.v = true; }
      const o = +Math.pow(1 - d / 3.1, 1.5).toFixed(3);
      if (o !== st.o) { row.style.opacity = o; st.o = o; }
      const sc = +(1 + 0.1 * Math.max(0, 1 - d)).toFixed(3);
      if (sc !== st.sc) { w.spans[i].style.transform = sc > 1 ? `scale(${sc})` : ''; st.sc = sc; }
      const sel = d < 0.5;
      if (sel !== st.sel) { row.classList.toggle('is-sel', sel); st.sel = sel; }
    }
  }

  // the settled value: aria, the summary line, and Book call back to itself
  function commit(w) {
    if (w.idx === w.target) return;
    const dir = Math.sign(w.target - w.idx);
    w.idx = w.target;
    aria(w);
    roll(w.sum, w.labels[w.idx], dir);
    unbook();
    msg.textContent = `${days[wheels[0].idx]}, ${pad(hours[wheels[1].idx])}:${pad(mins[wheels[2].idx])}`;
  }

  /* critically damped spring: x(t) = T + (A + B·t)·e^(−ωt), A = distance on screen, B = v + ωA. It starts from the position and velocity
     on screen. A throw picks ω = 1.5·v / distance, which starts decelerating and never crosses the target (floor 3, cap = the taps' ω);
     against an end the cap wins and it overshoots into the rubber band. A retarget without a throw caps the velocity at ω·distance. */
  let raf = 0;
  const kick = () => { if (!raf) raf = requestAnimationFrame(tick); };
  function springTo(w, T, v0 = 0, thrown = false) {
    T = clamp(Math.round(T), 0, w.n - 1);
    w.target = T; clearTimeout(w.wt);
    if (reduced) { w.pos = T; w.vel = 0; w.s = null; w.mode = 'rest'; draw(w); commit(w); return; }
    const A = w.pos - T;
    let om = OMEGA, v = v0;
    if (thrown && v * A < 0) om = clamp((1.5 * Math.abs(v)) / Math.abs(A), 3, OMEGA);
    else if (A > 0) v = Math.max(v, -om * A);
    else if (A < 0) v = Math.min(v, -om * A);
    else v = 0;
    if (A === 0 && v === 0) { w.pos = T; w.vel = 0; w.s = null; w.mode = 'rest'; draw(w); commit(w); return; }
    w.s = { T, A, B: v + om * A, w: om, t0: performance.now() };
    w.mode = 'spring';
    kick();
  }
  function tick(now) {
    raf = 0;
    let live = false;
    for (const w of wheels) {
      if (w.mode !== 'spring' || !w.s) continue;
      const s = w.s, t = Math.max(0, (now - s.t0) / 1000), e = Math.exp(-s.w * t);
      const x = s.T + (s.A + s.B * t) * e, v = (s.B - s.w * (s.A + s.B * t)) * e;
      if (t > 5 || (Math.abs(x - s.T) < 0.004 && Math.abs(v) < 0.05)) {
        w.pos = s.T; w.vel = 0; w.s = null; w.mode = 'rest'; draw(w); commit(w);
      } else { w.pos = x; w.vel = v; draw(w); live = true; }
    }
    if (live) kick();
  }

  /* one hand: a pointer or the ghost, both through down / move / up. y is client px, t is ms. */
  let drag = null;
  function down(w, y, t, rowEl, ghost = false) {
    if (drag) up(t);
    const moving = w.mode === 'spring' && Math.abs(w.vel) > 0.6;
    clearTimeout(w.wt);
    if (w.mode === 'spring') { w.mode = 'hold'; w.s = null; }                    // caught where it is
    drag = { w, y0: y, p0: w.pos, s: [[t, w.pos]], on: false, row: rowEl ? +rowEl.dataset.i : -1, moving, ghost };
    picker.classList.add('is-press');                                            // the pill dips on the press
  }
  function move(y, t) {
    if (!drag) return;
    const d = drag, w = d.w, dy = y - d.y0;
    if (!d.on) {
      if (Math.abs(dy) < SLOP) return;
      d.on = true; w.mode = 'drag'; w.vel = 0; w.el.classList.add('is-drag');
    }
    let p = d.p0 - dy / ROW;                                                     // 1:1 from where it was grabbed
    if (reduced) p = clamp(p, 0, w.n - 1);
    w.pos = p;
    d.s.push([t, p]);
    while (d.s.length > 2 && t - d.s[0][0] > 100) d.s.shift();
    draw(w);
  }
  function up(t) {
    if (!drag) return;
    const d = drag, w = d.w;
    drag = null;
    picker.classList.remove('is-press'); w.el.classList.remove('is-drag');
    if (d.on) {
      let v = 0;
      const b = d.s[d.s.length - 1];
      let a = d.s[0];
      for (const q of d.s) if (b[0] - q[0] <= 80) { a = q; break; }
      if (b[0] - a[0] > 8 && t - b[0] < 80) v = clamp(((b[1] - a[1]) / (b[0] - a[0])) * 1000, -60, 60);   // rows/s, positive = next rows
      if (reduced) { springTo(w, Math.round(w.pos)); return; }
      springTo(w, w.pos + v * LOOK, v, Math.abs(v) > 0.4);
    } else if (d.moving) springTo(w, Math.round(w.pos));                         // a tap on a spinning wheel only stops it
    else if (d.row >= 0) springTo(w, d.row);
    else springTo(w, w.target);
  }

  // a real pointer: move and up are heard on the window; capture starts with the drag
  let ptr = null;
  const pmove = (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    const was = drag && drag.on;
    move(e.clientY, e.timeStamp);
    if (!was && drag && drag.on) { try { ptr.w.el.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ } }
  };
  const pend = (e) => {
    if (!ptr || e.pointerId !== ptr.id) return;
    ptr = null;
    removeEventListener('pointermove', pmove); removeEventListener('pointerup', pend); removeEventListener('pointercancel', pend);
    up(e.timeStamp);
  };
  wheels.forEach((w) => {
    w.el.addEventListener('pointerdown', (e) => {
      if (e.button > 0 || ptr) return;
      ptr = { id: e.pointerId, w };
      w.el.focus({ preventScroll: true });
      down(w, e.clientY, e.timeStamp, e.target.closest('.pw-row'));
      addEventListener('pointermove', pmove); addEventListener('pointerup', pend); addEventListener('pointercancel', pend);
    });

    // wheel: a notch steps rows; a trackpad's small deltas move the drum and it settles 90 ms after the last one
    w.el.addEventListener('wheel', (e) => {
      if (e.ctrlKey) return;
      e.preventDefault();
      if (drag && drag.w === w) return;
      const dy = e.deltaMode === 1 ? e.deltaY * ROW : e.deltaMode === 2 ? e.deltaY * EDGE : e.deltaY;
      if (e.deltaMode || Math.abs(dy) >= 50) { springTo(w, w.target + Math.sign(dy) * Math.max(1, Math.round(Math.abs(dy) / 100)), w.vel); return; }
      if (w.mode === 'spring') { w.mode = 'hold'; w.s = null; }
      w.mode = 'wheel';
      let dp = dy / ROW;
      if ((w.pos < 0 && dp < 0) || (w.pos > w.n - 1 && dp > 0)) dp *= 0.4;
      w.pos = reduced ? clamp(w.pos + dp, 0, w.n - 1) : clamp(w.pos + dp, -1.5, w.n - 0.5);
      draw(w);
      clearTimeout(w.wt);
      w.wt = setTimeout(() => springTo(w, Math.round(w.pos)), 90);
    }, { passive: false });

    // keys: Up is the next row (as a native time field), Page steps 3, Home and End jump, Left and Right change wheel
    w.el.addEventListener('keydown', (e) => {
      const k = e.key, cur = w.target;
      let to = null;
      if (k === 'ArrowUp') to = cur + 1; else if (k === 'ArrowDown') to = cur - 1;
      else if (k === 'PageUp') to = cur + 3; else if (k === 'PageDown') to = cur - 3;
      else if (k === 'Home') to = 0; else if (k === 'End') to = w.n - 1;
      else if (k === 'ArrowLeft' || k === 'ArrowRight') {
        const nb = wheels[w.k + (k === 'ArrowRight' ? 1 : -1)];
        if (nb) { e.preventDefault(); nb.el.focus(); }
        return;
      } else return;
      e.preventDefault();
      const c = clamp(to, 0, w.n - 1);
      if (c === cur && !reduced && (k === 'ArrowUp' || k === 'ArrowDown') && w.mode === 'rest') {   // against an end: a nudge, then back
        w.pos += (k === 'ArrowUp' ? 1 : -1) * 0.3; draw(w);
      }
      springTo(w, c, w.vel);
    });
  });

  /* text that changes rolls inside its clip: the old line leaves up and the new one arrives from below (reversed when the value fell) */
  function roll(el, text, dir = 1) {
    const cur = el.lastElementChild;
    if (cur.textContent === text) return;
    if (!cur.animate) { cur.textContent = text; return; }
    if (reduced) { cur.textContent = text; cur.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160 }); return; }
    const w0 = el.offsetWidth;
    while (el.children.length > 2) el.firstElementChild.remove();
    const nb = document.createElement('b'); nb.textContent = text; el.appendChild(nb);
    const o = { duration: 420, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' };
    if (el.hasAttribute('data-fit')) {          // a slot that follows its text: the width runs from the old line to the new one, so nothing after it jumps
      nb.style.justifySelf = 'start'; const w1 = nb.offsetWidth; nb.style.justifySelf = '';
      el.animate([{ width: w0 + 'px' }, { width: w1 + 'px' }], o).finished.then(() => { el.style.width = ''; }, () => {});
      el.style.width = w1 + 'px';
    }
    cur.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-110 * dir}%)` }], o).finished.then(() => cur.remove(), () => {});
    nb.animate([{ transform: `translateY(${110 * dir}%)` }, { transform: 'translateY(0)' }], o);
  }
  let booked = false;
  function unbook() { if (booked) { booked = false; book.classList.remove('is-booked'); roll($('book-t'), 'Book call', -1); } }
  book.addEventListener('click', () => {
    if (booked) return;
    booked = true; book.classList.add('is-booked'); roll($('book-t'), 'Booked');
    msg.textContent = `Booked ${days[wheels[0].idx]} at ${pad(hours[wheels[1].idx])}:${pad(mins[wheels[2].idx])}`;
  });

  wheels.forEach(draw);
  return {
    wheels, down, move, up, springTo, book,
    get drag() { return drag; },
    reset() { wheels.forEach((w) => springTo(w, DATA[w.k].start)); },
    release() { if (drag && drag.ghost) up(performance.now()); },
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const [day, hour, min] = PW.wheels;
  let epoch = 0, resumeT = 0;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const centre = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

  // the ghost holds a wheel at its centre and moves dy px over ms through PW.down / move / up, as a hand does.
  // 'flick' accelerates and lets go at speed; 'ease' arrives and rests before it lets go
  async function hand(my, wh, dy, ms, kind) {
    const [x, y0] = centre(wh.el);
    if (!(await QM.ghostTo(x, y0, 760))) throw 0;
    await gap(my, 160);
    PW.down(wh, y0, performance.now(), wh.rows[Math.round(wh.pos)], true);
    await new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (my !== epoch) return res();
        const p = Math.min(1, (now - t0) / ms), k = kind === 'flick' ? Math.pow(p, 1.5) : mv(p);
        const y = y0 + dy * k;
        QM.ghostAt(x, y); PW.move(y, now);
        if (p < 1) requestAnimationFrame(f); else res();
      };
      requestAnimationFrame(f);
    });
    if (my !== epoch) throw 0;
    if (kind !== 'flick') await gap(my, 130);
    PW.up(performance.now());
  }
  async function tapRow(my, wh, i) {
    const row = wh.rows[i], [x, y] = centre(row);
    if (!(await QM.ghostTo(x, y, 720))) throw 0;
    await gap(my, 160);
    PW.down(wh, y, performance.now(), row, true);
    await gap(my, 110);
    PW.up(performance.now());
    await gap(my, 300);
  }
  async function tapBook(my) {
    const b = PW.book, [x, y] = centre(b);
    if (!(await QM.ghostTo(x + 40, y, 720))) throw 0;
    b.classList.add('is-hot'); await gap(my, 190);
    b.classList.add('is-press'); await gap(my, 110);
    b.classList.remove('is-press', 'is-hot'); b.click(); await gap(my, 300);
  }
  function rest() {
    PW.release();
    PW.reset();
    if (document.activeElement && document.activeElement.closest && document.activeElement.closest('.pw-card')) document.activeElement.blur();
  }
  async function script() {
    const my = ++epoch;
    try {
      await gap(my, QM.tile ? 2300 : 1500);
      QM.ghostShow();
      for (;;) {
        await hand(my, day, -44, 230, 'flick');                // a flick: the day wheel spins on and eases in
        await gap(my, 2300);
        await hand(my, hour, -98, 1000, 'ease');               // a slow drag, hour by hour
        await gap(my, 800);
        await tapRow(my, min, Math.min(min.n - 1, min.target + 2));
        await gap(my, 1000);
        await tapBook(my);                                     // Booked
        await QM.ghostTo(innerWidth * 0.84, innerHeight * 0.9, 700);
        await gap(my, 2400);
        PW.reset();                                            // the wheels roll back, Book call returns
        await gap(my, 2200);
      }
    } catch (e) { /* cancelled */ } finally { if (my !== epoch) PW.release(); }
  }
  function stopScript() { epoch++; QM.ghostHide(); PW.release(); PW.book.classList.remove('is-hot', 'is-press'); }
  if (!QM.tile && !reduced) {
    const idle = () => PW.wheels.some((x) => x.el === document.activeElement || x.el.matches(':hover')) || PW.book.matches(':hover') || PW.drag;
    const touch = (e) => {
      if (e && e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) { rest(); script(); } else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('wheel', touch, { passive: true });
    addEventListener('keydown', () => touch());
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(); if (!reduced) script(); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(script, 300));
})();
</script>
</body>
