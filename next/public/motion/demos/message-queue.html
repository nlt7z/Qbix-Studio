/* Message queue. One world, stepped by one clock (simStep): the agent's run, the springs, the later() timers. render() writes it.
   Every moving thing is a critically damped spring that starts from the value and velocity on screen:
   · the tray height TH, the field height FH, the count roll CN and the thread's jump offset OJ;
   · every chip: its rect is its destination's rect (a slot in the tray, the text in the field, a bubble in the thread, or a fixed rect) plus an offset
     spring on x, y, width and height that decays to 0, so a chip can leave from any rect on screen and a destination can move under it (the tray grows, the thread scrolls)
     without the chip lagging; its look (padding, background, radius) is two more springs, lr (row-ness) and lb (bubble-ness);
   · a row's slot index changing (a neighbour left, a drag passed it) only adds the difference to its offset, so it parts and closes up on its own spring. */
const MQ = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, R = (s) => TAU / s;                               // a response in seconds as an angular frequency
  const W = 720, HEAD = 48, CX = 80, CR = 640, BC = 432, LINE = 22, FH0 = 52, THD = 30, ROWH = 40, TPAD = 4, ROWX = 88, ROWW = 544, MAXQ = 4;
  const TP = 12, GAPB = 14, GAPL = 22, GAPC = 14, ACKH = 22, ACKG = 12, WLH = 24, SRH = 24, SRP = 6;                             // thread: top pad, bubble to line, line to next bubble, last item to composer
  const LOOK = 0.099, FLICK = 140, SLOP = 6, DB = 50;                        // projection (d = 0.99), px/s that is projected, px before a drag, rubber-band dimension
  const OMT = R(0.4), OMF = R(0.3), OMI = R(0.42), OMP = R(0.3), OML = R(0.22), OMK = R(0.1), OMC = R(0.2), OMJ = R(0.42), OMV = R(0.3), OMR = R(0.34);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const $ = (id) => document.getElementById('mq-' + id);
  const win = $('win'), thread = $('thread'), list = $('list'), card = $('card'), ta = $('ta'), send = $('send'), sl = $('sl'), mir = $('mir'), msg = $('msg'), cc = $('cc');
  const hl = card.querySelector('.mq-hl');

  /* a spring: the closed form, critically damped by default; it always starts from the x and v on screen */
  const mk = (x = 0, e = 0.05, ve = 3) => ({ x, v: 0, T: x, w: OMI, z: 1, on: false, e, ve });
  function step(s, dt) {
    if (!s.on) return false;
    const A = s.x - s.T, w = s.w, z = s.z;
    let x, v;
    if (z >= 0.999) { const B = s.v + w * A, e = Math.exp(-w * dt); x = s.T + (A + B * dt) * e; v = (B - w * (A + B * dt)) * e; }
    else {
      const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt), C = (s.v + z * w * A) / wd;
      x = s.T + e * (A * c + C * sn); v = e * (s.v * c - ((z * w * s.v + w * w * A) / wd) * sn);

  if (!QM.tile && !reduced) {
    const idle = () => MQ.win.matches(':hover') || (MQ.win.contains(document.activeElement) && document.activeElement !== document.body && MQ.ta.value);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                                // the ghost's own events do not count
      touched = true; clearTimeout(holdT); MQ.wake();
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true, capture: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); touched = false; MQ.pose(); holdPose(); if (!reduced) script(true); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (!touched) script(true); }, 300));
})();
</script>
