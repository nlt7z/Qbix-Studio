<script data-code>
const holo = (() => {
  const root = document.documentElement, card = document.getElementById('card');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // a guilloche rosette, the fine engraved pattern on bank notes: rotated sine curves
  (function rosette() {
    let d = '';
    for (let k = 0; k < 16; k++) {
      const ph = k / 16 * Math.PI * 2 / 9;
      for (let i = 0; i <= 360; i++) {
        const t = i / 360 * Math.PI * 2, r = 62 + 15 * Math.sin(9 * t + ph * 9) + 6 * Math.sin(27 * t - ph * 3);
        d += (i ? 'L' : 'M') + (Math.cos(t) * r).toFixed(2) + ' ' + (Math.sin(t) * r).toFixed(2);
      }
    }
    for (let k = 0; k < 12; k++) {
      const ph = k / 12 * Math.PI * 2 / 14;
      for (let i = 0; i <= 360; i++) {
        const t = i / 360 * Math.PI * 2, r = 92 + 4 * Math.sin(14 * t + ph * 14);
        d += (i ? 'L' : 'M') + (Math.cos(t) * r).toFixed(2) + ' ' + (Math.sin(t) * r).toFixed(2);
      }
    }
    document.querySelectorAll('.rose-d').forEach((p) => { p.setAttribute('d', d); p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', '.45'); });
  })();
  function size() {
    const h = Math.min(innerHeight * 0.76, innerWidth * 0.82 * 1.4, 640);
    root.style.setProperty('--w', (h / 1.4).toFixed(1) + 'px');
  }
  size(); addEventListener('resize', size);
  let tx = 0, ty = 0, has = false;
  // spring state for x and y tilt
  const s = { x: 0, y: 0, vx: 0, vy: 0 };
  let last = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.04, (now - last) / 1000) || 0.016; last = now;
    const gx = has ? tx : 0, gy = has ? ty : 0;
    const k = reduce ? 40 : 120, c = reduce ? 14 : 16;
    s.vx += ((gx - s.x) * k - s.vx * c) * dt; s.x += s.vx * dt;
    s.vy += ((gy - s.y) * k - s.vy * c) * dt; s.y += s.vy * dt;
    card.style.setProperty('--ry', (s.x * 18).toFixed(2) + 'deg');
    card.style.setProperty('--rx', (-s.y * 18).toFixed(2) + 'deg');
    card.style.setProperty('--fx', (50 + s.x * 50).toFixed(1) + '%');
    card.style.setProperty('--fy', (50 + s.y * 50).toFixed(1) + '%');
  })(performance.now());
  return {
    move(x, y) {
      const r = card.getBoundingClientRect();
      // the card's own box tilts too, so measure from its layout centre
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      tx = Math.max(-1.2, Math.min(1.2, (x - cx) / (r.width / 2)));
      ty = Math.max(-1.2, Math.min(1.2, (y - cy) / (r.height / 2)));
      has = true;
    },
    leave() { has = false; },
    path(t) {
      const r = card.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      return [cx + Math.sin(t * 0.85) * 0.95 * r.width / 2, cy + Math.sin(t * 1.7) * 0.6 * r.height / 2];
    }
  };
})();
document.addEventListener('pointermove', (e) => holo.move(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => holo.leave());
</script>
<script>
  QM.demo({ kind: 'pointer', move: (x, y) => holo.move(x, y), leave: () => holo.leave(), path: (t) => holo.path(t) });
</script>
