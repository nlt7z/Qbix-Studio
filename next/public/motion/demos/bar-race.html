/* Bar race. The playhead p is the only clock (weeks, 0 to 11; it can sit past an end while the thumb rubber-bands); t = clamp(p). Values are interpolated between the
   weeks, ranks come from the values, and every other number on the card follows from them: each row is a critically damped spring to its rank, the axis maximum is a
   spring to a round number, the week label rolls on a spring to the nearest week. A spring steps with its exact solution, so any frame length is stable and any new target
   starts from the value and velocity on screen. */
const BR = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const card = $('rr-card'), plot = $('rr-plot'), axis = $('rr-axis'), tl = $('rr-tl'), thumb = $('rr-thumb'), fw = $('rr-fw'), playBtn = $('rr-play'),
    sum = $('rr-sum'), msg = $('rr-msg'), clock = $('rr-clock'), ct = $('rr-ct'), co = $('rr-co'), cst = $('rr-cst'), cso = $('rr-cso');
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x)), sm = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

  /* --- the data: cumulative orders by week, a fixed table (week 12 sums to 2,149, as the orders in Brush zoom) --------------------------------------------------- */
  const NAMES = ['Ash vase', 'Loop tray', 'Pressed tumbler', 'Linen runner', 'Stone dish', 'Morning mug', 'Calla bowl', 'Ring dish'];
  const CUM = [
    [48, 92, 132, 170, 206, 238, 270, 300, 310, 395, 440, 480],   // Ash vase: out of stock in week 9
    [36, 70, 104, 138, 172, 206, 248, 290, 335, 360, 380, 400],   // Loop tray: featured in week 9
    [34, 66, 96, 124, 150, 176, 202, 228, 248, 266, 280, 290],    // Pressed tumbler
    [28, 54, 80, 104, 126, 146, 164, 180, 194, 205, 213, 220],    // Linen runner
    [20, 38, 54, 70, 82, 92, 100, 104, 107, 109, 110, 110],       // Stone dish
    [0, 0, 0, 0, 14, 40, 84, 140, 206, 276, 346, 410],            // Morning mug: launches in week 5
    [22, 42, 62, 80, 96, 110, 122, 132, 140, 144, 147, 150],      // Calla bowl
    [14, 27, 38, 49, 58, 66, 73, 78, 82, 85, 87, 89],             // Ring dish
  ];
  const N = NAMES.length, LAST = 11, ID = {};
  NAMES.forEach((n, i) => { ID[n] = i; });
  const valsAt = (t) => { const i = Math.min(Math.floor(t), LAST - 1), f = t - i; return CUM.map((c) => c[i] + (c[i + 1] - c[i]) * f); };
  const orderOf = (v) => v.map((x, i) => i).sort((a, b) => v[b] - v[a] || a - b);
  (function check() {
    const bad = (m) => { throw new Error('Bar race data: ' + m); };
    CUM.forEach((c, i) => { if (c.length !== 12) bad(NAMES[i] + ' has ' + c.length + ' weeks'); c.forEach((v, k) => { if (!Number.isInteger(v) || v < 0 || (k && v < c[k - 1])) bad(NAMES[i] + ' week ' + (k + 1)); }); });
    const A = ID['Ash vase'], L = ID['Loop tray'], M = ID['Morning mug'], S = ID['Stone dish'];
    if (CUM[M].slice(0, 4).some((v) => v !== 0) || CUM[M][4] <= 0) bad('Morning mug must launch in week 5');
    const lead = [], mRank = [];
    let prev = -1, sLast = -1, mIn = -1;
    for (let k = 0; k <= 11000; k++) {
      const t = k / 1000, o = orderOf(valsAt(t));
      if (o[0] !== prev) { lead.push([o[0], t]); prev = o[0]; }
      const rS = o.indexOf(S), rM = o.indexOf(M);
      if (rS < 6) sLast = t;
      if (rM < 6 && mIn < 0) mIn = t;
      mRank.push(rM);
    }
    if (lead.length !== 3 || lead[0][0] !== A || lead[1][0] !== L || lead[2][0] !== A) bad('the lead must go Ash vase, Loop tray, Ash vase');
    if (!(lead[1][1] > 7 && lead[1][1] < 8 && lead[2][1] > 8 && lead[2][1] < 9)) bad('Loop tray must lead in week 9 only');
    if (!(mIn > 6 && mIn < 7) || Math.abs(sLast - mIn) > 0.002) bad('Morning mug must enter the top six as Stone dish leaves it, for good');
    for (let k = 5800; k < mRank.length; k++) if (mRank[k] > mRank[k - 1]) bad('Morning mug must only climb');
    if (mRank[11000] !== 1) bad('Morning mug must finish second');
    if (orderOf(valsAt(8))[0] !== L || orderOf(valsAt(8))[1] !== A) bad('Week 9 must read Loop tray, Ash vase');
  })();

  /* --- geometry (card px) ---------------------------------------------------------------------------------------------------------------------------------------- */
  const X0 = 164, PW = 540, PITCH = 44, SLOTS = 6, PLOT_Y = 80, TL0 = 108, TL1 = 732, PPW = (TL1 - TL0) / LAST, TY = 408, CW = 780, BAND_D = 150;
  const SPEED = 1 / 0.9;                                           // weeks a second while playing
  const LADDER = [60, 100, 150, 200, 250, 300, 400, 500, 600];
  const ladder = (v) => LADDER.find((m) => m >= v * 1.04) || LADDER[LADDER.length - 1];
  const stepOf = (m) => (m <= 100 ? 20 : m <= 250 ? 50 : 100);

    s.v = (s.v - s.w * b * dt) * e;

    const row = el('rr-row', 'button'); row.type = 'button'; row.setAttribute('aria-pressed', 'false');
    const gl = el('rr-gnd'), gf = el('rr-gnd'), lab = el('rr-lab'), bar = el('rr-bar'), fig = el('rr-fig');

  });

    const g = el('rr-gl'), l = el('rr-al'); l.textContent = v;

  const put = (x, y) => { pos = { x, y }; const c = BR.client(x, y); QM.ghostAt(c.x, c.y); };
  async function glide(my, x, y, ms, el, down = false, ease = mv) {
    const f = pos || { x, y }, t0 = performance.now();
    for (;;) {
      await raf(); if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = ease(p);
      put(f.x + (x - f.x) * k, f.y + (y - f.y) * k);
      if (el) BR.emit('pointermove', el, pos.x, pos.y, down);
      if (p >= 1) break;
    }
  }
  const away = () => { BR.emit('pointerleave', BR.plot, pos.x, pos.y, false); };
  async function press(my, btn) { btn.classList.add('is-press'); await gap(my, 120); btn.classList.remove('is-press'); btn.click(); }
  async function toPlay(my) { away(); const q = BR.playPos(); await glide(my, q.x, q.y, 700, null); }
  async function grabThumb(my) {
    away(); const q = BR.thumbPos();
    await glide(my, q.x, q.y, 650, BR.tl);
    await gap(my, 140);
    BR.emit('pointerdown', BR.tl, pos.x, pos.y, true);
    await gap(my, 110);
  }
  const park = () => { if (reduced) return; const q = BR.thumbPos(); put(q.x + 17, q.y + 10); QM.ghostShow(); };
  async function script(first) {
    const my = ++epoch;
    try {
      if (first) await gap(my, QM.tile ? 4300 : 3000);
      QM.ghostShow();
      const M = BR.ID['Morning mug'];
      for (;;) {
        if (BR.playing) { await toPlay(my); await press(my, BR.playBtn); await gap(my, 500); }
        // 1. from the pose (Week 9, paused): Play at once. Ash vase retakes the lead (8.42), Morning mug passes Pressed tumbler (8.81) and Loop tray (10.77)
        await toPlay(my);
        await press(my, BR.playBtn);
        await until(my, () => BR.t >= 10.99, 9000);
        await gap(my, 800);
        // 2. drag the playhead back to Week 6 in one smooth move: the race runs backwards through the same overtakes
        await grabThumb(my);
        await glide(my, BR.weekX(6), pos.y, 1700, BR.tl, true);
        BR.emit('pointerup', BR.tl, pos.x, pos.y, false);
        await until(my, () => BR.idle, 3000);
        await gap(my, 250);
        // 3. play 6 to 9: Morning mug enters the top six, passes Calla bowl and Linen runner, Loop tray takes the lead. Follow Morning mug on the way, with a tap
        await toPlay(my);
        await press(my, BR.playBtn);
        const q0 = BR.rowPos(M);
        await glide(my, q0.x + 120, BR.PLOT_Y + BR.PITCH * 6.6, 600, null);   // waits under the bars, so the wait does not follow a bar by hover
        await until(my, () => BR.t >= 7.0, 6000);
        let q = BR.rowPos(M);
        await glide(my, q.x, q.y, 160, BR.plot);
        await press(my, BR.rowEl(M));
        away(); const pq = BR.playPos();
        await glide(my, pq.x, pq.y, 520, null);
        await until(my, () => BR.t >= 7.8, 4000);
        await press(my, BR.playBtn);                                  // pause just after the overtake
        await until(my, () => !BR.playing && BR.mode === 'idle', 3000);
        await grabThumb(my);                                          // let go of the playhead where it is: it settles on Week 9, the pose
        BR.emit('pointerup', BR.tl, pos.x, pos.y, false);
        await until(my, () => BR.idle, 3000);
        await gap(my, 1300);
        // let go of Morning mug: tap it again
        away();
        q = BR.rowPos(M);
        await glide(my, q.x + 140, q.y, 700, null);
        BR.emit('pointermove', BR.plot, pos.x, pos.y, false);
        await glide(my, q.x, q.y, 300, BR.plot);
        await gap(my, 200);
        await press(my, BR.rowEl(M));
        await gap(my, 300);
        away();
        park();
        await gap(my, QM.tile ? 2600 : 3000);
      }
    } catch (e) { if (e) console.error(e); }
  }
  function stopScript() { epoch++; QM.ghostHide(); pos = null; }
  if (!QM.tile && !reduced) {
    const idle = () => BR.card.matches(':hover') || BR.held || BR.card.contains(document.activeElement);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) { BR.hardReset(); BR.pose(); park(); script(false); } else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); BR.pose(); if (!reduced) { park(); script(true); } } });
  BR.pose(); park();
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { BR.pose(); park(); script(true); }, 300));
})();
</script>
