/* Command pages. A Strata command palette in the system face with Apple's neutrals: a translucent white panel, a search line, a list.
   Rows are absolutely positioned and every y, every cover (clip-path) and the panel's height are set from script: they are springs.
   The one lime is the pill inside the wash (.cp-hl); the wash is one element that travels, so rows themselves never get a background. */
.cp-panel, .cp-meas { --cp-f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Geist, system-ui, sans-serif;

/* Command pages. Every value that moves is a critically damped spring that starts from the value and velocity on screen:
   each row's y and its cover p (a clip-path), the wash's y and height, the page seam T and the panel's height. layout() turns the numbers into styles.
   The list is a pure function of the query (applyQuery): it decides which rows are in, in what order, and at which y; springs do the rest. */
const CP = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const PW = 560, SEARCH = 56, PADT = 6, PADB = 8, ROW = 44, LAB = 28, EMP = 56, AOLD = 140, X0 = 52, CHIPGAP = 8, MAXH = 434, PAGE = 5;

  /* a spring: the critically damped closed form; it always starts from the x and v on screen */
  const mk = (x = 0, resp = 0.3, eps = 0.02) => ({ x, v: 0, T: x, w: TAU / resp, on: false, eps });
  function step(s, dt) {
    if (!s.on) return false;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.T + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.T) < s.eps && Math.abs(s.v) < s.eps * 12) { s.x = s.T; s.v = 0; s.on = false; }
    return s.on;
  }
  function aim(s, T, resp) {
    if (resp) s.w = TAU / resp;
    s.T = T;
    if (reduced) { s.x = T; s.v = 0; s.on = false; } else s.on = true;
    kick();

    hl.style.transform = `translate3d(0, ${(HLY.x + (ROW - h) / 2).toFixed(2)}px, 0)`;
    layCaret();
  }

  /* back to the start, instantly: the pose the piece loads in (the thumbnail) is the query ne, Change theme... under the wash */
  function reset() {
    clearTimeout(S.timer); clearTimeout(S.runTimer); S.busy = false;
    pill.classList.remove('is-done'); hl.classList.remove('is-press');
    S.act = 0; S.theme = 'light'; setCur(true); rollMeta(true);
    snap(T, 0);
    pages[1].q = ''; pages[1].selKey = null;
  }
  function pose() {
    reset();
    S.soft = true; S.driver = 'ghost';
    const root = pages[0];
    root.q = 'ne'; input.value = 'ne';
    try { input.setSelectionRange(2, 2); } catch (e) { /* nothing */ }
    applyQuery(pages[1], { snap: true, sel: S.theme });
    applyQuery(root, { snap: true, sel: 'theme' });
    pageUI(); layout(); carets.forEach((c) => { c.classList.add('is-long'); c.classList.remove('b'); });
    kick();
  }
  function remeasure() { wc.clear(); reserve(); }
  pages = DEF.map(buildPage);
  remeasure();
  pose();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const fresh = CP_fresh(); remeasure(); if (fresh) pose(); else layout(); });
  function CP_fresh() { return S.act === 0 && pages[0].q === 'ne' && pages[0].selKey === 'theme' && S.soft; }

  return {
    S, panel, input, lists, pages: () => pages, hl, pill, T, H,
    pose, reset, layout, kick, push, pop, activate, move, clearQuery,
    get fresh() { return CP_fresh() && !T.on; },
    // the ghost types the way a hand does: a keydown, the text going into the field, an input event
    typeChar(ch) {
      S.driver = 'ghost'; S.soft = true;
      input.dispatchEvent(new KeyboardEvent('keydown', { key: ch, bubbles: true, cancelable: true }));
      input.setRangeText(ch, input.selectionStart, input.selectionEnd, 'end');
      input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: ch }));
      input.dispatchEvent(new KeyboardEvent('keyup', { key: ch, bubbles: true }));
    },
    back() {
      S.driver = 'ghost'; S.soft = true;
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Backspace', bubbles: true, cancelable: true }));
      const s = input.selectionStart;
      if (input.value && s > 0) { input.setRangeText('', s - 1, s, 'end'); input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'deleteContentBackward' })); }
    },
    key(k) { S.driver = 'ghost'; S.soft = true; input.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true })); },
    snapshot() { const pg = pages[S.act]; return { act: S.act, q: input.value, sel: pg.selKey, order: pg.order.map((r) => r.key), theme: S.theme, T: T.x, H: H.x, hy: HLY.x, busy: S.busy }; }
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('cp-fit'), world = document.getElementById('cp-world');
  // the panel is drawn at 560 px wide and 434 px tall (its tallest) and scaled to the room it is given
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    const s = Math.max(0.5, Math.min(0.86 * W / 560, (H - 2 * pad - ui) / 434, 1.4));
    fit.style.setProperty('--s', s.toFixed(4));
    fit.style.width = (560 * s).toFixed(2) + 'px'; fit.style.height = (434 * s).toFixed(2) + 'px';
    world.style.setProperty('--s', s.toFixed(4));
    CP.layout();
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);

  /* the ghost: it presses the same keys and moves the same pointer a hand does (untrusted events on the same handlers) */
  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const fire = (type, x, y, Ctor = PointerEvent) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 73, isPrimary: true, button: 0, view: window }));
    return t;
  };
  async function glide(my, to, ms = 760) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y }; fire('pointermove', x, y);
      if (p >= 1) break;
    }
  }
  async function tap(my) {
    const { x, y } = pos;
    const el = fire('pointerdown', x, y); await gap(my, 100); fire('pointerup', x, y);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  }
  const rowEl = (pi, key) => CP.pages()[pi].byKey.get(key).el;
  async function hover(my, pi, key, ms = 620) { const r = rowEl(pi, key).getBoundingClientRect(); await glide(my, { x: r.left + r.width * 0.42, y: r.top + r.height * 0.5 }, ms); }
  async function click(my, pi, key) { await hover(my, pi, key); await gap(my, 360); await tap(my); }
  async function type(my, str, d = 96) { for (let i = 0; i < str.length; i++) { CP.typeChar(str[i]); await gap(my, d + ((i * 37) % 5) * 12); } }
  async function erase(my, n, d = 120) { for (let i = 0; i < n; i++) { CP.back(); await gap(my, d); } }
  async function key(my, k, after = 560) { CP.key(k); await gap(my, after); }
  async function until(my, ok, max = 4000) { let t = 0; while (!ok() && t < max) { await gap(my, 100); t += 100; } }
  const val = () => CP.input.value;
  async function idle(my) {
    if (CP.S.act === 1) { CP.key('Escape'); await gap(my, 300); await until(my, () => !CP.T.on); await gap(my, 500); }
    if (val()) { while (val()) { CP.back(); await gap(my, 90); } await gap(my, 800); }
  }
  async function theme(my, key) {            // from the first page with Change theme... under the wash: push, move the wash, choose
    await key_(my, 'Enter', 1100);
    const cur = CP.S.theme, order = ['light', 'dark', 'system'], d = order.indexOf(key) - order.indexOf(cur);
    for (let i = 0; i < Math.abs(d); i++) await key_(my, d > 0 ? 'ArrowDown' : 'ArrowUp', 640);
    await gap(my, 200);
    await key_(my, 'Enter', 1900);           // tick, hold, pop
    await until(my, () => CP.S.act === 0 && !CP.T.on); await gap(my, 700);
  }
  const key_ = key;

  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 5000 : 3600) : 700);
      for (;;) {
        // 1 · the wash by keys, then a page
        if (!(first && CP.fresh)) { await idle(my); await type(my, 'ne'); await gap(my, 900); await key(my, 'ArrowDown', 100); }
        first = false;
        await key(my, 'ArrowDown', 700); await key(my, 'ArrowDown', 700);
        await key(my, 'ArrowUp', 640); await key(my, 'ArrowUp', 640);
        await key(my, 'ArrowUp', 640); await key(my, 'ArrowDown', 700);
        await theme(my, CP.S.theme === 'dark' ? 'light' : 'dark');
        // 2 · type, delete: rows leave and arrive
        await gap(my, 500);
        await erase(my, 2, 150); await gap(my, 1000);
        await key(my, 'End', 700); await key(my, 'Home', 700);
        await type(my, 'o', 120); await gap(my, 1100);
        await type(my, 'r', 120); await gap(my, 1300);
        await erase(my, 1, 200); await gap(my, 600); await erase(my, 1, 200); await gap(my, 1100);
        await type(my, 'ex', 100); await gap(my, 900);
        await key(my, 'Enter', 1900);               // a command runs: the pill's glyph becomes a tick
        await erase(my, 2, 100); await gap(my, 900);
        // 3 · the pointer: hover moves the wash, a click opens the page, a click chooses
        QM.ghostShow();
        await hover(my, 0, 'forma', 900); await gap(my, 500);
        await hover(my, 0, 'kova', 560); await gap(my, 360);
        await click(my, 0, 'theme'); await gap(my, 1000);
        await click(my, 1, CP.S.theme === 'system' ? 'light' : 'system');
        await gap(my, 1600); await until(my, () => CP.S.act === 0 && !CP.T.on);
        await gap(my, 500);
        await glide(my, { x: innerWidth * 0.84, y: innerHeight * 0.88 }, 800);
        QM.ghostHide(); pos = null; fire('pointermove', -10, -10);
        await gap(my, 1800);
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() {
    epoch++; QM.ghostHide();
    if (pos) { pos = null; fire('pointermove', -10, -10); }
  }
  if (!QM.tile && !reduced) {
    const busyHand = () => CP.panel.matches(':hover') || CP.panel.contains(document.activeElement) && document.activeElement !== document.body;
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                    // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); CP.pose(); if (!reduced) script(true); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => script(true), 300));
})();
</script>
</body>
