<script data-code>
/* Wiped frost. frost = the picture blurred + tint + grain, kept offscreen. The visible canvas starts as frost;
   the pointer erases it (destination-out), and a little frost is drawn back over it on a timer. */
const Wipe = (() => {
  const box = document.getElementById('wf'), img = document.getElementById('wf-img');
  const cv = document.getElementById('wf-frost'), ctx = cv.getContext('2d');
  const W = 592, H = 340, R = 44, STEP = 6, FOG = 0.07, FOG_MS = 50;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const src = document.createElement('canvas'); src.width = W; src.height = H;
  let ready = false, px = null, py = null, lastFog = 0;

  function buildFrost() {
    const s = src.getContext('2d');
    // object-fit: cover, drawn by hand so the copy lines up with the picture
    const k = Math.max(W / img.naturalWidth, H / img.naturalHeight), dw = img.naturalWidth * k, dh = img.naturalHeight * k;
    const dx = (W - dw) / 2, dy = (H - dh) / 2;
    if ('filter' in s) { s.filter = 'blur(16px)'; s.drawImage(img, dx - 32, dy - 32, dw + 64, dh + 64); s.filter = 'none'; }
    else { // no canvas filter: down and up twice
      const a = document.createElement('canvas'); a.width = 48; a.height = 28;
      const c = a.getContext('2d'); c.imageSmoothingQuality = 'high'; c.drawImage(img, dx / 12, dy / 12, dw / 12, dh / 12);
      s.imageSmoothingQuality = 'high'; s.drawImage(a, 0, 0, W, H);
    }
    s.fillStyle = 'rgba(255, 255, 255, .56)'; s.fillRect(0, 0, W, H);
    // matte grain: a small noise tile at 6%
    const t = document.createElement('canvas'); t.width = t.height = 128;
    const tc = t.getContext('2d'), d = tc.createImageData(128, 128);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    tc.putImageData(d, 0, 0);
    s.globalAlpha = 0.06; s.fillStyle = s.createPattern(t, 'repeat'); s.fillRect(0, 0, W, H); s.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); ctx.drawImage(src, 0, 0);
    ready = true;
    if (still) stamp(W * 0.64, H * 0.46, 1.5);
  }

  function stamp(x, y, scale) {
    const r = R * (scale || 1), g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.55, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // pointer in client px -> pane px (the sheet may be scaled)
  function move(cx, cy) {
    if (!ready || still) return;
    const b = box.getBoundingClientRect(), k = b.width / W;
    const x = (cx - b.left) / k, y = (cy - b.top) / k;
    if (px === null) { px = x; py = y; }
    const dx = x - px, dy = y - py, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / STEP));
    for (let i = 1; i <= n; i++) stamp(px + dx * i / n, py + dy * i / n);
    px = x; py = y;
  }
  function leave() { px = py = null; }
  function frame(now) {
    if (ready && !still && !document.hidden && now - lastFog > FOG_MS) {
      lastFog = now;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = FOG; ctx.drawImage(src, 0, 0); ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  if (img.complete && img.naturalWidth) buildFrost(); else img.addEventListener('load', buildFrost);
  requestAnimationFrame(frame);
  return { move, leave, box, W, H };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  // a real pointer anywhere in the sheet wipes (the harness hands over from the ghost)
  addEventListener('pointermove', (e) => Wipe.move(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('mouseleave', () => Wipe.leave());

  // the ghost's hand: a slow S down the pane and back up
  const ez = QM.bezier(0.65, 0, 0.35, 1), PERIOD = 9;
  QM.demo({
    kind: 'pointer',
    move: (x, y, ghost) => { if (ghost) Wipe.move(x, y); },
    leave: () => Wipe.leave(),
    path(t) {
      const r = Wipe.box.getBoundingClientRect(), k = r.width / Wipe.W;
      const f = (Math.max(0, t) % PERIOD) / PERIOD, tri = f < 0.5 ? f * 2 : 2 - f * 2, th = ez(tri) * Math.PI * 2;
      const x = Wipe.W * 0.5 + 215 * Math.sin(th), y = Wipe.H * 0.5 - 118 * Math.cos(th / 2);
      return [r.left + x * k, r.top + y * k];
    },
  });
</script>
