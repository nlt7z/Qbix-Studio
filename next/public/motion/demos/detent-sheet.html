<script data-code>
/* Detent sheet. Height is the one number: render(h) draws the sheet, the veil and the page from it.
   Release projects the velocity 0.2 s ahead, picks the nearest detent, and springTo() arrives there critically damped. */
const DS = { PEEK: 90, MED: 218, FULL: 336, OMEGA: 13, LOOK: 0.2, RUBBER: 24 };
const DETENTS = [DS.PEEK, DS.MED, DS.FULL], DNAMES = ['Peek', 'Medium', 'Full'];
const dsSheet = document.getElementById('ds-sheet'), dsVeil = document.getElementById('ds-veil'), dsPage = document.getElementById('ds-page');
const dsGrab = document.getElementById('ds-grab'), dsList = document.getElementById('ds-list'), dsWeek = document.getElementById('ds-week');
const dsBook = document.getElementById('ds-book'), dsMsg = document.getElementById('ds-msg');
const dsReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let dsH = DS.PEEK, dsIdx = 0, dsRaf = 0;

function render(h) {
  dsH = h;
  dsSheet.style.transform = `translate3d(0, ${(DS.FULL - h).toFixed(2)}px, 0)`;
  const q = clamp((h - DS.PEEK) / (DS.FULL - DS.PEEK), 0, 1);
  dsVeil.style.opacity = (0.62 * q).toFixed(3);
  dsVeil.style.pointerEvents = q > 0.5 ? 'auto' : 'none';
  const s = 1 - 0.04 * clamp((h - DS.MED) / (DS.FULL - DS.MED), 0, 1);
  dsPage.style.transform = s < 1 ? `scale(${s.toFixed(4)})` : 'none';
}
// what is not on screen is not reachable: groups below the current detent are inert
function setDetent(i) {
  dsIdx = i;
  dsList.inert = i < 1; dsWeek.inert = i < 2; dsBook.inert = i < 2;
  dsGrab.setAttribute('aria-valuenow', String(i));
  dsGrab.setAttribute('aria-valuetext', DNAMES[i]);
}
const nearest = (x) => DETENTS.reduce((b, d, i) => (Math.abs(d - x) < Math.abs(DETENTS[b] - x) ? i : b), 0);

// critically damped: x(t) = target + (A + B t) e^(-wt). B = v0 + wA; capping v0 toward the target at w|A| keeps A and B the same sign, so x never crosses the target
function springTo(i, v0 = 0) {
  cancelAnimationFrame(dsRaf);
  setDetent(i);
  const target = DETENTS[i];
  if (dsReduced) { render(target); return; }
  const A = dsH - target, w = DS.OMEGA, lim = w * Math.abs(A);
  let v = v0;
  if (A > 0) v = Math.max(v, -lim); else if (A < 0) v = Math.min(v, lim); else v = 0;
  const B = v + w * A, t0 = performance.now();
  const step = (now) => {
    const t = (now - t0) / 1000, x = target + (A + B * t) * Math.exp(-w * t);
    if (t > 1.4 || Math.abs(x - target) < 0.2) { render(target); return; }
    render(x);
    dsRaf = requestAnimationFrame(step);
  };
  dsRaf = requestAnimationFrame(step);
}
const rubber = (h) => (h > DS.FULL ? DS.FULL + DS.RUBBER * (1 - Math.exp(-(h - DS.FULL) / DS.RUBBER))
  : h < DS.PEEK ? DS.PEEK - DS.RUBBER * (1 - Math.exp(-(DS.PEEK - h) / DS.RUBBER)) : h);

// one drag, whoever holds it: a pointer or the ghost. y is client px, t is ms.
let dsDrag = null;
function dragStart(y, t) { cancelAnimationFrame(dsRaf); dsDrag = { y0: y, h0: dsH, s: [[t, y]] }; dsSheet.classList.add('is-drag'); }
function dragMove(y, t) {
  if (!dsDrag) return;
  dsDrag.s.push([t, y]);
  while (dsDrag.s.length > 2 && t - dsDrag.s[0][0] > 100) dsDrag.s.shift();
  render(rubber(dsDrag.h0 - (y - dsDrag.y0)));
}
function dragEnd(t) {
  if (!dsDrag) return;
  const a = dsDrag.s[0], b = dsDrag.s[dsDrag.s.length - 1];
  const v = b[0] - a[0] > 8 && t - b[0] < 80 ? -((b[1] - a[1]) / (b[0] - a[0])) * 1000 : 0;   // px/s, positive = taller
  dsDrag = null; dsSheet.classList.remove('is-drag');
  springTo(nearest(clamp(dsH, DS.PEEK, DS.FULL) + v * DS.LOOK), v);
}
const stepUp = () => springTo(dsIdx < 2 ? dsIdx + 1 : 0);

let dsPtr = null, dsSwallow = false;
// move and up are heard on the window, so a fast flick that leaves the sheet before the 4 px threshold is still followed; capture starts with the drag
dsSheet.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || dsPtr) return;
  dsPtr = { id: e.pointerId, y: e.clientY, t: e.timeStamp, moved: false, tapStep: !!e.target.closest('.ds-grab, .ds-hd, .ds-sub') };
  addEventListener('pointermove', ptrMove);
  addEventListener('pointerup', ptrEnd);
  addEventListener('pointercancel', ptrEnd);
});
function ptrMove(e) {
  if (!dsPtr || e.pointerId !== dsPtr.id) return;
  if (!dsPtr.moved) {
    if (Math.abs(e.clientY - dsPtr.y) < 4) return;
    dsPtr.moved = true; dsSwallow = true;
    try { dsSheet.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    dragStart(dsPtr.y, dsPtr.t);                      // the drag counts from where the pointer went down
  }
  dragMove(e.clientY, e.timeStamp);
}
function ptrEnd(e) {
  if (!dsPtr || e.pointerId !== dsPtr.id) return;
  const p = dsPtr; dsPtr = null;
  removeEventListener('pointermove', ptrMove); removeEventListener('pointerup', ptrEnd); removeEventListener('pointercancel', ptrEnd);
  if (p.moved) dragEnd(e.timeStamp);
  else if (p.tapStep && e.type === 'pointerup') stepUp();
}
dsSheet.addEventListener('click', (e) => { if (dsSwallow) { e.stopPropagation(); e.preventDefault(); } dsSwallow = false; }, true);
dsVeil.addEventListener('click', () => { if (dsIdx > 0) springTo(dsIdx - 1); });
dsGrab.addEventListener('keydown', (e) => {
  const k = e.key;
  const to = k === 'ArrowUp' || k === 'ArrowRight' ? Math.min(2, dsIdx + 1) : k === 'ArrowDown' || k === 'ArrowLeft' ? Math.max(0, dsIdx - 1) : k === 'Home' ? 0 : k === 'End' ? 2 : -1;
  if (to < 0) return;
  e.preventDefault(); springTo(to);
});
dsSheet.addEventListener('keydown', (e) => { if (e.key === 'Escape' && dsIdx > 0) { e.stopPropagation(); springTo(0); dsGrab.focus({ preventScroll: true }); } });

/* the booking inside: a day, a time, Book. Text that changes rolls inside its clip. */
const DAYS = [['Wed', 18, ['10:00', '14:00', '16:30']], ['Thu', 19, ['09:30', '12:00', '15:30']], ['Fri', 20, ['09:00', '11:00', '14:30']], ['Mon', 23, ['10:30', '13:00', '17:00']], ['Tue', 24, ['09:00', '11:30', '15:00']]];
const dsRows = [...dsList.querySelectorAll('.ds-row')];
let dsDay = 0, dsTime = 0, dsBooked = false;
dsWeek.innerHTML = DAYS.map((d, i) => `<button type="button" class="ds-day" aria-pressed="${i === 0}"><span>${d[0]}</span><span class="ds-mono">${d[1]}</span></button>`).join('');
const dsDays = [...dsWeek.querySelectorAll('.ds-day')];

function roll(el, text, delay = 0) {
  const cur = el.lastElementChild;
  if (cur.textContent === text) return;
  if (dsReduced || !cur.animate) { cur.textContent = text; return; }
  while (el.children.length > 2) el.firstElementChild.remove();
  const nb = document.createElement('b'); nb.textContent = text; el.appendChild(nb);
  const o = { duration: 420, delay, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' };
  cur.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-110%)' }], o).finished.then(() => cur.remove(), () => {});
  nb.animate([{ transform: 'translateY(110%)' }, { transform: 'translateY(0)' }], o);
}
const slot = () => `${DAYS[dsDay][0]} ${DAYS[dsDay][2][dsTime]}`;
function dsSync(rollTimes) {
  dsDays.forEach((b, i) => b.setAttribute('aria-pressed', String(i === dsDay)));
  dsRows.forEach((b, i) => {
    b.setAttribute('aria-pressed', String(i === dsTime));
    if (rollTimes) roll(b.firstElementChild, DAYS[dsDay][2][i], i * 30);
  });
  roll(document.getElementById('ds-book-t'), (dsBooked ? 'Booked ' : 'Book ') + slot());
  roll(document.getElementById('ds-next'), dsBooked ? `Booked: ${slot()}` : 'Next: Wed 10:00');
  dsBook.classList.toggle('is-booked', dsBooked);
}
dsDays.forEach((b, i) => b.addEventListener('click', () => { dsDay = i; dsBooked = false; dsSync(true); }));
dsRows.forEach((b, i) => b.addEventListener('click', () => { dsTime = i; dsBooked = false; dsSync(false); }));
dsBook.addEventListener('click', () => {
  if (dsBooked) return;
  dsBooked = true; dsSync(false);
  dsMsg.textContent = `Booked ${slot()}`;
});
setDetent(0); render(DS.PEEK);
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let epoch = 0, resumeT = 0;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function tap(my, el, hold = 240) {
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * 0.5, r.top + r.height * 0.55, 720))) throw 0;
    if (my !== epoch) throw 0;
    el.classList.add('is-hot');
    await gap(my, 190);
    el.classList.add('is-press');
    await gap(my, 120);
    el.classList.remove('is-press', 'is-hot');
    el.click();
    await gap(my, hold);
  }
  // the ghost holds the grabber and moves it dy px (negative = up) over ms; ease 'move' ends at rest, 'line' ends at speed (a flick)
  async function pull(my, dy, ms, flick) {
    const r = dsGrab.getBoundingClientRect(), x = r.left + r.width / 2;
    let y = r.top + r.height / 2;
    if (!(await QM.ghostTo(x, y, 700))) throw 0;
    await gap(my, 160);
    const y0 = y, mv = QM.bezier(0.65, 0, 0.35, 1);
    dragStart(y0, performance.now());
    await new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (my !== epoch) { dsDrag = null; dsSheet.classList.remove('is-drag'); return res(); }
        const p = Math.min(1, (now - t0) / ms), k = flick ? p : mv(p);
        y = y0 + dy * k; QM.ghostAt(x, y); dragMove(y, now);
        if (p < 1) requestAnimationFrame(f); else res();
      };
      requestAnimationFrame(f);
    });
    if (my !== epoch) throw 0;
    dragEnd(performance.now());
  }
  function rest(medium) {
    cancelAnimationFrame(dsRaf); dsDrag = null; dsSheet.classList.remove('is-drag');
    dsDay = 0; dsTime = 0; dsBooked = false; dsSync(true);
    springTo(medium ? 1 : 0);
    if (document.activeElement && document.getElementById('ds').contains(document.activeElement)) document.activeElement.blur();
  }
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      for (;;) {
        await gap(my, 1300);
        await pull(my, -128, 900, false);                      // a slow pull: medium
        await gap(my, 900);
        await tap(my, dsRows[1], 900);                         // Wed 14:00
        await pull(my, -110, 170, true);                       // a flick: full, from only part of the way
        await gap(my, 900);
        await tap(my, dsDays[1], 1000);                        // Thu: the times roll
        await tap(my, dsBook, 2000);                           // Booked
        await pull(my, 200, 170, true);                        // a flick down: peek
        await gap(my, 500);
        dsDay = 0; dsTime = 0; dsBooked = false; dsSync(true); // rolls the line back to Next
        await QM.ghostTo(innerWidth * 0.8, innerHeight * 0.88, 600);
        await gap(my, 1100);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!dsSheet.matches(':hover') && !dsSheet.contains(document.activeElement) && !dsDrag) { rest(false); script(); } else { touch({}); } }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }
  if (reduced) rest(true);
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(reduced); if (!reduced) script(); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(script, 300));
})();
</script>
