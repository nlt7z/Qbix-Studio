/* Frost tilt. A scene of solid shapes, and a card of frosted glass tilting over it. */
.ft { position: relative; width: 640px; height: 400px; background: #fff; perspective: 1100px; user-select: none; touch-action: none;
  --tx: 0; --ty: 0; }
.ft-shapes { position: absolute; inset: 0; }
.ft-shapes i { position: absolute; display: block; will-change: transform; }
.ft-lime { left: 134px; top: 64px; width: 132px; height: 132px; border-radius: 50%; background: #B8FF00; }
.ft-ink { left: 400px; top: 210px; width: 130px; height: 110px; background: #0B0C0D; }
.ft-sage { left: 330px; top: 50px; width: 170px; height: 150px; background: #E3E8DA; }

.ft-card { position: absolute; left: 150px; top: 100px; width: 340px; height: 200px; overflow: hidden; --cut: 16px;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transform: rotateX(calc(var(--ty) * -9deg)) rotateY(calc(var(--tx) * 9deg)); will-change: transform; }
/* the frost: a copy of the shapes, blurred, then tint and grain */
.ft-under { position: absolute; left: -210px; top: -160px; width: 760px; height: 520px; background: #fff; filter: blur(30px); }
.ft-under .ft-shapes { left: 60px; top: 60px; width: 640px; height: 400px; }
.ft-tint { position: absolute; inset: 0; background: rgba(255, 255, 255, .5); }
.ft-grain { position: absolute; inset: 0; opacity: .1; background-size: 160px 160px;

<script data-code>
/* Frost tilt. One value per axis (-1..1) chased toward the pointer; it drives the card's tilt and,
   the other way, the shapes behind (and their blurred copy under the glass). */
const Tilt = (() => {
  const box = document.getElementById('ft');
  const shapes = [...box.querySelectorAll('[data-shapes] i')];
  const W = 640, H = 400, RATE = 7, SETTLE = 900;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const expo = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
  let tx = 0, ty = 0, cx = 0, cy = 0, leaving = false, t0 = 0, fx = 0, fy = 0, last = 0;

  function apply() {
    box.style.setProperty('--tx', cx.toFixed(4)); box.style.setProperty('--ty', cy.toFixed(4));
    for (const s of shapes) { const d = +s.dataset.d; s.style.transform = 'translate(' + (-cx * d).toFixed(2) + 'px,' + (-cy * d * 0.8).toFixed(2) + 'px)'; }
  }
  // pointer in client px -> -1..1 around the scene's centre (the sheet may be scaled)
  function move(x, y) {
    if (still) return;
    const b = box.getBoundingClientRect(), k = b.width / W;
    tx = Math.max(-1, Math.min(1, ((x - b.left) / k - W / 2) / (W / 2)));
    ty = Math.max(-1, Math.min(1, ((y - b.top) / k - H / 2) / (H / 2)));
    leaving = false;
  }
  function leave() { if (leaving) return; leaving = true; t0 = performance.now(); fx = cx; fy = cy; tx = ty = 0; }
  function frame(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (!still) {
      if (leaving) { const e = expo((now - t0) / SETTLE); cx = fx * (1 - e); cy = fy * (1 - e); }
      else { const a = 1 - Math.exp(-RATE * dt); cx += (tx - cx) * a; cy += (ty - cy) * a; }
      apply();
    }
    requestAnimationFrame(frame);
  }
  apply(); requestAnimationFrame(frame);
  return { move, leave, box, W, H };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  addEventListener('pointermove', (e) => Tilt.move(e.clientX, e.clientY), { passive: true });
  document.documentElement.addEventListener('mouseleave', () => Tilt.leave());

  const PERIOD = 9;
  QM.demo({
    kind: 'pointer',
    move: (x, y, ghost) => { if (ghost) Tilt.move(x, y); },
    leave: () => Tilt.leave(),
    path(t) {
      const r = Tilt.box.getBoundingClientRect(), k = r.width / Tilt.W;
      const th = (Math.max(0, t) % PERIOD) / PERIOD * Math.PI * 2;
      const x = Tilt.W * 0.5 + 250 * Math.sin(th), y = Tilt.H * 0.5 + 130 * Math.sin(th * 2) * 0.8;
      return [r.left + x * k, r.top + y * k];
    },
  });
</script>
