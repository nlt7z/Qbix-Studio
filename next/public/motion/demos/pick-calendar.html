/* Studio week — redrawn for Qbix.
   Layout, sizes, radii and motion are the original's; colours are Qbix's: white, sage, ink, one lime. */
.pk {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px;
  --radius-sm: 8px; --radius-lg: 14px; --radius-pill: 999px;
  --duration-fast: 120ms; --duration-base: 200ms; --ease-out: cubic-bezier(.16, 1, .3, 1);
  --muted: var(--fg2); --faint: rgba(11, 12, 13, .56); --surface-muted: var(--sunk);
  font: 400 14px/1.5 var(--font-sans); letter-spacing: 0; color: var(--fg);
}
.stage { display: flex; flex-direction: column; gap: var(--space-5); }
.head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.head h1 { font: 300 28px/1.1 var(--font-headline); letter-spacing: -0.035em; }
.nav { display: flex; align-items: center; gap: var(--space-2); }
.nav .range { min-width: 168px; text-align: center; font-weight: 500; }
.nav button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 1px solid rgba(11, 12, 13, .32); border-radius: var(--radius-sm); background: var(--surface); color: var(--fg); cursor: pointer; transition: background-color var(--duration-fast) var(--ease-out); }
.nav button:hover { background: var(--surface-muted); }
.card { background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-4); }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) repeat(2, minmax(0, .8fr)); gap: var(--space-2); height: 330px; }
.col { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) var(--space-2); border-radius: var(--radius-sm); position: relative; transition: background-color var(--duration-fast) var(--ease-out); }
.col.wk { background: var(--surface-muted); }
.col.is-drop { background: var(--surface-muted); }
.col.wk.is-drop { background: #D6DCCB; }
.day { display: flex; align-items: baseline; gap: var(--space-2); padding: 0 var(--space-1) var(--space-1); color: var(--muted); }
.day b { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; }
.wk .day, .wk .day b { color: var(--faint); }
.day .today { background: var(--fg); color: var(--ground); border-radius: var(--radius-pill); padding: 0 var(--space-2); min-width: 24px; text-align: center; }
.it { display: grid; gap: 2px; padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; background: #fff; color: var(--fg); transition: background-color var(--duration-fast) var(--ease-out); }
.it.k-info { background: var(--fg); color: var(--ground); }
.it.k-att { background: var(--signal); color: var(--on-lime); }
.it.k-todo { background: var(--sunk); color: var(--fg); }
.col.wk .it.k-todo, .col.is-drop .it.k-todo { background: #fff; }
.it .t { white-space: nowrap; font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: var(--space-1); }
.it .n { line-height: 1.35; }

.it.k-att:hover, .it.k-att.is-hover { background: color-mix(in oklab, var(--signal) 88%, #000); }
.it.k-todo:hover, .it.k-todo.is-hover { background: #C9D1BC; }
.it.is-drag { z-index: 5; cursor: grabbing; transition: none; }

<script data-code>
/* Studio week. Items are moved with pointer events and follow the hand exactly; the day under the pointer
   is recessed; on drop the item takes its place in time order and settles there from where it was let go
   (a FLIP). */
const $ = (s) => document.querySelector(s);
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const TODAY = 1;   // Tuesday the 3rd
const FIRST = [    // [day, minutes from midnight (0 = a to-do), title, kind]
  [0, 540, 'Week planning', ''],
  [0, 840, 'Brief call, Dana Reyes', 'info'],
  [1, 600, 'Ship Willow refresh', ''],
  [1, 0, 'Send proof to Willow', 'todo'],
  [2, 690, 'Forma goes live', 'att'],
  [3, 780, 'Moodboard review, Kova', 'info'],
  [4, 570, 'Studio stand-up', ''],
  [4, 0, 'Send round 2 to Kova', 'todo'],
  [5, 480, 'Forma product shoot', ''],
];
const grid = $('#grid');
const clock = (m) => `${Math.floor(m / 60) % 12 || 12}:${String(m % 60).padStart(2, '0')} ${m < 720 ? 'AM' : 'PM'}`;
const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
grid.innerHTML = DAYS.map((d, i) => `<div class="col${i > 4 ? ' wk' : ''}" data-d="${i}"><div class="day"><span>${d}</span><b${i === TODAY ? ' class="today"' : ''}>${2 + i}</b></div></div>`).join('');
const cols = [...grid.children];

function node([, m, title, kind]) {
  const e = document.createElement('div');
  e.className = 'it' + (kind ? ' k-' + kind : '');
  e.dataset.min = m || 1e6;                                    // to-dos sort last
  e.innerHTML = kind === 'todo'
    ? `<span class="t">${CHECK}To-do</span><span class="n">${title}</span>`
    : `<span class="t">${clock(m)}</span><span class="n">${title}</span>`;
  return e;
}
const sort = (c) => [...c.querySelectorAll('.it')].sort((a, b) => a.dataset.min - b.dataset.min).forEach((n) => c.appendChild(n));
function build() {
  cols.forEach((c) => c.querySelectorAll('.it').forEach((n) => n.remove()));
  FIRST.forEach((f) => cols[f[0]].appendChild(node(f)));
  cols.forEach(sort);
}
build();

/* the drag */
let drag = null;
const scale = () => $('#stage').getBoundingClientRect().width / $('#stage').offsetWidth || 1;   // the page may draw the piece scaled
const colAt = (x) => cols.find((c) => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; });
grid.addEventListener('pointerdown', (e) => {
  const it = e.target.closest('.it');
  if (!it || drag) return;
  drag = { it, x: e.clientX, y: e.clientY, from: it.parentElement };
  it.classList.add('is-drag');
  it.classList.remove('is-fly');
  it.style.transform = '';
});
window.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const k = scale();
  drag.it.style.transform = `translate(${(e.clientX - drag.x) / k}px, ${(e.clientY - drag.y) / k}px)`;
  const c = colAt(e.clientX);
  cols.forEach((x) => x.classList.toggle('is-drop', x === c && c !== drag.from));
});
function drop(e) {
  if (!drag) return;
  const { it, from } = drag;
  drag = null;
  const c = colAt(e.clientX) || from, k = scale();
  cols.forEach((x) => x.classList.remove('is-drop'));
  const a = it.getBoundingClientRect();                       // where it was let go
  if (c !== from) { c.appendChild(it); sort(c); }             // its place in the day, in time order
  it.style.transition = 'none';
  it.style.transform = 'none';
  const b = it.getBoundingClientRect();                       // where that is
  it.style.transform = `translate(${(a.left - b.left) / k}px, ${(a.top - b.top) / k}px)`;
  void it.offsetWidth;                                        // start from there…
  it.classList.remove('is-drag');
  it.classList.add('is-fly');
  it.style.transition = '';
  it.style.transform = 'none';                                // …and settle
  setTimeout(() => it.classList.remove('is-fly'), 260);
}
window.addEventListener('pointerup', drop);
window.addEventListener('pointercancel', drop);
</script>
<script>
  /* ---- harness glue: the piece scaled to the window as the original was, a ghost hand that plays it, real input that takes over ---- */
  const ABORT = { abort: true };
  function fit(el, W, H, pad) {
    const ui = document.querySelector('.qm-ui');
    const go = () => {
      const bar = QM.tile || !ui ? 0 : 46;
      const k = Math.min((innerWidth - 2 * pad) / W, (innerHeight - bar - 2 * pad) / H);
      Object.assign(el.style, { width: W + 'px', height: H + 'px', left: innerWidth / 2 + 'px', top: (innerHeight - bar) / 2 + 'px', transform: `translate(-50%, -50%) scale(${k})` });
    };
    addEventListener('resize', go); go();
  }
  const hand = (() => {
    let x = innerWidth * 0.82, y = innerHeight * 0.86, held = null, over = null, gen = 0;
    const ease = QM.bezier(0.65, 0, 0.35, 1);
    const under = () => held || document.elementFromPoint(x, y) || document.body;
    const ev = (type, el, buttons) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, composed: true, pointerId: 7, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons }));
    const chain = (el) => { const s = []; for (let n = el; n; n = n.parentElement) s.push(n); return s; };
    function hover(el) {
      if (el === over) return;
      const keep = new Set(chain(el));
      chain(over).forEach((n) => { if (!keep.has(n)) n.classList.remove('is-hover'); });
      chain(el).forEach((n) => n.classList.add('is-hover'));
      over = el;
    }
    const api = {
      cancel() { gen++; },
      async wait(ms) { const my = gen; await QM.wait(ms); if (my !== gen) throw ABORT; },
      async to(tx, ty, ms = 700) {
        const my = gen, x0 = x, y0 = y, t0 = performance.now();
        QM.ghostShow();
        if (Math.hypot(tx - x0, ty - y0) < 1) { await Promise.resolve(); if (my !== gen) throw ABORT; return; }
        for (;;) {
          await new Promise(requestAnimationFrame);
          if (my !== gen) throw ABORT;
          const p = Math.min(1, (performance.now() - t0) / ms), k = ease(p);
          x = x0 + (tx - x0) * k; y = y0 + (ty - y0) * k;
          QM.ghostAt(x, y);
          const el = under(); hover(el); ev('pointermove', el, held ? 1 : 0);
          if (p >= 1) return;
        }
      },
      at(el, ms, fx = 0.5, fy = 0.5) { const r = el.getBoundingClientRect(); return api.to(r.left + r.width * fx, r.top + r.height * fy, ms); },
      down() { held = under(); ev('pointerdown', held, 1); },
      up() { const el = held || under(); ev('pointerup', el, 0); held = null; },
      release() { if (held) api.up(); },
      async drag(el, target, { ms = 900, y: fy = 0.3, fx = 0.5, grab = 0.4 } = {}) {
        await api.at(el, 700, 0.5, grab); await api.wait(140);
        api.down();
        const r = target.getBoundingClientRect();
        await api.to(r.left + r.width * fx, r.top + r.height * fy, ms);
        await api.wait(140);
        api.up();
      },
    };
    return api;
  })();

  async function story() {
    await hand.wait(700);
    const it = cols[1].querySelector('.it:not(.k-todo)');
    await hand.at(it, 700, 0.5, 0.3);
    await hand.wait(250);
    await hand.drag(it, cols[3], { ms: 900, y: 0.5, grab: 0.3 });
    await hand.wait(2200);
    const it2 = cols[0].querySelector('.k-info');
    await hand.drag(it2, cols[2], { ms: 800 });
    await hand.wait(2200);
  }
  let paused = false, running = false, lastReal = -1e9;
  function cancelStory() { hand.cancel(); QM.ghostHide(); hand.release(); running = false; }
  if (!QM.tile) {
    const real = (e) => { if (e.isTrusted) { lastReal = performance.now(); if (running) cancelStory(); } };
    ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  }
  addEventListener('message', (e) => { const m = e.data; if (m && m.qm === 'cmd' && m.cmd === 'pause') { paused = true; cancelStory(); } });
  (async function idle() {
    for (;;) {
      await QM.wait(250);
      if (QM.reduced || paused || document.hidden || (!QM.tile && performance.now() - lastReal < 2500)) continue;
      running = true;
      try { build(); await story(); } catch (e) { if (e !== ABORT) throw e; }
      if (running) { QM.ghostHide(); hand.release(); }
      running = false;
    }
  })();
  fit(document.getElementById('fit'), 1000, 480, 28);
  QM.demo({ kind: 'loop', restart() { paused = false; lastReal = -1e9; if (running) cancelStory(); } });
</script>
</body>
