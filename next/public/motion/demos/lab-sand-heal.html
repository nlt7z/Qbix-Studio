  "id": "lab-sand-heal",
  "title": "Healing sand",
  "group": "lab",
  "cat": "brand",
  "order": 60,
  "kind": "pointer",
  "tone": "paper",
  "line": "~9,000 grains · damped spring · swirl",
  "summary": "A word is drawn off screen and sampled into thousands of grains, each with a home. The pointer scatters nearby grains by how fast it moves; pushed grains slide to a stop, then fall back to their home on a damped spring with a little swirl, so the word heals itself.",
  "spec": [
    ["Grains", "area ÷ 55, 3,000 to 11,000, 1.3 to 2.2 px squares"],
    ["Push", "radius 11% of the short side, falls off squared, scaled by pointer speed"],
    ["Slide", "0.35 to 1.25 s of friction (0.9 per frame) before homing"],
    ["Home", "spring 0.012, swirl ±0.004, friction 0.84 per frame"],
    ["Physics", "sub-stepped per 1/60 s so it stays stable"],
    ["Idle", "a ghost sweeps across the word in a slow sine"]

<style data-code>

.sh canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

<body>
<main class="qm-stage">
<!-- code -->
<div class="sh" id="sh">
  <canvas aria-label="The word qbix, made of sand"></canvas>
  <div class="sh-copy">
    <span class="tag is-live">Shipped in 7 days</span>
    <p class="lede">Willow Counseling, live on its own domain.</p>
  </div>
</div>
<!-- /code -->
  <div class="qm-ui"><span>Sweep the pointer across the word</span></div>
</main>
<script src="../kit/stage.js"></script>
<script data-code>
/* Sand: text -> grains with homes -> push by pointer speed -> spring home.
   createSand(canvas, { word, reduce }) -> { pointer(x, y, on) } (css px in the canvas) */
function createSand(cv, { word = 'qbix', reduce = false } = {}) {
  const g = cv.getContext('2d');
  const TONES = ['#121417', '#1b1e22', '#272b30', '#353a41'];   // ink, a shade apart
  let W = 0, H = 0, k = 1, N = 0, x, y, vx, vy, hx, hy, rest, col, sz;
  const P = { x: -999, y: -999, px: -999, py: -999, vx: 0, vy: 0, on: false };

  function homes() {
    const off = document.createElement('canvas');
    off.width = Math.max(1, Math.round(W)); off.height = Math.max(1, Math.round(H));
    const o = off.getContext('2d', { willReadFrequently: true });
    o.font = '200px Eurostile, Geist, sans-serif';
    const per = o.measureText(word).width / 200;
    const size = Math.min(H * 0.5, (W * 0.8) / per);
    o.font = `${size}px Eurostile, Geist, sans-serif`;
    o.textAlign = 'center'; o.textBaseline = 'alphabetic';
    o.fillStyle = '#fff'; o.fillText(word, W / 2, H * 0.47 + size * 0.27);
    const d = o.getImageData(0, 0, off.width, off.height).data;
    let area = 0;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 128) area += 4;
    const want = Math.min(11000, Math.max(3000, Math.round(W * H / 55)));
    const step = Math.max(1.5, Math.sqrt(area / want));
    const pts = []; let s = 1;
    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let yy = 0; yy < off.height; yy += step) for (let xx = 0; xx < off.width; xx += step) {
      const px = xx + (r() - 0.5) * step, py = yy + (r() - 0.5) * step, ix = Math.round(px), iy = Math.round(py);
      if (ix < 0 || iy < 0 || ix >= off.width || iy >= off.height) continue;
      if (d[(iy * off.width + ix) * 4 + 3] > 110) pts.push(px, py);
    }
    return pts;
  }
  function build(keep) {
    const pts = homes(), n = pts.length / 2, ox = x, oy = y, oN = N;
    x = new Float32Array(n); y = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n);
    hx = new Float32Array(n); hy = new Float32Array(n); rest = new Float32Array(n);
    col = new Uint8Array(n); sz = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      hx[i] = pts[i * 2]; hy[i] = pts[i * 2 + 1];
      col[i] = (Math.random() * 4) | 0; sz[i] = 1.3 + Math.random() * 0.9;
      if (keep && oN) { const j = i % oN; x[i] = ox[j]; y[i] = oy[j]; rest[i] = Math.random() * 0.3; }
      else if (reduce) { x[i] = hx[i]; y[i] = hy[i]; }
      else {   // poured in from the edges
        const a = Math.random() * 6.2832, rr = Math.max(W, H) * (0.35 + Math.random() * 0.4);
        x[i] = W / 2 + Math.cos(a) * rr * 0.9; y[i] = H / 2 + Math.sin(a) * rr * 0.6; rest[i] = Math.random() * 0.5;
      }
    }
    N = n;
  }
  function step(dt) {
    const f = dt * 60, R = Math.max(46, Math.min(W, H) * 0.11), R2 = R * R;
    const pvx = P.vx, pvy = P.vy, sp = Math.hypot(pvx, pvy), active = P.on && sp > 0.05;
    for (let i = 0; i < N; i++) {
      const px = x[i], py = y[i];
      if (active) {
        const dx = px - P.x, dy = py - P.y, d2 = dx * dx + dy * dy;
        if (d2 < R2) {
          const d = Math.sqrt(d2) || 1, w = 1 - d / R, push = w * w * 2.4 * Math.min(1.6, 0.4 + sp * 0.06);
          vx[i] += (dx / d) * push * f + pvx * w * 0.16 * f; vy[i] += (dy / d) * push * f + pvy * w * 0.16 * f;
          rest[i] = 0.35 + Math.random() * 0.9;
        }
      }
      if (rest[i] > 0) {                      // pushed grains slide to a stop
        rest[i] -= dt; const fr = Math.pow(0.9, f); vx[i] *= fr; vy[i] *= fr;
      } else {                                // then home, on a damped spring with a little swirl
        const ex = hx[i] - px, ey = hy[i] - py, sw = (i & 1 ? 1 : -1) * 0.004;
        vx[i] += (ex * 0.012 - ey * sw) * f; vy[i] += (ey * 0.012 + ex * sw) * f;
        const fr = Math.pow(0.84, f); vx[i] *= fr; vy[i] *= fr;
      }
      x[i] = px + vx[i] * f; y[i] = py + vy[i] * f;
    }
  }
  function draw() {
    g.setTransform(k, 0, 0, k, 0, 0); g.clearRect(0, 0, W, H);
    for (let c = 0; c < 4; c++) {
      g.fillStyle = TONES[c]; g.beginPath();
      for (let i = 0; i < N; i++) if (col[i] === c) g.rect(x[i], y[i], sz[i], sz[i]);
      g.fill();
    }
  }
  function fit(keep) {
    W = cv.clientWidth; H = cv.clientHeight; k = Math.min(2, devicePixelRatio || 1);
    cv.width = Math.round(W * k); cv.height = Math.round(H * k);
    build(keep); draw();
  }
  let prev = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.04, (now - (prev || now)) / 1000); prev = now;
    if (P.px > -999 && dt) { P.vx += ((P.x - P.px) / (dt * 60) - P.vx) * 0.5; P.vy += ((P.y - P.py) / (dt * 60) - P.vy) * 0.5; }
    P.px = P.x; P.py = P.y;
    const n = Math.max(1, Math.ceil(dt * 60 - 0.01));
    for (let s = 0; s < n; s++) step(dt / n);
    draw();
  }
  fit(false);
  if (document.fonts) document.fonts.load('200px Eurostile').then(() => fit(!reduce));
  new ResizeObserver(() => { if (cv.clientWidth !== W || cv.clientHeight !== H) fit(true); }).observe(cv);
  requestAnimationFrame(frame);
  return { pointer(px, py, on = true) { P.x = px; P.y = py; P.on = on; } };
}
</script>
<script>
  const cv = document.querySelector('#sh canvas');
  const sand = createSand(cv, { reduce: QM.reduced });
  addEventListener('pointermove', (e) => { const r = cv.getBoundingClientRect(); sand.pointer(e.clientX - r.left, e.clientY - r.top, true); }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => sand.pointer(-999, -999, false));
  QM.demo({
    kind: 'pointer',
    // sweeps the word left to right and back, a little above and below the middle
    path: (t) => [innerWidth * (0.5 + 0.42 * Math.sin(t * 0.8 - 1.6)), innerHeight * (0.46 + 0.14 * Math.sin(t * 1.6))],
    move(x, y, ghost) { const r = cv.getBoundingClientRect(); sand.pointer(x - r.left, y - r.top, true); },
    leave() { sand.pointer(-999, -999, false); },
  });
</script>
</body>
</html>
