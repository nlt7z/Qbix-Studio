<style data-code>
/* Palette pull: a picture is sampled, its colours land in a row. */
.pp { position: relative; width: 560px; background: var(--surface); padding: 24px; color: var(--fg); --cut: 16px; }
.pp-top { display: flex; align-items: center; justify-content: space-between; height: 20px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg2); }
.pp-pic { position: relative; height: 270px; overflow: hidden; background: var(--sunk); }
.pp-pic img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 60%; }
/* a sample point: a true circle in its own colour, ringed white so it reads on any picture */
.pp-dot { position: absolute; left: var(--x); top: var(--y); width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px #fff; }
.pp-fly { position: absolute; left: 0; top: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--c); pointer-events: none; }
.pp-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 18px; }
.pp-blk { display: block; height: 56px; background: var(--c); transform-origin: 50% 100%; }
.pp-slot { display: grid; align-content: start; }
.pp-blk + .sl { margin-top: 10px; }
.sl { display: block; height: 16px; overflow: hidden; line-height: 16px; white-space: nowrap; }
.sl > * { display: block; }
.pp-hex { font-family: var(--font-mono); font-weight: 400; font-size: 12px; letter-spacing: 0.06em; }
.pp-role { font-size: 12px; color: var(--fg2); letter-spacing: 0; }
.pp-cnt { position: relative; width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.pp-cnt > span { position: relative; display: block; height: 20px; }
.pp-cnt i { position: absolute; right: 0; top: 0; font-style: normal; height: 20px; line-height: 20px; }
.pp-cnt.sl { height: 20px; }
</style>

<script data-code>
/* Build the whole pull as paused Web Animations on one clock, so it can play from 0 or be
   scrubbed to any time. Colours come from the markup (written down), never from a canvas. */
function palettePull(card) {
  const OUT = 'cubic-bezier(0.16, 1, 0.3, 1)', MOVE = 'cubic-bezier(0.65, 0, 0.35, 1)', IN = 'cubic-bezier(0.5, 0, 0.75, 0)';
  const pic = card.querySelector('.pp-pic');
  const dots = [...pic.querySelectorAll('.pp-dot')];
  const slots = [...card.querySelectorAll('.pp-slot')];
  const cnt = card.querySelector('.pp-cnt');
  const anims = [];
  const add = (el, kf, o) => {
    const a = el.animate(kf, Object.assign({ fill: 'both' }, o));
    a.pause();
    anims.push(a);
    return a;
  };
  const DROP = 560, STEP = 90, FLY = 700, PULL0 = 1100, GAP = 130, LAND = FLY * 0.88, GROW = 520, ROLL = 420;
  const lands = slots.map((_, i) => (i < dots.length ? PULL0 + i * GAP + LAND : PULL0 + (dots.length - 1) * GAP + LAND + 380));

  dots.forEach((d, i) => {
    const y = parseFloat(d.style.getPropertyValue('--y'));
    add(d, [{ transform: `translateY(${-(y + 28)}px)` }, { transform: 'translateY(0)' }], { duration: DROP, delay: i * STEP, easing: OUT });
    add(d, [{ scale: 1 }, { scale: 0.5 }], { duration: 320, delay: PULL0 + i * GAP, easing: MOVE });
    // the colour lifts off its point: a circle that grows on it, flies to the baseline, and is
    // taken in by the block growing up from there
    const fly = document.createElement('i');
    fly.className = 'pp-fly';
    fly.style.setProperty('--c', d.style.getPropertyValue('--c'));
    card.append(fly);
    const blk = slots[i].querySelector('.pp-blk');
    const sx = pic.offsetLeft + d.offsetLeft + 8, sy = pic.offsetTop + d.offsetTop + 8;
    const ex = slots[i].offsetLeft + slots[i].offsetWidth / 2, ey = blk.offsetTop + blk.offsetHeight - 8;
    const at = (x, y, s) => `translate(${x}px, ${y}px) scale(${s})`;
    add(fly, [
      { transform: at(sx, sy, 0), offset: 0, easing: OUT },
      { transform: at(sx, sy, 1), offset: 0.12, easing: MOVE },
      { transform: at(ex, ey, 1), offset: 0.88, easing: IN },
      { transform: at(ex, ey, 0), offset: 1 },
    ], { duration: FLY, delay: PULL0 + i * GAP });
  });
  slots.forEach((s, i) => {
    const t = lands[i];
    add(s.querySelector('.pp-blk'), [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: GROW, delay: t, easing: OUT });
    const [hex, role] = s.querySelectorAll('.sl > *');
    const roll = (el, d) => add(el, [{ transform: 'translateY(115%)' }, { transform: 'translateY(0)' }], { duration: ROLL, delay: t + d, easing: OUT });
    roll(hex, 120);
    roll(role, 200);
  });
  // the counter: every line is its own sleeve; the next rolls in (transform) while the one before rolls
  // out (the separate `translate` property, filled forwards only, so it never shows before its turn)
  const lines = [...cnt.querySelectorAll('i')];
  lines.forEach((ln, k) => {
    if (k > 0) add(ln, [{ transform: 'translateY(115%)' }, { transform: 'translateY(0)' }], { duration: ROLL, delay: lands[k - 1], easing: OUT });
    if (k < lines.length - 1) add(ln, [{ translate: '0 0' }, { translate: '0 -115%' }], { duration: ROLL, delay: lands[k], easing: OUT, fill: 'forwards' });
  });

  const total = Math.max(...anims.map((a) => a.effect.getComputedTiming().endTime));
  const at0 = () => anims.forEach((a) => { a.pause(); a.currentTime = 0; });
  return {
    total,
    reset: at0,
    play: () => anims.forEach((a) => { a.currentTime = 0; a.play(); }),
    seek: (v) => anims.forEach((a) => { a.pause(); a.currentTime = v * total; }),
    finish: () => anims.forEach((a) => { a.pause(); a.currentTime = total; }),
  };
}
</script>
<script>
  const card = document.getElementById('pp');
  const pull = palettePull(card);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* harness glue: scale the 560-wide design to the stage, centred, clear of the detail bar */
  const box = document.getElementById('fit');
  function fit() {
    const W = 560, H = box.offsetHeight || 500;
    const vw = innerWidth, vh = innerHeight - (QM.tile ? 0 : 46);
    const k = Math.min((0.7 * vw) / W, (0.86 * vh) / H, 1.5);
    box.style.cssText = `position:fixed;left:50%;top:${vh / 2}px;width:${W}px;transform:translate(-50%,-50%) scale(${k.toFixed(4)})`;
  }
  fit();
  addEventListener('resize', fit);

  if (still) pull.finish();
  QM.demo({
    kind: 'play',
    dur: pull.total,
    hold: 2400,
    lead: 500,
    reset: () => (still ? pull.finish() : pull.reset()),
    play: () => { if (!still) pull.play(); },
    seekPlay: (v) => pull.seek(v),
  });
</script>
