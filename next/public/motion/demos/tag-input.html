<style data-code>
/* Tag input: the word you typed becomes the block, in place. */
.card { background: var(--surface); padding: 28px; display: grid; gap: 14px; --cut: 16px; }
.tg-label { font: 500 15px/20px var(--font-sans); letter-spacing: -0.011em; color: var(--fg); }
.tg-field { position: relative; background: var(--sunk); padding: 14px 16px 15px; min-height: 64px; }
.tg-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tg-chip { --cut: 8px; display: inline-flex; align-items: center; height: 34px; padding: 0 12px; background: var(--fg); color: var(--ground); font: 500 15px/1 var(--font-sans); letter-spacing: -0.011em; white-space: nowrap; }
.tg-in { flex: 1 1 90px; min-width: 90px; height: 34px; padding: 0; border: 0; outline: 0; background: transparent; color: var(--fg); caret-color: var(--fg); font: 500 15px/1 var(--font-sans); letter-spacing: -0.011em; }
.tg-in::placeholder { color: var(--fg3); }
.tg-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--signal); transform: scaleX(0); transform-origin: left center; transition: transform 420ms var(--ease-out-expo); }
.tg-field:focus-within .tg-bar, .tg-field.is-focus .tg-bar { transform: scaleX(1); }
.tg-foot { display: flex; justify-content: space-between; font-size: 11px; line-height: 16px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg2); }

<body>
<main class="qm-stage">
<div class="rig" id="rig">
  <p class="kicker">Brief · Project tags</p>
<!-- code -->
<div class="card cut tg">

  <div class="tg-field" id="tg-field">
    <div class="tg-row" id="tg-row"><input id="tg-in" class="tg-in" type="text" placeholder="Add a tag" autocomplete="off" spellcheck="false"></div>
    <span class="tg-bar"></span>

</div>
<!-- /code -->

<script data-code>
/* Tag input. Offsets (not client rects) so it works under any scale: the chip is laid out in its slot
   first, then animated from where the typed text was. */
const field = document.getElementById('tg-field'), row = document.getElementById('tg-row');
const input = document.getElementById('tg-in'), nEl = document.getElementById('tg-n');
const MAX = 6, tags = [];
const EXPO = 'cubic-bezier(0.16, 1, 0.3, 1)';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fly = (el, from, ms, easing = EXPO) => { if (!still) el.animate(from, { duration: ms, easing }); };

function count() {
  nEl.textContent = tags.length + ' / ' + MAX;
  input.placeholder = tags.length ? '' : 'Add a tag';
}
function commit() {
  const v = input.value.trim().replace(/,+$/, '');
  if (!v || tags.length >= MAX) return false;
  const x0 = input.offsetLeft, y0 = input.offsetTop;           // where the text was typed
  const chip = document.createElement('span');
  chip.className = 'tg-chip cut'; chip.textContent = v;
  row.insertBefore(chip, input); tags.push(chip);
  input.value = '';
  const dx = x0 - (chip.offsetLeft + 12), dy = y0 - chip.offsetTop;
  fly(chip, [
    { transform: `translate(${dx}px, ${dy}px)`, background: 'rgba(18,20,23,0)', color: '#121417' },
    { transform: 'translate(0, 0)', background: '#121417', color: '#f3f4f5' }
  ], 420);
  fly(input, [{ transform: `translate(${x0 - input.offsetLeft}px, ${y0 - input.offsetTop}px)` }, { transform: 'none' }], 420);
  count();
  return true;
}
function pull() {
  if (!tags.length || input.value) return false;
  const chip = tags.pop(), text = chip.textContent;
  const x = chip.offsetLeft, y = chip.offsetTop;
  chip.remove();
  input.value = text; count();
  const g = chip.cloneNode(true);                              // the block drains to plain text while the field takes the word
  g.style.cssText = `position:absolute;left:${x}px;top:${y}px;margin:0;pointer-events:none`;
  field.appendChild(g);
  fly(g, [{ background: '#121417', color: '#f3f4f5' }, { color: 'rgba(243,244,245,0)', offset: 0.35 }, { background: 'rgba(18,20,23,0)', color: 'rgba(243,244,245,0)' }], 300, 'linear');
  setTimeout(() => g.remove(), still ? 0 : 300);
  fly(input, [{ transform: 'translateX(12px)' }, { transform: 'none' }], 300);
  input.setSelectionRange(text.length, text.length);
  return true;
}
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); }
  else if (e.key === 'Backspace' && !input.value && tags.length) { e.preventDefault(); pull(); }
});
</script>
<script>
  /* ---- harness glue: scale to the frame, the ghost script, real input takes over ---- */
  const rig = document.getElementById('rig');
  function fit() {
    const bar = QM.tile ? 0 : 46;
    const k = Math.min(innerWidth * 0.68 / 520, (innerHeight - bar - 48) / rig.offsetHeight, 2.2);
    rig.style.transform = `scale(${k.toFixed(4)})`;
  }
  addEventListener('resize', fit); fit();

  const ABORT = { abort: true };
  let gen = 0, running = false, paused = false, lastReal = -1e9;
  const sleep = (ms) => { const g = gen; return new Promise((res, rej) => setTimeout(() => (g === gen ? res() : rej(ABORT)), ms)); };
  const focusOn = (on) => { field.classList.toggle('is-focus', on); };
  function reset() {
    rig.classList.add('is-reset');
    tags.splice(0).forEach((c) => c.remove());
    input.value = ''; count(); focusOn(false);
    void rig.offsetWidth;
    rig.classList.remove('is-reset');
  }
  async function type(s, ms = 105) {
    for (const ch of s) { input.value += ch; await sleep(ms + (ch === 'e' ? 20 : 0)); }
  }
  async function erase(ms = 60) { while (input.value) { input.value = input.value.slice(0, -1); await sleep(ms); } }
  async function story() {
    reset(); await sleep(500);
    focusOn(true); await sleep(450);
    for (const w of ['brand', 'website', 'launch']) { await type(w); await sleep(260); commit(); await sleep(620); }
    await sleep(600); pull(); await sleep(900);
    await erase(); await sleep(250);
    await type('type'); await sleep(260); commit();
    await sleep(2400); focusOn(false); await sleep(600);
  }
  function showStill() { ['brand', 'website', 'launch'].forEach((w) => { input.value = w; commit(); }); focusOn(true); }
  function cancel() { gen++; running = false; QM.ghostHide(); }
  if (!QM.tile) {
    const real = (e) => { if (e.isTrusted) { lastReal = performance.now(); if (running) { cancel(); focusOn(false); } } };
    ['pointerdown', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  }
  addEventListener('message', (e) => { const m = e.data; if (m && m.qm === 'cmd' && m.cmd === 'pause') { paused = true; cancel(); } });
  if (QM.reduced) showStill();
  else (async function idle() {
    for (;;) {
      await new Promise((r) => setTimeout(r, 250));
      if (paused || document.hidden || running || (!QM.tile && performance.now() - lastReal < 4000)) continue;
      running = true;
      try { await story(); } catch (e) { if (e !== ABORT) throw e; }
      running = false;
    }
  })();
  QM.demo({ kind: 'loop', restart() { paused = false; lastReal = -1e9; if (running) cancel(); } });
</script>
</body>
