<script data-code>
/* Etched mark. One pair of positions drives both copies of the shapes: the blurred one under the
   tint and the sharp one seen through the letters. Closed sinusoid loops, 16 s and 20 s. */
(() => {
  const box = document.getElementById('em');
  const cs = [...box.querySelectorAll('[data-c]')], bs = [...box.querySelectorAll('[data-b]')];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, P1 = 16, P2 = 20;
  let t0 = performance.now(), raf = 0, onScreen = true, held = 0;

  function show(t) {
    const cx = 300 + 190 * Math.sin(TAU * (t / P1) + 0.9), cy = 196 + 52 * Math.sin(TAU * (t / (P1 / 2)) + 0.4);
    const bx = 330 + 175 * Math.sin(TAU * (t / P2) + 3.9) - 75, by = 196 + 46 * Math.cos(TAU * (t / (P2 / 2)) + 1.2) - 52;
    for (const c of cs) { c.setAttribute('cx', cx.toFixed(2)); c.setAttribute('cy', cy.toFixed(2)); }
    for (const b of bs) { b.setAttribute('x', bx.toFixed(2)); b.setAttribute('y', by.toFixed(2)); }
  }
  function frame(now) {
    raf = 0;
    if (!document.hidden && onScreen) show((now - t0) / 1000);
    raf = requestAnimationFrame(frame);
  }
  if (reduced) show(9);
  else {
    show(0); raf = requestAnimationFrame(frame);
    if ('IntersectionObserver' in window) new IntersectionObserver((e) => {
      const was = onScreen; onScreen = e[e.length - 1].isIntersecting;
      if (!onScreen) held = performance.now(); else if (!was) t0 += performance.now() - held;
    }).observe(box);
  }
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();
  QM.demo({ kind: 'loop', restart() { t0 = performance.now(); } });
})();
</script>
