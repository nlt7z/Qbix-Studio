/* Search morph · Idea: bencho.dev seek (MIT).
   O2's roles in qbix colours: ink on white, one lime. Radii, spacing and type are the O2 library's own. */
.sk {
  --text: #0B0C0D; --muted: rgba(11, 12, 13, 0.64); --faint: rgba(11, 12, 13, 0.58);
  --surface: #ffffff; --surface-muted: #EEF1E8; --surface-border: #E3E8DA; --edge: rgba(11, 12, 13, 0.52); --scrim: rgba(255, 255, 255, 0.72);
  --primary: #B8FF00; --on-primary: #0c1300;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  position: relative; overflow: hidden; width: 680px; background: var(--surface); border-radius: 14px;
  font-family: 'Geist', system-ui, sans-serif; font-size: 14px; line-height: 1.5; letter-spacing: 0; color: var(--text);
}
.sk-bar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: relative; z-index: 3; background: var(--surface); }
.sk-brand { display: flex; align-items: center; gap: 12px; color: var(--text); font-size: 16px; letter-spacing: -0.01em; line-height: 1.35; }
.sk-logo { display: block; height: 20px; width: auto; }
.sk-me { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; object-position: 50% 30%; }
/* one object: a box whose width is the state. The lens never moves inside it. */
.sk-seek { position: absolute; left: 50%; top: 14px; height: 44px; width: 44px; margin-left: -22px; border: 1px solid var(--edge); border-radius: 22px; background: var(--surface); overflow: hidden; display: flex; align-items: center; cursor: pointer; z-index: 4; transition: background-color 120ms var(--ease-out), border-color 120ms var(--ease-out); }
.sk-seek:hover, .sk-seek.is-hot { background: var(--surface-muted); }
.sk-seek.open { cursor: text; background: var(--surface); border-color: var(--text); }
.sk-lens { position: absolute; left: 13px; top: 12px; width: 18px; height: 18px; color: var(--text); display: grid; place-items: center; }
.sk-seek input { position: absolute; left: 40px; top: 0; height: 100%; width: 240px; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: var(--text); padding: 0; opacity: 0; transition: opacity 120ms var(--ease-out); }
.sk-seek input::placeholder { color: var(--faint); }
.sk-seek.open input { opacity: 1; }
.sk-esc { position: absolute; right: 12px; top: 10px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--surface-muted); color: var(--muted); font-size: 12px; display: grid; place-items: center; opacity: 0; transition: opacity 120ms var(--ease-out); pointer-events: none; }
.sk-seek.open .sk-esc { opacity: 1; }
.sk-results { position: absolute; left: 50%; top: 66px; width: 420px; margin-left: -210px; z-index: 2; background: var(--surface); border-radius: 8px; box-shadow: 0 0 0 1px var(--surface-border); padding: 4px; display: none; transform-origin: 50% 0; }
.sk-results.show { display: block; }
.sk-rh { padding: 8px 12px 4px; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--faint); }
.sk-res { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px; height: 56px; transition: background-color 120ms var(--ease-out); }
.sk-res:hover, .sk-res.is-hot { background: var(--surface-muted); }
.sk-res img { width: 36px; height: 26px; object-fit: cover; border-radius: 3px; }
.sk-res .t { flex: 1; display: grid; line-height: 1.3; }
.sk-res .t span:last-child { font-size: 12px; color: var(--muted); }
.sk-res mark { background: var(--primary); color: var(--on-primary); border-radius: 3px; }
.sk-res .pr { text-align: right; font-variant-numeric: tabular-nums; }
.sk-res .pr div:last-child { font-size: 12px; color: var(--muted); }
.sk-page { padding: 24px; display: grid; gap: 16px; }
.sk-page h1 { font-family: var(--font-headline); font-size: 28px; font-weight: 300; letter-spacing: -0.035em; line-height: 1.35; }
.sk-page p { margin: 0; font-size: 12px; color: var(--faint); }
.sk-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.sk-tile { background: var(--surface-muted); border-radius: 14px; padding: 20px; display: grid; gap: 4px; }
.sk-tile span { font-size: 12px; color: var(--muted); }
.sk-tile b { font-family: var(--font-mono); font-weight: 400; font-size: 16px; line-height: 30px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.sk-row { height: 44px; border-radius: 8px; background: var(--surface-muted); }
.sk-scrim { position: absolute; inset: 72px 0 0 0; background: var(--scrim); opacity: 0; pointer-events: none; z-index: 1; transition: opacity 200ms var(--ease-out); }
.sk-scrim.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .sk-seek, .sk-seek input, .sk-esc, .sk-scrim, .sk-res { transition: none; } }

<script data-code>
/* One box whose width is the state, on a spring: a press compresses it, then it grows from its middle. */
const $ = (s) => document.querySelector(s);
const seek = $('#sk-seek'), q = $('#sk-q'), results = $('#sk-results'), scrim = $('#sk-scrim');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ITEMS = [
  { t: 'Forma launch site', d: 'forma.studio · Design service', v: 'Live', n: '3 weeks', img: 'cross', pos: '50% 50%' },
  { t: 'Forma moodboard', d: 'Eight pages, 24 images', v: 'PDF', n: '8 pages', img: 'objects', pos: '50% 50%' },
  { t: 'Forma brief', d: 'Ceramic objects, a site and a film', v: '1 brief', n: 'Signed', img: 'lime-bloom', pos: '50% 50%' },
  { t: 'Forma launch film', d: '30 seconds, captions typed in', v: '0:30', n: 'Video', img: 'lime-arc', pos: '50% 50%' },
];
results.innerHTML = '<div class="sk-rh">Forma · Design service</div>' + ITEMS.map((p) =>
  `<div class="sk-res"><img src="../assets/art/${p.img}.webp" alt="" style="object-position:${p.pos}"><span class="t"><span><mark>Forma</mark>${p.t.slice(5)}</span><span>${p.d}</span></span><span class="pr"><div>${p.v}</div><div>${p.n}</div></span></div>`).join('');
const rows = [...results.querySelectorAll('.sk-res')];

const W0 = 44, W1 = 330;
let w = W0, vw = 0, tw = W0, press = 0, raf = 0, last = 0, open = false, rev = 0;
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const easeOut = (t) => 1 - Math.pow(1 - t, 4), easeIn = (t) => t * t * t;
function tween(ms, step, ease) {
  return new Promise((done) => {
    const t0 = performance.now();
    const f = (now) => { const p = Math.min(1, (now - t0) / ms); step(ease(p)); p < 1 ? requestAnimationFrame(f) : done(); };
    requestAnimationFrame(f);
  });
}
function paint() {
  seek.style.width = w.toFixed(2) + 'px';
  seek.style.marginLeft = (-w / 2).toFixed(2) + 'px';
  seek.style.transform = `scale(${1 - press * 0.08})`;
}
function tick(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  vw += (-420 * (w - tw) - 27 * vw) * dt; w += vw * dt;
  paint();
  if (Math.abs(w - tw) < 0.1 && Math.abs(vw) < 1) { w = tw; vw = 0; paint(); raf = 0; return; }
  raf = requestAnimationFrame(tick);
}
const wake = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };

async function show() {
  const my = ++rev;
  results.classList.add('show');
  rows.forEach((r) => { r.style.opacity = 0; r.style.transform = 'translateY(-6px)'; });
  results.style.opacity = 0;
  await tween(200, (k) => { results.style.opacity = k; }, easeOut);
  for (let i = 0; i < rows.length; i++) {
    if (my !== rev) return;
    tween(260, (k) => { rows[i].style.opacity = k; rows[i].style.transform = `translateY(${(1 - k) * -6}px)`; }, easeOut);
    await sleep(60);
  }
}
async function hide() {
  const my = ++rev;
  await tween(120, (k) => { results.style.opacity = 1 - k; }, easeIn);
  if (my === rev) results.classList.remove('show');
}
async function openIt() {
  if (open) return;
  open = true;
  press = 1; paint(); await sleep(90); press = 0;              // a thing that yields before it moves reads as pushed
  seek.classList.add('open'); scrim.classList.add('on');
  tw = W1;
  if (reduceMotion) { w = tw; paint(); } else wake();
  q.focus({ preventScroll: true });
}
function closeIt() {
  if (!open) return;
  open = false;
  seek.classList.remove('open'); scrim.classList.remove('on');
  q.blur(); hide();
  tw = W0;
  if (reduceMotion) { w = tw; paint(); } else wake();
  q.value = '';
}
seek.addEventListener('pointerdown', () => { if (!open) openIt(); });
seek.addEventListener('click', () => { if (!open) openIt(); });
q.addEventListener('input', () => {
  if (open && q.value.toLowerCase().startsWith('for') && !results.classList.contains('show')) show();
  if (!q.value) hide();
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeIt();
  if ((e.key === 'k' && (e.metaKey || e.ctrlKey)) || (e.key === '/' && !open)) { e.preventDefault(); openIt(); }
});
document.addEventListener('pointerdown', (e) => { if (open && !e.target.closest('#sk-seek, #sk-results')) closeIt(); });
paint();
</script>
<script>
  /* harness glue: a ghost opens the search, types, looks at a result and presses Esc */
  PickGhost.fit(document.getElementById('pk'), 680, 520);
  function rest() { rev++; open = false; seek.classList.remove('open'); scrim.classList.remove('on'); results.classList.remove('show'); results.style.opacity = ''; rows.forEach((r) => { r.style.opacity = ''; r.style.transform = ''; }); q.value = ''; q.blur(); w = tw = W0; vw = 0; press = 0; paint(); }
  PickGhost.start({
    hot: '.sk-res, .sk-seek:not(.open)',
    reset: rest,
    async script(g) {
      await g.wait(500);
      await g.click('#sk-seek', { ms: 600 });
      await g.wait(500);
      await g.type('#sk-q', 'Forma', 90);
      await g.wait(2200);
      await g.to(() => rows[1], { ms: 400 });
      await g.wait(900);
      await g.key('Escape');
      await g.wait(1400);
    },
    still() { open = true; seek.classList.add('open'); scrim.classList.add('on'); w = tw = W1; paint(); q.value = 'Forma'; results.classList.add('show'); },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
</body>
