<script data-code>
/* One function of one value, bgRender(v) with v 0..1, draws every frame. The pane's left edge L eases
   across; its right edge R waits at the line's end until the slab (PW px) is left, then leaves with it. */
(() => {
  const DUR = 2800, PW = 200, PAD = 28, W = 800, LEG = 1200 / 2800, BEAT = 400 / 2800;
  const frost = document.getElementById('bgl-frost'), h = document.querySelector('#bgl-sharp .bgl-h');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (x) => Math.min(1, Math.max(0, x));
  function bez(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(clamp(t)); };
  }
  const move = bez(0.65, 0, 0.35, 1);
  let x0 = 0, x1 = W, top = 80, bot = 80, xm = 400;
  function measure() {
    const b = document.getElementById('bgl').getBoundingClientRect(), r = h.getBoundingClientRect(), s = b.width / W || 1;
    x0 = (r.left - b.left) / s - PAD; x1 = (r.right - b.left) / s + PAD; xm = (x0 + x1) / 2;
    const ct = (r.top - b.top) / s, cb = (b.bottom - r.bottom) / s;
    top = Math.max(0, ct - 90); bot = Math.max(0, cb - 90);
  }
  function bgRender(v) {
    const L = v < LEG + BEAT / 2 ? x0 + move(clamp(v / LEG)) * (xm - x0) : xm + move(clamp((v - LEG - BEAT) / LEG)) * (W - xm), R = Math.max(x1, L + PW) + 0;
    const Rr = v >= 1 ? W : Math.min(W, R);
    const l = Math.max(0, L), r = Math.max(0, W - Rr);
    frost.style.clipPath = v >= 1 ? 'inset(50% 50% 50% 50%)' : `inset(${top}px ${r.toFixed(1)}px ${bot}px ${l.toFixed(1)}px)`;
  }
  let raf = 0;
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };
  function reset() { stop(); measure(); bgRender(reduced ? 1 : 0); }
  function play() {
    stop();
    if (reduced) return bgRender(1);
    measure();
    const t0 = performance.now();
    const step = (now) => { const v = (now - t0) / DUR; bgRender(Math.min(v, 1)); if (v < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  }
  QM.demo({ kind: 'play', lead: 900, dur: DUR, hold: 2200, reset, play, seekPlay(v) { stop(); bgRender(QM.clamp01(v)); } });
  const fit = () => { document.getElementById('fit').style.setProperty('--s', Math.max(0.4, Math.min(1.8, innerWidth / 900, innerHeight / 500)).toFixed(3)); };
  addEventListener('resize', fit); fit();
  if (document.fonts) document.fonts.ready.then(() => { if (!raf) reset(); });
  reset();
})();
</script>
