/* Step toast. The run is a clock (S.rt); the picture is springs, all critically damped, all starting from the value and velocity on screen.
   A card (one per finished step) has its depth p (0 is the newest, -1 is the toast itself) and its openness o. Its rect is the mix of two rects by o:
   the stacked edge for depth p (8 px up and 0.95 scale per level, at most three levels) and the row for depth p (52 px rows, 8 px apart, up the page).
   A card is clipped to the strip above the card in front of it, so a card behind shows its edge only and its text never mixes with another's.
   The page loads on a pose that is played, not drawn: the run is stepped, with the same code, to step 2 at 38 of 96 with the stack open. */
const ST = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TILE = new URLSearchParams(location.search).has('tile');
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const NS = 'http://www.w3.org/2000/svg';
  const TW = 452, TH = 64, RH = 52, RG = 8, LV = 8, SC = 0.95, MAXL = 3, FIN = 0.46, TKS = 0.26, GONE = 150, GRACE = 0.3, SLOP = 6, LOOK = 0.099, FLICKV = 500, BAND = 120;
  const LIME = [184, 255, 0], GRN = [174, 174, 178], DNC = [134, 134, 139], INK = [29, 29, 31];
  const RESP = { roll: 0.34, fill: 0.2, close: 0.18, disc: 0.26, tick: 0.2, grey: 0.2, count: 0.2, open: 0.38, shift: 0.42, leave: 0.45, rise: 0.5, home: 0.4, pill: 0.4, pillIn: 0.22 };

  /* a spring: the critically damped closed form; it always starts from the x and v on screen */
  const mk = (x = 0, resp = 0.3, eps = 0.002) => ({ x, v: 0, T: x, w: TAU / resp, on: false, eps });
  function step(s, dt) {
    if (!s.on) return;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.T + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.T) < s.eps && Math.abs(s.v) < s.eps * 12) { s.x = s.T; s.v = 0; s.on = false; }
  }
  function aim(s, T, resp, v) {
    if (resp) s.w = TAU / resp;
    s.T = T;
    if (v !== undefined) s.v = v;
    if (reduced) { s.x = T; s.v = 0; s.on = false; } else s.on = true;
  }
  const snap = (s, x) => { s.x = s.T = x; s.v = 0; s.on = false; };
  const rb = (x, D) => (x * D * 0.55) / (D + 0.55 * x);                      // rubber band, Apple's constant 0.55

  /* the steps: slot is what this run took, m is the batches of a count as [share of the working time, count] */
  const STEPS = [
    { live: 'Uploading files', done: 'Uploaded 12 files', slot: 1.8, n: 12, m: [[0, 0], [0.08, 2], [0.2, 4], [0.34, 5], [0.5, 7], [0.64, 9], [0.8, 11], [0.94, 12]] },
    { live: 'Optimising images', done: 'Optimised 96 images', slot: 3.2, n: 96, m: [[0, 0], [0.05, 6], [0.11, 13], [0.18, 19], [0.27, 27], [0.34, 33], [0.4, 38], [0.48, 46], [0.56, 55], [0.64, 63], [0.72, 72], [0.8, 80], [0.87, 87], [0.93, 92], [0.98, 96]] },
    { live: 'Updating DNS', done: 'Updated DNS', slot: 4.0, slow: 2.5 },
    { live: 'Going live', done: 'Went live', slot: 1.1, last: true }
  ];
  const N = STEPS.length, LAST = N - 1;
  let acc = 0;
  STEPS.forEach((s) => { s.T = acc; acc += s.slot; });
  const TOTAL = acc, END_TEXT = 'Live at willowcounseling.com', CANCEL_TEXT = 'Cancelled. Nothing was published.';
  const POSE_RT = STEPS[1].T + 1.18, POSE_RT_R = STEPS[2].T + 0.9;
  const countAt = (s, p) => { let c = 0; for (const [q, v] of s.m) if (p >= q) c = v; return c; };
  const sec = (x) => x.toFixed(1) + ' s';

  const $ = (id) => document.getElementById(id);
  const win = $('st-win'), stack = $('st-stack'), bridge = $('st-bridge'), list = $('st-list'), toast = $('st-toast'), act = $('st-act'), pill = $('st-pill'), live = $('st-live');
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const sv = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const hex = ([r, g, b]) => `rgb(${r},${g},${b})`;
  const mix = (a, b, k) => a.map((v, j) => Math.round(v + (b[j] - v) * k));
  const put = (e, k, v) => { if (e['_' + k] !== v) { e.setAttribute(k, v); e['_' + k] = v; } };

  pill.addEventListener('click', () => bringBack());

  /* the pose: step the world, with the same code as the run, to step 2 at 38 of 96, the stack open on one finished row; let the springs rest, hold, then the run goes on */
  function pose() {
    S.epoch++; Q.length = 0; S.posing = true; S.hold = 0; S.t = 0; S.runs = 0; S.state = 'run';
    H.ptr = H.foc = H.tap = H.esc = H.hold = false; DR = null; stack.classList.remove('is-drag');
    begin(false);
    if (reduced) { while (S.rt < POSE_RT_R) tick(1 / 60); resolve(); }
    else { while (S.rt < 1.95) tick(1 / 60); H.ptr = true; resolve(); while (S.rt < POSE_RT) tick(1 / 60); }
    const was = S.rt; S.hold = 99; for (let k = 0; k < 90; k++) tick(1 / 60); S.rt = was;
    S.hold = reduced ? 8 : TILE ? 1.3 : 0.6;
    S.posing = false;
    if (S.said) { live.textContent = S.said; }
    render();
  }

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (S.manual) return;
    tick(dt); render();
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  pose();
  last = performance.now();
  raf = requestAnimationFrame(frame);
  return { S, H, STEPS, TOTAL, CARDS: () => CARDS, DY, PL, tick, render, pose, cancel, undo, leave, letgo, resolve, win, stack, toast, act, pill, list, bridge, NAME, MARK, ACT, setOpen, isOpen: () => OPEN, drag: () => DR, layout, extent };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('st-fit');
  // the editor is drawn 720 × 460 and scaled to the room it is given
  function size() {
    const W = innerWidth, Hh = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 14 : Math.min(72, Math.max(24, 0.06 * Math.min(W, Hh))), ui = tile ? 0 : 46;
    let s = Math.max(0.4, Math.min((W - 2 * pad) / 720, (Hh - 2 * pad - ui) / 460, 1.6));
    s = Math.floor(s * 16) / 16;
    fit.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);

  /* the ghost: it moves the same pointer a hand does (untrusted events on the same handlers) and presses the real buttons */
  let epoch = 0, resumeT = 0, pos = null, touched = false;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const fire = (type, x, y, down = false) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 73, isPrimary: true, button: type === 'pointermove' ? -1 : 0, buttons: down ? 1 : 0, view: window }));
    return t;
  };
  async function glide(my, to, ms = 760, down = false) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y }; fire('pointermove', x, y, down);
      if (p >= 1) break;
    }
  }
  const until = async (my, ok, max = 14000) => { let t = 0; while (!ok() && t < max) { await gap(my, 60); t += 60; } };
  const pt = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  const park = () => pt(ST.win, 0.93, 0.5);
  async function press(my, el) {                                             // hover, press, release, click: the real pointer path
    const { x, y } = pos;
    el.classList.add('is-hot'); await gap(my, 180);
    fire('pointerdown', x, y, true); await gap(my, 100); fire('pointerup', x, y);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
    await gap(my, 140); el.classList.remove('is-hot');
  }
  async function dragDown(my, dist, ms) {                                    // a quick pull down on the toast, then let go
    const a = pos; fire('pointerdown', a.x, a.y, true); await gap(my, 90);
    await glide(my, { x: a.x + 6, y: a.y + dist }, ms, true);
    fire('pointerup', pos.x, pos.y);
  }
  const S = ST.S;
  async function script(first) {
    const my = ++epoch;
    try {
      const toast = () => pt(ST.toast, 0.66, 0.5);
      if (first) { pos = toast(); QM.ghostAt(pos.x, pos.y); QM.ghostShow(); await until(my, () => S.hold <= 0, 4000); await gap(my, 120); }
      else { pos = park(); QM.ghostAt(pos.x, pos.y); QM.ghostShow(); await gap(my, 500); }
      for (let round = 0; ; round++) {
        if (round > 0 || !first) { await until(my, () => S.state === 'run' && S.rt < 0.4 && S.hold <= 0, 30000); }
        else { await glide(my, park(), 760); }                                // the pose's pointer leaves, the stack closes, the run goes on
        const r = S.runs - 1, mode = r % 2 === 1 ? 'cancel' : r % 4 === 2 ? 'flick' : 'hover';   // a cancel every second run, a flick every fourth
        if (mode === 'hover') {
          await until(my, () => S.state === 'run' && S.rt >= STEPS_T(2) + 0.5, 12000);
          await glide(my, toast(), 800); await gap(my, 700);                  // back on the toast: the stack opens
          await until(my, () => ST.CARDS().length >= 3 || S.state !== 'run', 9000);   // step 3 ends while it is open: a row joins by the same move
          await gap(my, 1100);
        } else if (mode === 'cancel') {
          await until(my, () => S.state === 'run' && S.rt >= STEPS_T(1) + 0.1, 12000);
          await glide(my, toast(), 640); await gap(my, 500);
          await glide(my, pt(ST.act), 380); await gap(my, 120); await press(my, ST.act);   // Cancel
          await gap(my, 1700);
          await press(my, ST.act);                                            // Undo
          await gap(my, 900);
        } else {
          await until(my, () => S.state === 'run' && S.rt >= STEPS_T(1) + 0.7, 12000);
          await glide(my, toast(), 800); await gap(my, 600);
          await glide(my, pt(ST.toast, 0.5, 0.5), 300);
          await dragDown(my, 150 * ST.win.getBoundingClientRect().width / 720, 230);        // flicked away: the run goes on unseen
          await glide(my, park(), 600);
          await until(my, () => ST.PL.T === 1 && ST.PL.x > 0.98, 6000); await gap(my, 2200);
          await glide(my, pt(ST.pill), 800); await gap(my, 200);
          if (ST.S.away) await press(my, ST.pill);                            // the pill brings the stack back
          await gap(my, 1200);
        }
        await glide(my, park(), 800);                                         // the pointer leaves; the stack closes
        await until(my, () => S.state === 'gone', 30000);
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  const STEPS_T = (i) => ST.STEPS[i].T;
  function stopScript() {
    epoch++; QM.ghostHide(); ST.letgo();
    document.querySelectorAll('.is-hot').forEach((el) => el.classList.remove('is-hot'));
    if (pos) { pos = null; fire('pointermove', -10, -10); }
  }
  if (!QM.tile && !reduced) {
    const idle = () => ST.win.matches(':hover') || ST.H.ptr || ST.H.foc || ST.H.tap;
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                                // the ghost's own events do not count
      touched = true; stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true, capture: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); touched = false; ST.pose(); if (!reduced) script(true); } });
  // the harness hides the ghost as it starts; the pose's pointer is shown on the toast a moment after
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(() => requestAnimationFrame(() => { if (!touched) script(true); })));
})();
</script>
