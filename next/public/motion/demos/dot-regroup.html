   a dot waits up to 0.25 s by how far it has to go, so the near ones land first, and its path bows to the upper side by a fraction of the leg, so the flock does not
   cross in straight lines. A layout is a list of columns; a dot's row in its column is its rank by order time. Counts are the dots that have landed (within 4 px of their slot). */

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const card = $('dr-card'), cv = $('dr-cv'), cx = cv.getContext('2d'), tagEl = $('dr-tag'), chip = $('dr-chip'), chipT = $('dr-chip-t'), msg = $('dr-msg'), segEl = $('dr-seg'),
    colsEl = $('dr-cols'), labsEl = $('dr-labs'), tbl = $('dr-table');
  const CWD = 780, XC = 390, BY = 346, D = 10, R = 5, YMIN = 62, LABY = 372, N = 120;            // card px: the bottom row's centre line, the dot and its radius, the labels' top
  const CX0 = 14, CY0 = 56, CVW = 752, CVH = 312;                                                 // the dots' canvas, with room for a hovered dot
  const TAU = 2 * Math.PI, wr = (s) => TAU / s;
  const W_DOT = wr(0.5), W_LAB = wr(0.16), W_DIG = wr(0.14), W_CHIP = wr(0.2), W_TAG = wr(0.09), W_TAGA = wr(0.12), W_SEG = wr(0.34);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  /* a critically damped spring: the closed form, always from the x and v on screen */
  const mk = (x = 0) => ({ x, v: 0, t: x });
  const rest = (s) => s.x === s.t && s.v === 0;
  function spring(s, dt, w, eps = 1e-3) {
    if (reduced) { s.x = s.t; s.v = 0; return; }
    const A = s.x - s.t, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.t + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.t) < eps && Math.abs(s.v) < eps * 10) { s.x = s.t; s.v = 0; }
  }

  /* the data: 120 orders, generated once from a seed (shuffles are Fisher-Yates, so every engine agrees). Orders are in time order, three weeks Monday to Sunday */
  const PRODUCTS = [['Ash vase', 44], ['Loop tray', 30], ['Pressed tumbler', 23], ['Linen runner', 14], ['Stone dish', 9]];
  const CHANNELS = [['Shop', 58], ['Instagram', 41], ['Wholesale', 21]];
  const DAYS = [['Mon', 13], ['Tue', 15], ['Wed', 16], ['Thu', 18], ['Fri', 21], ['Sat', 22], ['Sun', 15]];
  const CH_DAY = [[0.8, 0.8, 0.9, 1, 1.2, 2.1, 2.1], [0.9, 0.9, 1, 1, 1.4, 1.3, 1.1], [2.2, 2.2, 2.2, 2, 1.1, 0.08, 0.04]];   // a channel's weight for each weekday: Shop leans to the weekend, Wholesale to Mon to Thu
  const P_CH = [[1, 1, 1, 1.15, 1.25], [2.4, 0.8, 0.9, 0.8, 0.7], [0.45, 1.6, 1.7, 0.9, 0.5]];                              // a product's weight in each channel: Wholesale to Loop tray and Tumbler, Instagram to Ash vase
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

    for (let wk = 0; wk < 3; wk++) for (let d = 0; d < 7; d++) for (let k = 0; k < split[d][wk]; k++) day.push(d);
    const pick = (w) => { let s = 0; for (const x of w) s += x; let u = r() * s; for (let i = 0; i < w.length; i++) { u -= w[i]; if (u < 0) return i; } return w.length - 1; };

    for (const i of shuf(Array.from({ length: N }, (_, k) => k))) { const c = pick(remC.map((n, c) => (n > 0 ? CH_DAY[c][day[i]] * n : 0))); chan[i] = c; remC[c]--; }
    for (const i of shuf(Array.from({ length: N }, (_, k) => k))) { const p = pick(remP.map((n, p) => (n > 0 ? P_CH[chan[i]][p] * n : 0))); prod[i] = p; remP[p]--; }
    return day.map((d, i) => ({ i, prod: prod[i], chan: chan[i], day: d }));

    const bad = [];

  const GROUPS = {
    all: { name: 'all orders', list: [['orders', N]], key: () => 0, w: 15, p: 32, g: 0 },
    product: { name: 'product', list: PRODUCTS, key: (o) => o.prod, w: 5, p: 25, g: 34 },

    day: { name: 'day', list: DAYS, key: (o) => o.day, w: 3, p: 25, g: 44 },
  };

      s.el.style.clipPath = c >= 0.999 ? 'none' : `inset(-2px ${((1 - c) * 100).toFixed(1)}% -2px 0)`;
    }
    paintChip(); paintSeg();
  }

  /* the loop: pauses off screen, in a hidden tab, and while the key frame is held */
  let raf = 0, last = 0, vis = true;
  const live = () => started && vis && !document.hidden && !frozen;
  function loop(now) { raf = 0; if (!live()) return; const dt = clamp((now - last) / 1000, 0.001, 0.05); last = now; update(dt); draw(); if (busy()) raf = requestAnimationFrame(loop); }
  function kick() { if (!raf && live()) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  new IntersectionObserver((es) => { vis = es[es.length - 1].isIntersecting; kick(); }).observe(card);
  document.addEventListener('visibilitychange', kick);
  const ff = (sec) => { for (let k = 0; k < Math.round(sec * 60); k++) update(1 / 60); draw(); };
  function thaw() { if (frozen) { frozen = false; kick(); } }

  /* ----- input: a hand or the ghost, both through the same pointer events ----- */
  const local = (e) => { const r = card.getBoundingClientRect(), k = r.width / CWD || 1; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; };
  const client = (x, y) => { const r = card.getBoundingClientRect(), k = r.width / CWD || 1; return { x: r.left + x * k, y: r.top + y * k }; };
  const colAt = (p) => {
    if (grp === 'all') return -1;
    for (const c of cols) if (p.x >= c.left - 8 && p.x <= c.left + c.vw + 8 && p.y >= BY - (c.rows - 1) * c.p - R - 12 && p.y <= LABY + 50) return c.k;
    return -1;
  };
  const dotAt = (p) => { let best = -1, bd = 10 * 10; for (const d of dots) { const q = (d.rx - p.x) ** 2 + (d.ry - p.y) ** 2; if (q <= bd) { bd = q; best = d.i; } } return best; };
  let ptr = null, touchT = 0;
  function hoverAt(p, touch) {
    const c = colAt(p), h = dotAt(p);
    if (c !== hoverCol || h !== hdot) { hoverCol = c; hdot = h; recolor(); paintLabels(); kick(); }
    ptr = touch ? null : p;
  }
  card.addEventListener('pointermove', (e) => { thaw(); if (e.pointerType === 'touch') return; hoverAt(local(e), false); });
  card.addEventListener('pointerleave', (e) => { if (e.pointerType === 'touch') return; ptr = null; if (hoverCol >= 0 || hdot >= 0) { hoverCol = -1; hdot = -1; recolor(); paintLabels(); kick(); } });
  card.addEventListener('pointerdown', (e) => { thaw(); if (e.pointerType === 'touch') { clearTimeout(touchT); hoverAt(local(e), true); } });
  addEventListener('pointerup', (e) => {
    if (pressCol >= 0) { pressCol = -1; kick(); }
    if (e.pointerType === 'touch') { clearTimeout(touchT); touchT = setTimeout(() => { if (hdot >= 0 || hoverCol >= 0) { hoverCol = -1; hdot = -1; recolor(); paintLabels(); kick(); } }, 1400); }
  });
  addEventListener('pointercancel', () => { if (pressCol >= 0) { pressCol = -1; kick(); } });
  document.addEventListener('keydown', (e) => {
    thaw();
    if (e.key === 'Escape' && pin) { e.preventDefault(); unpin(); }
  });

  /* the page: the key frame, played through the same change a hand makes */
  function hardReset(g = 'all') {
    pin = null; chipText = ''; chip.dataset.t = ''; put0(chipS); hoverCol = kbCol = hdot = pressCol = -1; T = 0; tagDot = -1; put0(tagS.a);
    regroup(g, true);
    ins[['all', 'product', 'channel', 'day'].indexOf(g)].checked = true;
    for (const s of slots) { s.ver = -1; s.c.x = s.c.t = 0; s.c.v = 0; }
    ff(1 / 60);
  }
  const put0 = (s) => { s.x = s.t = 0; s.v = 0; };
  function pose() {                                                  // the key frame, played: Product, Ash vase pinned (a tap), the pointer resting on its column
    frozen = false;
    hardReset('product'); ff(1); segMeasure();
    card.classList.add('is-still');
    pinCol(0); ff(1.6);
    const c = cols[0], q = { x: c.cx0 + c.p * 1.5, y: BY - 3.5 * c.p };
    if (!reduced) { hoverAt(q, false); ff(0.5); }
    segX.x = segX.t; segX.v = 0; paintSeg(); draw();
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('is-still')));
  }
  new ResizeObserver(() => { resize(); draw(); }).observe(card.parentElement);
  resize(); card.classList.add('is-still'); hardReset('product'); ff(1); segMeasure(); draw();
  if (document.fonts) document.fonts.ready.then(() => { segMeasure(); draw(); });

  return {
    freeze(on) { frozen = on; if (!on) kick(); },
    card, segEl, labs, ins, chip, btns, pose, client, selectGroup, pinCol, unpin, kick, ff, draw, update, hardReset, thaw, hoverAt, relayout,
    begin() { started = true; kick(); },
    get frozen() { return frozen; }, get grp() { return grp; }, get pin() { return pin; }, get cols() { return cols; },
    colCenter(k) { const c = cols[k]; return { x: c.cx0 + c.p * (c.w > 3 ? 1.5 : 0.5), y: BY - Math.min(c.rows - 1, 3) * c.p - c.p / 2 }; },     // a point between four dots: over the column, more than 10 px from any dot
    dotsOf: (pred) => dots.filter(pred), dots,
    get state() { return { grp, ver, pin: pin && pin.name, busy: busy(), counts: slots.filter((s) => s.col >= 0 && cols[s.col]).map((s) => ({ name: cols[s.col].name, m: cnt[s.col].m, n: cnt[s.col].n, shown: s.ra.n, c: +s.c.x.toFixed(2) })), focus: focusCol(), hdot }; },
    slotBoxes() { return slots.filter((s) => s.vis).map((s) => { const c = s.el.querySelector('.dr-cnt').getBoundingClientRect(), n = s.nm.getBoundingClientRect(), k = card.getBoundingClientRect().width / CWD; return { k: s.col, c: +s.c.x.toFixed(2), cnt: [c.left, c.top, c.right, c.bottom].map((v) => v / k), nm: [n.left, n.top, n.left + n.width, n.bottom].map((v) => v / k), box: s.el.getBoundingClientRect(), s: k, left: parseFloat(s.el.style.transform.slice(10)) }; }); },
    MARGINALS: { PRODUCTS, CHANNELS, DAYS }, ORDERS, BY, R,
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('dr-fit');
  // the card is drawn at 780 x 480 and scaled to the room it is given (1.0x in the 800 x 500 tile, 1.6x at most)
  function size() {
    const W = innerWidth, H = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 10 : Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = tile ? 0 : 46;
    const s = Math.max(0.4, Math.min((W - 2 * pad) / 780, (H - 2 * pad - ui) / 480, 1.6));
    fit.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);

  /* the ghost: it moves a pointer and clicks what a hand clicks (the same events on the same handlers) */
  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const fire = (type, x, y, Ctor = PointerEvent) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 77, isPrimary: true, button: 0, view: window }));
    return t;
  };
  async function glide(my, to, ms = 760) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.88 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y }; fire('pointermove', x, y);
      if (p >= 1) break;
    }
  }
  const mid = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  async function tap(my) {
    const { x, y } = pos, el = fire('pointerdown', x, y), press = el.closest && el.closest('.dr-so, .dr-chip');
    if (press) press.classList.add('is-press');
    await gap(my, 110);
    fire('pointerup', x, y);
    if (press) press.classList.remove('is-press');
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  }
  const names = ['all', 'product', 'channel', 'day'];
  const pick = async (my, g, ms = 760) => { const i = names.indexOf(g); if (DR.ins[i].checked) return false; await glide(my, mid(DR.labs[i]), ms); await gap(my, 200); await tap(my); return true; };
  const toCol = async (my, k, ms = 760) => { const c = DR.colCenter(k), p = DR.client(c.x, c.y); await glide(my, p, ms); };
  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 5000 : 3000) : 700);
      QM.ghostShow();
      for (;;) {
        await pick(my, 'product');
        if (!DR.pin) { await toCol(my, 0); await gap(my, 900); await tap(my); await gap(my, 1300); }   // Ash vase comes to ink and is pinned
        else await gap(my, first ? 500 : 900);
        first = false;
        await pick(my, 'channel'); await gap(my, 2400);                            // the pinned dots land as a solid base in each column
        const d = DR.dots.find((o) => DR.pin && DR.pin.set.has(o.i) && o.col === 1 && o.gy <= DR.BY - 2 * 25 && o.gy >= DR.BY - 4 * 25);
        if (d) { await glide(my, DR.client(d.gx, d.gy), 800); await gap(my, 1700); }   // one order, read
        await pick(my, 'day'); await gap(my, 2300);
        await glide(my, mid(DR.chip), 800); await gap(my, 200); await tap(my); await gap(my, 1300);   // unpin: every dot goes back to its time slot
        await pick(my, 'all'); await gap(my, 1800);
        await pick(my, 'product'); await gap(my, 1300);
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() { epoch++; QM.ghostHide(); pos = null; }
  if (!QM.tile && !reduced) {
    const busyHand = () => DR.card.matches(':hover') || (DR.card.contains(document.activeElement) && document.activeElement !== document.body);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                                  // the ghost's own events do not count
      stopScript();
      if (e && e.target && e.target.nodeType === 1 && !DR.card.contains(e.target)) DR.card.dispatchEvent(new PointerEvent('pointerleave', { pointerType: 'mouse' }));
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  // the ghost waits where the pose leaves the pointer: resting on the Ash vase column
  const park = () => { if (still) return; const c = DR.colCenter(0), p = DR.client(c.x, c.y); QM.ghostAt(p.x, p.y); pos = p; QM.ghostShow(); };
  const still = reduced || /[?&]noghost/.test(location.search);        // ?noghost: a page for checks, the pose is held by hand
  QM.demo({ kind: 'loop', restart() { stopScript(); DR.pose(); DR.begin(); if (!still) { park(); script(true); } } });
  DR.begin();
  DR.pose();
  if (!still) { park(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { park(); script(true); }, 300)); }
})();
</script>
