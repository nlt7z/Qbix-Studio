/* Semantic zoom. One heavy thing: the selected tile's ink ring. One lime point: its status dot. White surfaces with a soft ring.

.sz { width: 640px; max-width: 100%; display: grid; gap: 14px; color: #0B0C0D; font: 400 13px/18px Geist, system-ui, sans-serif; letter-spacing: -.006em; }
.sz :where(button) { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }

/* the canvas: white with a faint dot grid that pans and scales with the camera */
.sz-board { position: absolute; inset: 0; overflow: clip; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  background-image: radial-gradient(circle, rgba(11, 12, 13, .09) 1.2px, transparent 1.6px); background-size: 28px 28px; }

/* the title: centred at 50%, top left at 100%, larger at 200% */
.sz-t { position: absolute; left: 14px; right: 14px; top: 50%; transform: translateY(-50%); display: block;
  font: 300 17px/21px Outfit, Geist, sans-serif; letter-spacing: -.025em; text-wrap: balance;
  transition: top 420ms cubic-bezier(.65, 0, .35, 1), transform 420ms cubic-bezier(.65, 0, .35, 1), left 420ms cubic-bezier(.65, 0, .35, 1), right 420ms cubic-bezier(.65, 0, .35, 1), font-size 420ms cubic-bezier(.65, 0, .35, 1), line-height 420ms cubic-bezier(.65, 0, .35, 1); }

.sz-st { position: absolute; left: 14px; top: 38px; display: flex; align-items: center; gap: 8px; height: 18px; font-weight: 500; color: rgba(11, 12, 13, .66); white-space: nowrap;
  transition: clip-path 220ms cubic-bezier(.5, 0, .75, 0), transform 220ms cubic-bezier(.5, 0, .75, 0), left 420ms cubic-bezier(.65, 0, .35, 1), top 420ms cubic-bezier(.65, 0, .35, 1); }
.sz[data-lv="2"] .sz-st { left: 24px; top: 56px; }

.sz[data-lv="1"] .sz-th1, .sz[data-lv="2"] .sz-th2, .sz[data-lv="2"] .sz-r, .sz[data-lv="2"] .sz-ow { clip-path: inset(-4px); transform: none;

.sz-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 40px; }

.sz-cap i { grid-area: 1 / 1; font-style: normal; white-space: nowrap; transition: transform 360ms cubic-bezier(.16, 1, .3, 1); }
.sz-zoom { display: inline-flex; align-items: center; height: 40px; padding: 0 4px; border-radius: 999px; background: #fff;

.sz-zoom button { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%;

}
function szSelect(i) {
  if (i === szSel && szTiles[i].el.classList.contains('sel')) return;
  szSel = i;
  szTiles.forEach((t) => { const on = t.i === i; t.el.classList.toggle('sel', on); t.el.setAttribute('aria-pressed', String(on)); });
  szCapSet(1); szSay();
}
/* - and + step through 50, 100 and 200% around the selected tile */
function szZoomStep(dir) {
  const z = szTgt.z;
  const next = dir > 0 ? SZ.STEPS.find((s) => s > z + .02) : [...SZ.STEPS].reverse().find((s) => s < z - .02);
  if (next) szFocus(szSel, next, dir > 0 ? 560 : 400);
}
function szZoomAt(nz, px, py) {                      // keep the world point under the pointer where it is
  nz = szClamp(nz, SZ.MIN, SZ.MAX);
  const wx = szTgt.x + (px - szW / 2) / szTgt.z, wy = szTgt.y + (py - szH / 2) / szTgt.z;
  szGo(nz, wx - (px - szW / 2) / nz, wy - (py - szH / 2) / nz, 320);
}

/* input */
let szDrag = null, szSuppress = false;
szTiles.forEach((t) => {
  t.el.addEventListener('click', () => { if (!szSuppress) szSelect(t.i); });
  t.el.addEventListener('dblclick', () => { if (szSuppress) return; szSelect(t.i); const up = szTgt.z < 1.5; szFocus(t.i, up ? 2 : 1, up ? 560 : 400); });
  t.el.addEventListener('focus', () => { if (t.el.matches(':focus-visible')) { szSelect(t.i); szFocus(t.i, szTgt.z, 420); } });
});
szBoard.addEventListener('pointerdown', (e) => { if (e.button === 0) szDrag = { x: e.clientX, y: e.clientY, cx: szTgt.x, cy: szTgt.y, moved: false }; });
addEventListener('pointermove', (e) => {
  if (!szDrag) return;
  const dx = e.clientX - szDrag.x, dy = e.clientY - szDrag.y;
  if (!szDrag.moved && Math.hypot(dx, dy) < 5) return;
  if (!szDrag.moved) { szDrag.moved = true; szBoard.classList.add('drag'); szStop(); }
  const f = szFit(szCam.z, szDrag.cx - dx / szCam.z, szDrag.cy - dy / szCam.z);
  szCam.x = szTgt.x = f.x; szCam.y = szTgt.y = f.y; szDraw();
}, { passive: true });
addEventListener('pointerup', () => {
  if (szDrag && szDrag.moved) { szSuppress = true; setTimeout(() => { szSuppress = false; }, 0); }
  szDrag = null; szBoard.classList.remove('drag');
});
szBoard.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = szBoard.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) szZoomAt(szTgt.z * Math.exp(-e.deltaY * .006), e.clientX - r.left, e.clientY - r.top);
  else szGo(szTgt.z, szTgt.x + e.deltaX / szTgt.z, szTgt.y + e.deltaY / szTgt.z, 180);
}, { passive: false });
szInB.addEventListener('click', () => szZoomStep(1));
szOutB.addEventListener('click', () => szZoomStep(-1));
szEl.addEventListener('keydown', (e) => {
  if (e.key === '+' || e.key === '=') { e.preventDefault(); szZoomStep(1); }
  else if (e.key === '-' || e.key === '_') { e.preventDefault(); szZoomStep(-1); }
  else if (e.key === '0') { e.preventDefault(); szFocus(szSel, 1, 480); }
});
new ResizeObserver(() => { szW = szBoard.clientWidth; szH = szBoard.clientHeight; szGo(szTgt.z, szTgt.x, szTgt.y, 0); }).observe(szBoard);

/* the board at rest: 100% on Forma */
szEl.classList.add('snap');
szW = szBoard.clientWidth || 640; szH = szBoard.clientHeight || 356;
szSelect(0); szFocus(0, 1, 0); szCapSet(1, true); szSay();
szEl.getBoundingClientRect(); szEl.classList.remove('snap');
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0, first = true;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function to(my, x, y, ms) { if (!(await QM.ghostTo(x, y, ms)) || my !== epoch) throw 0; }
  async function toEl(my, el, ms, fx = 0.5, fy = 0.5) { const r = el.getBoundingClientRect(); await to(my, r.left + r.width * fx, r.top + r.height * fy, ms); }
  const press = async (my, el, fn) => { el.classList.add('is-hot'); await gap(my, 140); fn(); await gap(my, 160); el.classList.remove('is-hot'); };
  function rest() {                                   // the key state: 100% on Forma
    szSelect(0); szFocus(0, 1, 0);
  }
  async function script() {
    const my = ++epoch;
    try {
      if (QM.tile && first) { first = false; await gap(my, 5200); }
      QM.ghostShow();
      rest();
      for (;;) {
        await gap(my, 900);
        await toEl(my, szOutB, 820); await press(my, szOutB, () => szZoomStep(-1));   // 50%: titles only
        await gap(my, 1700);
        await toEl(my, szTiles[0].el, 800, 0.5, 0.6); await gap(my, 220);
        szTiles[0].el.dispatchEvent(new MouseEvent('dblclick', { bubbles: true }));    // 200% on Forma
        await gap(my, 300);
        { const r = szBoard.getBoundingClientRect(); await to(my, r.right - 22, r.top + r.height * 0.5, 700); }   // park in the margin, off the tile
        await gap(my, 3000);
        await toEl(my, szOutB, 760); await press(my, szOutB, () => szZoomStep(-1));   // back to 100%
        await to(my, innerWidth * 0.84, innerHeight * 0.86, 800);
        await gap(my, 2000);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); document.querySelectorAll('.sz-zoom .is-hot').forEach((b) => b.classList.remove('is-hot')); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!szEl.matches(':hover') && !szEl.contains(document.activeElement)) script(); else touch({}); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(); if (!reduced) script(); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (!reduced) script(); }, 300));
})();
</script>
</body>
