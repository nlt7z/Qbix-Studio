   to the smallest of 20, 40, 60, 80 that holds the visible days; each y tick has its own cover spring. A brush is a band in days (edges snapped to whole days, shown on springs
   of 0.07 s); releasing it retargets the domain to it. The overview thumb sets the domain directly while it is dragged and, on release, projects the throw (d = 0.99). */
const BZ = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const card = $('bz-card'), plot = $('bz-plot'), cv = $('bz-cv'), strip = $('bz-strip'), sv = $('bz-sv'), ylab = $('bz-ylab'), xlab = $('bz-xlab'), blab = $('bz-bl'),
    tag = $('bz-tag'), msg = $('bz-msg'), rbtn = $('bz-reset');
  const cx = cv.getContext('2d'), sx = sv.getContext('2d');
  /* geometry, card px: the plot box (L to R across, PT to PB down), the label gutter to its left; the strip under it */
  const CWD = 780, L = 60, R = 752, W = R - L, PT = 138, PB = 374, H = PB - PT, SY = 410, SH = 44;
  const CX0 = L - 14, CY0 = PT - 8, CVW = W + 28, CVH = H + 16;               // the plot canvas: room for the end dot and the handles
  const TX0 = L - 26, TY0 = SY - 5, TVW = W + 52, TVH = SH + 10;               // the strip canvas
  const N = 84, LAST = N - 1, MINSPAN = 2, RB = 44, LOOK = 0.99 / (1 - 0.99) / 1000;   // days, the smallest window (3 days), the rubber band's dimension (strip px), where d = 0.99 coasts to (s per unit velocity)
  const TAU = 2 * Math.PI, wr = (s) => TAU / s;
  const W_DOM = wr(0.5), W_BR = wr(0.07), W_P = wr(0.16), W_YU = wr(0.3), W_Y = wr(0.45), W_SLOT = wr(0.3), W_DOT = wr(0.09), W_TAG = wr(0.14), W_TAGA = wr(0.16), W_RST = wr(0.3), W_LAB = wr(0.16), W_DIG = wr(0.28);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const clamp01 = (x) => clamp(x, 0, 1);

  /* a critically damped spring: the closed form, always from the x and v on screen */
  const mk = (x = 0) => ({ x, v: 0, t: x });
  const put = (s, x) => { s.x = s.t = x; s.v = 0; };
  const rest = (s) => s.x === s.t && s.v === 0;
  function spring(s, dt, w, eps = 1e-3) {
    if (reduced) { s.x = s.t; s.v = 0; return; }
    const A = s.x - s.t, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.t + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.t) < eps && Math.abs(s.v) < eps * 10) { s.x = s.t; s.v = 0; }
  }

  /* the data: generated once from a seed, so every load is the same */
  function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const V = [], PS = [0], WF = [0.98, 1.02, 1.04, 0.96, 0.68, 0.6, 1.12];            // day 0 is a Tuesday; Saturday and Sunday are the low days
  { const r = rng(20260323);
    for (let i = 0; i < N; i++) {
      const k = i - 57, spike = k >= 0 ? 40 * Math.exp(-k / 2.1) : k === -1 ? 3 : 0;   // the launch: Wed 25 Feb, week 9, decays over a week

    rbtn.style.visibility = rv ? 'visible' : 'hidden'; rbtn.style.clipPath = rc >= 0.999 ? 'none' : `inset(0 ${((1 - rc) * 100).toFixed(1)}% 0 0)`;
    rbtn.tabIndex = rc > 0.5 ? 0 : -1; rbtn.setAttribute('aria-hidden', rc > 0.5 ? 'false' : 'true');
    // the band's label: dates and length, centred on the band, kept inside the card
    const lc = clamp01(lab.x);
    if (lc > 0.01 && brush.on) {
      const key = rangeText(brush.ta, brush.tb);
      if (key !== labKey) { labKey = key; blab.textContent = key; blab.dataset.w = '0'; }
      if (blab.style.visibility !== 'visible') blab.style.visibility = 'visible';
      const w = +blab.dataset.w || (blab.dataset.w = blab.offsetWidth);
      const mid = (X(brush.a.x) + X(brush.b.x)) / 2;
      const x = clamp(mid - w / 2, 14, CWD - 14 - w);
      blab.style.transform = `translateX(${(Math.round(x * K) / K).toFixed(2)}px)`;
      blab.style.clipPath = lc >= 0.999 ? 'none' : `inset(0 ${((1 - lc) * 50).toFixed(1)}%)`;
    } else if (blab.style.visibility !== 'hidden') blab.style.visibility = 'hidden';
    // the tag: the date and the value of the day the point is on
    const ta = clamp01(tagS.a.x);
    if (ta > 0.01 && tagDay >= 0) {
      const key = tagDay + '';
      if (key !== tag.dataset.k) { tag.dataset.k = key; tag.firstChild.textContent = V[tagDay] + ' orders'; tag.lastChild.textContent = wd(tagDay) + ' ' + dm(tagDay); }
      if (tag.style.visibility !== 'visible') tag.style.visibility = 'visible';
      tag.style.opacity = ta.toFixed(3); tag.style.transform = `translate3d(${(tagS.x.x - 52).toFixed(1)}px, ${tagS.y.x.toFixed(1)}px, 0)`;
    } else if (tag.style.visibility !== 'hidden') { tag.style.visibility = 'hidden'; tag.style.opacity = '0'; }
  }

  /* the loop: pauses off screen and in a hidden tab, and continues from the same state */
  let raf = 0, last = 0, started = false, vis = true;
  const live = () => started && vis && !document.hidden;
  function loop(now) { raf = 0; if (!live()) return; const dt = clamp((now - last) / 1000, 0.001, 0.05); last = now; update(dt); draw(); if (busy()) raf = requestAnimationFrame(loop); }
  function kick() { if (!raf && live()) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  new IntersectionObserver((es) => { vis = es[es.length - 1].isIntersecting; kick(); }).observe(card);
  document.addEventListener('visibilitychange', kick);
  const ff = (sec) => { for (let k = 0; k < Math.round(sec * 60); k++) update(1 / 60); draw(); };
  const refresh = () => { if (reduced) update(1 / 60); draw(); if (!reduced) kick(); };

  /* ----- input: a hand or the ghost, both through the same pointer events ----- */
  const local = (e) => { const r = card.getBoundingClientRect(), k = r.width / CWD || 1; return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k }; };
  const client = (x, y) => { const r = card.getBoundingClientRect(), k = r.width / CWD || 1; return { x: r.left + x * k, y: r.top + y * k }; };
  const now = () => performance.now();
  function abortGhost() {
    if (!drag || !drag.ghost) return false;
    const d = drag; drag = null;
    if (d.kind === 'brush') dropBrush(); else finishPan(d, true);
    ptr = null; kick(); return true;
  }
  /* the plot: press to brush, hover to read */
  plot.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.isTrusted && drag && drag.ghost) abortGhost();
    if (drag) return;
    const p = local(e), day = visDay(p.x), ghost = e.isTrusted === false;
    drag = { kind: 'brush', id: e.pointerId, ghost, type: e.pointerType, x0: p.x, y0: p.y, t0: now() };
    ptr = { x: p.x, y: p.y, inside: true, type: e.pointerType, ghost };
    kb.on = false; kb.anchor = null;
    beginBrush(day, 'drag');
    if (!ghost) { try { plot.setPointerCapture(e.pointerId); } catch (err) { /* the pointer is gone */ } }
    kick();
  });
  plot.addEventListener('pointermove', (e) => {
    const p = local(e);
    if (drag && drag.kind === 'brush' && drag.id === e.pointerId) {
      const day = visDay(p.x); brush.cur = day; ptr = { x: p.x, y: p.y, inside: true, type: e.pointerType, ghost: drag.ghost };
      brushTo(Math.min(brush.anchor, day), Math.max(brush.anchor, day));
    } else if (!drag && e.pointerType !== 'touch') {
      if (e.isTrusted && ptr && ptr.ghost) { /* a hand takes over */ }
      ptr = { x: p.x, y: p.y, inside: true, type: e.pointerType, ghost: e.isTrusted === false }; kb.on = false;
    } else return;
    kick();
  });
  plot.addEventListener('pointerleave', (e) => { if (!drag && e.pointerType !== 'touch') { ptr = null; kick(); } });
  function endBrushGesture(e, cancel) {
    if (!drag || drag.kind !== 'brush' || drag.id !== e.pointerId) return;
    const d = drag; drag = null;
    try { plot.releasePointerCapture(e.pointerId); } catch (err) { /* released */ }
    const ok = !cancel && commitBrush();
    if (cancel) dropBrush();
    if (d.type === 'touch') ptr = null;
    // two quick taps with no band between them: zoom out (the double click, for a mouse and for a finger)
    const t = now(), small = !ok && !cancel;
    if (small && lastTap && t - lastTap.t < 380 && Math.abs(lastTap.x - d.x0) < 30) { lastTap = null; resetZoom(); }
    else if (small) lastTap = { t, x: d.x0 }; else lastTap = null;
    kick();
  }
  plot.addEventListener('pointerup', (e) => endBrushGesture(e, false));
  plot.addEventListener('pointercancel', (e) => endBrushGesture(e, true));
  plot.addEventListener('dblclick', () => { if (!isFull() || brush.on) resetZoom(); });

  /* the keyboard: a cursor a day at a time, Shift extends a band from it, Enter zooms, Escape clears the band and then resets */
  plot.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (drag && drag.ghost) abortGhost();
    if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Home' || k === 'End') {
      e.preventDefault();
      const lo = tvis0(), hi = Math.max(lo, tvis1());
      if (!kb.on) { kb.on = true; kb.day = ptr && ptr.inside ? visDay(ptr.x) : hi; }
      kb.day = clamp(kb.day, lo, hi);
      let nd = kb.day;
      if (k === 'Home') nd = lo; else if (k === 'End') nd = hi; else nd += k === 'ArrowLeft' ? -1 : 1;
      if (nd < lo || nd > hi) {                                    // past the edge of the view: the window slides a day
        const sh = nd < lo ? Math.max(-1, -dom.a.t) : Math.min(1, LAST - dom.b.t);
        if (sh) { dom.a.t += sh; dom.b.t += sh; syncFig(); }
        nd = clamp(nd, tvis0(), tvis1());
      }
      ptr = null;
      if (e.shiftKey) {
        if (kb.anchor === null) kb.anchor = kb.day;
        if (!brush.on || brush.phase !== 'kb') beginBrush(kb.anchor, 'kb');
        brush.cur = nd; brushTo(Math.min(kb.anchor, nd), Math.max(kb.anchor, nd));
        say(rangeText(brush.ta, brush.tb) + '. ' + lastStats.text + '. Enter zooms to it.');
      } else {
        kb.anchor = null;
        if (brush.on && brush.phase === 'kb') dropBrush();
        say(wd(nd) + ' ' + dm(nd) + ': ' + V[nd] + ' orders.');
      }
      kb.day = nd; kick();
    } else if (k === 'Enter') {
      e.preventDefault();
      if (brush.on && brush.phase === 'kb') { kb.anchor = null; commitBrush(); kick(); } else say('Hold Shift and use the arrow keys to select 3 days or more first.');
    } else if (k === 'Escape') {
      e.preventDefault();
      if (brush.on && (brush.phase === 'kb' || brush.phase === 'drag')) { kb.anchor = null; dropBrush(); say('Range cleared.'); kick(); } else resetZoom();
    }
  });
  plot.addEventListener('focus', () => { kick(); });
  plot.addEventListener('blur', () => { kb.on = false; kb.anchor = null; if (brush.on && brush.phase === 'kb') dropBrush(); kick(); });
  rbtn.addEventListener('pointerdown', () => { rbtn.classList.add('is-press'); });
  addEventListener('pointerup', () => rbtn.classList.remove('is-press'));
  rbtn.addEventListener('click', () => { rbtn.classList.remove('is-press'); resetZoom(); });

  /* the overview: press the thumb to pan 1:1, an end to resize, outside it to centre it there. Release projects the throw (d = 0.99) */
  const stDay = (x) => ((x - SL) / SW) * LAST;                      // x in strip px
  const rbd = (over) => { const px = (over * SW) / LAST, r = (px * RB * 0.55) / (RB + 0.55 * px); return (r * LAST) / SW; };   // a rubber band, in days
  function stripX(e) { const p = local(e); return p.x - TX0; }
  function hitStrip(x) {
    const tl = stX(dom.a.x), tr = stX(dom.b.x), g = Math.min(9, (tr - tl) / 3);
    if (Math.abs(x - tl) <= g) return 'l';
    if (Math.abs(x - tr) <= g) return 'r';
    if (x > tl && x < tr) return 'pan';
    return 'out';
  }
  strip.addEventListener('pointerdown', (e) => {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.isTrusted && drag && drag.ghost) abortGhost();
    if (drag) return;
    const x = stripX(e), ghost = e.isTrusted === false, w = dom.b.t - dom.a.t;
    let kind = hitStrip(x), soft = false, grab = 0;
    if (kind === 'out') { kind = 'pan'; grab = w / 2; soft = true; }
    else if (kind === 'pan') grab = stDay(x) - dom.a.x;
    else if (kind === 'l') grab = stDay(x) - dom.a.x; else grab = stDay(x) - dom.b.x;
    ptr = null; kb.on = false; dropBrushIfAny();
    drag = { kind, id: e.pointerId, ghost, type: e.pointerType, grab, w, soft, hist: [], fixA: dom.a.t, fixB: dom.b.t };
    if (!ghost) { try { strip.setPointerCapture(e.pointerId); } catch (err) { /* the pointer is gone */ } }
    strip.style.cursor = 'grabbing';
    stripMove(e);
  });
  function dropBrushIfAny() { if (brush.on && brush.phase !== 'zoom' && brush.phase !== 'cover') dropBrush(); }
  function stripMove(e) {
    const d = drag, x = stripX(e);
    if (kindOf(d) === 'pan') {
      const lo = 0, hi = LAST - d.w, raw = stDay(x) - d.grab;
      const disp = raw < lo ? lo - rbd(lo - raw) : raw > hi ? hi + rbd(raw - hi) : raw;
      if (d.soft) { dom.a.t = clamp(Math.round(raw), lo, hi); dom.b.t = dom.a.t + d.w; }
      else { put(dom.a, disp); put(dom.b, disp + d.w); }
      d.hist.push({ t: now(), p: d.soft ? dom.a.x : disp }); if (d.hist.length > 12) d.hist.shift();
    } else if (d.kind === 'l') {
      const v = clamp(stDay(x) - d.grab, 0, d.fixB - MINSPAN); put(dom.a, v); put(dom.b, d.fixB);
    } else if (d.kind === 'r') {
      const v = clamp(stDay(x) - d.grab, d.fixA + MINSPAN, LAST); put(dom.b, v); put(dom.a, d.fixA);
    }
    syncFig(); kick();
  }
  const kindOf = (d) => d.kind;
  function finishPan(d, cancel) {
    strip.style.cursor = 'pointer';
    if (d.kind === 'pan') {
      const w = d.w, lo = 0, hi = LAST - w, h = d.hist, t = now();
      let v = 0;
      if (!cancel && !d.soft && h.length > 1) { const last = h[h.length - 1]; let f = h[0]; for (const q of h) if (last.t - q.t <= 80) { f = q; break; } if (last.t > f.t && t - last.t < 120) v = ((last.p - f.p) / (last.t - f.t)) * 1000; }
      const p = d.soft ? dom.a.t : dom.a.x, proj = p + v * LOOK;
      if (p < lo || p > hi) v = clamp(v, -20, 20);          // let go past an end: the rubber band returns it, it does not fling
      const tgt = p < lo || p > hi ? (p < lo ? lo : hi) : clamp(Math.round(Math.abs(v) < 2 ? p : proj), lo, hi);
      dom.a.t = tgt; dom.b.t = tgt + w; dom.a.v = dom.b.v = reduced ? 0 : v;
    } else {
      dom.a.t = Math.round(dom.a.x); dom.b.t = Math.round(dom.b.x);
      if (dom.b.t - dom.a.t < MINSPAN) { if (d.kind === 'l') dom.a.t = dom.b.t - MINSPAN; else dom.b.t = dom.a.t + MINSPAN; }
    }
    syncFig(); const z = !isFull(); if (z) say('Showing ' + rangeText(clamp(Math.round(dom.a.t), 0, LAST), clamp(Math.round(dom.b.t), 0, LAST)) + '. ' + lastStats.text + '.'); kick();
  }
  strip.addEventListener('pointermove', (e) => {
    if (drag && drag.id === e.pointerId && drag.kind !== 'brush') { stripMove(e); return; }
    if (!drag) { const k = hitStrip(stripX(e)); strip.style.cursor = k === 'l' || k === 'r' ? 'ew-resize' : k === 'pan' ? 'grab' : 'pointer'; }
  });
  const stripUp = (cancel) => (e) => { if (!drag || drag.kind === 'brush' || drag.id !== e.pointerId) return; const d = drag; drag = null; try { strip.releasePointerCapture(e.pointerId); } catch (err) { /* released */ } finishPan(d, cancel); };
  strip.addEventListener('pointerup', stripUp(false));
  strip.addEventListener('pointercancel', stripUp(true));

  /* the page: the pose, loaded through the same events a hand makes */
  function hardReset() {
    drag = null; ptr = null; kb = { on: false, day: LAST, anchor: null }; lastTap = null; dotMode = 'latest'; tagDay = -1;
    put(dom.a, 0); put(dom.b, LAST); put(rst, 0); put(lab, 0); put(brush.p, 0); put(brush.a, 0); put(brush.b, 0); brush.on = false; brush.phase = '';
    put(tagS.a, 0); put(tagS.x, 0); put(tagS.y, 0); topT = 80; put(topS, 80); put(dot, LAST);
    slots.forEach((o) => put(o.s, o.v <= 80 && o.v % 20 === 0 ? 1 : 0)); figKey = ''; syncFig(true); labKey = '';
  }
  function emit(type, el, x, y, down) {
    const c = client(x, y);

  }
  const PA = 53, PB2 = 66;                                          // the launch weeks: Sat 21 Feb to Fri 6 Mar, 14 days
  function pose() {
    hardReset();
    const yy = PT + H * 0.8;
    emit('pointerdown', plot, X(PA), yy, true);
    for (let k = 1; k <= 8; k++) emit('pointermove', plot, X(PA + (PB2 - PA) * (k / 8)), yy, true);
    ff(1.6);
    card.classList.add('is-still'); requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('is-still')));
  }
  new ResizeObserver(() => { resize(); draw(); }).observe(card.parentElement);
  resize(); hardReset(); refresh();

  return {
    card, plot, strip, rbtn, pose, emit, client, resetZoom, abortGhost, kick, ff, draw, update, hardReset,
    begin() { started = true; kick(); },
    get held() { return !!(drag && drag.ghost); }, get full() { return isFull(); }, get zooming() { return !!(brush.on && brush.phase === 'zoom'); },
    dayX(d) { return X(d); }, plotY(f = 0.5) { return PT + H * f; }, stripGeom() { return { l: stX(dom.a.x) + TX0, r: stX(dom.b.x) + TX0, y: STOP + TY0 + SH / 2 }; }, resetPos() { const r = card.getBoundingClientRect(), b = rbtn.getBoundingClientRect(), k = r.width / CWD; return { x: (b.left + b.width / 2 - r.left) / k, y: (b.top + b.height / 2 - r.top) / k }; },
    get state() { return { a: dom.a.x, b: dom.b.x, ta: dom.a.t, tb: dom.b.t, top: topS.x, topT, brush: brush.on ? { phase: brush.phase, a: brush.ta, b: brush.tb, p: brush.p.x } : null, fig: lastStats, rst: rst.x, dot: dot.x, dotMode, drag: drag && drag.kind, figKey, tag: tagS.a.x, lab: lab.x }; },
    V, stats, X, Y, W, L, R, PT, PB, N, LAST,
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('bz-fit');
  // the card is drawn at 780 x 480 and scaled to the room it is given (1.0x in the 800 x 500 tile, 1.6x at most)
  function size() {
    const W = innerWidth, H = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 10 : Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = tile ? 0 : 46;
    const s = Math.max(0.4, Math.min((W - 2 * pad) / 780, (H - 2 * pad - ui) / 480, 1.6));
    fit.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);

  /* the ghost: it sends the same pointer events a hand does (down, move, up on the plot or the strip), so the tile shows the real brush, zoom and throw */
  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1), inE = (p) => p * p * p, outE = (p) => 1 - Math.pow(1 - p, 3);
  const put = (x, y) => { pos = { x, y }; const c = BZ.client(x, y); QM.ghostAt(c.x, c.y); };
  // glide the hand to (x, y) in card px; el gets pointermove each frame (down: the button is held)
  async function glide(my, x, y, ms, el, down = false, ease = mv) {
    const f = pos || { x, y }, t0 = performance.now();
    for (;;) {
      await raf(); if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = ease(p);
      put(f.x + (x - f.x) * k, f.y + (y - f.y) * k);
      if (el) BZ.emit('pointermove', el, pos.x, pos.y, down);
      if (p >= 1) break;
    }
  }
  const away = () => { BZ.emit('pointerleave', BZ.plot, pos.x, pos.y, false); };
  const plotY = (f) => BZ.plotY(f);
  async function brushLaunch(my) {                                  // press on the plot at Sat 21 Feb, drag to Fri 6 Mar
    await glide(my, BZ.dayX(53) + 60, plotY(0.8), 700, BZ.plot);
    await glide(my, BZ.dayX(53), plotY(0.8), 500, BZ.plot);
    await gap(my, 200);
    BZ.emit('pointerdown', BZ.plot, BZ.dayX(53), plotY(0.8), true);
    await glide(my, BZ.dayX(66), plotY(0.8), 900, BZ.plot, true);
    await gap(my, 1100);
  }
  async function resetBy(my) {                                      // the Reset pill, pressed and released like a button
    const p = BZ.resetPos();
    away(); await glide(my, p.x, p.y, 600, null);
    BZ.rbtn.classList.add('is-press'); await gap(my, 130); BZ.rbtn.classList.remove('is-press'); BZ.rbtn.click();
    await gap(my, 1400);
  }
  async function script(first) {
    const my = ++epoch;
    try {
      if (first) await gap(my, QM.tile ? 5000 : 3000);
      QM.ghostShow();
      for (;;) {
        if (BZ.held) { const c = pos || { x: BZ.dayX(66), y: plotY(0.8) }; BZ.emit('pointerup', BZ.plot, c.x, c.y, false); }   // let go of the posed band: the zoom
        else {
          if (!BZ.full) await resetBy(my);
          await brushLaunch(my);
          BZ.emit('pointerup', BZ.plot, pos.x, pos.y, false);
        }
        await gap(my, 1300);
        // throw the overview thumb to the left, and let it coast
        away();
        let g = BZ.stripGeom();
        await glide(my, (g.l + g.r) / 2, g.y, 650, BZ.strip);
        await gap(my, 160);
        BZ.emit('pointerdown', BZ.strip, pos.x, pos.y, true);
        await gap(my, 120);
        await glide(my, pos.x - 128, pos.y, 470, BZ.strip, true, inE);
        BZ.emit('pointerup', BZ.strip, pos.x, pos.y, false);
        await gap(my, 1100);
        // brush again inside the zoom
        const a0 = Math.ceil(BZ.state.ta) + 3;
        await glide(my, BZ.dayX(a0), plotY(0.55), 650, BZ.plot);
        await gap(my, 150);
        BZ.emit('pointerdown', BZ.plot, BZ.dayX(a0), plotY(0.55), true);
        await glide(my, BZ.dayX(a0 + 6), plotY(0.55), 750, BZ.plot, true);
        await gap(my, 450);
        BZ.emit('pointerup', BZ.plot, pos.x, pos.y, false);
        await gap(my, 1350);
        await resetBy(my);
        away(); await glide(my, BZ.dayX(40), plotY(0.45), 900, BZ.plot);   // a look at the chart before the next round
        await gap(my, 700);
        away();
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; BZ.abortGhost(); QM.ghostHide(); pos = null; }
  const park = () => { if (reduced) return; put(BZ.dayX(66), plotY(0.8)); QM.ghostShow(); };
  if (!QM.tile && !reduced) {
    const idle = () => BZ.plot.matches(':hover') || BZ.strip.matches(':hover') || BZ.held || BZ.plot.contains(document.activeElement);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) { script(false); } else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); BZ.pose(); if (!reduced) { park(); script(true); } } });
  BZ.begin();
  BZ.pose();
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { park(); script(true); }, 300));
})();
</script>
