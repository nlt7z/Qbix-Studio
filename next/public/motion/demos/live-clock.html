<script data-code>
/* Where the studio works and what time it is there: Pacific time, ticking each second.
   Building a DateTimeFormat costs far more than using one, so it is made once. */
const TZ = 'America/Los_Angeles';
const clockFormat = new Intl.DateTimeFormat('en-US', {
  timeZone: TZ, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true, timeZoneName: 'short',
});

function studioClock(root) {
  const timer = root.querySelector('.studio-time');
  const hm = root.querySelector('.studio-hm');
  const s = root.querySelector('.studio-s');
  const ampm = root.querySelector('.studio-ampm');
  const tick = () => {
    const parts = clockFormat.formatToParts(new Date());
    const get = (t) => parts.find((p) => p.type === t)?.value ?? '';
    hm.textContent = `${get('hour')}:${get('minute')}`;
    s.textContent = `:${get('second')}`;
    ampm.textContent = `${get('dayPeriod')} ${get('timeZoneName')}`;
    timer.setAttribute('aria-label', `Studio time ${hm.textContent} ${ampm.textContent}`);
  };
  tick();
  return window.setInterval(tick, 1000);
}

studioClock(document.querySelector('.studio'));
</script>

  QM.demo({ kind: 'loop' });
