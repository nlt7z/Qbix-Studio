<!doctype html>
<html lang="en" data-tone="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abacus sweep · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">

<style data-code>
.ab { position: absolute; inset: 0; }
.ab canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ab-head { position: absolute; left: var(--pad); top: var(--pad); right: var(--pad); display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; }
.ab-total { display: flex; font-family: Outfit, Geist, sans-serif; font-weight: 200; font-size: clamp(52px, 9vw, 120px); line-height: .9; letter-spacing: -.04em; font-variant-numeric: lining-nums; margin-top: 6px; }
.ab-total .c { display: inline-block; overflow: hidden; position: relative; height: 1em; line-height: 1; }
.ab-total .c span { display: block; }
.ab-total .c span.in { animation: ab-up .55s cubic-bezier(.16, 1, .3, 1) both; }
.ab-total .c span.dn { animation: ab-down .55s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes ab-up { from { transform: translateY(100%); } to { transform: none; } }
@keyframes ab-down { from { transform: translateY(-100%); } to { transform: none; } }
.ab-side { text-align: right; font: 400 13px/1.5 'Geist', Geist, sans-serif; letter-spacing: 0; color: rgba(11, 12, 13,.64); }
</style>
</head>
<body>
<main class="qm-stage" style="padding:0">
<!-- code -->
<div class="ab" id="ab">
  <canvas id="c"></canvas>
  <div class="ab-head" id="head">
    <div><p class="kicker">Sprint 14 · tasks done</p><div class="ab-total" id="total"></div></div>
    <p class="ab-side" id="side"></p>
  </div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const abacus = (() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const totalEl = document.getElementById('total'), headEl = document.getElementById('head'), sideEl = document.getElementById('side');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = 9, RODS = 4;
  const REST = [227, 232, 218], LIME = [184, 255, 0];
  const counts = [3, 4, 8, 2];
  const beads = [];
  for (let r = 0; r < RODS; r++) { beads.push([]); for (let i = 0; i < N; i++) beads[r].push({ a: 0, v: 0, target: 0, next: undefined, delay: 0 }); }
  // Rod space: "a" runs along a rod (beads count toward the far end), "c" across the rods.
  // Wide frames use horizontal rods, tall frames vertical ones.
  let W, H, dpr, pad, vert = false, A0, A1, rodC = [], rodGap, bw, bh, postW;
  const toA = (x, y) => (vert ? y : x), toC = (x, y) => (vert ? x : y);
  const gxy = (a, c) => (vert ? [c, a] : [a, c]);
  function layout() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    pad = Math.max(18, Math.min(64, Math.min(W, H) * 0.06));
    document.documentElement.style.setProperty('--pad', pad + 'px');
    vert = H > W * 1.05;
    sideEl.innerHTML = vert ? 'Sweep down to add<br>sweep up to take away' : 'Sweep right to add<br>sweep left to take away';
    const headH = headEl.getBoundingClientRect().height || 110;
    const top = pad + headH + Math.max(14, H * 0.04);
    const xs = [pad, W - pad], ys = vert ? [top + 24, H - pad - 22] : [top, H - pad];
    const along = vert ? ys : xs, across = vert ? xs : ys;
    const acrossLen = across[1] - across[0], alongLen = along[1] - along[0];
    rodGap = Math.min(acrossLen / RODS, vert ? 1e9 : 128);
    postW = Math.max(8, Math.min(16, Math.min(W, H) * 0.02));
    bh = rodGap * (vert ? 0.6 : 0.66);
    bw = Math.min((alongLen - postW * 2) / (N + 3.5), bh / 1.3);
    bh = Math.min(bh, bw * 1.9);
    const rodLen = bw * (N + 3.5);
    A0 = along[0] + (alongLen - rodLen) / 2; A1 = A0 + rodLen;
    const c0 = across[0] + (acrossLen - rodGap * RODS) / 2;
    rodC = []; for (let r = 0; r < RODS; r++) rodC.push(c0 + rodGap * (r + 0.5));
    for (let r = 0; r < RODS; r++) for (let i = 0; i < N; i++) {
      const b = beads[r][i]; b.target = targetA(r, i); b.next = undefined; b.a = b.target; b.v = 0;
    }
  }
  const lowA = (i) => A0 + bw * (i + 0.5);
  const highA = (i) => A1 - bw * (N - i - 0.5);
  const targetA = (r, i) => (i < N - counts[r] ? lowA(i) : highA(i));

  // the total, digit by digit
  let shown = '', prevVal = -1;
  function renderTotal() {
    const val = counts[0] * 1000 + counts[1] * 100 + counts[2] * 10 + counts[3];
    const s = val.toLocaleString('en-US'); if (s === shown) return;
    const dir = val >= prevVal ? 'in' : 'dn';
    if (s.length !== shown.length) {
      totalEl.innerHTML = '';
      for (const ch of s) { const c = document.createElement('span'); c.className = 'c'; c.innerHTML = `<span${shown ? ` class="${dir}"` : ''}>${ch}</span>`; totalEl.appendChild(c); }
    } else [...s].forEach((ch, i) => { if (ch !== shown[i]) totalEl.children[i].innerHTML = `<span class="${dir}">${ch}</span>`; });
    shown = s; prevVal = val;
  }
  function setCount(r, k, from) {
    k = Math.max(0, Math.min(N, k));
    if (k === counts[r]) return;
    counts[r] = k;
    for (let i = 0; i < N; i++) { const b = beads[r][i]; b.next = targetA(r, i); b.delay = reduce ? 0 : Math.abs(i - from) * 0.035; }
    renderTotal();
  }
  // the pointer pushes the beads it crosses on a rod
  function sweep(x0, y0, x1, y1) {
    const a0 = toA(x0, y0), a1 = toA(x1, y1), cm = (toC(x0, y0) + toC(x1, y1)) / 2, da = a1 - a0;
    if (Math.abs(da) < 0.5) return;
    const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
    for (let r = 0; r < RODS; r++) {
      if (Math.abs(cm - rodC[r]) > bh * 0.55) continue;
      const k = counts[r];
      if (da > 0) {
        for (let i = 0; i < N - k; i++) { const p = beads[r][i].a; if (p + bw * 0.45 >= lo && p - bw * 0.3 <= hi) { setCount(r, N - i, i); break; } }
      } else {
        for (let i = N - 1; i >= N - k; i--) { const p = beads[r][i].a; if (p - bw * 0.45 <= hi && p + bw * 0.3 >= lo) { setCount(r, N - 1 - i, i); break; } }
      }
    }
  }
  function tap(x, y) {
    const a = toA(x, y), c = toC(x, y);
    for (let r = 0; r < RODS; r++) {
      if (Math.abs(c - rodC[r]) > bh * 0.55) continue;
      for (let i = 0; i < N; i++) if (Math.abs(a - beads[r][i].a) < bw * 0.5) {
        if (i < N - counts[r]) setCount(r, N - i, i); else setCount(r, N - 1 - i, i);
        return;
      }
    }
  }
  const mix = (t) => `rgb(${REST.map((v, i) => Math.round(v + (LIME[i] - v) * t)).join(',')})`;
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    // drawn in rod space; a swap transform turns it upright for tall frames
    if (vert) ctx.setTransform(0, dpr, dpr, 0, 0, 0);
    const c0 = rodC[0] - rodGap * 0.5, c1 = rodC[RODS - 1] + rodGap * 0.5;
    ctx.fillStyle = '#0B0C0D';
    ctx.fillRect(A0 - postW, c0, postW, c1 - c0);
    ctx.fillRect(A1, c0, postW, c1 - c0);
    const w = bw * 0.47, h = bh / 2, cc = Math.min(w, h) * 0.42;
    for (let r = 0; r < RODS; r++) {
      const c = rodC[r];
      ctx.fillStyle = 'rgba(11, 12, 13,.2)'; ctx.fillRect(A0, c - 1, A1 - A0, 2);
      for (let i = 0; i < N; i++) {
        const b = beads[r][i], p = b.a;
        const t = Math.max(0, Math.min(1, (p - lowA(i)) / (highA(i) - lowA(i))));
        ctx.fillStyle = mix(t * t * (3 - 2 * t));
        // a flat bead, chamfered at the corners
        ctx.beginPath();
        ctx.moveTo(p - w + cc, c - h); ctx.lineTo(p + w - cc, c - h); ctx.lineTo(p + w, c - h + cc);
        ctx.lineTo(p + w, c + h - cc); ctx.lineTo(p + w - cc, c + h); ctx.lineTo(p - w + cc, c + h);
        ctx.lineTo(p - w, c + h - cc); ctx.lineTo(p - w, c - h + cc); ctx.closePath(); ctx.fill();
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const fs = Math.max(10, Math.min(13, rodGap * 0.15));
    ctx.font = `500 ${fs}px 'Geist Mono', Geist, sans-serif`;
    const names = ['×1000', '×100', '×10', '×1'];
    for (let r = 0; r < RODS; r++) {
      const [x, y] = gxy(A0 - postW - 12, rodC[r]);
      ctx.fillStyle = 'rgba(11, 12, 13,.64)';
      if (vert) { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(names[r], rodC[r], A0 - postW - 8); }
      else if (A0 - postW - 12 > fs * 3.4) { ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText(names[r], x, y); }
      ctx.fillStyle = '#0B0C0D';
      if (vert) { ctx.textAlign = 'center'; ctx.textBaseline = 'top'; if (H - (A1 + postW) > fs * 1.6) ctx.fillText(String(counts[r]), rodC[r], A1 + postW + 6); }
      else if (W - A1 - postW - 12 > fs * 1.4) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(String(counts[r]), A1 + postW + 12, rodC[r]); }
    }
  }
  function physics(dt) {
    const k = reduce ? 120 : 340, damp = reduce ? 26 : 19;
    for (let r = 0; r < RODS; r++) {
      const row = beads[r];
      for (const b of row) {
        if (b.next !== undefined) { b.delay -= dt; if (b.delay <= 0) { b.target = b.next; b.next = undefined; } }
        b.v += ((b.target - b.a) * k - b.v * damp) * dt; b.a += b.v * dt;
      }
      for (let it = 0; it < 3; it++) {
        for (let i = 0; i < N - 1; i++) {
          const p = row[i], q = row[i + 1], gap = q.a - p.a;
          if (gap < bw) { const d = (bw - gap) / 2; p.a -= d; q.a += d; p.v = q.v = (p.v + q.v) / 2; }
        }
        if (row[0].a < A0 + bw / 2) { row[0].a = A0 + bw / 2; row[0].v = Math.abs(row[0].v) * 0.2; }
        if (row[N - 1].a > A1 - bw / 2) { row[N - 1].a = A1 - bw / 2; row[N - 1].v = -Math.abs(row[N - 1].v) * 0.2; }
      }
    }
  }
  renderTotal(); layout();
  addEventListener('resize', layout);
  if (document.fonts) document.fonts.ready.then(layout);
  let last = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, (now - last) / 1000) || 0.016; last = now;
    physics(dt / 2); physics(dt / 2);
    draw();
  })(performance.now());

  let px = null, py = null;
  return {
    move(x, y) { if (px !== null) sweep(px, py, x, y); px = x; py = y; },
    leave() { px = null; },
    tap,
    /* a ghost pass: slide along the gap between rods, drop onto one, sweep through its beads */
    plan: {},
    path(t) {
      const L = 3.1, k = Math.floor(t / L), u = (t - k * L) / L;
      const prev = this.seg(k - 1), s = this.seg(k);
      const e = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const q = (a, b, x) => Math.min(1, Math.max(0, (x - a) / (b - a)));
      const gapC = s.c - rodGap * 0.5;
      let a, c;
      if (u < 0.3) { a = prev.ea; c = prev.c + (gapC - prev.c) * e(q(0, 0.3, u)); }
      else if (u < 0.55) { a = prev.ea + (s.sa - prev.ea) * e(q(0.3, 0.55, u)); c = gapC; }
      else if (u < 0.65) { a = s.sa; c = gapC + (s.c - gapC) * e(q(0.55, 0.65, u)); }
      else if (u < 0.82) { a = s.sa + (s.ea - s.sa) * e(q(0.65, 0.82, u)); c = s.c; }
      else { a = s.ea; c = s.c + (rodGap * 0.5) * e(q(0.82, 0.95, u)); }
      return gxy(a, c);
    },
    seg(k) {
      if (!this.plan[k] || this.plan[k].w !== A0 + 'x' + A1) {
        const r = [0, 2, 1, 3, 2, 0, 3, 1][((k % 8) + 8) % 8], n = counts[r];
        const add = n < 5;
        let sa, ea;
        if (add) { const nn = Math.min(N, n + 3); sa = lowA(N - nn) - bw * 0.7; ea = sa + bw * 1.7; }
        else { const nn = Math.max(0, n - 3); sa = highA(N - 1 - nn) + bw * 0.7; ea = sa - bw * 1.7; }
        this.plan[k] = { r, c: rodC[r], sa, ea, w: A0 + 'x' + A1 };
        delete this.plan[k - 8];
      }
      return this.plan[k];
    }
  };
})();
document.addEventListener('pointermove', (e) => abacus.move(e.clientX, e.clientY));
document.addEventListener('pointerdown', (e) => abacus.tap(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => abacus.leave());
</script>
<script>
  QM.demo({ kind: 'pointer',
    move: (x, y) => abacus.move(x, y),
    leave: () => abacus.leave(),
    path: (t) => abacus.path(t + 0.2) });
</script>
</body>
</html>
