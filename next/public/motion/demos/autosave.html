<style data-code>
/* A save state: one sleeve, words that roll through it. data-state on .as picks the visible row. */
.as { display: inline-flex; align-items: center; height: 32px; padding: 0 12px 0 10px; gap: 10px; background: var(--fill, rgba(11, 12, 13,.05)); font: 500 13px/1 var(--font-sans, 'Geist', sans-serif); letter-spacing: -0.005em; color: var(--fg, #0B0C0D); }
.as-sleeve { position: relative; height: 18px; overflow: hidden; width: var(--w, 52px); transition: width 320ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.as-row { position: absolute; left: 0; top: 0; height: 18px; display: flex; align-items: center; gap: 8px; white-space: nowrap; transform: translateY(110%); transition: transform 320ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.as-row.is-in { transform: translateY(0); }
.as-row.is-out { transform: translateY(-110%); }
.as-row.is-park { transition: none; transform: translateY(110%); }
.as-row[data-s='edited'] { color: var(--fg2, rgba(11, 12, 13,.64)); }
/* the mark before the word: three squares, or the lime tick */
.as-mark { position: relative; width: 16px; height: 16px; flex: none; }
.as-dots { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; }
.as-dots i { width: 4px; height: 4px; background: var(--fg, #0B0C0D); opacity: .22; }
.as[data-state='saving'] .as-dots i { animation: as-step 480ms steps(1, end) infinite; }
.as[data-state='saving'] .as-dots i:nth-child(2) { animation-delay: 160ms; }
.as[data-state='saving'] .as-dots i:nth-child(3) { animation-delay: 320ms; }
@keyframes as-step { 0% { opacity: 1; } 33.3% { opacity: .22; } 100% { opacity: .22; } }
.as-tick { position: absolute; left: 0; top: 50%; width: 18px; height: 18px; margin-top: -9px; background: var(--signal, #B8FF00); clip-path: inset(0 100% 0 0); transition: clip-path 180ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.as-tick svg { position: absolute; inset: 0; }
.as-tick path { fill: none; stroke: var(--on-lime, #0c1300); stroke-width: 2; stroke-dasharray: 14; stroke-dashoffset: 14; transition: stroke-dashoffset 280ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.as[data-state='saved'] .as-tick { clip-path: inset(0); }
.as[data-state='saved'] .as-tick path { stroke-dashoffset: 0; transition-delay: 120ms; }
@media (prefers-reduced-motion: reduce) { .as-sleeve, .as-row, .as-tick, .as-tick path { transition: none; } .as[data-state='saving'] .as-dots i { animation: none; opacity: 1; } }
</style>

<script data-code>
(function () {
  const as = document.getElementById('as'), sleeve = document.getElementById('sleeve');
  const rows = {}; sleeve.querySelectorAll('.as-row').forEach((r) => { rows[r.dataset.s] = r; });
  const width = (s) => rows[s].scrollWidth + 1;
  let t1 = 0, t2 = 0, state = '';
  function set(s) {
    if (s === state) return;
    const old = rows[state], row = rows[s];
    // the new word always rises from below the sleeve; the old one always leaves upward
    row.classList.remove('is-out'); row.classList.add('is-park'); void row.offsetWidth; row.classList.remove('is-park'); row.classList.add('is-in');
    if (old) { old.classList.remove('is-in'); old.classList.add('is-out'); }
    state = s; as.dataset.state = s; sleeve.style.setProperty('--w', width(s) + 'px');
  }
  // call on every edit: Saving now, Saved 900 ms after the last keystroke, Edited just now 3.5 s after that
  function edited() {
    clearTimeout(t1); clearTimeout(t2);
    set('saving');
    t1 = setTimeout(() => { set('saved'); t2 = setTimeout(() => set('edited'), 3500); }, 900);
  }
  document.querySelectorAll('.doc .body').forEach((p) => p.addEventListener('input', edited));
  set('edited');
  window.Autosave = { edited, set, reset() { clearTimeout(t1); clearTimeout(t2); state = ''; Object.values(rows).forEach((r) => r.classList.remove('is-in', 'is-out')); set('edited'); } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();
  const live = document.getElementById('live');
  document.fonts && document.fonts.ready.then(() => Autosave.reset());

  // the ghost types into the launch paragraph; real input stops it, and it resumes after 4 s idle
  const ABORT = {};
  let gen = 0, lastReal = -1e9, running = false;
  async function story(g) {
    const z = async (ms) => { await QM.wait(ms); if (g !== gen) throw ABORT; };
    const type = async (s) => { for (const ch of s) { live.textContent += ch; Autosave.edited(); await z(ch === ' ' ? 90 : 62); } };
    live.textContent = ''; Autosave.reset();
    await z(900);
    await type('Launch in two weeks.');
    await z(3700);
    await type(' Three pages: home, shop, studio.');
    await z(5600);
    live.textContent = ''; await z(600);
  }
  if (QM.reduced) { live.textContent = 'Launch in two weeks. Three pages: home, shop, studio.'; Autosave.set('saved'); }
  else {
    if (!QM.tile) ['pointerdown', 'keydown'].forEach((n) => addEventListener(n, (e) => {
      if (!e.isTrusted) return;
      lastReal = performance.now(); if (running) { gen++; running = false; }
    }, { capture: true, passive: true }));
    (async function idle() {
      for (;;) {
        await QM.wait(250);
        if (document.hidden || (!QM.tile && performance.now() - lastReal < 4000 + (document.activeElement === live ? 2000 : 0))) continue;
        running = true; const g = gen;
        try { await story(g); } catch (e) { if (e !== ABORT) throw e; }
        running = false;
      }
    })();
  }
  QM.demo({ kind: 'loop', restart() { lastReal = -1e9; if (running) { gen++; running = false; } } });
</script>
</body>
