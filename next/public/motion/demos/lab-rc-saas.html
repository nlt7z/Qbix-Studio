<style data-code>
/* Week planner: an ask bar over a five-day grid. Times map to percentages of the column height. */
.wk { --ch: clamp(230px, 56vh, 330px); background: #EEF1E8; padding: 14px; display: grid; gap: 12px; width: 100%; --c: 14px;
  clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, 0 100%); }
.wk-ask { display: flex; align-items: center; gap: 10px; min-height: 36px; background: #ffffff; padding: 0 12px; font-size: 15px; color: #0B0C0D; white-space: nowrap; overflow: hidden; }
.wk-ask svg { flex: none; width: 14px; height: 14px; }
.wk-caret { width: 2px; height: 16px; background: #0B0C0D; flex: none; margin-left: -8px; }
.wk-answer { margin-left: auto; flex: none; overflow: hidden; height: 1.6em; font: 500 13px/1.6 'Geist', sans-serif; letter-spacing: -.006em; color: #0B0C0D; }
.wk-answer span { display: block; transform: translateY(110%); transition: transform 600ms cubic-bezier(0.16, 1, 0.3, 1); }
.wk-answer.on span { transform: translateY(0); }
.wk-week { display: grid; grid-template-columns: 28px repeat(5, 1fr); gap: 4px; }
.wk-dh { font: 500 13px/1 'Geist', sans-serif; letter-spacing: -.006em; color: rgba(11, 12, 13, 0.66); padding: 2px 0 4px; }
.wk-hours { position: relative; height: var(--ch); }
.wk-hours span { position: absolute; left: 0; font: 400 12px/1 'Geist Mono', monospace; color: rgba(11, 12, 13, 0.38); transform: translateY(-50%); }
.wk-col { position: relative; height: var(--ch); background: #ffffff; }
.wk-ev { position: absolute; left: 0; right: 0; background: #EEF1E8; padding: 5px 6px; overflow: hidden; display: grid; align-content: start; gap: 2px; }
.wk-ev b { font-weight: 500; font-size: 12px; line-height: 1.2; color: #0B0C0D; }
.wk-ev span { font-size: 12px; line-height: 1.2; color: rgba(11, 12, 13, 0.55); }
.wk-slot { position: absolute; left: 0; right: 0; box-shadow: inset 0 0 0 2px #0B0C0D; clip-path: inset(0 100% 0 0); transition: clip-path 380ms cubic-bezier(0.16, 1, 0.3, 1); }
.wk-slot.on { clip-path: inset(0 0 0 0); }
.wk-pick { position: absolute; left: 0; right: 0; background: #B8FF00; color: #0c1300; padding: 6px; display: grid; align-content: start; gap: 2px; clip-path: inset(0 0 100% 0); transition: clip-path 600ms cubic-bezier(0.16, 1, 0.3, 1); }
.wk-pick.on { clip-path: inset(0 0 0 0); }
.wk-pick b { font-weight: 500; font-size: 12px; line-height: 1.2; } .wk-pick span { font-size: 12px; opacity: 1; color: rgba(12, 19, 0, 0.7); }
.wk.is-reset * { transition: none !important; }
</style>

<script data-code>
(() => {
  const H0 = 8, H1 = 18, pct = (h) => ((h - H0) / (H1 - H0)) * 100;
  const hours = document.getElementById('hours');
  for (let h = 9; h < H1; h += 2) { const s = document.createElement('span'); s.style.top = pct(h) + '%'; s.textContent = (h > 12 ? h - 12 : h) + (h >= 12 ? 'p' : 'a'); hours.append(s); }
  const cols = [...document.querySelectorAll('.wk-col')];
  const EVENTS = [
    [0, 9, 10.5, 'Palette', 'Ana'], [0, 13, 15, 'Build', 'Theo'], [1, 10, 12, 'Kickoff', 'Mara'], [1, 14, 15, 'QA', 'Theo'],
    [2, 9, 10, 'Standup', 'All'], [2, 11, 12.5, 'Layout', 'Ana'], [3, 9.5, 11.5, 'Build', 'Theo'], [3, 16, 17, 'Invoice', 'Sera'],
    [4, 10, 11, 'Demo', 'All'], [4, 13, 16, 'Launch', 'Sera'],
  ];
  const place = (e, a, b) => { e.style.top = `calc(${pct(a)}% + 1px)`; e.style.height = `calc(${pct(b) - pct(a)}% - 2px)`; };
  EVENTS.forEach(([c, a, b, t, who]) => { const e = document.createElement('div'); e.className = 'wk-ev'; place(e, a, b); e.innerHTML = `<b>${t}</b><span>${who}</span>`; cols[c].append(e); });
  const SLOTS = [[1, 15.5, 17], [2, 14, 16], [3, 12.5, 14.5]];
  const slotEls = SLOTS.map(([c, a, b]) => { const s = document.createElement('div'); s.className = 'wk-slot'; place(s, a, b); cols[c].append(s); return s; });
  const picked = document.createElement('div'); picked.className = 'wk-pick'; place(picked, 14, 16); picked.innerHTML = '<b>Review</b><span>Mara, Ana, Theo</span>'; cols[2].append(picked);
  const ask = document.getElementById('ask-text'), answer = document.getElementById('answer'), PROMPT = 'Find an hour for the Forma review';
  let run = 0;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  function clear() { ask.textContent = ''; answer.classList.remove('on'); picked.classList.remove('on'); slotEls.forEach((s) => s.classList.remove('on')); }
  async function play() {
    const my = ++run, ok = () => my === run;
    await wait(700); if (!ok()) return;
    for (let i = 1; i <= PROMPT.length; i++) { ask.textContent = PROMPT.slice(0, i); await wait(38); if (!ok()) return; }
    await wait(500); if (!ok()) return;
    for (const s of slotEls) { s.classList.add('on'); await wait(220); if (!ok()) return; }
    answer.classList.add('on'); await wait(900); if (!ok()) return;
    slotEls.forEach((s, i) => { if (i !== 1) s.classList.remove('on'); });
    picked.classList.add('on');
  }
  function reset() { run++; const w = document.getElementById('wk'); w.classList.add('is-reset'); clear(); void w.offsetWidth; w.classList.remove('is-reset'); }
  window.wkApi = { play, reset, still() { run++; ask.textContent = PROMPT; answer.classList.add('on'); picked.classList.add('on'); } };
})();
</script>
<script>
  if (QM.reduced) { window.wkApi.still(); }
  QM.demo({ kind: 'play', lead: 450, dur: 4600, hold: 3600, reset: window.wkApi.reset, play: window.wkApi.play });
</script>
