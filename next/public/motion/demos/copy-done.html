<style data-code>
/* Copy to done. Tokens: --sunk, --fg, --signal, --on-lime, the qbix easings. */
.cd { width: min(72vw, 640px); background: #EEF1E8; }
.cd-code { margin: 0; padding: 36px 40px 28px; font: 400 clamp(14px, 2.3vw, 19px)/1.75 'Geist Mono', Geist, sans-serif; color: rgba(11, 12, 13, .64); letter-spacing: 0; white-space: pre; overflow: hidden; }
.cd-code b { font-weight: 500; color: #0B0C0D; }
.cd-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 20px 40px; }
.cd-file { font: 12px/16px 'Geist', Geist, sans-serif; letter-spacing: 0; color: rgba(11, 12, 13, .64); }

.cd-btn {
  display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px 0 12px;
  border: 0; background: #E3E8DA; color: #0B0C0D; cursor: pointer; user-select: none; white-space: nowrap;
  font: 500 17px/1 Geist, system-ui, sans-serif; letter-spacing: -.011em;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  transition: transform 150ms cubic-bezier(.22, 1, .36, 1);
}
.cd-btn:active, .cd-btn.is-press { transform: translateY(2px); }
.cd-btn:focus-visible { outline: 2px solid #0B0C0D; outline-offset: -6px; }

/* the icon: two squares that un-draw, a tick that draws, a lime square uncovered from below */
.cd-ic { position: relative; flex: none; width: 30px; height: 30px; display: block; }
.cd-ic::before { content: ''; position: absolute; inset: 0; background: #B8FF00; clip-path: inset(100% 0 0 0); transition: clip-path 200ms cubic-bezier(.5, 0, .75, 0); }
.cd-ic svg { position: relative; display: block; width: 30px; height: 30px; fill: none; stroke-width: 1.8; stroke-linejoin: miter; stroke-linecap: butt; }
.cd-ic .sq { stroke: #0B0C0D; stroke-dasharray: 1; stroke-dashoffset: 0; transition: stroke-dashoffset 360ms cubic-bezier(.16, 1, .3, 1) 160ms; }
.cd-ic .tick { stroke: #0c1300; stroke-width: 2.2; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 200ms cubic-bezier(.5, 0, .75, 0); }

/* the label: two words in one sleeve; the sleeve's width glides to the word showing */
.cd-lab { display: grid; justify-items: start; overflow: hidden; height: 1.3em; line-height: 1.3em; width: var(--w, auto); transition: width 420ms cubic-bezier(.16, 1, .3, 1); }
.cd-lab span { grid-area: 1 / 1; width: max-content; transition: transform 420ms cubic-bezier(.16, 1, .3, 1); }
.cd-lab .b { transform: translateY(110%); }

.cd-btn.is-done .cd-ic::before { clip-path: inset(0); transition: clip-path 320ms cubic-bezier(.16, 1, .3, 1) 120ms; }
.cd-btn.is-done .sq { stroke-dashoffset: 1; transition: stroke-dashoffset 260ms cubic-bezier(.5, 0, .75, 0); }
.cd-btn.is-done .tick { stroke-dashoffset: 0; transition: stroke-dashoffset 360ms cubic-bezier(.16, 1, .3, 1) 140ms; }
.cd-btn.is-done .cd-lab .a { transform: translateY(-110%); }
.cd-btn.is-done .cd-lab .b { transform: none; }

@media (prefers-reduced-motion: reduce) {
  .cd-btn, .cd-ic::before, .cd-ic .sq, .cd-ic .tick, .cd-lab, .cd-lab span { transition: none !important; }
}

<script data-code>
/* Copy to done. One class, is-done, drives every part; the sleeve's width is set from the word that shows. */
const cdBtn = document.getElementById('cd-btn');
const cdLab = document.getElementById('cd-lab');
const cdWord = { a: cdLab.querySelector('.a'), b: cdLab.querySelector('.b') };
let cdTimer = 0;
function cdFit(done) { cdLab.style.setProperty('--w', (done ? cdWord.b : cdWord.a).offsetWidth + 'px'); }
function cdCopy() {
  if (cdBtn.classList.contains('is-done')) return;
  try { navigator.clipboard && navigator.clipboard.writeText(document.getElementById('cd-code').textContent).catch(() => {}); } catch (e) { /* file:// may refuse */ }
  cdBtn.classList.add('is-done');
  cdFit(true);
  cdTimer = setTimeout(cdBack, 1600);
}
function cdBack() {
  clearTimeout(cdTimer);
  cdBtn.classList.remove('is-done');
  cdFit(false);
}
cdBtn.addEventListener('click', cdCopy);
cdFit(false);
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const aim = () => { const r = cdBtn.getBoundingClientRect(); return [r.left + r.width * 0.55, r.top + r.height * 0.6]; };
  function reset() { cdBack(); cdBtn.classList.remove('is-press'); }
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      for (;;) {
        await gap(my, 900);
        const [x, y] = aim();
        await QM.ghostTo(x, y, 900);
        await gap(my, 220);
        cdBtn.classList.add('is-press');
        await gap(my, 150);
        cdBtn.classList.remove('is-press');
        cdCopy();
        await gap(my, 2900);                       // 1.6 s of Copied, the roll back, a beat of rest
        await QM.ghostTo(x + 90, y + 70, 600);
        await gap(my, 1100);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!cdBtn.matches(':hover')) { reset(); script(); } else { touch({}); } }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); reset(); if (!reduced) script(); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { cdFit(false); script(); }, 300));
})();
</script>
