   go down first and then left under the title, and back right first and then up. Contents are seven slots uncovered under clips 40 ms apart, only
   once the row is tall enough to hold them, and covered first on close, before the row shrinks. A close and an open that meet start together, so the
   two heights are springs that sum to a constant. The one lime is handed over: the Live dot goes out before the stage marker comes in, and back. */

  function step(s, dt) {
    if (!s.on) return;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);

  const head = (r, fx = 0.6) => { const b = r.el.getBoundingClientRect(); return { x: b.left + b.width * fx, y: b.top + 22 * s() }; };
  const glyph = (r) => { const g = r.glEl.getBoundingClientRect(); return { x: g.left + g.width / 2, y: g.top + g.height / 2 }; };
  async function press(my, el) { const { x, y } = pos; fire('pointerdown', x, y, el); await gap(my, 110); fire('pointerup', x, y, el); el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window })); }
  const key = (el, k) => el.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true }));
  const openRow = () => (RX.openId() ? RX.byId[RX.openId()] : null);

  /* the pose the piece loads in, made through the real click path and played: Willow Counseling opens and settles */
  function pose() {
    RX.setup();
    const r = RX.byId.willow;
    if (reduced) { RX.request('willow'); RX.advance(1); return; }
    const b = r.el.getBoundingClientRect(), x = b.left + b.width * 0.5, y = b.top + 22 * s();
    fire('pointerdown', x, y, r.btn); RX.advance(0.1);
    fire('pointerup', x, y, r.btn); r.btn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
    RX.advance(2);
  }

  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 4850 : 3400) : 600);
      QM.ghostShow();
      for (;;) {
        // Willow is open: close it by its glyph, open Forma, open Kova (a cross-over), arrows down twice, close with Escape
        let o = openRow();
        if (o) { await glide(my, glyph(o), 600); await gap(my, 160); await press(my, o.btn); await gap(my, 850); }
        for (const id of ['forma', 'kova']) {
          const r = RX.byId[id];
          await glide(my, head(r, 0.58), 520); await gap(my, 150); await press(my, r.btn); await gap(my, id === 'forma' ? 950 : 1050);
        }
        for (let n = 0; n < 2; n++) { await gap(my, 220); key(openRow().btn, 'ArrowDown'); await gap(my, 900); }
        await gap(my, 150); key(openRow().btn, 'Escape'); await gap(my, 900);
        // rest, then back to the pose by a click that nobody sees
        await glide(my, { x: Math.min(innerWidth - 24, RX.card.getBoundingClientRect().right + 28), y: innerHeight * 0.55 }, 700);
        QM.ghostHide(); pos = null;
        await gap(my, 500);
        { const r = RX.byId.willow; r.btn.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, view: window })); }
        await gap(my, 2300);
        QM.ghostShow();
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() { epoch++; QM.ghostHide(); pos = null; }
  if (!QM.tile && !reduced) {
    const busyHand = () => RX.card.matches(':hover') || (RX.card.contains(document.activeElement) && document.activeElement !== document.body);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                    // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); pose(); if (!reduced) script(true); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { size(); pose(); if (!reduced) script(true); }, 60));
})();
</script>
</body>
