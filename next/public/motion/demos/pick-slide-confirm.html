<script data-code>
/* The knob follows the finger a step behind and, past the mark, finishes the track itself. Then it unfurls
   leftward to fill the track, its right edge planted: the width grows by exactly what the offset loses. */
const $ = (id) => document.getElementById(id);
const track = $('sc-track'), knob = $('sc-knob'), fill = $('sc-fill'), lab = $('sc-lab'), lab2 = $('sc-lab2'), chip = $('sc-st');
const PAD = 3, GRIP = 48, MARK = 0.62, HOLD = 2800;
let span = 0, x = 0, held = false, busy = false, committed = false, timer = 0, tgt = 0, gx = 0, gx0 = 0, raf = 0, lastFrame = 0;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const outExpo = (t) => 1 - Math.pow(1 - t, 4);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const measure = () => { span = track.clientWidth - PAD * 2 - GRIP; };
function tween(ms, step, ease) {
  return new Promise((done) => {
    const t0 = performance.now();
    const f = (now) => { const p = Math.min(1, (now - t0) / ms); step(ease(p)); p < 1 ? requestAnimationFrame(f) : done(); };
    requestAnimationFrame(f);
  });
}
function paint(unfurl = 0) {
  const f = clamp(x / span, 0, 1);
  knob.style.left = PAD + x - unfurl * x + 'px';                // the right edge stays planted while it opens out
  knob.style.width = GRIP + unfurl * x + 'px';
  fill.style.width = (x + GRIP / 2 + PAD) * (1 - unfurl) + 'px';
  lab.style.opacity = Math.max(0, 1 - f * 2.2) * (1 - unfurl);
  lab2.style.opacity = unfurl > 0.6 ? (unfurl - 0.6) / 0.4 : 0;
}
function reset() {
  clearTimeout(timer);
  committed = busy = held = false; x = tgt = 0;
  knob.classList.remove('done', 'drag');
  chip.className = 'sc-chip'; chip.textContent = 'Draft';
  measure(); paint(0);
}
async function commit(from) {
  committed = busy = true;
  await tween(reduceMotion ? 1 : 260, (k) => { x = from + (span - from) * k; paint(0); }, outExpo);   // past the mark it takes over
  knob.classList.add('done');
  chip.className = 'sc-chip done'; chip.textContent = 'Booked';
  await tween(reduceMotion ? 1 : 320, (k) => paint(k), inOut);
  busy = false;
  timer = setTimeout(reset, HOLD);
}
function back(from) {
  busy = true;
  let v = 0, p = from, last = performance.now();
  const step = (now) => {                                      // a damped spring home
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    v += (-260 * p - 24 * v) * dt; p += v * dt; x = Math.max(0, p); paint(0);
    if (Math.abs(p) < 0.3 && Math.abs(v) < 4) { x = 0; paint(0); busy = false; } else requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function chase(now) {                                          // x follows the target a step behind
  const dt = Math.min(0.033, (now - (lastFrame || now)) / 1000);
  lastFrame = now;
  x += (tgt - x) * (1 - Math.exp(-16 * dt)); paint(0);
  raf = held ? requestAnimationFrame(chase) : 0;
}
knob.addEventListener('pointerdown', (e) => {
  if (busy || committed) return;
  held = true; gx0 = e.clientX; gx = x; tgt = x;
  knob.classList.add('drag');
  try { knob.setPointerCapture(e.pointerId); } catch (_) { /* a scripted pointer */ }
});
addEventListener('pointermove', (e) => {
  if (!held) return;
  const k = track.getBoundingClientRect().width / track.offsetWidth;    // the page may be scaled
  tgt = clamp(gx + (e.clientX - gx0) / k, 0, span);
  if (!raf) { lastFrame = 0; raf = requestAnimationFrame(chase); }
});
function release() {
  if (!held) return;
  held = false;
  knob.classList.remove('drag');
  if (tgt / span >= MARK) commit(x); else back(x);
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
knob.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && !committed && !busy) { e.preventDefault(); commit(x); } });
addEventListener('resize', () => { measure(); paint(committed ? 1 : 0); });
reset();
</script>
<script>
  /* harness glue: a ghost drags the knob most of the way across, and lets go */
  PickGhost.fit(document.getElementById('pk'), 360, 560);
  const at = (f) => () => { const r = track.getBoundingClientRect(); return { x: r.left + r.width * f, y: r.top + r.height / 2 }; };
  PickGhost.start({
    hot: '.sc-knob',
    reset,
    async script(g) {
      await g.wait(500);
      await g.to('#sc-knob', { ms: 600 });
      await g.down();
      await g.to(at(0.34), { ms: 700 });
      await g.wait(250);
      await g.to(at(0.7), { ms: 650 });
      await g.up();
      await g.wait(3600);
    },
    still() { x = span; knob.classList.add('done'); chip.className = 'sc-chip done'; chip.textContent = 'Booked'; committed = true; paint(1); },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
