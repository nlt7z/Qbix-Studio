<style data-code>
/* A segmented control whose block stretches: edges on different timings (data-dir says which leads). */
.sg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 112px; padding: 4px; background: var(--sunk, #eceef0); }
.sg-seg {
  all: unset; box-sizing: border-box; position: relative; z-index: 1; height: 44px; display: grid; place-items: center; cursor: pointer;
  font: 500 15px/1 var(--font-sans, 'Geist', sans-serif); letter-spacing: -0.011em; color: var(--fg, #121417);
  transition: transform 160ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1));
}
.sg-seg.is-press { transform: translateY(2px); }
.sg-seg:focus-visible { outline: 2px solid var(--fg, #121417); outline-offset: -6px; }
.sg-blk { position: absolute; z-index: 2; top: 4px; bottom: 4px; background: var(--fg, #121417); overflow: hidden; pointer-events: none; }
.sg-in { position: absolute; top: 0; bottom: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 112px; color: var(--ground, #f3f4f5); }
.sg-in .sg-seg { transform: none; color: inherit; }
/* leading edge 300 ms, trailing edge 560 ms; the paper labels hang from the same left edge so they stay put */
.sg[data-dir='r'] .sg-blk, .sg[data-dir='r'] .sg-in { transition: left 560ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)) 40ms, right 300ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.sg[data-dir='l'] .sg-blk, .sg[data-dir='l'] .sg-in { transition: left 300ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)), right 560ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)) 40ms; }
.sg-in { transition: none; }
@media (prefers-reduced-motion: reduce) { .sg .sg-blk, .sg .sg-in, .sg-seg { transition: none !important; } }
</style>
<style>
  .fit { width: 560px; transform: scale(var(--s, 1)); transform-origin: center; display: grid; gap: 14px; }
  .card { background: var(--surface); padding: 24px; display: grid; gap: 20px; --cut: 16px; }
  .bar { display: flex; align-items: center; justify-content: space-between; }

<script data-code>
(function () {
  const sg = document.getElementById('sg');
  const segs = [...sg.querySelectorAll(':scope > .sg-seg')];
  const blk = sg.querySelector('.sg-blk');
  const inner = blk.firstElementChild;
  // the paper labels: a clone of the real ones, as wide as the track, held still against it
  segs.forEach((s) => { const c = s.cloneNode(true); c.removeAttribute('role'); c.removeAttribute('aria-checked'); c.tabIndex = -1; c.setAttribute('aria-hidden', 'true'); inner.appendChild(c); });
  const WIDTHS = ['100%', '62%', '30%'], PX = ['1280 px', '820 px', '390 px'];
  let cur = 0;
  function place(i) {
    const L = segs[i].offsetLeft, R = sg.clientWidth - (L + segs[i].offsetWidth);
    blk.style.left = inner.style.left = '';
    blk.style.left = L + 'px'; blk.style.right = R + 'px';
    inner.style.left = -L + 'px'; inner.style.width = (segs.length * segs[0].offsetWidth) + 'px';
  }
  function select(i, focus) {
    if (i === cur && blk.style.left) return;
    sg.dataset.dir = i > cur ? 'r' : 'l';
    cur = i;
    segs.forEach((s, k) => { s.setAttribute('aria-checked', k === i); s.tabIndex = k === i ? 0 : -1; });
    place(i);
    if (focus) segs[i].focus();
    document.getElementById('pg').style.width = WIDTHS[i];
    document.getElementById('px').textContent = PX[i];
  }
  segs.forEach((s, i) => s.addEventListener('click', () => select(i)));
  sg.addEventListener('keydown', (e) => {
    const k = { ArrowRight: cur + 1, ArrowDown: cur + 1, ArrowLeft: cur - 1, ArrowUp: cur - 1, Home: 0, End: segs.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault();
    select(Math.max(0, Math.min(segs.length - 1, k)), true);
  });
  const snap = (i) => { const t = sg.dataset.dir; sg.removeAttribute('data-dir'); cur = -1; blk.style.left = ''; select(i); void blk.offsetWidth; sg.dataset.dir = t || 'r'; };
  window.Segments = { select, snap, segs, get cur() { return cur; } };
  snap(0);
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();
  document.fonts && document.fonts.ready.then(() => Segments.snap(Segments.cur < 0 ? 0 : Segments.cur));

  // the ghost: press Tablet, Phone, Desktop; any real input stops it, and it resumes after 4 s idle
  const ABORT = {};
  let gen = 0, lastReal = -1e9, running = false;
  async function press(g, z, i) {
    const el = Segments.segs[i], r = el.getBoundingClientRect();
    await QM.ghostTo(r.left + r.width * 0.5, r.top + r.height * 0.62, 760); if (g !== gen) throw ABORT;
    el.classList.add('is-press'); await z(130); el.classList.remove('is-press');
    Segments.select(i);
  }
  async function story(g) {
    const z = async (ms) => { await QM.wait(ms); if (g !== gen) throw ABORT; };
    QM.ghostShow();
    await z(900);
    await press(g, z, 1); await z(1500);
    await press(g, z, 2); await z(1500);
    await press(g, z, 0); await z(1700);
  }
  if (QM.reduced) { Segments.snap(1); document.getElementById('pg').style.transition = 'none'; document.getElementById('pg').style.width = '62%'; }
  else {
    if (!QM.tile) ['pointerdown', 'keydown', 'pointermove'].forEach((n) => addEventListener(n, (e) => {
      if (!e.isTrusted || (n === 'pointermove' && e.pointerType !== 'mouse')) return;
      lastReal = performance.now(); if (running) { gen++; QM.ghostHide(); }
    }, { capture: true, passive: true }));
    (async function idle() {
      for (;;) {
        await QM.wait(250);
        if (document.hidden || (!QM.tile && performance.now() - lastReal < 4000)) continue;
        running = true; const g = gen;
        try { await story(g); } catch (e) { if (e !== ABORT) throw e; }
        QM.ghostHide(); running = false;
      }
    })();
  }
  QM.demo({ kind: 'loop', restart() { lastReal = -1e9; if (running) { gen++; QM.ghostHide(); } } });
</script>
