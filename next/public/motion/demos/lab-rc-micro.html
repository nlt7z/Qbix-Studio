<script type="application/json" id="qm-meta">
{
  "id": "lab-rc-micro", "title": "Six small moments", "group": "lab", "cat": "buttons", "order": 780,
  "kind": "loop", "tone": "paper",
  "line": "reels · magnet · send · toasts · dots · skeleton",
  "summary": "Six small app-grade interactions on six flat panels, each playing by itself and each answering the real pointer. Digits roll on reels, a button leans toward the pointer, one control goes from Send to a spinner to a drawn tick, toasts spring in and stack, a field of dots swells under the pointer, and shapes wipe into real content.",
  "spec": [["Reels", "each digit on its own reel, 700 ms + 60 ms a digit, expo out, only changed digits roll; a second tap rolls on from where the reel is"], ["Magnet", "button follows at 0.35, label at 0.45 of that; critically damped spring 200 / 28 (no overshoot); reach 140px"], ["Send", "the label leaves up (220 ms ease in) while the width glides 380 ms on the move curve to a 48px square, the spinner rises in 120 ms later (1.1 s), the tick is drawn 420 ms; the way back mirrors it, so the button never snaps"], ["Toasts", "slide in 480 ms expo out, older ones step back 9px and 6% in scale on the move curve, leave downward after 2.6 s, ease in"], ["Dots", "14px grid, radius 1 → 4.2px by Gaussian distance (σ 70px); the swell follows the pointer, or the scripted point, with a smoothed chase so it never jumps"], ["Skeleton", "flat blocks with a sweeping band; the content is uncovered over them left to right (500 ms expo out, 70 ms apart) and, 3.4 s later, wiped back out left to right (260 ms ease in) so the loop has no cut"]],
  "source": ["Qbix studio library · 08-micro-kit"],
  "where": "Product moments across the studio's builds: an order count, a booking button, a send state, a saved palette, an activity feed that loads.",
  "rules": ["Panels are flat surfaces 8px apart with the top right corner cut; nothing is boxed inside a panel.", "No gradients and no opacity fades: the spotlight is dots, the skeleton is a sweeping flat band, toasts leave by sliding out of the panel.", "Nothing bounces: springs are critically damped and every exit is quicker than its entrance.", "Every control is a real button with hover, a 2px press, a focus ring inside its cut corner, and a status line a screen reader can follow.", "Lime is the one button, Book a call.", "A reduced-motion viewer gets every state at rest."],
  "tags": ["micro", "buttons", "toast", "recipe"]
}
</script>
<style data-code>
.mm { position: absolute; inset: 8px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; }
@media (max-width: 560px) { .mm { grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); } }
.mm-panel { position: relative; overflow: hidden; background: #EEF1E8; color: #0B0C0D; display: grid; grid-template-rows: auto 1fr; padding: 16px 18px;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.mm-panel h2 { margin: 0; font: 500 13px/16px 'Geist', sans-serif; letter-spacing: -.006em; color: rgba(11, 12, 13,.66); }
.mm-panel h2 b { font-weight: 500; color: rgba(11, 12, 13,.38); }
.mm-s { display: grid; place-items: center; position: relative; min-height: 0; }
.mm-btn { height: 48px; padding: 0 24px; border: 0; cursor: pointer; font: 500 15px/1 Geist, sans-serif; white-space: nowrap; touch-action: manipulation;
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  transition: translate 300ms var(--ease-portfolio), background 120ms var(--ease), color 120ms var(--ease); }
/* a press is 2px down in 100 ms (the individual translate property, so the magnet's own transform is untouched) */
.mm-btn:active { translate: 0 2px; transition-duration: 100ms; }
/* the cut corner would clip an outside ring: it sits inside, 7px in, clear of the diagonal */
.mm-btn:focus-visible { outline: 2px solid currentColor; outline-offset: -7px; }
.mm-lime { background: #B8FF00; color: #0c1300; }
.mm-lime:hover { background: #C9F24A; }
.mm-solid { background: #0B0C0D; color: #ffffff; }
.mm-solid:hover { background: #26282C; }
.mm-quiet { background: none; color: #0B0C0D; padding: 0 4px; height: 32px; clip-path: none; box-shadow: inset 0 -1px 0 transparent; transition: translate 300ms var(--ease-portfolio), box-shadow 160ms var(--ease); }
.mm-quiet:hover { box-shadow: inset 0 -1px 0 #0B0C0D; }
.mm-quiet:focus-visible { outline: 2px solid #0B0C0D; outline-offset: 3px; }
.mm-btn[aria-disabled='true'] { cursor: default; }

/* 1. rolling number */
.mm-ticker { font: 400 clamp(36px, 5.4vw, 64px)/1 'Outfit', 'Geist', sans-serif; letter-spacing: -.03em; display: flex; font-variant-numeric: tabular-nums; }
.mm-ticker .col { height: 1em; overflow: hidden; display: inline-block; }
.mm-ticker .reel { display: flex; flex-direction: column; }
.mm-ticker .reel span { height: 1em; display: block; text-align: center; }
.mm-ticker .sep { width: .28em; text-align: center; }
.mm-tw { display: grid; gap: 6px; justify-items: center; }
/* 3. send, wait, done */
.mm-send { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; min-width: 48px; padding: 0; overflow: hidden; }
.mm-send > * { grid-area: 1 / 1; }
.mm-send .lbl { padding: 0 24px; }
.mm-send svg { width: 22px; height: 22px; translate: 0 48px; }
.mm-send svg.spin { animation: mm-spin .8s linear infinite; }
@keyframes mm-spin { to { rotate: 360deg; } }
.mm-send svg.tick path { stroke-dasharray: 24; stroke-dashoffset: 24; }
.mm-send.done svg.tick path { animation: mm-draw .42s .05s var(--ease-out-expo) forwards; }
@keyframes mm-draw { to { stroke-dashoffset: 0; } }
.mm-sendbox { display: grid; justify-items: center; }
.mm-status { color: rgba(11, 12, 13,.66); font-size: 13px; line-height: 18px; height: 18px; margin-top: 10px; text-align: center; white-space: nowrap; }
/* 4. toasts */
.mm-toasts { position: absolute; left: 0; right: 0; bottom: 12px; display: grid; justify-items: center; pointer-events: none; }
.mm-toast { grid-area: 1 / 1; background: #0B0C0D; color: #ffffff; padding: 10px 16px; font-size: 15px; will-change: transform; white-space: nowrap;
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%); }
/* 5. dots */
.mm-dots { position: absolute; inset: 0; width: 100%; height: 100%; }
.mm-copy { position: relative; font: 400 clamp(20px, 2.4vw, 28px)/1.1 'Outfit', 'Geist', sans-serif; letter-spacing: -.03em; text-align: center; max-width: 11ch; pointer-events: none; background: #EEF1E8; padding: 8px 12px; }
/* 6. skeleton, then content: the content is uncovered over the skeleton and wiped back out, so there is no cut */
.mm-feed { width: 100%; max-width: 260px; display: grid; gap: 10px; }
.mm-cell { display: grid; }
.mm-cell > * { grid-area: 1 / 1; }
.mm-item { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; }
.mm-item .av { width: 36px; height: 36px; background: #E3E8DA; display: grid; place-items: center; font: 500 13px 'Geist Mono'; letter-spacing: 0; }
.mm-item b { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; }
.mm-item span { color: rgba(11, 12, 13,.64); font-size: 13px; }
.mm-ct { background: #EEF1E8; clip-path: inset(0 100% 0 0); }
.sk { position: relative; overflow: hidden; background: #E3E8DA; }
.sk::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: #EEF1E8; animation: mm-sweep 1.3s linear infinite; }
@keyframes mm-sweep { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.mm-lines { display: grid; gap: 7px; }
.mm-lines .sk { height: 9px; }
.mm-lines .sk:last-child { width: 60%; }
@media (prefers-reduced-motion: reduce) { .sk::after, .mm-send svg.spin { animation: none; } .mm-btn { transition: none; } }
</style>
<style>.qm-stage { display: block; padding: 0; }</style>

<body>
<main class="qm-stage">
<!-- code -->
<div class="mm">
  <div class="mm-panel"><h2>01 <b>Rolling number</b></h2>
    <div class="mm-s"><div class="mm-tw"><div class="mm-ticker" id="mm-ticker" role="img"></div><p class="sr-only" id="mm-count" role="status" aria-live="polite"></p><button class="mm-btn mm-quiet" id="mm-bump" type="button">Add an order</button></div></div></div>
  <div class="mm-panel" id="mm-magpanel"><h2>02 <b>Magnetic button</b></h2>
    <div class="mm-s"><button class="mm-btn mm-lime" id="mm-mag" type="button"><span style="display:inline-block">Book a call</span></button></div></div>
  <div class="mm-panel"><h2>03 <b>Send, wait, done</b></h2>
    <div class="mm-s"><div class="mm-sendbox">
      <button class="mm-btn mm-solid mm-send" id="mm-send" type="button"><span class="lbl">Send brief</span>
        <svg class="spin" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.6" stroke-dasharray="40 100"/></svg>
        <svg class="tick" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.6"/></svg></button>
      <div class="mm-status" id="mm-status" role="status" aria-live="polite"></div></div></div></div>
  <div class="mm-panel"><h2>04 <b>Toast stack</b></h2>
    <div class="mm-s" style="align-items:start;padding-top:14px"><button class="mm-btn mm-solid" id="mm-save" type="button">Save palette</button></div>
    <div class="mm-toasts" id="mm-toasts" aria-live="polite"></div></div>
  <div class="mm-panel" id="mm-spotpanel"><h2>05 <b>Dots under the pointer</b></h2>
    <div class="mm-s"><canvas class="mm-dots" id="mm-dots" aria-hidden="true"></canvas><p class="mm-copy">Move across this panel</p></div></div>
  <div class="mm-panel"><h2>06 <b>Skeleton to content</b></h2>
    <div class="mm-s"><div class="mm-feed" id="mm-feed"></div></div></div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const Micro = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const EXPO = 'cubic-bezier(.16,1,.3,1)';
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const real = { t: -1e9 };
  addEventListener('pointermove', (e) => { if (e.isTrusted) real.t = performance.now(); }, { passive: true });
  const isIdle = () => performance.now() - real.t > 3000;
  const timers = [];
  const every = (ms, f, first = 0) => { const a = setTimeout(f, first); const b = setInterval(f, ms); timers.push(a, b); };

  /* 1. rolling number: every digit on its own reel; only the changed ones roll */
  const ticker = document.getElementById('mm-ticker');
  let value = 12480;
  function renderTicker(v, animate) {
    const s = v.toLocaleString('en-US');
    if (ticker.dataset.len !== String(s.length)) {
      ticker.innerHTML = '';
      for (const ch of s) {
        if (ch === ',') { const sep = document.createElement('span'); sep.className = 'sep'; sep.textContent = ','; ticker.append(sep); continue; }
        const col = document.createElement('span'); col.className = 'col';
        const reel = document.createElement('span'); reel.className = 'reel';
        for (let d = 0; d <= 9; d++) { const x = document.createElement('span'); x.textContent = d; reel.append(x); }
        col.append(reel); ticker.append(col);
      }
      ticker.dataset.len = s.length;
    }
    const reels = ticker.querySelectorAll('.reel');
    let k = 0;
    for (const ch of s) {
      if (ch === ',') continue;
      const reel = reels[k++], to = `translateY(${-+ch}em)`;
      // a second tap mid-roll rolls on from where the reel is now, not from where the last one was headed
      if (animate && !reduced && reel.style.transform !== to) { const from = getComputedStyle(reel).transform; reel.getAnimations().forEach((a) => a.cancel()); reel.animate([{ transform: from === 'none' ? 'translateY(0)' : from }, { transform: to }], { duration: 700 + k * 60, easing: EXPO }); }
      reel.style.transform = to;
    }
    ticker.setAttribute('aria-label', s + ' orders');
    if (animate) document.getElementById('mm-count').textContent = s + ' orders';
  }
  renderTicker(value, false);
  const bump = () => { value += 137; renderTicker(value, true); };
  document.getElementById('mm-bump').addEventListener('click', bump);

  /* 2. magnetic button: the button and its label follow by different amounts */
  const mp = document.getElementById('mm-magpanel'), mag = document.getElementById('mm-mag'), lab = mag.firstElementChild;
  const mx = { x: 0, v: 0 }, my = { x: 0, v: 0 };
  const mpt = { x: 0, y: 0, inside: false };
  mp.addEventListener('pointermove', (e) => { const r = mp.getBoundingClientRect(); mpt.x = e.clientX - r.left; mpt.y = e.clientY - r.top; mpt.inside = true; });
  mp.addEventListener('pointerleave', () => { mpt.inside = false; });
  const spring = (s, target, dt) => { s.v += (200 * (target - s.x) - 28 * s.v) * dt; s.x += s.v * dt; };   // critically damped: c = 2 √k

  /* 3. send, wait, done: the control keeps its place across the three states. Words leave up and arrive from below
     (the individual translate property, so the spinner's own rotation is untouched); the width glides both ways. */
  const send = document.getElementById('mm-send'), status = document.getElementById('mm-status');
  const lbl = send.querySelector('.lbl'), spin = send.querySelector('svg.spin'), tick = send.querySelector('svg.tick');
  const IN = 'cubic-bezier(.5,0,.75,0)', MOVE = 'cubic-bezier(.65,0,.35,1)';
  const stop = (el) => el.getAnimations().filter((a) => !(a instanceof CSSAnimation)).forEach((a) => a.cancel());   // the spinner's own CSS turn stays
  const leave = (el) => { stop(el); if (!reduced) el.animate([{ translate: '0 0' }, { translate: '0 -48px' }], { duration: 220, easing: IN, fill: 'both' }); else el.style.translate = '0 -48px'; };
  const enter = (el, delay = 0) => { stop(el); if (!reduced) el.animate([{ translate: '0 48px' }, { translate: '0 0' }], { duration: 420, easing: EXPO, delay, fill: 'both' }); else el.style.translate = '0 0'; };
  let busy = false;
  async function doSend() {
    if (busy) return; busy = true; send.setAttribute('aria-disabled', 'true');
    const w0 = send.offsetWidth;
    send.classList.add('loading'); send.style.width = w0 + 'px'; status.textContent = 'Sending';
    leave(lbl); enter(spin, 120);
    if (!reduced) await send.animate([{ width: w0 + 'px' }, { width: '48px' }], { duration: 380, easing: MOVE, fill: 'forwards' }).finished;
    send.style.width = '48px';
    await wait(1100);
    leave(spin); send.classList.add('done'); enter(tick, 120); send.classList.remove('loading'); status.textContent = 'Sent. We reply within a day.';
    await wait(2200);
    leave(tick); enter(lbl, 140); status.textContent = '';
    if (!reduced) await send.animate([{ width: '48px' }, { width: w0 + 'px' }], { duration: 380, easing: MOVE, fill: 'forwards' }).finished;
    send.classList.remove('done'); send.getAnimations().forEach((a) => a.cancel()); send.style.width = '';
    [spin, tick].forEach((el) => el.getAnimations().filter((a) => !(a instanceof CSSAnimation)).forEach((a) => a.cancel()));
    busy = false; send.removeAttribute('aria-disabled');
  }
  send.addEventListener('click', doSend);
  [spin, tick].forEach((el) => { el.style.translate = '0 48px'; });

  /* 4. toast stack: spring in, older ones step back, leave by sliding out of the panel */
  const toasts = document.getElementById('mm-toasts'), live = [];
  let n = 0;
  const layoutToasts = () => live.forEach((t, i) => {
    const depth = live.length - 1 - i;
    t.el.style.zIndex = 10 - depth;
    t.el.animate([{}, { transform: `translateY(${-Math.min(depth, 2) * 9}px) scale(${1 - Math.min(depth, 3) * 0.06})` }], { duration: reduced ? 1 : 380, easing: MOVE, fill: 'forwards' });
  });
  function save() {
    const el = document.createElement('div'); el.className = 'mm-toast'; el.textContent = `Palette ${++n} saved`;
    toasts.append(el);
    const t = { el }; live.push(t);
    if (!reduced) el.animate([{ transform: 'translateY(70px) scale(.94)' }, { transform: 'none' }], { duration: 480, easing: EXPO });
    layoutToasts();
    setTimeout(() => {
      const i = live.indexOf(t); if (i < 0) return; live.splice(i, 1);
      el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(70px)' }], { duration: 300, easing: IN, fill: 'forwards' }).finished.then(() => el.remove());
      layoutToasts();
    }, 2600);
  }
  document.getElementById('mm-save').addEventListener('click', save);

  /* 5. dots under the pointer: the spotlight as a field of dots that swell */
  const sp = document.getElementById('mm-spotpanel'), dc = document.getElementById('mm-dots'), dg = dc.getContext('2d');
  const spt = { x: -999, y: -999, inside: false }, dp = { x: null, y: null };
  sp.addEventListener('pointermove', (e) => { const r = sp.getBoundingClientRect(); spt.x = e.clientX - r.left; spt.y = e.clientY - r.top; spt.inside = true; });
  sp.addEventListener('pointerleave', () => { spt.inside = false; spt.x = spt.y = -999; });
  const paintDots = (px, py) => {
    const r = sp.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    if (dc.width !== Math.round(r.width * dpr) || dc.height !== Math.round(r.height * dpr)) { dc.width = Math.round(r.width * dpr); dc.height = Math.round(r.height * dpr); }
    dg.setTransform(dpr, 0, 0, dpr, 0, 0); dg.clearRect(0, 0, r.width, r.height);
    dg.fillStyle = '#0B0C0D';
    const G = 14, s2 = 2 * 70 * 70;
    dg.beginPath();
    for (let y = G / 2; y < r.height; y += G) for (let x = G / 2; x < r.width; x += G) {
      const d2 = (x - px) * (x - px) + (y - py) * (y - py), rad = 1 + 3.2 * Math.exp(-d2 / s2);
      dg.moveTo(x + rad, y); dg.arc(x, y, rad, 0, Math.PI * 2);
    }
    dg.fill();
  };

  /* 6. skeleton to content: flat shapes with a sweeping band; the real thing is uncovered over them, left to right,
     and wiped back out the same way, so the loop has no cut. Each row holds both layers in one cell. */
  const feed = document.getElementById('mm-feed');
  const PEOPLE = [['MR', 'Mara', 'approved the homepage'], ['TH', 'Theo', 'deployed forma.studio'], ['AN', 'Ana', 'shared the palette']];
  feed.innerHTML = PEOPLE.map(([a, w, t]) => `<div class="mm-cell"><div class="mm-item" aria-hidden="true"><div class="av sk"></div><div class="mm-lines"><div class="sk"></div><div class="sk"></div></div></div><div class="mm-item mm-ct"><div class="av">${a}</div><div><b>${w}</b><span>${t}</span></div></div></div>`).join('');
  const cts = [...feed.querySelectorAll('.mm-ct')];
  const wipe = (el, from, to, delay, ms, easing) => { el.getAnimations().forEach((x) => x.cancel()); el.style.clipPath = to; if (!reduced) el.animate([{ clipPath: from }, { clipPath: to }], { duration: ms, delay, easing, fill: 'backwards' }); };
  const OPEN = 'inset(0 0 0 0)', SHUT = 'inset(0 100% 0 0)', GONE = 'inset(0 0 0 100%)';
  const reveal = () => cts.forEach((c, i) => wipe(c, SHUT, OPEN, i * 70, 500, EXPO));
  const clear = () => cts.forEach((c, i) => wipe(c, OPEN, GONE, i * 70, 260, IN));
  const rearm = () => cts.forEach((c) => { c.getAnimations().forEach((x) => x.cancel()); c.style.clipPath = SHUT; });
  function cycle() { rearm(); timers.push(setTimeout(reveal, 1600), setTimeout(clear, 5400)); }

  let raf = 0, last = performance.now(), onscreen = true;
  new IntersectionObserver((e) => { onscreen = e[e.length - 1].isIntersecting; }).observe(sp);
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!onscreen || document.hidden) return;
    const idle = isIdle();
    // magnet: with no real pointer a ghost pointer circles the button
    const br = mag.getBoundingClientRect(), pr = mp.getBoundingClientRect();
    const cx = pr.width / 2, cy = pr.height / 2 + 12;
    let px = mpt.x, py = mpt.y, ins = mpt.inside;
    if (idle) { const a = now / 1100; px = cx + Math.cos(a) * 90; py = cy + Math.sin(a * 1.3) * 34; ins = true; }
    const bx = br.left - pr.left + br.width / 2 - mx.x, by = br.top - pr.top + br.height / 2 - my.x;
    const dx = px - bx, dy = py - by, d = Math.hypot(dx, dy), k = ins && d < 140 ? 1 - d / 140 : 0;
    if (!reduced) {
      spring(mx, dx * 0.35 * k, dt); spring(my, dy * 0.35 * k, dt);
      // at rest the button sits exactly on its pixel: the spring's tail is snapped to zero
      const rest = (s) => Math.abs(s.x) < 0.02 && Math.abs(s.v) < 0.02;
      if (k === 0 && rest(mx) && rest(my)) { mx.x = mx.v = my.x = my.v = 0; mag.style.transform = ''; lab.style.transform = ''; }
      else {
        mag.style.transform = `translate(${mx.x.toFixed(2)}px, ${my.x.toFixed(2)}px)`;
        lab.style.transform = `translate(${(mx.x * 0.45).toFixed(2)}px, ${(my.x * 0.45).toFixed(2)}px)`;
      }
    }
    // dots
    // the swell chases its point (the pointer, or the scripted one), so handing over never jumps
    const sr = sp.getBoundingClientRect();
    const real = !idle && spt.inside, gx = real ? spt.x : sr.width * (0.5 + 0.36 * Math.sin(now / 1700)), gy = real ? spt.y : sr.height * (0.55 + 0.25 * Math.sin(now / 1100 + 1));
    if (dp.x === null) { dp.x = gx; dp.y = gy; }
    const kk = 1 - Math.exp(-dt * (real ? 14 : 5));
    dp.x += (gx - dp.x) * kk; dp.y += (gy - dp.y) * kk;
    paintDots(dp.x, dp.y);
  }
  function start() {
    timers.splice(0).forEach((t) => { clearTimeout(t); clearInterval(t); });
    cycle();
    if (reduced) { cts.forEach((c) => { c.style.clipPath = OPEN; }); return; }
    every(3200, () => { if (isIdle()) bump(); }, 1400);
    every(7600, () => { if (isIdle()) doSend(); }, 2600);
    every(2300, () => { if (isIdle()) save(); }, 900);
    every(7000, cycle, 7000);
    if (!raf) raf = requestAnimationFrame(frame);
  }
  if (reduced) { cts.forEach((c) => { c.style.clipPath = OPEN; c.previousElementSibling.style.display = "none"; }); paintDots(60, 60); }
  return { start };
})();
</script>
<script>
  QM.demo({ kind: 'loop', restart: () => Micro.start() });
  Micro.start();
</script>
</body>
