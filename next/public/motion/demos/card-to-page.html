<script data-code>
/* Card to page. One progress q (0 = grid, 1 = page) draws every part; opening runs it up, going back runs it down the same curve. */
const CP = { OPEN: 520, BACK: 440 };
const CP_RADIUS = [16, 16];      // picture corner on the card and on the page, px on screen
const CP_ITEMS = [
  { name: 'Arc cup', price: '$38', d: 'A hand-thrown cup with a curved lip. Satin lime glaze, 9 cm tall.' },
  { name: 'Wave plate', price: '$46', d: 'A flat plate with a rolling edge. Dishwasher safe, 24 cm wide.' },
  { name: 'Bloom vase', price: '$82', d: 'Folded petals in one piece. Holds three stems, 21 cm tall.' },
  { name: 'Fold dish', price: '$54', d: 'A shallow dish for keys and rings. Soft matte glaze, 14 cm wide.' },
];
const cpBox = document.getElementById('cp'), cpGrid = document.getElementById('cp-g'), cpPage = document.getElementById('cp-pg');
const cpCards = [...cpGrid.querySelectorAll('.cp-c')].map((el) => ({ el, pic: el.querySelector('.cp-pic'), name: el.querySelector('.cp-name'), price: el.querySelector('.cp-price') }));
const cpH1 = document.getElementById('cp-h1'), cpH2 = document.getElementById('cp-h2'), cpBack = document.getElementById('cp-back'), cpNo = document.getElementById('cp-no');
const cpHero = document.getElementById('cp-hero'), cpHeroImgs = [...cpHero.children], cpT = document.getElementById('cp-t'), cpPr = document.getElementById('cp-pr');
const cpLines = [document.getElementById('cp-st'), document.getElementById('cp-d'), document.getElementById('cp-addw')];
const cpAdd = document.getElementById('cp-add'), cpDesc = document.getElementById('cp-d');
const cpReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cpQ = 0, cpTarget = 0, cpCur = 0, cpLive = false, cpRaf = 0, cpLast = 0, cpFl = null, cpFocusBack = false, cpAddT = 0;

// the curves, as the kit's: move (.65, 0, .35, 1), expo out (.16, 1, .3, 1), in (.5, 0, .75, 0)
function cpBezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
}
const cpMove = cpBezier(0.65, 0, 0.35, 1), cpExpo = cpBezier(0.16, 1, 0.3, 1), cpIn = cpBezier(0.5, 0, 0.75, 0);
const cp01 = (x) => Math.min(1, Math.max(0, x));
const cpPx = (n) => (Math.abs(n) < 0.005 ? 0 : n).toFixed(2);

// a shared element: from its rect on the card (a) to its rect on the page (b), the page element standing in for the card's
function cpFly(el, a, b, f, uniform, radius) {
  if (f >= 1) { el.style.transform = ''; if (radius) el.style.borderRadius = ''; return; }
  const k = (p) => a[p] + (b[p] - a[p]) * f;
  const sy = k('height') / b.height, sx = uniform ? sy : k('width') / b.width;
  el.style.transform = `translate(${cpPx(k('left') - b.left)}px, ${cpPx(k('top') - b.top)}px) scale(${sx.toFixed(5)}, ${sy.toFixed(5)})`;
  // the corner is drawn in the element's own units, so a 16 px corner on screen is 16 / scale (card radius to page radius, linearly)
  if (radius) el.style.borderRadius = `${((radius[0] + (radius[1] - radius[0]) * f) / sx).toFixed(2)}px / ${((radius[0] + (radius[1] - radius[0]) * f) / sy).toFixed(2)}px`;
}
const cpRect = (el) => { const r = el.getBoundingClientRect(); return { left: r.left, top: r.top, width: r.width, height: r.height }; };

function cpDraw(q) {
  const t = q * CP.OPEN, f = cpMove(q), card = cpCards[cpCur];
  if (q > 0 && !cpLive) {                                   // first frame of a flight: the card's own parts give way to the page's
    cpLive = true;
    card.pic.style.visibility = card.name.style.visibility = card.price.style.visibility = 'hidden';
    card.el.classList.add('is-picked');
    cpPage.style.visibility = 'visible';
    if (cpTarget && cpFocusBack) cpBack.focus({ preventScroll: true });   // focus goes with the page
  } else if (q === 0 && cpLive) {                           // last frame of the way back: the card's parts return, the page leaves
    cpLive = false;
    card.pic.style.visibility = card.name.style.visibility = card.price.style.visibility = '';
    card.el.classList.remove('is-picked');
    cpPage.style.visibility = 'hidden';
    cpHero.style.transform = cpT.style.transform = cpPr.style.transform = cpHero.style.borderRadius = '';
    cpCards.forEach((c) => { c.el.style.transform = ''; });
    cpH1.style.clipPath = cpH1.style.transform = cpH2.style.clipPath = cpH2.style.transform = '';
    cpLines.forEach((el) => { el.style.clipPath = el.style.transform = ''; });
  }
  if (!cpLive) return;
  // picture, name, price: the page's own elements, flown
  cpFly(cpHero, cpFl.a.pic, cpFl.b.pic, f, false, CP_RADIUS);
  cpFly(cpT, cpFl.a.name, cpFl.b.name, f, true);
  cpFly(cpPr, cpFl.a.price, cpFl.b.price, f, true);
  // the other cards slide out toward their own side; the frame clips them
  cpCards.forEach((c, j) => {
    if (j === cpCur) return;
    const left = 24 + j * 154, off = j < cpCur ? -(left + 146) : 648 - left + 8;
    const s = cpMove(cp01((t - 30 * Math.abs(j - cpCur)) / 420));
    c.el.style.transform = s ? `translateX(${(off * s).toFixed(2)}px)` : '';
  });
  // headers: the shop row leaves up under a closing clip, the back row is uncovered from below 120 ms later
  const lv = cpIn(cp01(t / 150)), ar = cpExpo(cp01((t - 120) / 360));
  cpH1.style.clipPath = lv ? `inset(0 0 ${(lv * 100).toFixed(2)}% 0)` : ''; cpH1.style.transform = lv ? `translateY(${(-6 * lv).toFixed(2)}px)` : '';
  cpH2.style.clipPath = ar < 1 ? `inset(${((1 - ar) * 100).toFixed(2)}% 0 0 0)` : ''; cpH2.style.transform = ar < 1 ? `translateY(${((1 - ar) * 6).toFixed(2)}px)` : '';
  // the rest of the page: stock, description, Add to cart, uncovered from the bottom edge behind the flight
  cpLines.forEach((el, k) => {
    const u = cpExpo(cp01((t - 140 - k * 50) / 380));
    el.style.clipPath = u < 1 ? `inset(${((1 - u) * 100).toFixed(2)}% 0 0 0)` : ''; el.style.transform = u < 1 ? `translateY(${((1 - u) * 8).toFixed(2)}px)` : '';
  });
}
function cpStep() {
  cpRaf = 0;
  const now = performance.now(), dt = Math.min(50, Math.max(0.5, now - cpLast)); cpLast = now;
  cpQ = cpTarget ? Math.min(1, cpQ + dt / CP.OPEN) : Math.max(0, cpQ - dt / CP.BACK);
  cpDraw(cpQ);
  if (cpQ !== cpTarget) cpRaf = requestAnimationFrame(cpStep); else cpArrive();
}
function cpRun() {
  if (cpReduced) { cpQ = cpTarget; cpDraw(cpQ); cpArrive(); return; }
  if (!cpRaf) { cpLast = performance.now(); cpRaf = requestAnimationFrame(cpStep); }
}
function cpArrive() {
  if (cpTarget) { if (cpFocusBack && document.activeElement !== cpBack) cpBack.focus({ preventScroll: true }); }
  else {
    cpGrid.inert = false;
    if (cpFocusBack) cpCards[cpCur].el.focus({ preventScroll: true });
  }
}

function cpOpen(i, focus = true) {
  if (cpQ > 0 || cpTarget) return;
  cpCur = i; cpFocusBack = focus;
  const it = CP_ITEMS[i], card = cpCards[i];
  cpHeroImgs.forEach((img, k) => img.classList.toggle('is-cur', k === i));
  cpT.textContent = it.name; cpPr.textContent = it.price; cpDesc.textContent = it.d;
  cpNo.textContent = `0${i + 1} / 04`;
  cpPage.style.visibility = 'visible';                       // measure the page where it will rest
  cpFl = {
    a: { pic: cpRect(card.pic), name: cpRect(card.name), price: cpRect(card.price) },
    b: { pic: cpRect(cpHero), name: cpRect(cpT), price: cpRect(cpPr) },
  };
  cpPage.style.visibility = '';                              // it stays hidden until the flight's first frame
  cpTarget = 1; cpGrid.inert = true; cpPage.inert = false;
  cpRun();
}
function cpClose(focus = true) {
  if (!cpTarget) return;
  cpTarget = 0; cpFocusBack = focus; cpPage.inert = true;
  cpRun();
}

cpCards.forEach((c, i) => c.el.addEventListener('click', () => cpOpen(i, !window.cpQuiet)));
cpBack.addEventListener('click', () => cpClose(!window.cpQuiet));
addEventListener('keydown', (e) => { if (e.key === 'Escape' && cpTarget) { e.preventDefault(); cpClose(true); } });
cpAdd.addEventListener('click', () => {
  clearTimeout(cpAddT);
  cpAdd.classList.add('is-done');
  cpAddT = setTimeout(() => cpAdd.classList.remove('is-done'), 1700);
});
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function tap(my, el, hold = 240) {
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * 0.55, r.top + r.height * 0.55, 760))) throw 0;
    if (my !== epoch) throw 0;
    el.classList.add('is-hot');
    await gap(my, 190);
    el.classList.add('is-press');
    await gap(my, 110);
    el.classList.remove('is-press', 'is-hot');
    el.click();
    await gap(my, hold);
  }
  // back to the grid, instantly and invisibly (a real visitor left the page open)
  function reset() {
    if (cpQ > 0 || cpTarget) { cancelAnimationFrame(cpRaf); cpRaf = 0; cpTarget = 0; cpQ = 0; cpDraw(0); cpPage.inert = true; cpGrid.inert = false; }
    cpAdd.classList.remove('is-done');
    if (document.activeElement && cpBox.contains(document.activeElement)) document.activeElement.blur();
  }
  let n = 0;
  async function script() {
    const my = ++epoch;
    window.cpQuiet = true;
    try {
      QM.ghostShow();
      if (cpTarget) await tap(my, cpBack, 600);
      for (;;) {
        await gap(my, 1000);
        const i = [2, 0, 3, 1][n++ % 4];
        await tap(my, cpCards[i].el, 2200);                      // the flight, and the page at rest
        await tap(my, cpAdd, 1500);                              // Added
        await tap(my, cpBack, 600);                              // and the same flight back
        await QM.ghostTo(innerWidth * 0.78, innerHeight * 0.84, 600);
        await gap(my, 700);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; window.cpQuiet = false; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!cpBox.matches(':hover') && !cpBox.contains(document.activeElement)) script(); else touch({}); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); reset(); if (!reduced) script(); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(script, 300));
})();
</script>
