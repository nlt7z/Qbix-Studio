<script data-code>
/* Two edits, each on the same clock: strike, rise, close and drop, count. S is when the edit starts. */
const RL_EDITS = [600, 2700];
const RL_OK = 4700, RL_END = 5300;

const rlRows = [...document.querySelectorAll('[data-edit]')];
const rlParts = rlRows.map((row) => ({
  row, slot: row.querySelector('.rl-slot'), old: row.querySelector('.rl-old'), oldT: row.querySelector('.rl-old > span'),
  strike: row.querySelector('.rl-strike'), sleeve: row.querySelector('.rl-sleeve'), newT: row.querySelector('.rl-sleeve > span'), bar: row.querySelector('.rl-bar'),
}));

const rlClamp = (x) => Math.min(1, Math.max(0, x));
function rlBez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(rlClamp(t)); };
}
const rlOut = rlBez(0.16, 1, 0.3, 1), rlMove = rlBez(0.65, 0, 0.35, 1);

function redlineRender(t) {
  // read first: the two widths of each slot (the phrases are absolutely placed, so they keep their own width)
  const m = rlParts.map((p) => [p.oldT.offsetWidth, p.newT.offsetWidth]);
  let count = 0;
  rlParts.forEach((p, i) => {
    const [wo, wn] = m[i], s = RL_EDITS[i];
    const strike = rlOut(rlClamp((t - s) / 360));
    const bar = rlOut(rlClamp((t - s) / 300));
    const rise = rlOut(rlClamp((t - (s + 500)) / 420));
    const glide = rlMove(rlClamp((t - (s + 1250)) / 500));
    const retreat = rlMove(rlClamp((t - (s + 1250)) / 400));
    const drop = rlMove(rlClamp((t - (s + 1390)) / 400));
    count += rlOut(rlClamp((t - (s + 1790)) / 300));
    p.slot.style.width = (wo + (wn - wo) * glide).toFixed(2) + 'px';
    p.strike.style.width = (wo * strike).toFixed(2) + 'px';
    p.old.style.clipPath = `inset(0 ${((retreat) * 100).toFixed(2)}% 0 0)`;
    p.sleeve.style.width = wn + 'px';
    p.sleeve.style.transform = `translateY(${(drop * 1.2).toFixed(4)}em)`;
    p.newT.style.transform = `translateY(calc(${((1 - rise) * 100).toFixed(2)}% + ${((1 - rise) * 2).toFixed(2)}px))`;
    p.newT.style.width = wn + 'px';
    p.bar.style.transform = `scaleY(${bar})`;
  });
  const num = document.getElementById('rl-num');
  [...num.children].forEach((c) => { c.style.transform = `translateY(${(-count * 100).toFixed(2)}%)`; });
  document.getElementById('rl-ok').style.transform = `translateY(calc(${((1 - rlOut(rlClamp((t - RL_OK) / 520))) * 100).toFixed(2)}% + ${((1 - rlOut(rlClamp((t - RL_OK) / 520))) * 2).toFixed(2)}px))`;
}
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0;
  const still = () => redlineRender(RL_END + 1);
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };
  function reset() { stop(); if (reduced) still(); else redlineRender(0); }
  function play() {
    stop();
    if (reduced) return still();
    const t0 = performance.now();
    const step = (now) => { const t = now - t0; redlineRender(Math.min(t, RL_END + 1)); if (t < RL_END + 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  }
  QM.demo({
    kind: 'play', lead: 500, dur: RL_END, hold: 2600, reset, play,
    seekPlay(v) { stop(); redlineRender(QM.clamp01(v) * RL_END); },
  });
  if (document.fonts) document.fonts.ready.then(() => { if (!raf) reset(); });
  reset();
})();
</script>
