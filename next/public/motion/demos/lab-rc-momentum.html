<style data-code>

.mo-tile { position: absolute; left: 0; top: 0; height: 100%; width: clamp(150px, 27vw, 290px); overflow: hidden; background: #e6e8ea; will-change: transform;

<body>
<main class="qm-stage">
<!-- code -->
<div class="mo" id="mo">
  <div class="mo-head"><p class="kicker">Shipped work · this year</p><h2 class="title">Nine launches.</h2></div>
  <div class="mo-strip" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Work strip"></div>
  <div class="mo-under"><div class="mo-cap" aria-live="polite"></div><span class="mo-count"></span></div>
</div>
<!-- /code -->
  <div class="qm-ui"><span>Drag, flick, or use the arrow keys</span></div>

<script src="../kit/stage.js"></script>
<script data-code>
/* Momentum strip. createStrip(el, items) -> { down(x), drag(x), up(), step(dir) } */
function createStrip(strip, items, { capEl, countEl, reduce = false } = {}) {
  const N = items.length;
  const tiles = items.map(([name, src], i) => {
    const el = document.createElement('div'); el.className = 'mo-tile';
    const img = document.createElement('img'); img.alt = ''; img.src = src; el.append(img); strip.append(el);
    return { el, img, i, name };
  });
  let W = 0, cw = 0, gap = 0, span = 0, total = 0, pos = 0, vel = 0, skew = 0, mode = 'rest', sv = 0, st = 0, shown = -1;
  const wrap = (v, lo, hi) => { const r = hi - lo; return ((((v - lo) % r) + r) % r) + lo; };
  function measure() {
    const old = span; W = strip.clientWidth; cw = tiles[0].el.offsetWidth; gap = Math.max(14, cw * 0.06); span = cw + gap; total = span * N;
    if (old) pos = Math.round(pos / old) * span;
  }
  const nearest = () => Math.round(pos / span) * span;
  function snapTo(target) { st = target; sv = vel; mode = reduce ? 'rest' : 'snap'; if (reduce) pos = target; }
  let dragging = null;
  function down(x) { dragging = { x, t: performance.now(), locked: false }; vel = 0; }
  function drag(x) {
    if (!dragging) return;
    const dx = x - dragging.x;
    if (!dragging.locked) { if (Math.abs(dx) < 4) return; dragging.locked = true; mode = 'drag'; strip.classList.add('is-drag'); }
    const now = performance.now(), dt = Math.max((now - dragging.t) / 1000, 1 / 240);
    pos -= dx; vel = vel + (-dx / dt - vel) * 0.35; dragging.x = x; dragging.t = now;
  }
  function up() { if (!dragging) return; if (dragging.locked) { mode = reduce ? 'snap' : 'coast'; if (reduce) snapTo(nearest()); } dragging = null; strip.classList.remove('is-drag'); }
  function step(dir) { vel = 0; snapTo(Math.round((mode === 'snap' ? st : pos) / span + dir) * span); }
  strip.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); step(1); } if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); } });
  strip.addEventListener('wheel', (e) => { if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return; e.preventDefault(); pos += e.deltaX; vel = e.deltaX * 30; mode = 'coast'; }, { passive: false });

  function setCaption(i) {
    if (i === shown) return; shown = i;
    Array.from(capEl.children).forEach((old) => { old.classList.add('is-out'); setTimeout(() => old.remove(), 450); });
    const s = document.createElement('span'); s.textContent = items[i][0]; s.className = 'is-in'; capEl.append(s);
    requestAnimationFrame(() => requestAnimationFrame(() => s.classList.remove('is-in')));
    countEl.textContent = `${String(i + 1).padStart(2, '0')} / ${String(N).padStart(2, '0')}`;
  }
  function render(dt) {
    if (mode === 'coast') { vel *= Math.exp(-3.2 * dt); pos += vel * dt; if (Math.abs(vel) < 260) snapTo(nearest()); }
    else if (mode === 'snap') {                                    // a spring from the current position and velocity
      const k = 140, c = 2 * Math.sqrt(k) * 0.85;
      sv += (-k * (pos - st) - c * sv) * dt; pos += sv * dt; vel = sv;
      if (Math.abs(pos - st) < 0.05 && Math.abs(sv) < 5) { pos = st; mode = 'rest'; vel = 0; }
    } else if (mode === 'rest') vel = 0;
    const target = Math.max(-9, Math.min(9, -vel * 0.004)); skew += (target - skew) * (1 - Math.exp(-10 * dt));
    const center = W / 2 - cw / 2;
    for (const t of tiles) {
      const x = wrap(t.i * span - pos, -total / 2, total / 2), dist = x / (W / 2 + cw);
      t.el.style.transform = `translate3d(${(center + x).toFixed(1)}px,0,0) skewX(${skew.toFixed(2)}deg)`;
      t.img.style.transform = `translate3d(${(-Math.max(-1.1, Math.min(1.1, dist)) * cw * 0.12).toFixed(1)}px,0,0)`;
    }
    setCaption(((Math.round(pos / span) % N) + N) % N);
  }
  measure(); render(0);
  new ResizeObserver(measure).observe(strip);
  let prev = 0; const loop = (now) => { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - (prev || now)) / 1000); prev = now; render(dt); };
  requestAnimationFrame(loop);
  return { down, drag, up, step };
}
</script>
<script>
  const A = '../assets/art/';
  const items = [['Forma · Homepage', A + 'objects.webp'], ['Kova · App', A + 'curves.webp'], ['Strata · Design system', A + 'ribbon.webp'], ['Willow Counseling · Practice site', A + 'calla.webp'],
    ['Halo lamp · Product page', A + 'ring.webp'], ['Knot stool · Product page', A + 'cross.webp'], ['Prism block · Product page', A + 'block.webp'], ['Carafe · Product page', A + 'bottle.webp'], ['Kova · Brand', A + 'wall.webp']];
  const root = document.getElementById('mo'), strip = root.querySelector('.mo-strip');
  const s = createStrip(strip, items, { capEl: root.querySelector('.mo-cap'), countEl: root.querySelector('.mo-count'), reduce: QM.reduced });
  strip.addEventListener('pointerdown', (e) => { s.down(e.clientX); strip.setPointerCapture(e.pointerId); });
  strip.addEventListener('pointermove', (e) => s.drag(e.clientX));
  strip.addEventListener('pointerup', () => s.up()); strip.addEventListener('pointercancel', () => s.up());

  /* the ghost hand: take hold, throw the strip left, let it land, go back */
  const CYC = 4.6; let down = false;
  const ease = (u) => u * u * (3 - 2 * u);
  function ghostPath(t) {
    t = Math.max(0, t); const u = (t % CYC) / CYC, W = innerWidth, r = strip.getBoundingClientRect(), y = r.top + r.height * 0.55;
    let x; const x0 = W * 0.7, x1 = W * 0.3;
    if (u < 0.12) { x = x0; down = false; } else if (u < 0.3) { x = x0 + (x1 - x0) * Math.pow((u - 0.12) / 0.18, 1.6); down = true; }
    else if (u < 0.62) { x = x1; down = false; } else { x = x1 + (x0 - x1) * ease((u - 0.62) / 0.3); down = false; if (u > 0.92) x = x0; }
    return [x, y];
  }
  let gDown = false;
  QM.demo({
    kind: 'pointer', path: ghostPath,
    move(x, y, ghost) {
      if (!ghost) return;
      if (down && !gDown) { s.down(x); gDown = true; } else if (!down && gDown) { s.up(); gDown = false; } else if (gDown) s.drag(x);
    },
    leave() { s.up(); gDown = false; },
  });
</script>
