<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII ring · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{
  "id": "lab-ascii-motion",
  "title": "ASCII ring",
  "group": "lab",
  "cat": "backgrounds",
  "order": 660,
  "kind": "pointer",
  "tone": "dark",
  "line": "z-buffered ring · 17-step character ramp",
  "summary": "A parametric ring with a flat oval cross-section twists and breathes. Normals and lighting are computed per point and projected with a z-buffer onto a monospace grid; each cell gets a character by brightness. The pointer turns it.",
  "spec": [
    ["Surface", "ring radius 1 + 0.08 sin(2u − 0.8t); cross-section 0.42 × 1.3 by 0.42 × 0.62, twisting 2 turns, breathing 20%"],
    ["Raster", "one pass over (u, v) samples, depth kept per character cell (nearest wins)"],
    ["Light", "dot(normal, light) ^ 1.4 plus a rim term; level = floor(b × 17)"],
    ["Ramp", ".,:;-~=+*cxoe%#&@, each level a flat grey, the lit edge lime"],
    ["Pointer", "yaw (x − ½) × 1.3, pitch (y − ½) × 0.9, eased 1 − e^(−3 dt)"],
    ["Idle", "after 2.5 s the pointer drifts on a slow Lissajous path"]
  ],
  "source": ["Qbix studio library · ascii-motion"],
  "where": "A ring as a Qbix Labs chapter plate: the object as pure type.",
  "rules": [
    "Characters are flat colours from a ladder, never alpha. Dark ones are grey, the top two levels are lime.",
    "The grid is monospace so cells line up; use the system mono, the studio fonts are not fixed-width.",
    "Resolution follows the grid: more cells, more samples."
  ],
  "tags": ["text", "canvas", "3d", "pointer"],
  "shot": 1600

<style data-code>
/* ASCII motion: one canvas, text drawn cell by cell */
.ascii { position: relative; width: 100%; height: 100%; touch-action: none; user-select: none; }
.ascii canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
<style>
  .am { width: 100%; height: calc(100svh - clamp(40px, 9vmin, 96px)); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; }
  html:not(.qm-tile) .am { height: calc(100svh - clamp(40px, 9vmin, 96px) - 46px); }
  .am-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
</style>
</head>
<body>
<main class="qm-stage">
  <div class="am">
    <div class="am-row"><span class="kicker">Qbix Labs</span><span class="tag">Chapter 02</span></div>
<!-- code -->
<div class="ascii" role="img" aria-label="A twisted soft ring drawn in text characters, turning slowly"><canvas></canvas></div>
<!-- /code -->
    <div class="am-row"><span class="kicker">The ring, in type</span><span class="kicker">qbix.space</span></div>
  </div>
  <div class="qm-ui"><span>Move the pointer to turn the ring</span></div>
</main>
<script src="../kit/stage.js"></script>
<script data-code>
function asciiRing(box, { reduce = false } = {}) {
  const cv = box.querySelector('canvas');
  const ctx = cv.getContext('2d');
  const FAM = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';
  const RAMP = '.,:;-~=+*cxoe%#&@';
  const LEVELS = RAMP.length;
  // a flat ladder: dark grey up to chalk, the lit edge (top two levels) in lime
  const COLORS = Array.from({ length: LEVELS }, (_, i) => {
    if (i >= LEVELS - 2) return '#B8FF00';
    const k = i / (LEVELS - 3), g = Math.round(58 + 186 * Math.pow(k, 0.9));
    return `rgb(${g},${g},${Math.round(g * 0.99)})`;
  });
  let W = 0, H = 0, dpr = 1, fsz = 12, cw = 7, lh = 14, cols = 0, rows = 0, ox = 0, oy = 0;
  let zbuf, lbuf, raf = 0, prev = 0, t = 1.2, lastInput = -1e9, gt = 0;
  let tpx = 0.5, tpy = 0.5, ppx = 0.5, ppy = 0.5, yaw = 0, pitch = 0;
  let NU = 200, NV = 60, cosV, sinV;

  function size() {
    const r = cv.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    fsz = Math.max(9, Math.min(15, Math.min(W, H) / 40));
    ctx.font = `600 ${fsz}px ${FAM}`;
    cw = ctx.measureText('M').width || fsz * 0.6;
    lh = fsz * 1.18;
    cols = Math.floor(W / cw); rows = Math.floor(H / lh);
    ox = (W - cols * cw) / 2; oy = (H - rows * lh) / 2;
    zbuf = new Float32Array(cols * rows);
    lbuf = new Int8Array(cols * rows);
    NU = Math.ceil(Math.max(cols, rows * 2) * 2.6);
    NV = Math.ceil(Math.max(cols, rows * 2) * 0.75);
    cosV = new Float32Array(NV + 1); sinV = new Float32Array(NV + 1);
    for (let j = 0; j <= NV; j++) { const v = (j / NV) * Math.PI * 2; cosV[j] = Math.cos(v); sinV[j] = Math.sin(v); }
  }
  // a ring whose cross-section is a flattened ellipse that twists twice around the loop and breathes
  function ringParams(u, time) {
    const R0 = 1 + 0.08 * Math.sin(2 * u - time * 0.8);
    const rr = 0.42 * (1 + 0.2 * Math.sin(3 * u + time * 1.4));
    const phi = 2 * u + time * 0.6;
    return [R0, rr * 1.3, rr * 0.62, Math.cos(phi), Math.sin(phi), Math.cos(u), Math.sin(u)];
  }
  function point(p, c, s, out) {
    const ex = p[1] * c, ey = p[2] * s;
    const cx = ex * p[3] - ey * p[4], cy = ex * p[4] + ey * p[3];
    const rad = p[0] + cx;
    out[0] = rad * p[5]; out[1] = rad * p[6]; out[2] = cy;
  }
  const A = [0, 0, 0], B = [0, 0, 0], C = [0, 0, 0];
  function render() {
    zbuf.fill(0); lbuf.fill(-1);
    const ax = 0.42 + 0.22 * Math.sin(t * 0.23) + pitch, ay = 0.25 * Math.sin(t * 0.31) + yaw, az = t * 0.28;
    const sa = Math.sin(ax), ca = Math.cos(ax), sb = Math.sin(ay), cb = Math.cos(ay), sc = Math.sin(az), cc = Math.cos(az);
    const D = 4.4;
    const K = Math.min(cols * cw, rows * lh) * D * 0.33;
    const lx = -0.62, ly = 0.55, lz = -0.56;
    const du = (Math.PI * 2) / NU, e = du * 0.5;
    for (let i = 0; i < NU; i++) {
      const u = i * du;
      const p = ringParams(u, t), q = ringParams(u + e, t);
      for (let j = 0; j < NV; j++) {
        point(p, cosV[j], sinV[j], A);
        point(q, cosV[j], sinV[j], B);
        point(p, cosV[j + 1], sinV[j + 1], C);
        // normal from the two tangents, pointing away from the ring's spine
        const ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2];
        const vx = C[0] - A[0], vy = C[1] - A[1], vz = C[2] - A[2];
        let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        const sx = A[0] - p[0] * p[5], sy = A[1] - p[0] * p[6], sz = A[2];
        if (nx * sx + ny * sy + nz * sz < 0) { nx = -nx; ny = -ny; nz = -nz; }
        const nl = Math.hypot(nx, ny, nz) || 1;
        nx /= nl; ny /= nl; nz /= nl;
        // rotate point and normal: z, then x, then y
        const x = A[0] * cc - A[1] * sc, y = A[0] * sc + A[1] * cc, z = A[2];
        const y2 = y * ca - z * sa, z2 = y * sa + z * ca;
        const x3 = x * cb + z2 * sb, z3 = -x * sb + z2 * cb;
        const mx = nx * cc - ny * sc, my = nx * sc + ny * cc, mz = nz;
        const my2 = my * ca - mz * sa, mz2 = my * sa + mz * ca;
        const mx3 = mx * cb + mz2 * sb, mz3 = -mx * sb + mz2 * cb;
        const ooz = 1 / (z3 + D);
        const gx = Math.floor((W / 2 + x3 * K * ooz - ox) / cw);
        const gy = Math.floor((H / 2 - y2 * K * ooz - oy) / lh);
        if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) continue;
        const idx = gy * cols + gx;
        if (ooz <= zbuf[idx]) continue;          // z-buffer: the nearest sample owns the cell
        zbuf[idx] = ooz;
        const L = mx3 * lx + my2 * ly + mz3 * lz;
        const b = Math.min(1, Math.max(0, 0.06 + 0.94 * Math.pow(Math.max(0, L), 1.4) + 0.12 * Math.pow(1 - Math.abs(mz3), 3)));
        lbuf[idx] = Math.min(LEVELS - 1, Math.floor(b * LEVELS));
      }
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = `600 ${fsz}px ${FAM}`;
    ctx.textBaseline = 'top';
    // a quiet field of dots so the empty cells still read as the same material
    ctx.fillStyle = '#26282C';
    for (let gy = 1; gy < rows; gy += 2) for (let gx = (gy >> 1) % 2; gx < cols; gx += 3) {
      if (lbuf[gy * cols + gx] < 0) ctx.fillText('.', ox + gx * cw, oy + gy * lh);
    }
    for (let lv = 0; lv < LEVELS; lv++) {
      ctx.fillStyle = COLORS[lv];
      const ch = RAMP[lv];
      for (let k = 0; k < lbuf.length; k++) {
        if (lbuf[k] !== lv) continue;
        ctx.fillText(ch, ox + (k % cols) * cw, oy + Math.floor(k / cols) * lh);
      }
    }
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - (prev || now)) / 1000);
    prev = now; t += dt;
    if (now - lastInput > 2500) {
      gt += dt;
      tpx = 0.5 + 0.38 * Math.sin(gt * 0.45);
      tpy = 0.5 + 0.3 * Math.sin(gt * 0.61 + 1);
    }
    const k = 1 - Math.exp(-dt * 3);
    ppx += (tpx - ppx) * k; ppy += (tpy - ppy) * k;
    yaw = (ppx - 0.5) * 1.3; pitch = (ppy - 0.5) * 0.9;
    render();
  }
  function aim(cx, cy) { lastInput = performance.now(); tpx = cx / window.innerWidth; tpy = cy / window.innerHeight; }
  window.addEventListener('pointermove', (e) => aim(e.clientX, e.clientY));
  window.addEventListener('pointerdown', (e) => aim(e.clientX, e.clientY));
  function start() {
    if (reduce) { t = 2.2; render(); return; }
    if (!raf) { prev = 0; raf = requestAnimationFrame(frame); }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else start(); });
  new ResizeObserver(() => { size(); if (reduce) render(); }).observe(cv);
  size(); start();
  return { aim, idle() { lastInput = -1e9; } };
}
</script>
<script>
  const am = asciiRing(document.querySelector('.ascii'), { reduce: QM.reduced });
  QM.demo({ kind: 'pointer', move: (x, y) => am.aim(x, y), leave: () => am.idle() });
</script>
</body>
</html>
