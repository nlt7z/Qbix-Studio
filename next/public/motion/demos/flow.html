<script src="../kit/stage.js"></script>
<script data-code>
/* ---- lib/scene/quiet.ts — whether the page is being scrolled right now. The generative drawings
   hold still while it is, so the scroll keeps every frame (they pick up again once it stops). */
let lastScroll = -1e9;
let listening = false;
function scrolling() {
  if (!listening) {
    listening = true;
    window.addEventListener('scroll', () => (lastScroll = performance.now()), { passive: true });
  }
  return performance.now() - lastScroll < 180;
}

/* ---- components/scene/Flow.tsx
   Generative art: particles carried by a slow field of currents, each drawing a fine line where it
   goes while the old lines fade, so the picture is the paths they take. Lime on ink by default
   (colours as 'r, g, b'). Drawn at the canvas's own device pixels, the scene's zoom included; it's
   drawn out the first time it comes on the screen (not on load), moves only while it's on the screen
   and the tab is open, and for reduced motion it's a still.
   count · seed · ground · ink · speed · scale (the size of the currents: above 1, wider) ·
   alpha (how strong each line is drawn) · density (canvas pixels per css pixel, for a big soft one) */
function flow(cv, { count = 520, seed = 7, ground = '11, 12, 14', ink = '184, 255, 0', speed = 1, scale = 1, alpha = 0.78, density, ratio } = {}) {
  const g = cv.getContext('2d', { alpha: false });
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let W = 0, H = 0, k = 1, t = 0;
  const ps = Array.from({ length: count }, () => ({ x: 0, y: 0, life: 0 }));
  const spawn = (p) => {
    p.x = rnd() * W;
    p.y = rnd() * H;
    p.life = 50 + rnd() * 160;
  };
  // the currents: an angle at each point (in the drawing's px), turning slowly with time
  const angle = (x, y) => {
    const u = x / k / scale, v = y / k / scale;
    return Math.sin(u * 0.011 + t * 0.35) * 1.5 + Math.cos(v * 0.013 - t * 0.25) * 1.3 + Math.sin((u + v) * 0.0045 + 1.3) * 2.4;
  };
  const fade = (n) => `rgba(${ground}, ${(1 - Math.pow(0.94, n)).toFixed(3)})`;
  const line = `rgba(${ink}, ${alpha})`;
  // a step of the currents; the old lines fade every `every` steps (by as much as they would have)
  let since = 0;
  const step = (every = 1) => {
    t += 0.004 * speed;
    if (++since >= every) {
      g.fillStyle = fade(since);
      g.fillRect(0, 0, W, H);
      since = 0;
    }
    g.strokeStyle = line;
    g.lineWidth = Math.max(1, k * 0.9);
    g.beginPath();
    const v = 1.15 * k * speed;
    for (const p of ps) {
      const a = angle(p.x, p.y);
      const nx = p.x + Math.cos(a) * v, ny = p.y + Math.sin(a) * v;
      g.moveTo(p.x, p.y);
      g.lineTo(nx, ny);
      p.x = nx;
      p.y = ny;
      if (--p.life <= 0 || nx < 0 || ny < 0 || nx > W || ny > H) spawn(p);
    }
    g.stroke();
  };
  const fresh = () => {
    g.fillStyle = `rgb(${ground})`;
    g.fillRect(0, 0, W, H);
    ps.forEach(spawn);
    // drawn out ahead: fewer steps, faded less often, the bigger the canvas (a big one comes in mid-scroll)
    const n = Math.max(40, Math.min(180, Math.round((180 * 4e5) / (W * H))));
    for (let i = 0; i < n; i++) step(n < 180 ? 4 : 1);
  };

  let raf = 0, seen = false, drawn = false;
  const size = (w, h) => {
    if (w < 2 || h < 2 || (w === W && h === H)) return;
    W = cv.width = w;
    H = cv.height = h;
    k = W / Math.max(1, cv.clientWidth);
    drawn = false;
    if (seen) draw();
  };
  const draw = () => {
    if (drawn || !W) return;
    drawn = true;
    fresh();
  };
  const ro = new ResizeObserver(([e]) => {
    const d = e.devicePixelContentBoxSize?.[0];
    if (density) size(Math.round(e.contentRect.width * density), Math.round(e.contentRect.height * density));
    // (added for a gallery tile: `ratio` canvas pixels a css pixel as drawn on the screen, whatever the zoom)
    else if (ratio) { const r = cv.getBoundingClientRect(); size(Math.round(r.width * ratio), Math.round(r.height * ratio)); }
    else if (d) size(d.inlineSize, d.blockSize);
    else size(Math.round(e.contentRect.width * devicePixelRatio), Math.round(e.contentRect.height * devicePixelRatio));
  });
  try { ro.observe(cv, { box: 'device-pixel-content-box' }); } catch { ro.observe(cv); }

  const loop = () => {
    raf = 0;
    if (!seen || document.hidden || calm || !W) return;
    // still while the page is scrolled
    if (!scrolling()) step();
    raf = requestAnimationFrame(loop);
  };
  const wake = () => { if (!raf) raf = requestAnimationFrame(loop); };
  const io = new IntersectionObserver(([e]) => {
    seen = e.isIntersecting;
    if (seen) draw();
    wake();
  });
  io.observe(cv);
  document.addEventListener('visibilitychange', wake);
  return {
    // draw it out again from the start (the same seed: the same first picture)
    restart() { s = seed; t = 0; since = 0; drawn = false; if (seen) draw(); wake(); },
    stop() {
      ro.disconnect();
      io.disconnect();
      document.removeEventListener('visibilitychange', wake);
      if (raf) cancelAnimationFrame(raf);
    },
  };
}

/* A canvas's options from its data attributes: <canvas class="flow" data-count="420" data-seed="11"> */
const flowOptions = (d) => ({
  count: d.count && +d.count, seed: d.seed && +d.seed, ground: d.ground, ink: d.ink,
  speed: d.speed && +d.speed, scale: d.scale && +d.scale, alpha: d.alpha && +d.alpha, density: d.density && +d.density,
});
const flowCanvases = Array.from(document.querySelectorAll('canvas.flow'));
const flows = flowCanvases.map((cv) => flow(cv, flowOptions(cv.dataset)));
</script>
<script>
  // --- demo glue: the two drawings the site puts Flow in, laid out at their own size and zoomed to their box ---
  const $ = (id) => document.getElementById(id);
  const fit = (box, scn, w, h) => {
    const f = () => { const k = Math.min(box.clientWidth / w, box.clientHeight / h); if (k > 0) scn.style.setProperty('zoom', String(Math.round(k * 1000) / 1000)); };
    f();
    new ResizeObserver(f).observe(box);
  };
  fit($('box-study'), $('scn-study'), 232, 226);
  fit($('box-table'), $('scn-table'), 256, 414);
  // a gallery tile draws one canvas pixel a css pixel (the drawings are zoomed to their box); the detail view, the site's own rule
  function mount() {
    flows.forEach((f, i) => {
      f.stop();
      flows[i] = flow(flowCanvases[i], { ...flowOptions(flowCanvases[i].dataset), ratio: QM.tile ? 1 : undefined });
    });
  }
  mount();
  document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-view]').forEach((x) => x.classList.toggle('is-on', x === b));
    $('v-study').classList.toggle('is-on', b.dataset.view === 'study');
    $('v-table').classList.toggle('is-on', b.dataset.view === 'table');
    $('v-table').setAttribute('aria-hidden', String(b.dataset.view !== 'table'));
  }));
  $('redraw').addEventListener('click', () => flows.forEach((f) => f.restart()));
  QM.demo({ kind: 'loop', restart: () => flows.forEach((f) => f.restart()) });
</script>
</body>
