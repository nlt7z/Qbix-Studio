<script data-code>
/* Six cells that are one input. Digits rise into place; a focus frame slides between the cells on a spring;
   a full code ripples the cells lime, and the card gives way to the welcome. */
const $ = (id) => document.getElementById(id);
const cellsEl = $('otp-cells'), input = $('otp-code'), caretEl = $('otp-caret'), errEl = $('otp-err');
const v1 = $('otp-v1'), v2 = $('otp-v2'), bar = $('otp-bar');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const N = 6, CW = 52, G = 8, xOf = (i) => i * (CW + G) + (i >= 3 ? 8 : 0);          // a wider gap in the middle
const OUT = 'cubic-bezier(0.16, 1, 0.3, 1)';
const cells = Array.from({ length: N }, (_, i) => {
  const c = document.createElement('div');
  c.className = 'otp-cell'; c.style.left = xOf(i) + 'px';
  cellsEl.insertBefore(c, caretEl);
  return c;
});
let phase = 'type', shown = '', timers = [];
const later = (fn, ms) => { timers.push(setTimeout(fn, ms)); };

/* the frame: x on a spring, to the next empty cell */
const caret = { x: 0, v: 0 };
let raf = 0;
function wake() {
  if (raf) return;
  let prev = performance.now();
  const f = (now) => {
    const dt = Math.min(0.033, (now - prev) / 1000); prev = now;
    const to = xOf(Math.min(input.value.length, N - 1));
    caret.v += ((to - caret.x) * 520 - caret.v * 28) * dt; caret.x += caret.v * dt;
    caretEl.style.transform = `translateX(${caret.x}px)`;
    if (Math.abs(to - caret.x) < 0.05 && Math.abs(caret.v) < 0.5) { caret.x = to; caret.v = 0; caretEl.style.transform = `translateX(${to}px)`; raf = 0; return; }
    raf = requestAnimationFrame(f);
  };
  raf = requestAnimationFrame(f);
}
function render() {
  const v = input.value;
  cells.forEach((c, i) => {
    const ch = v[i] || '', had = shown[i] || '';
    if (ch === had) return;
    c.innerHTML = ch ? `<span>${ch}</span>` : '';
    if (ch && !reduceMotion) c.firstChild.animate([{ transform: 'translateY(14px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 200, easing: OUT });
  });
  shown = v; wake();
}
function reset(full) {
  timers.forEach(clearTimeout); timers = [];
  phase = 'type'; input.value = ''; input.disabled = false; shown = ''; errEl.textContent = '';
  cells.forEach((c) => { c.className = 'otp-cell'; c.innerHTML = ''; });
  caret.x = 0; caretEl.style.transform = 'translateX(0)';
  if (full) {
    [v1, v2].forEach((v) => v.getAnimations().forEach((a) => a.cancel()));        // the page change leaves its last frame held
    v1.hidden = false; v2.hidden = true;
    bar.style.transition = 'none'; bar.style.setProperty('--p', '0%');
  }
}
function ok() {
  phase = 'ok'; input.blur(); input.disabled = true; cellsEl.removeAttribute('data-focus');
  cells.forEach((c, i) => later(() => {                          // the ripple: lime, one by one, each lifting a little
    c.classList.add('ok');
    if (!reduceMotion) c.animate([{ transform: 'none' }, { transform: 'translateY(-6px)', offset: 0.4 }, { transform: 'none' }], { duration: 320, easing: OUT });
  }, i * 60));
  later(async () => {                                              // the card gives way to the welcome line
    if (!reduceMotion) await v1.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'cubic-bezier(0.7, 0, 0.84, 0)', fill: 'forwards' }).finished;
    v1.hidden = true; v2.hidden = false;
    if (!reduceMotion) v2.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 200, easing: OUT });
    bar.style.transition = reduceMotion ? 'none' : 'width 1400ms cubic-bezier(0.65, 0, 0.35, 1)';
    bar.style.setProperty('--p', '100%');
  }, N * 60 + 700);
}
function no() {
  phase = 'no'; errEl.textContent = 'That code did not match. Try again.';
  cells.forEach((c, i) => {
    c.classList.add('no');
    if (!reduceMotion) c.animate([{ transform: 'none' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(-4px)' }, { transform: 'none' }], { duration: 360, delay: i * 20, easing: 'cubic-bezier(0.65, 0, 0.35, 1)' });
  });
  later(() => { cells.forEach((c) => { if (c.firstChild) c.firstChild.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }); }); }, 700);
  later(() => { const e = errEl.textContent; reset(); errEl.textContent = e; input.focus(); }, 950);
}
input.addEventListener('input', () => {
  if (phase !== 'type') return;
  input.value = input.value.replace(/\D/g, '').slice(0, N);
  render();
  if (input.value.length === N) {
    const v = input.value;
    phase = 'check';
    later(() => (/^(\d)\1+$/.test(v) ? no() : ok()), 260);       // any one repeated digit is wrong, for the demo
  }
});
input.addEventListener('focus', () => { cellsEl.setAttribute('data-focus', ''); wake(); });
input.addEventListener('blur', () => { if (phase === 'type') cellsEl.removeAttribute('data-focus'); });
input.addEventListener('keydown', () => { if (phase === 'type') errEl.textContent = ''; });
cellsEl.addEventListener('pointerdown', () => input.focus({ preventScroll: true }));
$('otp-resend').addEventListener('click', () => { $('otp-exp').textContent = 'A new code is on its way'; });
reset(true);
</script>
<script>
  /* harness glue: a ghost types the code; on every other pass, a wrong one first */
  PickGhost.fit(document.getElementById('pk'), 440, 420, { max: 1.5 });
  let round = 0;
  PickGhost.start({
    hot: '.otp-btn',
    reset() { reset(true); $('otp-exp').textContent = 'The code expires in 10 minutes'; },
    async script(g) {
      const wrong = round++ % 2 === 1;
      await g.wait(1200);
      await g.click('#otp-cells', { ms: 650 });
      await g.wait(500);
      await g.type('#otp-code', wrong ? '111111' : '482915', 190);
      await g.wait(wrong ? 2600 : 4200);
    },
    still() { input.value = '482915'; render(); cells.forEach((c) => c.classList.add('ok')); },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
</body>
