<script data-code>
(function () {
  const root = document.getElementById('fp'), read = document.getElementById('fpR');
  const cards = [...root.querySelectorAll('.fp-c')];
  const parts = cards.map((c) => ({ c, p: c.querySelector('.fp-p'), t: c.querySelector('.fp-t'), g: c.querySelector('.fp-g') }));
  const N = cards.length, reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let shown = -1;
  function draw(p) {                       // p: 0..N-1, the card in focus
    parts.forEach((o, i) => {
      const d = i - p;
      const ad = Math.abs(d);
      const depth = d >= 0 ? d : 0;
      const frost = d >= 0 ? clamp(d / 2.8, 0, 1) : clamp(ad * 2.4, 0, 1);   // a passed card frosts over fast
      const y = d >= 0 ? -depth * 46 : ad * 22;
      const s = d >= 0 ? 1 - depth * 0.045 : 1 + ad * 0.05;
      const gone = d < 0 ? clamp(1 - (ad - 0.35) / 0.5, 0, 1) : 1;           // once frosted white it leaves
      o.c.style.transform = `translate3d(0, ${y.toFixed(2)}px, 0) scale(${s.toFixed(4)})`;
      o.c.style.zIndex = String(d < 0 ? 200 : 100 - Math.round(ad * 10));
      o.c.style.visibility = gone <= 0 ? 'hidden' : 'visible';
      o.c.style.opacity = gone.toFixed(3);
      o.p.style.filter = `blur(${(frost * 34).toFixed(2)}px) saturate(${(1 + frost * 0.3).toFixed(2)})`;
      o.t.style.opacity = (d < 0 ? Math.min(0.9, frost * 0.9) : Math.min(1, d * 2.5) * (0.3 + frost * 0.32)).toFixed(3);
      o.g.style.opacity = (0.07 + frost * 0.07).toFixed(3);
    });
    const n = clamp(Math.round(p), 0, N - 1) + 1;
    if (n !== shown) { shown = n; read.textContent = `f/2.0 · 0${n} / 0${N}`; }
  }
  // the scroll is the playhead, smoothed with the site's chase
  let target = 0, cur = 0, raf = 0, last = 0;
  const maxY = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const aim = () => { target = clamp(scrollY / maxY(), 0, 1) * (N - 1); if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); } };
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    cur += (target - cur) * (1 - Math.exp(-6.5 * dt));
    if (Math.abs(target - cur) < 0.0008) cur = target;
    draw(cur);
    raf = cur === target ? 0 : requestAnimationFrame(tick);
  }
  if (reduce) draw(0);
  else { addEventListener('scroll', aim, { passive: true }); addEventListener('resize', aim); draw(0); aim(); }
})();
</script>
