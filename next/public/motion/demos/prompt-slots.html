/* Prompt slots. Everything that moves is a spring (critically damped, from the value and velocity on screen):
   the flyer's x, y, width and size, OPEN (the sentence unfolding: blanks become pills, the missing words and the full stop open), each slot's width W,
   the lime ring's x, y, width and height, and the sent bubble's x, y and size. layout() turns those numbers into styles; nothing else moves a thing.
   Text is real: one input per slot. Its width is the text's measured width (so it never scrolls) and the pill, whose width is the spring, clips it. */
const PS = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const sm = (x, a, b) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const FS = 20, CFS = 13, CPAD = 14, BFS = 16, PADX = 12, MINP = 32, MAXP = 262, MAXLEN = 22;
  const RESP = { fly: 0.38, open: 0.52, slot: 0.3, ring: 0.34, bub: 0.46 };

  const TPL = [
    { name: 'Write a launch post', ph: [
      { t: 'Write a launch post for', s: { ph: 'Forma', name: 'Client' }, tc: 1, sc: 1 },
      { t: 'about', s: { ph: 'the spring line', name: 'Launch' }, tc: 0, sc: 0, tail: '.' }] },
    { name: 'Compare two layouts', ph: [
      { t: 'Compare', s: { ph: 'the old grid', name: 'First layout' }, tc: 1, sc: 1 },
      { t: 'and', s: { ph: 'the new grid', name: 'Second layout' }, tc: 1, sc: 1, tail: '.' }] },
    { name: 'Turn notes into a brief', ph: [
      { t: 'Turn', s: { ph: 'the call notes', name: 'Source' }, tc: 1, sc: 1 },
      { t: 'into a brief', tc: 1, tail: '.' }] }
  ];

  /* a spring: the critically damped closed form; it always starts from the x and v on screen */
  const mk = (x = 0, resp = 0.4, eps = 0.02) => ({ x, v: 0, T: x, w: TAU / resp, on: false, eps });
  function step(s, dt) {
    if (!s.on) return false;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.T + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.T) < s.eps && Math.abs(s.v) < s.eps * 12) { s.x = s.T; s.v = 0; s.on = false; }
    return s.on;
  }
  function aim(s, T, resp) {
    if (resp) s.w = TAU / resp;
    s.T = T;
    if (reduced) { s.x = T; s.v = 0; s.on = false; } else s.on = true;
    kick();
  }
  const snap = (s, x) => { s.x = s.T = x; s.v = 0; s.on = false; };

  const $ = (id) => document.getElementById(id);
  const panel = $('ps-panel'), thread = $('ps-thread'), greet = $('ps-greet'), chipsEl = $('ps-chips'), field = $('ps-field'), sent = $('ps-sent'), ringEl = $('ps-ring');
  const free = $('ps-free'), sendBtn = $('ps-send'), hint = $('ps-hint'), live = $('ps-live'), flyEl = $('ps-fly'), meas = $('ps-meas');
  const chips = Array.from(chipsEl.querySelectorAll('.ps-chip'));
  const mkEl = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };

  const FL = { x: mk(0, RESP.fly, 0.25), y: mk(0, RESP.fly, 0.25), w: mk(0, RESP.fly, 0.25), p: mk(0, RESP.fly, 0.0012) };
  const OPEN = mk(0, RESP.open, 0.0008);
  const RING = { x: mk(0, RESP.ring, 0.2), y: mk(0, RESP.ring, 0.2), w: mk(0, RESP.ring, 0.2), h: mk(0, RESP.ring, 0.2), docked: true, a: 0 };
  const BUB = { x: mk(0, RESP.bub, 0.2), y: mk(0, RESP.bub, 0.2), f: mk(FS, RESP.bub, 0.01) };
  const S = { t: null, act: -1, landed: false, closing: false, sending: false, driver: 'user', soft: false, flyOn: false, flyDir: 'in', flyChip: -1 };
  let phr = [], slots = [], flyCw = null, bub = null, dotsW = 0, raf = 0, last = 0, blink = 0;

  /* measuring: text widths come from a hidden span outside the scaled panel, so they are in design px */
  const wcache = new Map();
  function tw(str, weight = 400) {
    const k = weight + '|' + str;
    let w = wcache.get(k);
    if (w === undefined) { meas.style.fontWeight = weight; meas.textContent = str; w = meas.getBoundingClientRect().width; wcache.set(k, w); }
    return w;
  }
  const sc = () => panel.getBoundingClientRect().width / panel.offsetWidth || 1;
  const rel = (el, base, s) => { const r = el.getBoundingClientRect(), b = base.getBoundingClientRect(); return { x: (r.left - b.left) / s, y: (r.top - b.top) / s, w: r.width / s, h: r.height / s }; };
  const say = (m) => { live.textContent = ''; setTimeout(() => { live.textContent = m; }, 30); };
  const needW = (sl) => { const v = sl.inp.value; return clamp(Math.ceil(tw(v || sl.d.ph, v ? 500 : 400)) + PADX * 2, MINP, MAXP); };

  /* build the sentence for a template: phrases of [words][blank][full stop] */
  function build(t) {
    const T = TPL[t];
    sent.textContent = ''; phr = []; slots = [];
    sent.setAttribute('aria-label', T.name);
    const nS = T.ph.filter((p) => p.s).length;
    T.ph.forEach((d) => {
      const el = mkEl('div', 'ps-i ps-ph' + (d.s ? ' has-slot' : ''));
      const P = { d, el };
      P.main = mkEl('span', 'ps-main'); P.tt = mkEl('span', 'ps-tt', d.t); P.main.append(P.tt); el.append(P.main);
      if (d.s) {
        const sl = { d: d.s, P, si: slots.length, c: !!d.sc, vis: 1, kk: 1 };

      inp.dispatchEvent(new KeyboardEvent('keyup', { key: ch, bubbles: true }));
    },
    key(k, shift = false) {
      S.driver = 'ghost';
      const sl = slots[S.act];
      const tgt = sl ? sl.inp : document;
      tgt.dispatchEvent(new KeyboardEvent('keydown', { key: k, shiftKey: shift, bubbles: true, cancelable: true }));
    },
    snapshot() { return { t: S.t, act: S.act, landed: S.landed, vals: slots.map((s) => s.inp.value), ring: [RING.x.x, RING.y.x, RING.w.x, RING.h.x, RING.a, RING.docked], open: OPEN.x, fly: [FL.x.x, FL.y.x, FL.w.x, FL.p.x], send: !sendBtn.disabled, W: slots.map((s) => s.W.x), bub: bub && bub.text }; }
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('ps-fit'), panel = PS.panel;
  // the panel is drawn at 520 px wide and scaled to the room it is given (about 78% of the width, 1.3x at most)
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    const pw = panel.offsetWidth, ph = panel.offsetHeight;
    const s = Math.max(0.5, Math.min(0.8 * W / pw, (H - 2 * pad - ui - 36) / ph, 1.3));
    fit.style.setProperty('--s', s.toFixed(4));
    panel.style.setProperty('--s', s.toFixed(4));
    fit.style.width = (pw * s).toFixed(2) + 'px'; fit.style.height = (ph * s).toFixed(2) + 'px';
    PS.layout();
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);

  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  // the ghost's events: the same ones a hand makes, untrusted so the page can tell them apart
  const fire = (type, x, y, Ctor = PointerEvent) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 73, isPrimary: true, button: 0, view: window }));
    return t;
  };
  const centre = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * 0.5, y: r.top + r.height * 0.5 }; };
  async function glide(my, to, ms = 760) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y }; fire('pointermove', x, y);
      if (p >= 1) break;
    }
  }
  async function until(my, ok, max = 6000) { let t = 0; while (!ok() && t < max) { await gap(my, 100); t += 100; } }
  async function tap(my) {
    const { x, y } = pos;
    const el = fire('pointerdown', x, y); await gap(my, 100); fire('pointerup', x, y);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  }
  async function click(my, el, dx = 0.5) { const r = el.getBoundingClientRect(); await glide(my, { x: r.left + r.width * dx, y: r.top + r.height * 0.55 }, 640); await gap(my, 170); await tap(my); }
  // the ghost types with the same input path as a hand; a little uneven, never random
  async function type(my, str) {
    for (let i = 0; i < str.length; i++) { PS.typeChar(str[i]); await gap(my, 72 + ((i * 37) % 5) * 13); }
  }
  async function key(my, k, shift = false, after = 500) { PS.key(k, shift); await gap(my, after); }
  const chip = (i) => PS.chips[i];
  async function ensureIdle(my) {
    if (PS.S.t !== null) { PS.key('Escape'); await gap(my, 300); await until(my, () => PS.S.t === null && !PS.S.flyOn); await gap(my, 700); }
  }
  async function pick(my, i) {
    await ensureIdle(my);
    await click(my, chip(i), 0.35);
    await until(my, () => PS.S.landed); await gap(my, 900);
  }
  async function send(my) {
    await until(my, () => PS.canSend(), 2000);
    await click(my, PS.sendBtn);
    await gap(my, 2600);
  }

  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 5000 : 3600) : 700);
      QM.ghostShow();
      if (first && PS.fresh) {                                  // from the pose: finish the sentence, send it
        const sl = PS.slots()[1];
        await click(my, sl.pill, 0.5); await gap(my, 350);
        await type(my, 'the card refresh'); await gap(my, 650);
        await send(my);
      }
      for (;;) {
        await pick(my, 2);                                      // Turn … into a brief: type, then Escape folds it home
        await type(my, 'Willow intake'); await gap(my, 800);
        await key(my, 'Escape', false, 400);
        await until(my, () => PS.S.t === null && !PS.S.flyOn); await gap(my, 1100);
        await pick(my, 1);                                      // Compare … and …: two slots, back and forth, Return sends
        await type(my, 'the old grid'); await gap(my, 500);
        await key(my, 'Tab', false, 700);
        await type(my, 'the new grid'); await gap(my, 600);
        await key(my, 'Tab', true, 800);                        // Shift+Tab, the ring travels back
        await key(my, 'Tab', false, 800);
        await key(my, 'Enter', false, 400);
        await until(my, () => !PS.canSend() && PS.S.t === null, 2000); await gap(my, 2600);
        await pick(my, 0);                                      // Write a launch post for … about …
        await type(my, 'Kova'); await gap(my, 500);
        await key(my, 'Tab', false, 700);
        await type(my, 'the card refresh'); await gap(my, 700);
        await send(my);
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() {
    epoch++; QM.ghostHide();
    if (pos) { pos = null; fire('pointermove', -10, -10); }
  }
  if (!QM.tile && !reduced) {
    const idle = () => PS.panel.matches(':hover') || !!PS.panel.querySelector(':focus-visible') || PS.panel.contains(document.activeElement) && document.activeElement !== document.body;
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                    // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); PS.pose(); if (!reduced) script(true); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => script(true), 300));
})();
</script>
</body>
