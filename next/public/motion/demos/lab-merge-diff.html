<!doctype html>
<html lang="en" data-tone="paper">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word merge · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{
  "id": "lab-merge-diff", "title": "Word merge", "group": "lab", "cat": "text", "order": 400,
  "kind": "play", "tone": "paper",
  "line": "820 ms words fly · 480 ms collapse · 1.5 s settle",
  "summary": "Two versions of a line of homepage copy sit one above the other, split into words on a canvas. On Resolve the words both versions share fly to one spot and overlap, the words not used leave through the edge of their own strip, new words scale in, and the two lines collapse into one. A lime strip marks the merge, then draws back. Each round picks a random result.",
  "spec": [["Fly", "820 ms, each word 50 ms behind the one before, cubic-out"], ["Collapse", "480 ms in-out from 760 ms: two lines become one"], ["Merge strip", "lime, shown for 1.5 s after the collapse, then retracts left"], ["Leaving words", "slide 0.6 line height out of their strip and are cut by its edge"], ["New words", "scale from 0 to 1 at the merged position"], ["Reset", "a wipe from the left covers the file and the next round is planned"]],
  "source": ["Qbix studio library · merge-diff"],
  "where": "A Design service chapter about review rounds: two people's edits to one homepage, resolved in a click.",
  "rules": ["No fading: words leave through the cut edge of their strip, the reset is a wipe.", "Lime is the merged line and the Resolve button.", "Strips are flat blocks with the top right corner cut; no rounded rectangles.", "Keep a line to six words: the fly lasts 820 ms with words 50 ms apart, so a seventh would land short."],
  "tags": ["canvas", "text", "click", "diff"]
}
</script>
<style data-code>
.md { width: min(100%, 820px); height: 100%; display: flex; flex-direction: column; }
.md-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.md-head h2 { font: 400 clamp(28px, 4.6vw, 50px)/1 Eurostile, Geist, sans-serif; letter-spacing: -.03em; margin: 8px 0 0; }
.md-sub { height: 1.5em; overflow: hidden; margin-top: 10px; color: rgba(18,20,23,.64); font-size: clamp(13px, 1.3vw, 15px); }
.md-sub span { display: block; }
.md-plot { position: relative; flex: 1; min-height: 0; margin-top: clamp(14px, 2.6vh, 28px); }
.md-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
</style>
<style>
  .qm-stage { align-items: stretch; justify-items: center; }
  .md { min-height: 0; }
  .md .btn { flex: none; }
</style>
</head>
<body>
<main class="qm-stage">
<!-- code -->
<div class="md">
  <div class="md-head">
    <div>
      <p class="kicker">Qbix · home.copy</p>
      <h2>Two edits, one homepage</h2>
      <div class="md-sub" id="md-sub"><span>3 conflicts in homepage copy</span></div>
    </div>
    <button class="btn btn-lime" id="md-go">Resolve</button>
  </div>
  <div class="md-plot" id="md-plot"><canvas id="md-c"></canvas></div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const Merge = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
  const ease2 = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const lerp = (a, b, t) => a + (b - a) * t;
  const HEAD = 'Eurostile, Geist, sans-serif', MONO = '"Encode Sans", Geist, sans-serif', SANS = 'Geist, system-ui, sans-serif';
  // flat colours on paper: yours on a white strip, Sera's on a light tint, the merge in lime with ink on it; rest is the ink a merged line settles into
  const C = { ours: [18, 20, 23], theirs: [92, 96, 102], rest: [18, 20, 23], ink: [12, 19, 0], lime: [184, 255, 0], s1: [255, 255, 255], s2: [224, 227, 230], num: [134, 137, 142] };
  const rgb = (c) => `rgb(${c.map(Math.round)})`;
  const mixc = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  const SRC = [
    { t: 'Qbix is a small design studio' },
    { o: 'Bring the idea. We build it.', h: 'Bring the idea. We ship it.', m: ['Bring the idea. We ship it.', 'Bring the idea. We build it.', 'Bring the idea. We make it.'] },
    { t: 'Websites, brands and products' },
    { o: 'Moodboard to domain in 3 weeks', h: 'Moodboard to domain in 1 week', m: ['Moodboard to domain in 1 week', 'Moodboard to domain in 3 weeks', 'Moodboard to domain in 2 weeks'] },
    { t: 'Design service, from $500' },
    { o: 'Book a 30 minute call', h: 'Book a free call this week', m: ['Book a free 30 minute call', 'Book a free call this week', 'Book a 30 minute call'] },
    { t: 'Write to contact@qbix.space' },
  ];
  const key = (w) => w.replace(/,$/, '').toLowerCase();
  let file = [];
  function plan() {
    file = SRC.map((l) => {
      if (l.t) return { t: l.t.split(' ') };
      const merged = l.m[Math.floor(Math.random() * l.m.length)].split(' ');
      const o = l.o.split(' ').map((w) => ({ w, used: false })), h = l.h.split(' ').map((w) => ({ w, used: false }));
      const slots = merged.map((w) => {
        const s = { w, src: [] };
        const a = o.find((x) => !x.used && key(x.w) === key(w)); if (a) { a.used = true; s.src.push({ side: 0, tok: a }); }
        const b = h.find((x) => !x.used && key(x.w) === key(w)); if (b) { b.used = true; s.src.push({ side: 1, tok: b }); }
        return s;
      });
      return { o, h, slots, start: null };
    });
  }
  plan();
  const conflicts = () => file.filter((l) => l.slots);

  const cv = document.getElementById('md-c'), ctx = cv.getContext('2d'), wrap = document.getElementById('md-plot');
  let W = 0, H = 0, dpr = 1, LH = 34, FS = 15, GUT = 34;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    LH = clamp(H / 10.6, 26, 62); FS = clamp(LH * 0.42, 13, 24);
    if (W < 400) FS = Math.min(FS, 14);
    GUT = FS * 2.4;
  }
  addEventListener('resize', resize); resize();

  const sub = document.getElementById('md-sub');
  let subCur = '';
  function setSub(t) {
    if (t === subCur) return; subCur = t;
    const el = sub.firstElementChild;
    if (reduce) { el.textContent = t; return; }
    el.animate([{ transform: 'none' }, { transform: 'translateY(-110%)' }], { duration: 180, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).onfinish = () => {
      el.textContent = t; el.animate([{ transform: 'translateY(110%)' }, { transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' });
    };
  }

  let blocks = [], wipe = 1;
  const resolveNext = () => { const c = conflicts().find((l) => l.start === null); if (c) c.start = reduce ? -1e9 : performance.now(); };
  function cutRect(x, y, w, h, c) {
    if (w < 1) return;
    c = Math.min(c, w, h);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  }
  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    // the reset is a wipe from the left, never a fade
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W * wipe, H); ctx.clip();
    ctx.textBaseline = 'middle';
    const font = `400 ${FS}px ${SANS}`;
    ctx.font = font; const SP = ctx.measureText(' ').width;
    let y = 0, n = 1;
    blocks = [];
    for (const l of file) {
      if (l.t) {
        ctx.fillStyle = rgb(C.num); ctx.textAlign = 'right'; ctx.font = `400 ${FS * 0.8}px ${MONO}`; ctx.fillText(n, GUT - 14, y + LH / 2);
        ctx.textAlign = 'left'; ctx.font = font; ctx.fillStyle = 'rgba(18,20,23,.64)'; ctx.fillText(l.t.join(' '), GUT, y + LH / 2);
        y += LH; n++; continue;
      }
      const t = l.start === null ? -1 : now - l.start;
      const p1 = t < 0 ? 0 : clamp(t / 820, 0, 1), p2 = t < 0 ? 0 : ease2((t - 760) / 480), p3 = t < 0 ? 0 : clamp((t - 1300) / 1500, 0, 1);
      const bh = LH * (2 - p2);
      blocks.push({ y0: y, y1: y + bh, l });
      const sx = GUT - 10, sw = W - sx, e1 = ease2(p1), up = LH * 0.5 * p2;
      const yO = y + lerp(0, LH * 0.5, e1) - up + 1, yT = y + lerp(LH, LH * 0.5, e1) - up + 1;
      // the two strips are surfaces; once they meet, the merged line is a lime strip that draws back to the left
      const strip = (yy, col) => { ctx.fillStyle = rgb(col); cutRect(sx, yy, sw, LH - 2, 10); };
      if (e1 < 0.999) { strip(yO, C.s1); strip(yT, C.s2); }
      const limeW = sw * (1 - ease2(p3)) * (e1 > 0.5 ? 1 : 0);
      if (limeW > 0.5) { ctx.fillStyle = rgb(C.lime); cutRect(sx, y + LH * 0.5 - up + 1, limeW * Math.min(1, e1 * 1.2), LH - 2, 10); }
      ctx.fillStyle = rgb(C.num); ctx.textAlign = 'right'; ctx.font = `400 ${FS * 0.8}px ${MONO}`; ctx.fillText(n, GUT - 14, y + lerp(LH * 0.5, LH, e1) - up);
      // labels, in the voice of the site's tags
      ctx.font = `500 ${FS * 0.62}px ${MONO}`; ctx.textAlign = 'right';
      const lab = (txt, yy, col) => { ctx.fillStyle = rgb(col); ctx.fillText(txt, W - 14, yy); };
      if (e1 < 0.999) { lab('YOURS', y + LH * 0.5 - up + e1 * LH * 0.25, C.num); lab("SERA'S", y + LH * 1.5 - up - e1 * LH * 0.25, C.num); }
      if (p2 > 0.02 && p3 < 0.5) lab('MERGED', y + LH * 0.5 + (1 - p2) * LH * 0.5, C.ink);
      ctx.textAlign = 'left'; ctx.font = font;
      const place = (arr, yy) => { let x = GUT; arr.forEach((k) => { k.x = x; k.y = yy; k.wd = ctx.measureText(k.w).width; x += k.wd + SP; }); };
      place(l.o, LH * 0.5); place(l.h, LH * 1.5);
      let x = GUT; l.slots.forEach((s) => { s.x = x; s.wd = ctx.measureText(s.w).width; x += s.wd + SP; });
      const midY = LH - up;
      // words that are not used leave out of the edge of their own strip, cut off by it
      for (const [arr, side] of [[l.o, 0], [l.h, 1]]) {
        arr.forEach((k, i) => {
          if (k.used) return;
          const q = ease(clamp((p1 - i * 0.03) * 1.6, 0, 1));
          const bandY = side ? yT : yO;
          if (q >= 1 || e1 > 0.98) return;
          ctx.save(); ctx.beginPath(); ctx.rect(sx, bandY, sw, LH - 2); ctx.clip();
          ctx.fillStyle = rgb(side ? C.theirs : C.ours);
          ctx.fillText(k.w, k.x, y + lerp(k.y, k.y + (side ? 1 : -1) * LH * 0.7, q) - up + (side ? bandY - (y + LH * 1.5 - up) : bandY - (y + LH * 0.5 - up)) * 0);
          ctx.restore();
        });
      }
      l.slots.forEach((s, i) => {
        const q = ease2(clamp((p1 - 0.1 - i * 0.05) / 0.7, 0, 1)), sw2 = ease(clamp((q - 0.65) / 0.35, 0, 1));
        const onLime = limeW > 0 ? 1 : 0;
        if (!s.src.length) {
          ctx.save(); ctx.translate(s.x + s.wd / 2, y + midY); const sc = sw2; ctx.scale(Math.max(0.001, sc), Math.max(0.001, sc));
          ctx.fillStyle = rgb(C.ink); ctx.textAlign = 'center'; ctx.fillText(s.w, 0, 0); ctx.restore(); ctx.textAlign = 'left';
          return;
        }
        s.src.forEach((src, j) => {
          const k = src.tok, xx = lerp(k.x, s.x, q), yy = y + lerp(k.y, LH, q) - up;
          if (j === 1 && q > 0.98) return;
          const end = p3 > 0.35 ? C.rest : C.ink;
          const col = q < 0.98 ? mixc(src.side ? C.theirs : C.ours, C.ink, q * (p2 > 0 ? 1 : 0)) : end;
          ctx.fillStyle = rgb(p3 > 0 ? mixc(col, C.rest, ease(p3)) : col);
          if (k.w !== s.w) {
            // the word is swapped inside its own box: old one out through the top, new one in from below
            ctx.save(); ctx.beginPath(); ctx.rect(xx - 2, yy - LH * 0.36, Math.max(k.wd, s.wd) + 4, LH * 0.72); ctx.clip();
            ctx.fillText(k.w, xx, yy - sw2 * LH * 0.6);
            ctx.fillText(s.w, xx, yy + (1 - sw2) * LH * 0.6);
            ctx.restore();
          } else ctx.fillText(k.w, xx, yy);
        });
      });
      y += bh; n++;
    }
    ctx.restore();
  }

  const go = document.getElementById('md-go');
  function press() { go.classList.add('is-press'); go.style.transform = 'translateY(2px)'; setTimeout(() => { go.style.transform = ''; }, 170); }
  go.addEventListener('click', () => { press(); resolveNext(); });
  cv.addEventListener('pointerdown', (e) => {
    const r = cv.getBoundingClientRect(), py = e.clientY - r.top;
    const b = blocks.find((b) => py >= b.y0 && py <= b.y1);
    if (b && b.l.start === null) b.l.start = reduce ? -1e9 : performance.now(); else resolveNext();
  });

  let wipeDir = 0, last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(50, now - last) / 1000; last = now;
    const left = conflicts().filter((l) => l.start === null).length;
    setSub(left === 3 ? '3 conflicts in homepage copy' : left ? `${left} conflict${left > 1 ? 's' : ''} left` : 'All merged, ready to ship');
    if (wipeDir) {
      wipe = clamp(wipe + wipeDir * dt / 0.5, 0, 1);
      if (wipe === 0 && wipeDir < 0) { plan(); wipeDir = 1; }
      else if (wipe === 1 && wipeDir > 0) wipeDir = 0;
    }
    draw(now);
  }
  requestAnimationFrame(frame);
  return {
    resolveNext, press, go,
    left: () => conflicts().filter((l) => l.start === null).length,
    restart() { wipeDir = -1; if (reduce) { plan(); wipe = 1; wipeDir = 0; conflicts()[0].start = -1e9; } },
    still() { conflicts()[0].start = -1e9; },
  };
})();
</script>
<script>
  QM.split(Merge.go, { arrow: true });
  QM.demo({
    kind: 'play', dur: 9400, hold: 1000, lead: 400,
    reset() { Merge.restart(); },
    async play() {
      if (QM.reduced) { Merge.still(); return; }
      QM.ghostShow();
      const b = Merge.go.getBoundingClientRect();
      await QM.ghostTo(b.left + b.width * 0.55, b.top + b.height * 0.6, 900);
      for (let i = 0; i < 3; i++) {
        await QM.wait(i ? 1600 : 300);
        Merge.press(); Merge.resolveNext();
      }
      await QM.wait(2600);
      QM.ghostTo(innerWidth * 0.84, innerHeight * 0.86, 700);
    },
  });
</script>
</body>
</html>
