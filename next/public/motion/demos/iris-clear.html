/* Iris clear. Every card has springs for x, y, press and iris radius; all are critically damped and start from the value on screen, so nothing jumps and nothing bounces.
   Coordinates are board pixels (the board may be drawn scaled: the pointer is divided by the scale). One layout pass sets every target, in reading order, from the cards still present.
   A card that has been cleared holds its slot until its iris passes half-way; then the others reflow. */
const IC = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = 2 * Math.PI, R = (s) => TAU / s;                                 // a response in seconds as an angular frequency
  const OMI = R(0.28), OMM = R(0.4), OML = R(0.3), OMP = R(0.1), OMR = R(0.2), OMK = R(0.26), OMV = R(0.34), OMW = R(0.22);
  const W = 224, H = 156, GX = 16, GY = 16, X0 = 28, Y0 = 72, COLS = 3, BW = 760, BH = 464;   // card, gaps, where the grid starts, the board
  const PADX = 40, REACH = 30;                                                 // the clip wrapper's margin; how far a card's shadow is seen
  const STAG = 30, TOL = 8, UNDO_MS = 5000, RING = 1 / 3, BELOW = 6, LEAD = 10, ROOM = 12;  // ms between movers; px before a press is a drag; how long Undo is on offer; ring while r < a third of its start; px a mover may sit over a card that stays; px before it clears one that the rise may start; px of overlap that still counts as room
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const $ = (id) => document.getElementById('ic-' + id);
  const fit = $('fit'), board = $('board'), list = $('list'), num = $('num'), strip = $('strip'), empty = $('empty'), again = $('again'), pill = $('pill'), undoBtn = $('undo'), msg = $('msg');

  /* a spring, critically damped: x(t) = T + (A + B·t)·e^(−ωt). It always starts from the x and v on screen, and never overshoots. */
  const mk = (x = 0) => ({ x, v: 0, T: x, w: OMM, on: false, hold: null });
  function step(s, dt, eps, veps) {
    if (!s.on) return false;
    if (s.hold) return true;                                                  // a held spring waits at rest until its condition is met
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.T + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;

    snap() { return C.map((c) => ({ i: c.i, name: c.name, state: c.state, slot: c.slot, x: c.x.x, y: c.y.x, tx: c.x.T, ty: c.y.T, xon: c.x.on, yon: c.y.on, pend: !!c.pend, r: c.ir.x, R0: c.R0, half: c.half, held: !!(c.x.hold || c.y.hold), pr: c.pr.x })); },
    el: { list, board, pill, undoBtn, again, num, empty },
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('ic-fit');
  // the board is drawn at 760 × 464 and scaled to the room it is given (1 in the 800 × 500 tile, 1.6 at most)
  function size() {
    const W = innerWidth, H = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 18 : Math.min(48, Math.max(24, 0.04 * Math.min(W, H))), ui = tile ? 0 : 46;
    const s = Math.max(0.4, Math.min(0.97 * W / 760, (H - 2 * pad - ui) / 464, 1.6));
    fit.style.setProperty('--s', s.toFixed(4));
    IC.measure();
  }
  size();
  addEventListener('resize', size);

  /* the ghost: a hand that drives the same press, move and release the pointer does */
  let epoch = 0, resumeT = 0, gp = { x: 380, y: 232 };
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const put = () => { const c = IC.client(gp.x, gp.y); QM.ghostAt(c.x, c.y); return c; };
  async function glide(my, bx, by, ms) {
    const x0 = gp.x, y0 = gp.y, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), e = mv(p);
      gp = { x: x0 + (bx - x0) * e, y: y0 + (by - y0) * e };
      put();
      if (p >= 1) break;
    }
  }
  const calm = async (my, ms = 2500) => { const t0 = performance.now(); await gap(my, 120); while (!IC.settled() && performance.now() - t0 < ms) await gap(my, 60); };
  // a tap: glide to a point, press, hold a beat so the 0.97 shows, release. If the card there is already closing, try again a moment later
  async function tap(my, bx, by, travel = 560, hold = 120) {
    await glide(my, bx, by, travel);
    for (let k = 0; k < 6; k++) {
      await gap(my, k ? 140 : 100);
      const c = IC.client(bx, by);
      if (IC.down(IC.hit(c.x, c.y), c.x, c.y, true)) { await gap(my, hold); IC.up(c.x, c.y); return true; }
    }
    return false;
  }
  async function pressPill(my, which) {
    const p = which === 'again' ? IC.againPt() : IC.pillPt();
    await glide(my, p.x, p.y, 520);
    const b = which === 'again' ? IC.el.again : IC.el.undoBtn;
    b.classList.add('is-hot'); await gap(my, 150);
    b.classList.add('is-press'); await gap(my, 110);
    b.classList.remove('is-press', 'is-hot');
    if (which === 'again') IC.refill(); else IC.undo();
  }

  async function script() {
    const my = ++epoch;
    try {
      await gap(my, QM.tile ? 5000 : 1800);
      QM.ghostShow();
      for (let round = 0; ; round++) {
        if (IC.posed) {                                                      // the world was held two thirds through the first clear: let it finish
          gp = { x: 136 + 508, y: 114 + 244 }; put();
          IC.resume(); await gap(my, 200);
        } else {                                                             // from six whole cards: the Renew card, near its lower right
          IC.home(); await gap(my, 300);
          const e = IC.pt(5, 0.78, 0.76);
          await tap(my, e.x, e.y, 800);
        }
        await calm(my);
        let q = IC.pt(0, 0.1, 0.13);                                         // a corner of the first card
        await tap(my, q.x, q.y, 520);
        await gap(my, 380);
        q = IC.pt(1, 0.5, 0.5);                                              // the centre of the second
        await tap(my, q.x, q.y, 480);
        await gap(my, 380);
        q = IC.pt(2, 0.97, 0.52);                                            // an edge of the third
        await tap(my, q.x, q.y, 480);
        await calm(my); await gap(my, 250);
        await pressPill(my, 'undo');                                         // Undo once: the others make room, the iris opens from the edge
        await calm(my); await gap(my, 400);
        q = IC.pt(0, 0.5, 0.5);                                              // the rest, one after another
        for (let n = 0; n < 3; n++) {
          await tap(my, q.x, q.y, n ? 240 : 520, 90);
          await gap(my, 220);
        }
        await gap(my, 2500);                                                 // All clear
        await pressPill(my, 'again');                                        // Start over: six irises from the cards' centres
        await gap(my, 1900);
      }
    } catch (e) { /* cancelled */ } finally { if (my !== epoch) IC.letgo(); }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const idle = () => IC.held || IC.el.board.matches(':hover');
    const touch = () => {
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) { IC.home(); script(); } else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') touch(); }, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch());
  }
  const park = () => { if (reduced || !IC.posed) return; gp = { x: 136 + 508, y: 114 + 244 }; put(); QM.ghostShow(); };
  QM.demo({ kind: 'loop', restart() { stopScript(); IC.home(); if (!reduced && (QM.tile || QM.live)) { IC.pose(); park(); } if (!reduced) script(); } });
  if (!reduced && (QM.tile || QM.live)) IC.pose();
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { park(); script(); }, 300));
})();
</script>
</body>
</html>
