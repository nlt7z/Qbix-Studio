<script data-code>
/* Passkey sign-in. The state is one attribute (idle, scan, ok) plus a morph class; the scan is one progress value p that
   draws the ring and the five strokes together, so cancelling is just running p backwards from wherever it is. */
const pk = document.getElementById('pk'), pkBtn = document.getElementById('pk-btn'), pkIn = document.getElementById('pk-in');
const pkRing = document.getElementById('pk-ring'), pkArcs = Array.from(document.querySelectorAll('#pk-gl path'));
const pkCancel = document.getElementById('pk-cancel'), pkOut = document.getElementById('pk-out'), pkLive = document.getElementById('pk-live');
const pkHint = document.getElementById('pk-hint'), pkT2 = document.getElementById('pk-t2'), pkT1 = document.getElementById('pk-t1');
const pkReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PK_SCAN = 900, PK_BACK = 600, PK_LEAD = 380;
let pkP = 0, pkRaf = 0, pkState = 'idle', pkHintT = 0, pkLead = 0;

const pkOutCubic = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
function pkPaint(p) {                               // the ring and the strokes, from centre outward
  pkP = p;
  pkRing.style.strokeDashoffset = (1 - p).toFixed(4);
  pkArcs.forEach((a, i) => { a.style.strokeDashoffset = (1 - pkOutCubic((p - i * 0.14) / 0.4)).toFixed(4); });
}
function pkRun(to, ms, done) {                      // from wherever p is now; to 1 is forward, to 0 is back
  cancelAnimationFrame(pkRaf);
  const from = pkP, t0 = performance.now();
  if (!ms) { pkPaint(to); if (done) done(); return; }
  const dur = ms * Math.abs(to - from);
  const step = (now) => {
    const k = dur ? Math.min(1, (now - t0) / dur) : 1;
    pkPaint(from + (to - from) * k);
    if (k < 1) pkRaf = requestAnimationFrame(step); else if (done) done();
  };
  pkRaf = requestAnimationFrame(step);
}
function pkName() {                                 // the name before the @, capitalised
  const n = (pkIn.value.split('@')[0] || '').trim().split(/[._-]/)[0];
  return n ? n[0].toUpperCase() + n.slice(1) : '';
}
function pkSet(s) {
  pkState = s;
  pk.dataset.s = s;
  pkCancel.inert = s !== 'scan';
  pkOut.inert = s !== 'ok';
  pkBtn.setAttribute('aria-disabled', String(s === 'ok'));
  pkBtn.setAttribute('aria-label', s === 'scan' ? 'Scanning passkey. Press to cancel' : s === 'ok' ? 'Signed in' : 'Sign in with passkey');
  pkIn.readOnly = s !== 'idle';
}
function pkStart() {
  if (!/.+@.+/.test(pkIn.value.trim())) {            // no email: ask for one instead of scanning
    pkIn.setAttribute('aria-invalid', 'true'); pkIn.focus({ preventScroll: true });
    pkHint.textContent = 'Add your email first.'; pkLive.textContent = 'Add your email first.';
    clearTimeout(pkHintT); pkHintT = setTimeout(() => { pkHint.textContent = 'Your passkey stays on this device.'; pkIn.removeAttribute('aria-invalid'); }, 2200);
    return;
  }
  pkIn.removeAttribute('aria-invalid');
  const name = pkName();
  pkT2.textContent = name ? 'Welcome back, ' + name : 'Welcome back';
  pkSet('scan'); pk.classList.add('m');
  pkLive.textContent = 'Scanning your passkey. Touch your sensor.';
  clearTimeout(pkLead);                             // the scan starts once the pill has become the circle
  pkLead = setTimeout(() => pkRun(1, pkReduced ? 0 : PK_SCAN, () => {
    pkSet('ok'); pkLive.textContent = pkT2.textContent + '. Signed in.';
  }), pkReduced ? 0 : PK_LEAD);
}
function pkAbort() {                                // cancel: run p back, then widen into the pill
  if (pkState !== 'scan') return;
  const had = pk.contains(document.activeElement);
  clearTimeout(pkLead);
  pkSet('idle'); pkLive.textContent = 'Passkey sign-in cancelled.';
  pkRun(0, pkReduced ? 0 : PK_BACK, () => pk.classList.remove('m'));
  if (had) pkBtn.focus({ preventScroll: true });          // the Cancel link goes inert, so keyboard focus moves to the button
}
function pkSignOut(instant) {                       // the disc closes, the circle widens to the pill
  if (instant) pk.classList.add('still');
  cancelAnimationFrame(pkRaf); clearTimeout(pkLead);
  pkSet('idle'); pkLive.textContent = instant ? '' : 'Signed out.';
  pkRun(0, 0);
  pk.classList.remove('m');
  if (instant) { pk.getBoundingClientRect(); pk.classList.remove('still'); }
}
function pkRestOk() {                               // reduced motion: rests signed in
  pk.classList.add('still', 'm');
  pkT2.textContent = 'Welcome back, ' + (pkName() || 'Dana');
  pkPaint(1); pkSet('ok');
  pk.getBoundingClientRect(); pk.classList.remove('still');
}
pkBtn.addEventListener('click', () => { if (pkState === 'idle') pkStart(); else if (pkState === 'scan') pkAbort(); });
pkCancel.addEventListener('click', pkAbort);
pkOut.addEventListener('click', () => { const had = document.activeElement === pkOut; pkSignOut(); if (had) pkBtn.focus({ preventScroll: true }); });
pk.addEventListener('keydown', (e) => { if (e.key === 'Escape') pkAbort(); });
pkPaint(0);
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function go(my, el, fx = 0.5, fy = 0.58, ms = 760) {
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * fx, r.top + r.height * fy, ms))) throw 0;
    if (my !== epoch) throw 0;
  }
  async function tap(my, el, fx = 0.5) {
    await go(my, el, fx);
    el.classList.add('is-hot');
    await gap(my, 160);
    el.style.transform = 'translateY(1px)';
    await gap(my, 110);
    el.style.transform = '';
    el.classList.remove('is-hot');
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }
  async function aside(my, el, dx, dy) {              // step off the control so the ghost never sits on the glyph
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width / 2 + dx, r.top + r.height / 2 + dy, 520))) throw 0;
    if (my !== epoch) throw 0;
  }
  function rest() {                                   // the form at rest; reduced motion rests signed in
    pkIn.value = 'dana@kova.app';
    if (reduced) pkRestOk(); else pkSignOut(true);
    if (document.activeElement && pk.contains(document.activeElement)) document.activeElement.blur();
  }
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      for (;;) {
        await gap(my, 900);
        await tap(my, pkBtn, 0.5);                    // sign in, then step aside while it scans
        await aside(my, pkBtn, 112, -2);
        await gap(my, 2100);                          // scan, welcome, a moment to read it
        await tap(my, pkOut, 0.5);                    // sign out, the card glides back
        await aside(my, pkOut, 90, 40);
        await gap(my, 1500);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); [pkBtn, pkOut].forEach((b) => b.classList.remove('is-hot')); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!pk.matches(':hover') && !pk.contains(document.activeElement)) { rest(); script(); } else { touch({}); } }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true, capture: true });
    addEventListener('pointerdown', touch, { passive: true, capture: true });
    addEventListener('keydown', () => touch({}), true);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); rest(); if (!reduced) script(); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (reduced) rest(); else script(); }, 300));
})();
</script>
