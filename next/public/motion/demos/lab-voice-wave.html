<script data-code>
/* Voice note: record bars live, resample to a fixed count on stop, seek by dragging. */
function voiceNote(root) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = root.querySelector('canvas'), ctx = cv.getContext('2d');
  const mainB = root.querySelector('#vn-main'), redo = root.querySelector('#vn-redo'), timeEl = root.querySelector('#vn-time'), stateEl = root.querySelector('#vn-state');
  const ic = { mic: root.querySelector('#icMic'), stop: root.querySelector('#icStop'), play: root.querySelector('#icPlay'), pause: root.querySelector('#icPause') };
  const INK = '#0B0C0D', INK_DIM = 'rgba(11,12,13,0.26)';
  let dpr = 1, CW = 0, CH = 0, pitch = 7, bw = 3.6;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1); const r = cv.getBoundingClientRect(); CW = r.width; CH = r.height;
    cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
    pitch = CW < 420 ? 6 : 7; bw = pitch * 0.52;
    if (mode === 'review' || mode === 'play') layoutFinal(false);
  }
  // synthetic speech: seeded words, each a swell with a flutter inside
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const words = []; (() => { let t = 0.12; while (t < 60) { const d = 0.16 + rnd() * 0.42; words.push([t, t + d, 0.45 + rnd() * 0.55, rnd() * 6]); t += d + 0.05 + rnd() * 0.22 + (rnd() < 0.18 ? 0.35 : 0); } })();
  function amp(t) {
    for (const w of words) { if (t < w[0]) break; if (t <= w[1]) { const u = (t - w[0]) / (w[1] - w[0]); return Math.min(1, 0.06 + w[2] * Math.pow(Math.sin(Math.PI * u), 0.7) * (0.62 + 0.38 * Math.abs(Math.sin(t * 15 + w[3])))); } }
    return 0.05 + 0.04 * Math.abs(Math.sin(t * 23));
  }
  let mode = 'idle', recT0 = 0, recDur = 0, samples = [], bars = [], collapseT = 0, prog = 0, scrub = false;
  const STEP = 0.075, now = () => performance.now() / 1000;
  const fmt = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const showIcon = (n) => { for (const k in ic) ic[k].classList.toggle('hide', k !== n); };
  function setMode(m) {
    mode = m;
    if (m === 'idle') { showIcon('mic'); redo.classList.add('hide'); stateEl.textContent = 'Tap to record'; samples = []; bars = []; timeEl.textContent = '0:00'; mainB.setAttribute('aria-label', 'Record'); }
    if (m === 'rec') { showIcon('stop'); redo.classList.add('hide'); stateEl.textContent = 'Recording'; recT0 = now(); samples = []; mainB.setAttribute('aria-label', 'Stop'); }
    if (m === 'review') { showIcon('play'); redo.classList.remove('hide'); stateEl.textContent = ''; mainB.setAttribute('aria-label', 'Play'); }
    if (m === 'play') { showIcon('pause'); redo.classList.remove('hide'); stateEl.textContent = ''; if (prog >= 0.999) prog = 0; mainB.setAttribute('aria-label', 'Pause'); }
  }
  const liveX = (i, n) => { const cap = Math.floor(CW / pitch) - 1, off = Math.max(0, n - cap); return (i - off) * pitch + pitch / 2; };
  function layoutFinal(animate) {   // one bar per bucket of samples, keeping the peak
    const M = Math.max(8, Math.floor(CW / pitch)), n = samples.length, nf = recDur / STEP, out = [];
    for (let j = 0; j < M; j++) {
      const a = Math.floor((j * n) / M), b = Math.max(a + 1, Math.floor(((j + 1) * n) / M));
      let m = 0, sx = 0;
      for (let i = a; i < b && i < n; i++) { m = Math.max(m, samples[i]); sx += liveX(i, nf); }
      const fx = sx / Math.max(1, Math.min(b, n) - a);
      out.push({ x0: animate ? fx : j * pitch + pitch / 2, h0: m, x1: j * pitch + pitch / 2, h1: Math.max(0.08, m), d: j * 0.006 });
    }
    bars = out; collapseT = animate ? now() : -9;
  }
  function stopRec() {
    recDur = Math.max(0.6, now() - recT0);
    if (samples.length < 4) { setMode('idle'); return; }
    layoutFinal(!reduce); prog = 0; setMode('review'); timeEl.textContent = fmt(recDur);
  }
  function press() {
    mainB.classList.add('pressed'); setTimeout(() => mainB.classList.remove('pressed'), 140);
    if (mode === 'idle') setMode('rec'); else if (mode === 'rec') stopRec(); else if (mode === 'review') setMode('play'); else if (mode === 'play') setMode('review');
  }
  const ease = (u) => { u = Math.min(1, Math.max(0, u)); return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
  const bar = (x, h, mid) => ctx.rect(x - bw / 2, mid - h / 2, bw, h);
  function draw(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, CW, CH);
    const mid = CH / 2, maxH = CH - 4;
    if (mode === 'idle') {
      ctx.fillStyle = INK_DIM; ctx.beginPath();
      for (let j = 0; j < Math.floor(CW / pitch); j++) bar(j * pitch + pitch / 2, reduce ? 2 : 2 + 1.5 * Math.sin(t * 2 + j * 0.35), mid);
      ctx.fill(); return;
    }
    if (mode === 'rec') {
      const n = samples.length, nf = (t - recT0) / STEP, cap = Math.floor(CW / pitch);
      ctx.fillStyle = INK; ctx.beginPath();
      for (let i = Math.max(0, n - cap - 2); i < n; i++) {
        const age = t - recT0 - i * STEP, g = reduce ? 1 : Math.min(1, age / 0.22), gg = 1 - Math.pow(1 - g, 3), x = liveX(i, nf);
        if (x < -pitch) continue;
        bar(x, Math.max(2, samples[i] * maxH * gg), mid);
      }
      ctx.fill();
      const lx = liveX(n, nf);
      if (lx < CW) { ctx.fillStyle = INK_DIM; ctx.beginPath(); for (let x = lx + pitch; x < CW; x += pitch) bar(x, 2, mid); ctx.fill(); }
      return;
    }
    const px = prog * CW, ct = t - collapseT, done = [], todo = [];
    for (const b of bars) {
      const e = ease((ct - b.d) / 0.65), x = b.x0 + (b.x1 - b.x0) * e;
      let h = (b.h0 + (b.h1 - b.h0) * e) * maxH;
      if (scrub) { const d = (x - px) / (pitch * 3.2); h *= 1 + 0.35 * Math.exp(-d * d); }
      h = Math.min(CH, Math.max(2, h));
      (x <= px ? done : todo).push([x, h]);
    }
    ctx.fillStyle = INK; ctx.beginPath(); for (const [x, h] of done) bar(x, h, mid); ctx.fill();
    ctx.fillStyle = INK_DIM; ctx.beginPath(); for (const [x, h] of todo) bar(x, h, mid); ctx.fill();
    if (prog > 0 || scrub) { ctx.fillStyle = INK; ctx.fillRect(px - 1, 0, 2, CH); }   // the playhead
  }
  let last = now();
  (function frame() {
    requestAnimationFrame(frame);
    const t = now(), dt = Math.min(0.05, t - last); last = t;
    if (mode === 'rec') { const el = t - recT0; while (samples.length * STEP < el) samples.push(amp(samples.length * STEP)); timeEl.textContent = fmt(el); if (el > 14) stopRec(); }
    if (mode === 'play' && !scrub) { prog += dt / recDur; if (prog >= 1) { prog = 1; setMode('review'); } }
    if (mode === 'review' || mode === 'play') timeEl.textContent = fmt(prog * recDur) + ' / ' + fmt(recDur);
    draw(t);
  })();
  mainB.addEventListener('click', () => { if (!api.scripted) press(); });
  redo.addEventListener('click', () => { prog = 0; setMode('idle'); });
  const scrubTo = (x) => { prog = Math.min(1, Math.max(0, x / CW)); };
  cv.addEventListener('pointerdown', (e) => { if (mode !== 'review' && mode !== 'play') return; scrub = true; cv.setPointerCapture(e.pointerId); scrubTo(e.clientX - cv.getBoundingClientRect().left); });
  cv.addEventListener('pointermove', (e) => { cv.style.cursor = mode === 'review' || mode === 'play' ? 'ew-resize' : 'default'; if (scrub) scrubTo(e.clientX - cv.getBoundingClientRect().left); });
  const endScrub = () => { scrub = false; };
  cv.addEventListener('pointerup', endScrub); cv.addEventListener('pointercancel', endScrub);
  addEventListener('resize', resize);
  setMode('idle'); resize();
  if (reduce) { for (let i = 0; i < 90; i++) samples.push(amp(i * STEP)); recDur = 90 * STEP; layoutFinal(false); prog = 0.42; setMode('review'); }
  const api = {
    press, redo: () => redo.click(), get mode() { return mode; }, get prog() { return prog; }, set prog(v) { prog = v; },
    set scrub(v) { scrub = v; }, get samples() { return samples.length; },
    btn: () => mainB, redoBtn: () => redo, canvas: () => cv, scripted: false,
  };
  return api;
}
const vn = voiceNote(document.getElementById('vn'));
</script>
<script>
  /* the ghost's story: tap record, talk for 3.6 s, stop, play, seek along the wave, record again */
  let gen = 0, lastReal = -1e9;
  ['pointerdown', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, (e) => { if (e.isTrusted) { lastReal = performance.now(); gen++; QM.ghostHide(); vn.scripted = false; vn.scrub = false; } }, true));
  const ctr = (el, fx = 0.55, fy = 0.6) => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
  const guard = (g) => { if (g !== gen) throw 0; };
  async function glide(x, y, ms, g) { QM.ghostShow(); const ok = await QM.ghostTo(x, y, ms, QM.tokenless); guard(g); }
  async function script(g) {
    vn.scripted = true; QM.ghostShow();
    if (vn.mode === 'rec') { await QM.ghostTo(...ctr(vn.btn()), 700); guard(g); vn.press(); await QM.wait(900); guard(g); }
    if (vn.mode === 'review' || vn.mode === 'play') { await QM.ghostTo(...ctr(vn.redoBtn()), 800); guard(g); vn.redo(); await QM.wait(700); guard(g); }
    await QM.ghostTo(...ctr(vn.btn()), 700); guard(g); await QM.wait(150); vn.press();
    await QM.wait(3600); guard(g);
    await QM.ghostTo(...ctr(vn.btn()), 300); guard(g); vn.press();
    await QM.wait(1300); guard(g); vn.press(); await QM.wait(1700); guard(g);
    const cvr = vn.canvas().getBoundingClientRect(), y = cvr.top + cvr.height * 0.55;
    await QM.ghostTo(cvr.left + vn.prog * cvr.width, y, 700); guard(g);
    vn.scrub = true;
    for (const u of [0.78, 0.35, 0.6]) {
      const x0 = cvr.left + vn.prog * cvr.width, tx = cvr.left + u * cvr.width, t0 = performance.now();
      while (performance.now() - t0 < 900) { guard(g); const k = Math.min(1, (performance.now() - t0) / 900), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, x = x0 + (tx - x0) * e; QM.ghostAt(x, y); vn.prog = (x - cvr.left) / cvr.width; await QM.wait(16); }
      await QM.wait(200);
    }
    vn.scrub = false;
    await QM.ghostTo(innerWidth * 0.8, innerHeight * 0.9, 700); guard(g);
    while (vn.mode === 'play') { await QM.wait(200); guard(g); }
    await QM.wait(1400); guard(g);
    vn.scripted = false;
  }
  async function idleLoop() {
    for (;;) {
      await QM.wait(300);
      if (QM.reduced || document.hidden || performance.now() - lastReal < 2500) continue;
      const g = gen;
      try { await script(g); } catch (e) { /* real input took over */ }
      vn.scripted = false;
    }
  }
  QM.demo({ kind: 'loop', restart() {} });
  idleLoop();
</script>
