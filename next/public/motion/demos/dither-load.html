/* Dither load. ditherLoad(canvas, image) reads the picture's luminance once, builds a 1-bit ordered-dither mask for each cell size,
   and returns draw(ms): the whole load as a pure function of time, so it plays, scrubs and rests on any frame. */
function ditherLoad(canvas, image, o = {}) {
  const W = canvas.width, H = canvas.height, N = W * H;
  const INK = o.ink || 0xFF0D0C0B, FIELD = o.field || 0xFFFFFFFF;            // ABGR: #0B0C0D and white
  const STEPS = o.steps || [[0, 520, 8], [380, 420, 4], [760, 380, 2], [1100, 340, 1]]; // [start ms, sweep ms, cell px]
  const DISSOLVE = o.dissolve || [1300, 500];
  const TOTAL = DISSOLVE[0] + DISSOLVE[1], BAND = 16;
  const ease = bez(0.45, 0, 0.25, 1);                                         // the kit's ease-soft

  // Bayer 8 x 8, thresholds 0..1
  let m = [[0]];
  for (let n = 1; n < 8; n *= 2) {
    const k = m.length, next = [];
    for (let y = 0; y < 2 * k; y++) { next.push([]); for (let x = 0; x < 2 * k; x++) next[y][x] = 4 * m[y % k][x % k] + [[0, 2], [3, 1]][(y / k) | 0][(x / k) | 0]; }
    m = next;
  }
  const B = (x, y) => (m[y & 7][x & 7] + 0.5) / 64;

  // luminance, through a tone curve: pale ground goes to the field, the dark folds to solid ink
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H;
  const g = c2.getContext('2d', { willReadFrequently: true });
  g.drawImage(image, 0, 0, W, H);
  const px = g.getImageData(0, 0, W, H).data, dark = new Float32Array(N);
  for (let i = 0; i < N; i++) dark[i] = Math.pow(Math.min(1, Math.max(0, (1 - px[i * 4] / 255 - (o.lo ?? 0.2)) / (o.span ?? 0.72))), o.gamma ?? 1.45);

  // one ink mask per cell size: the cell's mean darkness against the matrix at the cell's own index
  const masks = STEPS.map(([, , k]) => {
    const out = new Uint8Array(N);
    for (let cy = 0; cy * k < H; cy++) for (let cx = 0; cx * k < W; cx++) {
      let sum = 0, cnt = 0;
      for (let y = cy * k; y < Math.min(H, cy * k + k); y++) for (let x = cx * k; x < Math.min(W, cx * k + k); x++) { sum += dark[y * W + x]; cnt++; }
      const ink = sum / cnt > B(cx, cy) ? 1 : 0;
      for (let y = cy * k; y < Math.min(H, cy * k + k); y++) for (let x = cx * k; x < Math.min(W, cx * k + k); x++) out[y * W + x] = ink;
    }
    return out;
  });
  // per pixel: the jitter that roughens a front, and the order in which the resolve clears it
  const jit = new Float32Array(N), key = new Float32Array(N);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    jit[y * W + x] = B(x, y) * BAND;
    key[y * W + x] = 0.78 * B(x >> 2, y >> 2) + 0.22 * (y / H);
  }

  const ctx = canvas.getContext('2d'), frame = ctx.createImageData(W, H), buf = new Uint32Array(frame.data.buffer);
  function draw(ms) {
    const fronts = STEPS.map(([at, dur]) => ease((ms - at) / dur) * (H + BAND));
    const q = ms > DISSOLVE[0] ? ease((ms - DISSOLVE[0]) / DISSOLVE[1]) : -1;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (q > key[i]) { buf[i] = 0; continue; }                               // cleared: the picture shows through
      let s = STEPS.length - 1;
      while (s >= 0 && y + jit[i] > fronts[s]) s--;
      buf[i] = s >= 0 && masks[s][i] ? INK : FIELD;
    }
    ctx.putImageData(frame, 0, 0);
    // how many steps have started, for the readout
    let n = 0;
    for (const [at] of STEPS) if (ms >= at && ms > 0) n++;
    return { step: n, done: ms >= TOTAL };
  }
  return { draw, total: TOTAL };

  function bez(x1, y1, x2, y2) {                                              // cubic-bezier(x1, y1, x2, y2) as a function
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return (x) => {
      if (x <= 0) return 0;
      if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = ((ax * t + bx) * t + cx) * t - x, d = (3 * ax * t + 2 * bx) * t + cx; if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
      return ((ay * t + by) * t + cy) * t;
    };
  }
}

/* The tile: plays on load and again on a click. Anything that sets the time (a clock, a scrubber) just calls show(ms). */
const dl = document.getElementById('dl'), dlCv = document.getElementById('dl-cv');
let dlEng = null, dlRaf = 0, dlT0 = 0;
function dlShow(ms) {
  if (!dlEng) return;
  const r = dlEng.draw(ms);
  dlCv.hidden = r.done;
  dl.classList.toggle('is-done', r.done);
  dl.querySelector('.dl-roll b').style.setProperty('--n', r.step);
  document.getElementById('dl-w').textContent = r.done ? 'Loaded' : 'Loading';
}
function dlStop() { cancelAnimationFrame(dlRaf); dlRaf = 0; }
function dlPlay() {
  dlStop();
  if (!dlEng) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { dlShow(dlEng.total); return; }
  dlT0 = performance.now();
  const tick = (now) => {
    const ms = Math.min(dlEng.total, now - dlT0);
    dlShow(ms);
    dlRaf = ms < dlEng.total ? requestAnimationFrame(tick) : 0;
  };
  dlRaf = requestAnimationFrame(tick);
}
function dlRest() { dlStop(); dlShow(matchMedia('(prefers-reduced-motion: reduce)').matches && dlEng ? dlEng.total : 0); }
</script>

    seekPlay(v) { dlStop(); dlShow(Math.max(0, Math.min(1, v)) * (dlEng ? dlEng.total : 1800)); },
  });
  ready.then(() => {
    dlEng = ditherLoad(dlCv, src);
    dlRest();
  });
})();
</script>
