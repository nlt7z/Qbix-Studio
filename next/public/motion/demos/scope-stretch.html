<script data-code>
/* Scope stretch. One number drives everything: the shown total chases the target, and widths, counts, ruler and lime are read from it. */
const Scope = (() => {
  const sc = document.getElementById('sc'), row = document.getElementById('sc-row'), handle = document.getElementById('sc-handle');
  const ruler = document.getElementById('sc-ruler');
  const U = 50, GAP = 8, MIN = 5, MAX = 10;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const NAMES = ['Discovery', 'Identity', 'Website', 'Launch'];
  const WEEKS = { 5: [1, 2, 1, 1], 6: [1, 2, 2, 1], 7: [2, 2, 2, 1], 8: [2, 3, 2, 1], 9: [2, 3, 3, 1], 10: [2, 3, 3, 2] };
  const START = new Date(2026, 10, 9); // Kova starts Monday 9 Nov
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dateOf = (w) => { const d = new Date(START.getTime() + w * 7 * 864e5); return d.getDate() + ' ' + MON[d.getMonth()]; };

  const EXPO = 'cubic-bezier(.16, 1, .3, 1)';
  function roll(slot, text, instant) {
    const old = slot.lastElementChild;
    if (old && old.textContent === text) return;
    const n = document.createElement('span'); n.textContent = text; slot.appendChild(n);
    const w = n.offsetWidth;
    if (!old || instant || still) { if (!slot.hasAttribute('data-fixed')) slot.style.width = w + 'px'; if (old) slot.removeChild(old); return; }
    const dir = parseFloat(text) >= parseFloat(old.textContent) ? 1 : -1;
    if (!slot.hasAttribute('data-fixed')) slot.style.width = w + 'px';
    old.animate([{ transform: 'none' }, { transform: `translateY(${-110 * dir}%)` }], { duration: 260, easing: EXPO, fill: 'forwards' }).onfinish = () => old.remove();
    n.animate([{ transform: `translateY(${110 * dir}%)` }, { transform: 'none' }], { duration: 260, easing: EXPO });
  }

  // the phase blocks and the ruler
  const ph = NAMES.map((name) => {
    const el = document.createElement('div'); el.className = 'sc-ph';
    el.innerHTML = '<span class="sc-n"><span class="sc-roll"></span></span><span class="sc-name">' + name + '</span>';
    row.insertBefore(el, handle);
    return { el, slot: el.querySelector('.sc-roll'), shown: '' };
  });
  const ticks = [];
  for (let i = 1; i <= MAX; i++) {
    const t = document.createElement('div'); t.className = 'sc-tk'; t.style.left = i * U - GAP / 2 + 'px';
    t.innerHTML = '<b>' + i + '</b>'; ruler.appendChild(t); ticks.push(t);
  }
  const tot = document.getElementById('sc-total'), date = document.getElementById('sc-date');

  let target = 7, shown = 7, last = 0, raf = 0, down = false;
  function draw(w, instant) {
    const lo = Math.max(MIN, Math.min(MAX - 1, Math.floor(w))), f = Math.min(1, Math.max(0, w - lo));
    let x = 0;
    ph.forEach((p, i) => {
      const wk = WEEKS[lo][i] + (WEEKS[lo + 1][i] - WEEKS[lo][i]) * f;
      const wd = Math.max(1, wk * U - GAP);
      p.el.style.transform = `translateX(${x.toFixed(2)}px)`; p.el.style.width = wd.toFixed(2) + 'px';
      x += wk * U;
    });
    handle.style.transform = `translateX(${x.toFixed(2)}px)`;
    const wr = Math.round(w), t = WEEKS[wr];
    ph.forEach((p, i) => roll(p.slot, String(t[i]), instant));
    roll(tot, String(wr), instant); roll(date, dateOf(wr), instant);
    ticks.forEach((tk, i) => tk.classList.toggle('is-on', i + 1 <= w + 0.02));
    ph[3].el.classList.toggle('is-lime', wr >= MAX);
    row.setAttribute('aria-valuenow', wr);
  }
  function frame(now) {
    raf = 0;
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000)); last = now;
    let nx = shown + (target - shown) * (1 - Math.exp(-9 * dt));
    if (still || Math.abs(target - nx) < 0.002) nx = target;
    if (nx !== shown) { shown = nx; draw(shown); }
    if (shown !== target) raf = requestAnimationFrame(frame);
  }
  function set(w) {
    w = Math.max(MIN, Math.min(MAX, Math.round(w)));
    if (w === target) return;
    target = w;
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); }
  }
  // The handle's left edge is the row's end: weeks = (pointer x - row left - grab offset) / 50.
  // The ghost holds the handle by its middle (OFF 18); the viewer holds it where they grabbed it.
  const OFF = 18;
  let grab = OFF;
  const scale = () => row.getBoundingClientRect().width / row.offsetWidth;
  function move(cx, cy, ghost) {
    const r = row.getBoundingClientRect();
    if (ghost) hold(true);
    set((cx - r.left - (ghost ? OFF : grab) * scale()) / scale() / U);
  }
  function hold(on) { handle.classList.toggle('is-press', on); }
  function release() { down = false; hold(false); }
  row.addEventListener('pointerdown', (e) => {
    down = true; hold(true);
    const h = handle.getBoundingClientRect();
    // on the handle: keep where it was grabbed; on the row: the handle's middle comes to the pointer
    grab = e.clientX >= h.left && e.clientX <= h.right ? (e.clientX - h.left) / scale() : OFF;
    try { row.setPointerCapture(e.pointerId); } catch (err) { /* synthetic pointer */ }
    move(e.clientX, e.clientY);
    e.preventDefault();
  });
  row.addEventListener('pointermove', (e) => { if (down) move(e.clientX, e.clientY); });
  row.addEventListener('pointerup', release);
  row.addEventListener('pointercancel', release);
  row.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { set(target + 1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { set(target - 1); e.preventDefault(); }
  });
  draw(shown, true);
  return { move, release, row, sc, handle, U, MIN, MAX, get shown() { return shown; } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  // the ghost drags the handle: out to 10 and a dwell, back to 5 and a dwell, then to the middle
  const ez = QM.bezier(0.65, 0, 0.35, 1);
  const LEGS = [ // [weeks the ghost holds, travel s, dwell s]
    [7, 0, 0.6], [10.2, 2.2, 1.9], [5.1, 3.4, 1.4], [8.4, 2.4, 0.8], [6.2, 1.8, 0.8], [9.6, 2.2, 1.6], [7, 2.6, 1.2],
  ];
  const PERIOD = LEGS.reduce((s, l) => s + l[1] + l[2], 0);
  QM.demo({
    kind: 'pointer',
    move: (x, y, ghost) => { if (ghost) Scope.move(x, y, true); },
    leave: () => Scope.release(),
    path(t) {
      const r = Scope.row.getBoundingClientRect(), k = r.width / Scope.row.offsetWidth;
      let u = Math.max(0, t) % PERIOD, w = LEGS[LEGS.length - 1][0];
      let prev = w;
      for (const [to, tr, dw] of LEGS) {
        if (u < tr) { w = prev + (to - prev) * ez(u / tr); break; }
        u -= tr;
        if (u < dw) { w = to; break; }
        u -= dw; prev = to;
      }
      // the ghost holds the handle: x from the row's left, y on the handle's face
      return [r.left + (w * Scope.U + 18) * k, r.top + 80 * k];
    },
  });
</script>
