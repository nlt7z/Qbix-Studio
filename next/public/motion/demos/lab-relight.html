<script src="../kit/stage.js"></script>
<script data-code>
const relight = (() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { alpha: false, antialias: false });
  let setLight = () => {}, pathFn = () => [0, 0];
  if (!gl) return { move() {}, path: () => [0, 0] };
  const VS = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
  const FS = `
precision highp float;
uniform sampler2D u_map;   // rg: normal xy, b: height, a: letter mask
uniform vec2 u_res; uniform float u_dpr, u_hs; uniform vec3 u_light;
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main(){
  vec2 p = vec2(gl_FragCoord.x, u_res.y * u_dpr - gl_FragCoord.y) / u_dpr;
  vec4 m = texture2D(u_map, p / u_res);
  vec2 nxy = m.rg * 2.0 - 1.0;
  vec3 n = normalize(vec3(nxy, sqrt(max(0.0, 1.0 - dot(nxy, nxy)))));
  vec3 P = vec3(p, m.b * u_hs);
  vec3 d = u_light - P; float dist = length(d); vec3 L = d / dist;
  float diff = max(dot(n, L), 0.0);
  float sh = 1.0; float dxy = length(d.xy);
  if (dxy > 1.0){
    vec2 dir = d.xy / dxy;
    float reach = min(dxy, (u_hs - P.z) * dxy / max(d.z, 1.0));
    float jit = hash(gl_FragCoord.yx * 0.73);
    for (int i = 1; i <= 32; i++){
      float s = reach * (float(i) - jit) / 32.0;
      float rz = P.z + d.z * (s / dxy);
      float hq = texture2D(u_map, (P.xy + dir * s) / u_res).b * u_hs;
      sh = min(sh, clamp(7.0 * (rz - hq) / s + 0.15, 0.0, 1.0));
    }
  }
  float R = max(u_res.x, u_res.y) * 0.55;
  float att = 1.0 / (1.0 + (dist * dist) / (R * R));
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0));
  float spec = pow(max(dot(n, H), 0.0), 28.0) * 0.1 * sh;
  // white plaster: the same light, read against a flat panel under it. 1 on flat ground, more where a reed
  // faces the light, 0 in a cast shadow, so the relief reads as a few shades either side of paper
  float zf = u_light.z - 0.07 * u_hs;
  float flatD = max(zf / length(vec3(p - u_light.xy, zf)), 0.06);
  float rel = diff * sh / flatD;
  float relief = 1.0 + 0.16 * (min(rel, 2.0) - 1.0);
  vec3 plaster = mix(vec3(0.957, 0.961, 0.965), vec3(0.72, 1.0, 0.0), m.a);
  vec3 col = plaster * relief * (0.975 + 0.07 * att) + spec * att * 0.5;
  col += (hash(gl_FragCoord.xy) - 0.5) / 255.0;
  gl_FragColor = vec4(col, 1.0);
}`;
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const aLoc = gl.getAttribLocation(prog, 'a'); gl.enableVertexAttribArray(aLoc); gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  const U = {}; ['u_map', 'u_res', 'u_dpr', 'u_hs', 'u_light'].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));
  const tex = gl.createTexture();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, dpr, HS;
  function blur(src, w, h, r) {
    let a = src, b = new Float32Array(w * h);
    for (let pass = 0; pass < 3; pass++) {
      for (let y = 0; y < h; y++) { let acc = 0; const row = y * w;
        for (let x = -r; x <= r; x++) acc += a[row + Math.min(w - 1, Math.max(0, x))];
        for (let x = 0; x < w; x++) { b[row + x] = acc / (2 * r + 1); acc += a[row + Math.min(w - 1, x + r + 1)] - a[row + Math.max(0, x - r)]; } }
      for (let x = 0; x < w; x++) { let acc = 0;
        for (let y = -r; y <= r; y++) acc += b[Math.min(h - 1, Math.max(0, y)) * w + x];
        for (let y = 0; y < h; y++) { a[y * w + x] = acc / (2 * r + 1); acc += b[Math.min(h - 1, y + r + 1) * w + x] - b[Math.max(0, y - r) * w + x]; } }
    }
    return a;
  }
  function build() {
    dpr = Math.min(1.5, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    HS = Math.min(W, H) * 0.06;
    const sc = Math.max(W, H) / 760, w = Math.max(2, Math.round(W / sc)), h = Math.max(2, Math.round(H / sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    x.fillStyle = '#000'; x.fillRect(0, 0, w, h); x.fillStyle = '#fff';
    const FONT = 'Eurostile, Geist, sans-serif';
    x.font = `400 100px ${FONT}`;
    const one = x.measureText('qbix').width, two = Math.max(x.measureText('qb').width, x.measureText('ix').width);
    const s1 = Math.min(w * 0.78 / one * 100, h * 0.6 / 0.92), s2 = Math.min(w * 0.7 / two * 100, h * 0.74 / 1.7);
    const lines = s2 > s1 * 1.2 ? ['qb', 'ix'] : ['qbix'], fs = lines.length === 2 ? s2 : s1;
    x.font = `400 ${fs}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
    const lh = fs * 1.0, total = fs * 0.7 + lh * (lines.length - 1) + (lines.length === 2 ? 0.02 : 0.22) * fs;
    let y = h * 0.47 - total / 2 + fs * 0.7;
    lines.forEach((l) => { x.fillText(l, w / 2, y); y += lh; });
    const img = x.getImageData(0, 0, w, h).data;
    const raw = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) raw[i] = img[i * 4] / 255;
    const mask = raw.slice();
    const soft = blur(raw, w, h, Math.max(1, Math.round(fs * 0.011)));
    const period = Math.max(8, Math.min(w, h) * 0.05);
    const hgt = new Float32Array(w * h);
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const u = ((i + 0.5) % period) / period * 2 - 1;
      const reed = Math.sqrt(Math.max(0, 1 - u * u * 0.92));
      let l = soft[j * w + i]; l = Math.min(1, Math.max(0, (l - 0.08) / 0.84)); l = l * l * (3 - 2 * l);
      hgt[j * w + i] = 0.07 * reed * (1 - l) + 0.9 * l;
    }
    const data = new Uint8Array(w * h * 4), k = HS / sc;
    const at = (a, b) => hgt[Math.min(h - 1, Math.max(0, b)) * w + Math.min(w - 1, Math.max(0, a))];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const dx = (at(i + 1, j) - at(i - 1, j)) * 0.5 * k, dy = (at(i, j + 1) - at(i, j - 1)) * 0.5 * k;
      const inv = 1 / Math.hypot(dx, dy, 1), o = (j * w + i) * 4;
      data[o] = Math.round((-dx * inv * 0.5 + 0.5) * 255); data[o + 1] = Math.round((-dy * inv * 0.5 + 0.5) * 255);
      data[o + 2] = Math.round(hgt[j * w + i] * 255); data[o + 3] = Math.round(Math.min(1, mask[j * w + i]) * 255);
    }
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
    [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]].forEach(([a, b]) => gl.texParameteri(gl.TEXTURE_2D, a, b));
  }
  let rebuildT = 0;
  build();
  addEventListener('resize', () => { clearTimeout(rebuildT); rebuildT = setTimeout(build, 120); });
  if (document.fonts) document.fonts.load('400 100px Eurostile').then(build, () => {});
  let tx = innerWidth * 0.3, ty = innerHeight * 0.4, lx = tx, ly = ty, last = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now;
    const k = 1 - Math.exp(-dt * 9);
    lx += (tx - lx) * k; ly += (ty - ly) * k;
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform1i(U.u_map, 0); gl.uniform2f(U.u_res, W, H); gl.uniform1f(U.u_dpr, dpr); gl.uniform1f(U.u_hs, HS);
    gl.uniform3f(U.u_light, lx, ly, Math.min(W, H) * 0.3);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  })(performance.now());
  return {
    move(x, y) { tx = x; ty = y; },
    path(t) { const u = t * 0.5 * (reduce ? 0 : 1) + 2.2; return [innerWidth * (0.5 + 0.4 * Math.cos(u)), innerHeight * (0.46 + 0.36 * Math.sin(u * 1.37))]; }
  };
})();
document.addEventListener('pointermove', (e) => relight.move(e.clientX, e.clientY));
</script>
<script>
  QM.demo({ kind: 'pointer', move: (x, y) => relight.move(x, y), path: (t) => relight.path(t) });
</script>
