  const SEAT = 4.5, SEAT_P = 0.85, SETTLE = 400, LOOK = 0.99 / (1 - 0.99) / 1000;                                         // seat zone px and pull; ms the line must rest before a sort; 0.099 s of look-ahead (d = 0.99)
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const TAU = Math.PI * 2, OM = TAU / 0.28, OMT = TAU / 0.4, OMR = TAU / 0.3, OMK = TAU / 0.3, OMY = TAU / 0.42, OME = TAU / 0.2;

  /* Forma's stock, units. The rows keep this order until the switch is on. */
  const DATA = [['Ash vase', 86], ['Loop tray', 54], ['Pressed tumbler', 41], ['Linen runner', 47], ['Stone dish', 27], ['Morning mug', 72], ['Calla bowl', 18], ['Ring dish', 12], ['Tall jug', 9]];

  /* a spring: the critically damped closed form, or the damped cosine below 1; it always starts from the x and v on screen */
  const mk = (x = 0) => ({ x, v: 0, T: x, w: OM, z: 1, on: false });
  function step(s, dt, eps, veps) {
    if (!s.on) return false;
    const A = s.x - s.T, w = s.w, z = s.z;
    let x, v;
    if (z >= 0.999) { const B = s.v + w * A, e = Math.exp(-w * dt); x = s.T + (A + B * dt) * e; v = (B - w * (A + B * dt)) * e; }
    else {
      const wd = w * Math.sqrt(1 - z * z), e = Math.exp(-z * w * dt), c = Math.cos(wd * dt), sn = Math.sin(wd * dt), C = (s.v + z * w * A) / wd;

    if (Math.abs(x - s.T) < eps && Math.abs(v) < veps) { s.x = s.T; s.v = 0; s.on = false; }

  const capV = (x, T, v, w) => { const A = x - T; return A < 0 ? Math.min(v, -w * A) : A > 0 ? Math.max(v, -w * A) : 0; };

  const $ = (id) => document.getElementById('bt-' + id);

  /* digits: each place is a strip of 0 to 9 (three times over) on its own spring and takes the shortest way round; a leading place opens and closes by width */
  const STRIP = Array.from({ length: 30 }, (_, i) => i % 10).join('\n');
  const nums = [];
  function Num(el, places, lh, response) {
    el.style.setProperty('--lh', lh + 'px');
    this.lh = lh; this.om = TAU / response; this.n = -1;
    this.slots = places.map((p) => {
      const d = document.createElement('span'), st = document.createElement('span');
      d.className = 'bt-d'; st.className = 'bt-st'; st.textContent = STRIP; d.append(st); el.append(d);
      return { p, d, st, dg: 0, pos: 10, tgt: 10, vel: 0, vis: true };
    });
    this.el = el;

  Num.prototype.set = function (n, instant) {
    if (n === this.n) return;
    this.n = n; this.el.dataset.v = n;
    for (const o of this.slots) {

      if (instant || reduced) { o.dg = dg; o.pos = o.tgt = 10 + dg; o.vel = 0; this.draw(o); }
      else if (dg !== o.dg) { o.tgt += ((dg - o.dg + 15) % 10) - 5; o.dg = dg; }
      if (vis !== o.vis) { o.vis = vis; o.d.classList.toggle('is-off', !vis); }
    }

  Num.prototype.draw = function (o) { o.st.style.transform = `translateY(${(-o.pos * this.lh).toFixed(2)}px)`; };
  Num.prototype.step = function (dt) {

      if (o.pos === o.tgt && !o.vel) continue;

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('bt-fit');
  // the card is drawn at 780 x 480 and scaled to the room it is given (1.0x in the 800 x 500 tile, 1.6x at most)
  function size() {
    const W = innerWidth, H = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 10 : Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = tile ? 0 : 46;

        await back(my);
        await hand(my, 20 * BT.K, 2700, mv, 0);                            // 40 to 60, slowly: three rows flip one by one
        await gap(my, 1100);

        await gap(my, 1500);

        await gap(my, 2100);

        await gap(my, 2400);
