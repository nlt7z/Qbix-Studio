<script data-code>
/* Glass composer. The copy of the page inside the box is moved by the box's own offsets each frame,
   so the frost always matches what is under it. Everything the page changes is a class on .gc. */
const $ = (s) => document.querySelector(s);
const gc = $('#gc'), box = $('#box'), copy = $('#copy'), ta = $('#ta'), go = $('#go');
const OUT = 'cubic-bezier(0.16, 1, 0.3, 1)';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const OLD = 'Ceramics, made slowly.', NEW = 'Pots made to be used.';
let timers = [], busy = false, until = 0, raf = 0;

copy.append($('#pg').cloneNode(true));          // the page, twice: sharp, and under the glass
function sync() {
  copy.style.transform = `translate(${-(box.offsetLeft + 60)}px, ${-(box.offsetTop + 60)}px)`;
  if (performance.now() < until) raf = requestAnimationFrame(sync); else raf = 0;
}
function kick(ms = 900) { until = performance.now() + ms; if (!raf) raf = requestAnimationFrame(sync); }
function setBox(w, h) {
  box.style.width = w + 'px'; box.style.height = h + 'px'; box.style.left = (640 - w) / 2 + 'px';
  kick(); if (still) sync();
}
function fitText() {
  ta.style.height = '0px';
  const h = Math.min(66, Math.max(22, ta.scrollHeight));
  ta.style.height = h + 'px';
  if (!busy) setBox(400, h + 42);
}
function headline(text) {
  document.querySelectorAll('.gc-hl').forEach((h) => {
    if (still) { h.textContent = text; return; }
    h.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 200, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'forwards' }).finished.then(() => {
      h.textContent = text;
      h.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 420, easing: OUT, fill: 'both' });
    });
  });
}
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
function send() {
  if (busy || !ta.value.trim()) return;
  busy = true; ta.blur(); gc.classList.add('is-busy');
  $('#stx').textContent = 'Updating the hero'; $('#stn').textContent = '0 changes';
  setBox(300, 44);
  at(900, () => { gc.classList.add('is-grown'); $('#stn').textContent = '1 change'; kick(1000); });
  at(1700, () => { headline(NEW); $('#stn').textContent = '2 changes'; });
  at(2700, () => { $('#stx').textContent = 'Updated the hero'; });
  at(4200, () => { gc.classList.remove('is-busy'); ta.value = ''; go.classList.remove('has-text'); ta.style.height = '22px'; setBox(400, 64); });
  at(5200, () => { gc.classList.remove('is-grown'); headline(OLD); kick(1000); busy = false; });
}
ta.addEventListener('input', () => { go.classList.toggle('has-text', ta.value.length > 0); fitText(); });
ta.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
go.addEventListener('click', send);
setBox(400, 64);
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  PickGhost.fit($('#fit'), 640, 440, { max: 1.5, gutter: 90 });
  function rest() {
    timers.forEach(clearTimeout); timers = []; busy = false;
    document.getAnimations().forEach((a) => a.cancel());
    gc.classList.remove('is-busy', 'is-grown');
    document.querySelectorAll('.gc-hl').forEach((h) => { h.textContent = OLD; });
    ta.value = ''; go.classList.remove('has-text'); ta.style.height = '22px';
    box.style.transition = 'none'; setBox(400, 64); box.offsetWidth; box.style.transition = ''; sync();
  }
  const WORDS = 'Make the hero taller, and change the headline to Pots made to be used';
  const type = async (g, str, ms) => { for (const ch of str) { ta.value += ch; go.classList.add('has-text'); fitText(); await g.wait(ms / str.length); } };
  PickGhost.start({
    hot: '.gc-go',
    reset: rest,
    still() { rest(); ta.value = 'Make the hero taller, and change the headline'; go.classList.add('has-text'); fitText(); },
    async script(g) {
      await g.wait(500);
      await g.to('.gc-ta', { ms: 700, fx: 0.3 });
      ta.focus({ preventScroll: true });
      await g.wait(200);
      await type(g, WORDS, 1900);
      await g.wait(500);
      await g.click('#go', { ms: 600 });
      await g.wait(5800);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
