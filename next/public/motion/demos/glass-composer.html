<script data-code>
/* Glass composer. The copy of the page inside the box is moved by the box's own offsets each frame,
   so the frost always matches what is under it. Everything the page changes is a class on .gc. */
const $ = (s) => document.querySelector(s);
const gc = $('#gc'), box = $('#box'), copy = $('#copy'), ta = $('#ta'), go = $('#go');
const OUT = 'cubic-bezier(0.16, 1, 0.3, 1)';
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const OLD = 'Ceramics, made slowly.', NEW = 'Pots made to be used.';
let timers = [], busy = false, until = 0, raf = 0;

copy.append($('#pg').cloneNode(true));          // the page, twice: sharp, and under the glass
function sync() {
  // the box's true position (it is fractional while it glides), in the card's own pixels, so the frost never steps
  const r = box.getBoundingClientRect(), g = gc.getBoundingClientRect(), k = g.width / 640 || 1;
  copy.style.transform = `translate(${(-((r.left - g.left) / k + 60)).toFixed(2)}px, ${(-((r.top - g.top) / k + 60)).toFixed(2)}px)`;
  if (performance.now() < until) raf = requestAnimationFrame(sync); else raf = 0;
}
function kick(ms = 900) { until = performance.now() + ms; if (!raf) raf = requestAnimationFrame(sync); }
function setBox(w, h) {
  box.style.width = w + 'px'; box.style.height = h + 'px'; box.style.left = (640 - w) / 2 + 'px';
  kick(); if (still) sync();
}
function fitText() {
  ta.style.height = '0px';
  const h = Math.min(66, Math.max(22, ta.scrollHeight));
  ta.style.height = h + 'px';
  if (!busy) setBox(400, h + 42);
}
const say = (t) => { $('#say').textContent = t; };
const IN = 'cubic-bezier(0.5, 0, 0.75, 0)';
/* a word swap is uncovered from below; its width is reserved, so nothing around it moves */
function swap(el, text) {
  el.textContent = text;
  if (!still) el.animate([{ clipPath: 'inset(0 0 100% 0)', transform: 'translateY(6px)' }, { clipPath: 'inset(0 0 0 0)', transform: 'none' }], { duration: 320, easing: OUT });
}
function headline(text) {
  document.querySelectorAll('.gc-hl').forEach((h) => {
    if (still) { h.textContent = text; return; }
    h.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 200, easing: 'cubic-bezier(0.5, 0, 0.75, 0)', fill: 'forwards' }).finished.then(() => {
      h.textContent = text;
      h.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 420, easing: OUT, fill: 'both' });
    });
  });
}
const at = (ms, fn) => timers.push(setTimeout(fn, ms));
function send() {
  if (busy || !ta.value.trim()) return;
  busy = true; ta.blur(); gc.classList.add('is-busy'); $('.gc-in').inert = true;
  $('#stx').textContent = 'Updating the hero'; $('#stn').textContent = '0 changes';
  say('Updating the hero. 0 changes.');
  setBox(300, 44);
  at(900, () => { gc.classList.add('is-grown'); swap($('#stn'), '1 change'); kick(1000); });
  at(1700, () => { headline(NEW); swap($('#stn'), '2 changes'); say('2 changes.'); });
  at(2700, () => { swap($('#stx'), 'Updated the hero'); say('Updated the hero.'); });
  at(4200, () => { gc.classList.remove('is-busy'); $('.gc-in').inert = false; ta.value = ''; go.classList.remove('has-text'); go.setAttribute('aria-disabled', 'true'); ta.style.height = '22px'; setBox(400, 64); });
  at(5200, () => { gc.classList.remove('is-grown'); headline(OLD); kick(1000); busy = false; });
}
const sync_go = () => { const on = ta.value.trim().length > 0; go.classList.toggle('has-text', ta.value.length > 0); go.setAttribute('aria-disabled', String(!on)); };
ta.addEventListener('input', () => { sync_go(); fitText(); });
/* the glass takes its frame for keyboard focus only (a click or the ghost shows the caret alone) */
let kbd = false;
addEventListener('keydown', (e) => { if (e.isTrusted && e.key === 'Tab') kbd = true; }, true);
addEventListener('pointerdown', () => { kbd = false; }, true);
ta.addEventListener('focus', () => box.classList.toggle('is-kb', kbd));
ta.addEventListener('blur', () => box.classList.remove('is-kb'));
ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
go.addEventListener('click', send);
setBox(400, 64);
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  PickGhost.fit($('#fit'), 640, 440, { max: 1.5, gutter: 90 });
  function rest() {
    timers.forEach(clearTimeout); timers = []; busy = false;
    document.getAnimations().forEach((a) => a.cancel());
    gc.classList.remove('is-busy', 'is-grown');
    document.querySelectorAll('.gc-hl').forEach((h) => { h.textContent = OLD; });
    ta.value = ''; go.classList.remove('has-text'); go.setAttribute('aria-disabled', 'true'); ta.style.height = '22px'; $('.gc-in').inert = false; say('');
    $('#stx').textContent = 'Updating the hero'; $('#stn').textContent = '0 changes'; box.classList.remove('is-kb');
    box.style.transition = 'none'; setBox(400, 64); box.offsetWidth; box.style.transition = ''; sync();
  }
  const WORDS = 'Make the hero taller, and change the headline to Pots made to be used';
  // a hand, not a metronome: runs of quick keys, a longer beat after a comma or a word (a fixed pseudo-random rhythm)
  const type = async (g, str, ms) => {
    const w = [...str].map((ch, i) => (0.55 + 0.9 * Math.abs(Math.sin(i * 12.9898)) ) * (ch === ',' ? 1.2 : ch === ' ' ? 1.5 : 1) + (str[i - 1] === ',' ? 5 : 0));
    const sum = w.reduce((a, b) => a + b, 0);
    for (let i = 0; i < str.length; i++) { ta.value += str[i]; sync_go(); fitText(); await g.wait(ms * w[i] / sum); }
  };
  PickGhost.start({
    hot: '.gc-go',
    reset: rest,
    still() { rest(); ta.value = 'Make the hero taller, and change the headline'; sync_go(); fitText(); },
    async script(g) {
      await g.wait(500);
      await g.to('.gc-ta', { ms: 700, fx: 0.3 });
      ta.focus({ preventScroll: true });
      await g.wait(200);
      await type(g, WORDS, 1900);
      await g.wait(500);
      await g.click('#go', { ms: 600 });
      await g.wait(6400);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
