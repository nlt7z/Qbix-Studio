<script data-code>
/* Generated card. One timeline of classes (o open, k skeleton, t title, n total, b bars, d done); CSS carries every transition,
   so Regenerate can interrupt at any point: it takes the classes off (parts leave fast, the card closes) and then builds again. */
const gc = document.getElementById('gc'), gcTx = document.getElementById('gc-tx'), gcNum = document.getElementById('gc-num');
const gcBars = document.getElementById('gc-bars'), gcLink = document.getElementById('gc-link'), gcRg = document.getElementById('gc-rg'), gcLive = document.getElementById('gc-live');
const GC_TITLE = 'Spend this week', GC_TOTAL = 1284;
const gcReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let gcTimers = [], gcRaf = 0, gcShown = 0;

function gcBez(x1, y1, x2, y2) {                    // a CSS cubic-bezier as a function of progress
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; } return ((ay * t + by) * t + cy) * t; };
}
const gcMove = gcBez(.65, 0, .35, 1);
const gcMoney = (v) => '$' + Math.round(v).toLocaleString('en-US');
function gcCount(to, ms) {                          // the total: one tween, retargets from where it is
  cancelAnimationFrame(gcRaf);
  const from = gcShown, t0 = performance.now();
  const paint = (v) => { gcShown = v; gcNum.textContent = gcMoney(v); };
  if (!ms) return paint(to);
  const step = (now) => { const p = Math.min(1, (now - t0) / ms); paint(from + (to - from) * gcMove(p)); if (p < 1) gcRaf = requestAnimationFrame(step); };
  gcRaf = requestAnimationFrame(step);
}
function gcAt(ms, fn) { gcTimers.push(setTimeout(fn, gcReduced ? 0 : ms)); }
function gcClear() { gcTimers.forEach(clearTimeout); gcTimers = []; cancelAnimationFrame(gcRaf); }
function gcType() {                                 // the title writes itself, 26 ms a character
  let i = 0;
  const tick = () => { gcTx.textContent = GC_TITLE.slice(0, ++i); if (i < GC_TITLE.length) gcTimers.push(setTimeout(tick, 26)); };
  tick();
}
function gcBuild() {                                // about 2.3 s from the first outline
  gcClear();
  gcLive.textContent = 'Generating the spend card.';
  gcAt(0,    () => gc.classList.add('o'));
  gcAt(220,  () => gc.classList.add('k'));
  gcAt(760,  () => { gc.classList.add('t'); gcType(); });
  gcAt(960,  () => gc.classList.add('b'));
  gcAt(1000, () => { gc.classList.add('n'); gcCount(GC_TOTAL, 760); });
  gcAt(1780, () => {
    gc.classList.add('d'); gcBars.inert = false; gcLink.inert = false;
    gcLive.textContent = 'Spend card ready. Total ' + gcMoney(GC_TOTAL) + ' this week, highest today at $240.';
  });
}
function gcOut() {                                  // every part leaves fast, the card closes
  gcClear();
  gcBars.inert = true; gcLink.inert = true;
  gcLink.classList.remove('is-open');
  gc.classList.remove('d', 'b', 'n', 't', 'k', 'o');
  gcCount(0, 0);
  gcTx.textContent = '';
  gcBars.querySelectorAll('.is-pin').forEach((b) => { b.classList.remove('is-pin'); b.setAttribute('aria-pressed', 'false'); });
}
function gcRegen() { gcOut(); gcAt(360, gcBuild); }
function gcRest(built) {                            // an instant state, no transitions
  gc.classList.add('still');
  gcOut();
  if (built) {
    gc.classList.add('o', 'k', 't', 'n', 'b', 'd');
    gcTx.textContent = GC_TITLE; gcCount(GC_TOTAL, 0);
    gcBars.inert = false; gcLink.inert = false;
    gcLive.textContent = 'Spend card ready. Total ' + gcMoney(GC_TOTAL) + ' this week, highest today at $240.';
  }
  gc.getBoundingClientRect();
  gc.classList.remove('still');
}
gcRg.addEventListener('click', () => (gcReduced ? gcRest(true) : gcRegen()));
gcBars.addEventListener('click', (e) => {            // a click pins a bar's value open
  const col = e.target.closest('.gc-col'); if (!col) return;
  const on = col.classList.toggle('is-pin'); col.setAttribute('aria-pressed', String(on));
});
let gcOpenT = 0;
gcLink.addEventListener('click', () => {            // the link says what it is doing, then settles back
  gcLink.classList.add('is-open'); gcLive.textContent = 'Opening in Kova.';
  clearTimeout(gcOpenT);
  gcOpenT = setTimeout(() => gcLink.classList.remove('is-open'), gcReduced ? 0 : 1400);
});
</script>

(() => {

  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  async function go(my, el, fx = 0.5, fy = 0.58) {
    const r = el.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * fx, r.top + r.height * fy, 720))) throw 0;
    if (my !== epoch) throw 0;

  async function tap(my, el, hold) {
    await go(my, el);
    el.classList.add('is-hot');
    await gap(my, 160);
    el.style.transform = 'translateY(1px)';
    await gap(my, 110);
    el.style.transform = '';
    el.classList.remove('is-hot');
    el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    await gap(my, hold);
  }
  async function read(my, col, hold) {                // hover a bar: the ghost sits beside the bar's top, never on its value
    const r = col.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * 0.78, r.bottom - 34, 720))) throw 0;
    if (my !== epoch) throw 0;
    col.classList.add('is-hot');
    await gap(my, hold);
    col.classList.remove('is-hot');
  }
  const cols = Array.from(document.querySelectorAll('.gc-col'));
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      gcBuild();
      for (;;) {
        await gap(my, 2900);                          // the build, then a moment to read it
        await read(my, cols[2], 1100);
        await read(my, cols[3], 1100);
        await tap(my, gcRg, 400);                     // regenerate
        await QM.ghostTo(gcRg.getBoundingClientRect().left + 40, gcRg.getBoundingClientRect().top + 52, 480);
        if (my !== epoch) throw 0;
        await gap(my, 360);                           // the card closes and builds again
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); cols.forEach((c) => c.classList.remove('is-hot')); gcRg.classList.remove('is-hot'); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (!gc.matches(':hover') && !gc.contains(document.activeElement)) { script(); } else { touch({}); } }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true, capture: true });
    addEventListener('pointerdown', touch, { passive: true, capture: true });
    addEventListener('keydown', () => touch({}), true);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); gcClear(); if (reduced) gcRest(true); else { gcRest(false); script(); } } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (reduced) gcRest(true); else script(); }, 300));
})();
</script>
