<style data-code>
/* Layer compare. Idea: bencho.dev image-compare (MIT).
   Two renders of one picture and a line between them. */
.cmp { display: grid; gap: 16px; width: 760px; font-size: 14px; line-height: 1.5; letter-spacing: 0; color: var(--fg); }
.cmp-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.cmp-head h1 { font-family: var(--font-sans); font-size: 28px; font-weight: 400; letter-spacing: -0.03em; line-height: 1.35; }
.cmp-meta { font-size: 12px; color: rgba(18, 20, 23, 0.56); }
.cmp-chip { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 24px; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--fg2); background: rgba(18, 20, 23, 0.07); }
.cmp-chip.alert { color: #fff; background: var(--fg); }

.cmp-frame { position: relative; width: 760px; height: 400px; border-radius: 14px; overflow: hidden; touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; background: var(--surface); }
.cmp-frame:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
/* every child lets the pointer through: the whole frame is the handle; each layer is its own compositor layer, so the drawing is rasterised once */
.cmp-layer { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; object-position: 50% 62%; pointer-events: none; -webkit-user-drag: none; will-change: transform; }
.cmp-render { clip-path: inset(0 50% 0 0); }          /* the script replaces it with the bowed path */
.cmp-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.cmp-line path { fill: none; stroke: var(--fg); stroke-width: 2.5; stroke-linecap: round; }
.cmp-grip { position: absolute; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: var(--fg); color: var(--surface); display: grid; place-items: center; pointer-events: none; transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1); }
.cmp-frame[data-held] .cmp-grip { background: #363a40; }
.cmp-grip svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cmp-tag { position: absolute; top: 16px; pointer-events: none; }
.cmp-tag.l { left: 60px; }
.cmp-tag.r { right: 60px; }
.cmp-tag .cmp-chip { background: var(--fg); color: var(--surface); min-height: 28px; padding: 0 12px; }

.cmp-find { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: var(--surface); border-radius: 14px; padding: 12px 20px; }
.cmp-find .what { display: flex; align-items: center; gap: 12px; }
.cmp-find .what b { font-weight: 500; }
.cmp-find .nums { color: var(--fg2); font-variant-numeric: tabular-nums; }
</style>

<script data-code>
/* One knob, 0..1. The render is clipped to the left of a line whose ends trail the knob on a spring, so the
   line bows when the knob is pulled and settles straight when it rests. */
const W = 760, H = 400;
const $ = (id) => document.getElementById(id);
const frame = $('frame'), render = $('render'), ln = $('ln'), grip = $('grip');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let cur = 0.5, target = null, ends = { x: 0.5, v: 0 }, raf = 0, drag = null;

function draw() {
  const x = cur * W, bend = clamp((cur - ends.x) * W * 0.5, -22, 22), top = x - bend;
  const q = `Q ${(x + bend).toFixed(2)} ${H / 2} ${top.toFixed(2)} ${H}`;
  render.style.clipPath = `path('M 0 0 L ${top.toFixed(2)} 0 ${q} L 0 ${H} Z')`;
  ln.setAttribute('d', `M ${top.toFixed(2)} 0 ${q}`);
  grip.style.left = x + 'px';
  $('tagL').style.opacity = clamp((cur - 0.2) * 4, 0, 1);
  $('tagR').style.opacity = clamp((0.8 - cur) * 4, 0, 1);
  const p = Math.round(cur * 100);
  $('pct').textContent = p >= 100 ? 'All render' : p <= 0 ? 'All dots' : p + '% render';
  frame.setAttribute('aria-valuenow', p);
}
/* one loop for the glide toward a target and the ends catching up with the knob */
function wake() {
  if (raf) return;
  let prev = performance.now();
  const step = (t) => {
    const dt = Math.min(0.033, (t - prev) / 1000); prev = t;
    if (target !== null) {
      cur += (target - cur) * (1 - Math.pow(0.0004, dt));
      if (Math.abs(target - cur) < 0.0005) { cur = target; target = null; }
    }
    ends.v += ((cur - ends.x) * 620 - ends.v * 44) * dt; ends.x += ends.v * dt;
    draw();
    if (target === null && Math.abs(cur - ends.x) < 0.0006 && Math.abs(ends.v) < 0.002) { ends.x = cur; ends.v = 0; draw(); raf = 0; return; }
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
}
const at = (cx) => { const r = frame.getBoundingClientRect(); return clamp((cx - r.left) / r.width, 0, 1); };
const jump = (v) => { cur = v; target = null; ends.x = v; ends.v = 0; draw(); };
const glide = (v) => { if (still) return jump(v); target = v; wake(); };
frame.addEventListener('pointerdown', (e) => {
  try { frame.setPointerCapture(e.pointerId); } catch (_) { /* a scripted press has no pointer to capture */ }
  const v = at(e.clientX); drag = { s: [[performance.now(), v]] };
  frame.dataset.held = ''; glide(v);
});
frame.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const v = at(e.clientX), now = performance.now();
  drag.s.push([now, v]); drag.s = drag.s.filter((s) => now - s[0] < 160);
  target = null; cur = v;
  if (still) jump(v); else wake();
});
const release = (fling) => {
  const d = drag; drag = null; delete frame.dataset.held;
  if (!d || !fling) return;
  const now = performance.now(), s = d.s.filter((q) => now - q[0] < 140);
  if (s.length < 2) return;
  const v = (s[s.length - 1][1] - s[0][1]) / Math.max(40, s[s.length - 1][0] - s[0][0]);   // fractions of the width per ms
  if (Math.abs(v) > 0.0009) glide(v > 0 ? 1 : 0);                                            // a flick carries on to its edge
};
frame.addEventListener('pointerup', () => release(true));
frame.addEventListener('pointercancel', () => release(false));
frame.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { e.preventDefault(); glide(clamp((target ?? cur) - 0.1, 0, 1)); }
  if (e.key === 'ArrowRight') { e.preventDefault(); glide(clamp((target ?? cur) + 0.1, 0, 1)); }
});
draw();
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  /* loop kind: the ghost drags the line as the library's own preview does: a slow pull, a push, a flick right; a pull, a flick left */
  PickGhost.fit($('fit'), 760, 556, { max: 1.5, gutter: 48 });
  const X = (f) => () => { const r = frame.getBoundingClientRect(); return { x: r.left + r.width * f, y: r.top + r.height * 0.55 }; };
  const lin = (x) => x;
  PickGhost.start({
    reset: () => { drag = null; delete frame.dataset.held; jump(0.5); },
    still: () => jump(0.5),
    async script(g) {
      await g.wait(500);
      await g.to(X(0.5), { ms: 650 }); await g.down();
      await g.to(X(0.26), { ms: 1000 });
      await g.wait(700);
      await g.to(X(0.62), { ms: 1100 });
      await g.wait(500);
      await g.to(X(0.84), { ms: 170, ease: lin });
      await g.up();                                   // a flick: it glides to the right edge
      await g.wait(2000);
      await g.to(X(0.8), { ms: 500 }); await g.down();
      await g.to(X(0.4), { ms: 700 });
      await g.to(X(0.16), { ms: 170, ease: lin });
      await g.up();                                   // and to the left
      await g.wait(1800);
      glide(0.5);
      await g.wait(1000);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
</body>
