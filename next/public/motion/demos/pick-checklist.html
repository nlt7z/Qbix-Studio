/* Launch checklist. Idea: bencho.dev checklist (MIT). */
.ck { width: 520px; background: var(--surface); border-radius: 14px; padding: 24px; display: grid; gap: 16px; font-size: 14px; line-height: 1.5; letter-spacing: 0; color: var(--fg); }
.ck-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }

.ck-top p { margin: 4px 0 0; color: var(--fg2); }
.ck-count { font-family: var(--font-mono); font-size: 20px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.35; }
.ck-count span { color: var(--fg2); }
.ck-track { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.ck-track > i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--signal); transition: width 260ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.ck-item { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; margin: 0 -12px; width: calc(100% + 24px); border: 0; border-radius: 8px; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck-item:hover, .ck-item.is-hot { background: var(--fill); }
.ck-item:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.ck-box { position: relative; width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 1px solid rgba(11, 12, 13, 0.52); background: var(--surface); transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1), border-color 120ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck-item[aria-checked="true"] .ck-box { background: var(--signal); border-color: var(--signal); }
.ck-box svg { display: block; width: 14px; height: 14px; fill: none; stroke: var(--on-lime); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ck-box path { stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset 200ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck-item[aria-checked="true"] .ck-box path { stroke-dashoffset: 0; transition-delay: 60ms; }
.ck-label { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.ck-t { position: relative; display: inline-block; width: fit-content; max-width: 100%; font-size: 14px; line-height: 1.35; color: var(--fg); transition: color 200ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck-t::after { content: ""; position: absolute; left: 0; right: 0; top: 52%; height: 1.5px; background: currentColor; transform: scaleX(0); transform-origin: 0 50%; transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1) 90ms; }
.ck-item[aria-checked="true"] .ck-t { color: var(--fg2); }
.ck-item[aria-checked="true"] .ck-t::after { transform: scaleX(1); }
.ck-who img { display: block; width: 24px; height: 24px; border-radius: 50%; object-fit: cover; object-position: 40% 35%; }
.ck-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 8px; }
.ck-foot span { color: var(--fg2); }
.ck-go { height: 36px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px; background: var(--signal); color: var(--on-lime); font-weight: 500; white-space: nowrap; cursor: pointer; transition: background-color 120ms cubic-bezier(0.16, 1, 0.3, 1), color 120ms cubic-bezier(0.16, 1, 0.3, 1); }
.ck-go:hover { background: color-mix(in oklab, var(--signal) 88%, #000); }
.ck-go:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.ck-go:disabled { background: color-mix(in srgb, var(--signal) 32%, var(--surface)); color: rgba(12, 19, 0, 0.4); cursor: default; }
@media (prefers-reduced-motion: reduce) { .ck *, .ck *::before, .ck *::after { transition-duration: 1ms !important; } }

<script data-code>
/* A tick is one attribute; the box, the check, the strike, the count, the bar and the button all follow it. */
const $ = (s) => document.querySelector(s);
const list = $('#list');
const items = [...list.querySelectorAll('.ck-item')];
const N = items.length;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint() {
  const n = items.filter((b) => b.getAttribute('aria-checked') === 'true').length;
  $('#count').innerHTML = `${n}<span> of ${N}</span>`;
  $('#bar').style.width = (n / N * 100) + '%';
  $('#release').disabled = n < N;
  $('#hint').textContent = n === N ? 'All set for willowcounseling.com' : `${N - n} to go`;
}
const set = (b, v) => { b.setAttribute('aria-checked', v); paint(); };
list.addEventListener('click', (e) => { const b = e.target.closest('.ck-item'); if (b) set(b, b.getAttribute('aria-checked') !== 'true'); });
function reset(n = 2) { items.forEach((b, i) => b.setAttribute('aria-checked', i < n)); paint(); }
reset(still ? 5 : 2);
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  /* loop kind: the ghost ticks three, takes one back and ticks it again, then the last two: the button wakes */
  PickGhost.fit($('#fit'), 520, 590, { max: 1.5, gutter: 48 });
  PickGhost.start({
    hot: '.ck-item',
    reset: () => reset(2),
    still: () => reset(5),
    async script(g) {
      await g.wait(500);
      await g.click(items[2], { ms: 520 }); await g.wait(650);
      await g.click(items[3], { ms: 480 }); await g.wait(650);
      await g.click(items[4], { ms: 480 }); await g.wait(900);
      await g.click(items[1], { ms: 520 }); await g.wait(1000);
      await g.click(items[1], { ms: 300 }); await g.wait(900);
      await g.click(items[5], { ms: 480 }); await g.wait(500);
      await g.click(items[6], { ms: 420 }); await g.wait(1800);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
