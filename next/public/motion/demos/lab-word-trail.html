  "group": "lab",
  "cat": "brand",
  "order": 50,

  "tone": "paper",
  "line": "2.1 s life · ink to lime by speed · source-atop",
  "summary": "The pointer's path is drawn into an offscreen canvas where it fades with time, its colour going from ink to lime as the pointer speeds up. The word is drawn first, as a pale sage tint, and the trail is composited with source-atop, so it shows only inside the letterforms.",
  "spec": [

<style data-code>
.wt { position: absolute; inset: 0; cursor: crosshair; touch-action: none; }
.wt canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.wt-top, .wt-foot { position: absolute; left: clamp(16px, 4vmin, 48px); right: clamp(16px, 4vmin, 48px); display: flex; justify-content: space-between; align-items: center; gap: 16px; pointer-events: none;

.wt-top { top: clamp(16px, 4vmin, 44px); }
.wt-foot { bottom: clamp(16px, 4vmin, 44px); }

<body>
<main class="qm-stage" style="padding:0">
<!-- code -->
<div class="wt">
  <canvas id="c"></canvas>
  <div class="wt-top"><span>Studio · Sign off</span><span>Qbix</span></div>
  <div class="wt-foot"><span>Draw inside the word</span>
    <div class="wt-key"><span>Slow</span><span style="display:flex;gap:2px" id="key"></span><span>Fast</span></div></div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const wordTrail = (() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const trail = document.createElement('canvas'), tctx = trail.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FONT = 'Outfit, Geist, system-ui, sans-serif', WORD = 'qbix';
  const LIFE = reduce ? 3 : 2.1;
  const BASE = [227, 232, 218], C0 = [11, 12, 13], C1 = [184, 255, 0];   // a pale word, ink when slow, lime when fast
  let W, H, dpr, lines = [WORD], fs = 100, VMAX = 1500, on = true;
  const FOOT = () => Math.min(80, H * 0.12);
  function fitWord() {
    const pad = Math.min(W, H) * 0.08, aw = W - pad * 2, ah = H - pad * 2 - FOOT();
    ctx.font = `400 100px ${FONT}`;
    const m1 = ctx.measureText(WORD).width, m2 = Math.max(ctx.measureText('qb').width, ctx.measureText('ix').width);
    const asc = 78, desc = 24, lh = (asc + desc) * 1.02;
    const s1 = Math.min(aw / m1, ah / (asc + desc)) * 100, s2 = Math.min(aw / m2, ah / (lh * 2)) * 100;
    if (s2 > s1 * 1.15) { lines = ['qb', 'ix']; fs = s2; } else { lines = [WORD]; fs = s1; }
  }
  // where the word sits: one baseline a line. The block is centred on the x-height bands (not on the ascender and the descender), so the weight of the word sits on the middle of the frame
  function geom() {
    const asc = fs * 0.78, desc = fs * 0.24, lh = (asc + desc) * 1.02, xh = fs * 0.52;
    const span = lh * (lines.length - 1) + xh;
    const top = (H - FOOT()) / 2 - span / 2 + xh;          // the first baseline
    return { lh, xh, base: lines.map((_, i) => Math.round(top + lh * i)) };
  }
  function layout() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = trail.width = Math.round(W * dpr); cv.height = trail.height = Math.round(H * dpr);
    VMAX = Math.max(700, Math.min(W, H) * 2);
    fitWord();
    if (reduce) seedStill();
  }
  function drawWord(c) {
    c.font = `400 ${fs}px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    const g = geom();
    lines.forEach((l, i) => c.fillText(l, W / 2, g.base[i]));
  }
  // stroke points: x, y, time, smoothed speed
  const pts = [];
  let lastAdd = -1e9;
  function addPoint(x, y, t, fresh) {
    const p = pts[pts.length - 1];
    let v = 0;
    if (p && !fresh) { const dt = Math.max(0.008, t - p.t); v = Math.hypot(x - p.x, y - p.y) / dt; }
    const sv = p && !fresh ? p.sv + (v - p.sv) * 0.25 : 0;
    pts.push({ x, y, t, sv, brk: !!fresh });
  }
  function push(x, y) {
    const now = performance.now() / 1000;
    addPoint(x, y, now, now - lastAdd > 0.3);
    lastAdd = now;
  }
  // ink or lime, with only a short blend between: the middle of an ink-to-lime ramp is mud
  const speedColor = (v) => { const t = Math.max(0, Math.min(1, (v / VMAX - 0.3) / 0.4)), u = t * t * (3 - 2 * t); return C0.map((x, i) => Math.round(x + (C1[i] - x) * u)); };
  // a point's colour and width at age factor k (1 new, 0 gone). The colour holds and eases back to the pale word only in the last 40% of
  // its life (halfway between ink and sage is a grey), and the width thins first, so an old stroke tapers away instead of washing out.
  const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const tone = (p, k) => { const col = speedColor(p.sv), ka = sm(0, 0.4, k); return BASE.map((x, j) => x + (col[j] - x) * ka); };
  const half = (p, k) => fs * 0.3 * (1.1 - 0.4 * Math.min(1, p.sv / VMAX)) * (0.16 + 0.84 * sm(0, 0.7, k)) / 2;
  // one stretch of stroke: round stamps close together along the way, colour and width interpolated between its two points.
  // Both change smoothly along the path, so the overlaps never show as arcs or bands (a stamp every 6% of its radius).
  function seg(a, ka, b, kb, last) {
    const ca = tone(a, ka), cb = tone(b, kb), ha = half(a, ka), hb = half(b, kb);
    const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / Math.max(1.2, Math.min(ha, hb) * 0.06)));
    for (let i = last ? 0 : 1; i <= n; i++) {
      const f = i / n, r = ha + (hb - ha) * f;
      tctx.fillStyle = `rgb(${Math.round(ca[0] + (cb[0] - ca[0]) * f)},${Math.round(ca[1] + (cb[1] - ca[1]) * f)},${Math.round(ca[2] + (cb[2] - ca[2]) * f)})`;
      tctx.beginPath(); tctx.arc(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, r, 0, 6.2832); tctx.fill();
    }
  }
  // reduced motion: one finished stroke stays on the word, not fading
  let still = [];
  function seedStill() {
    still = [];
    const N = 70, g = geom();
    for (let i = 0; i <= N; i++) {
      const [x, y] = route(i / N, 0);
      const p = still[i - 1], v = p ? Math.hypot(x - p.x, y - p.y) * N / 1.6 : 0;
      still.push({ x, y, sv: p ? p.sv + (v - p.sv) * 0.25 : 0, brk: i === 0 });
    }
  }
  function frame() {
    requestAnimationFrame(frame);
    if (!on || document.hidden) return;
    const now = performance.now() / 1000;
    while (pts.length && now - pts[0].t > LIFE) pts.shift();
    // 1. the trail canvas: every live segment, oldest first, fading with age
    tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    tctx.clearRect(0, 0, W, H);
    for (let i = 1; i < still.length; i++) seg(still[i - 1], 0.9, still[i], 0.9, i === 1);
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i]; if (b.brk) continue;
      seg(a, 1 - (now - a.t) / LIFE, b, 1 - (now - b.t) / LIFE, i === 1 || pts[i - 1].brk);
    }
    // 2. the word, then the trail only where the word is
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgb(' + BASE.join(',') + ')';
    drawWord(ctx);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(trail, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
  // the ghost's hand: two passes along the word, out and back, each slow at its ends and fast in the middle (so ink to lime to ink), then a beat of rest
  const ez = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const PASS = 2.5, REST = 0.6, PERIOD = 2 * (PASS + REST);
  function route(p, pass) {
    const g = geom(), j = pass % lines.length;
    ctx.font = `400 ${fs}px ${FONT}`;
    const mw = ctx.measureText(lines[j]).width, x0 = W / 2 - mw / 2 + mw * 0.07, x1 = W / 2 + mw / 2 - mw * 0.07;
    const u = ez(p), dir = pass % 2 ? -1 : 1;
    const x = dir > 0 ? x0 + (x1 - x0) * u : x1 + (x0 - x1) * u;
    const y = g.base[j] - g.xh / 2 + dir * Math.sin(p * 6.2832) * g.xh * 0.2 * (lines.length > 1 ? 0.8 : 1);
    return [x, y];
  }
  layout();
  addEventListener('resize', layout);
  if (document.fonts) document.fonts.load('400 100px Outfit').then(layout, () => {});
  if (window.IntersectionObserver) new IntersectionObserver((e) => { on = e[0].isIntersecting; }).observe(cv);   // paused off screen
  requestAnimationFrame(frame);
  // the key: flat steps
  const key = document.getElementById('key');
  for (let i = 0; i < 8; i++) { const s = document.createElement('i'); s.style.background = `rgb(${speedColor(i / 7 * VMAX).join(',')})`; key.appendChild(s); }
  return {
    push,
    path(t) {
      const u = t % PERIOD, pass = u < PERIOD / 2 ? 0 : 1, v = pass ? u - PERIOD / 2 : u;
      return route(Math.min(1, v / PASS), pass);
    }
  };
})();
document.addEventListener('pointermove', (e) => {
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  evs.forEach((ev) => wordTrail.push(ev.clientX, ev.clientY));
});
</script>
<script>
  QM.demo({ kind: 'pointer', move: (x, y, ghost) => { if (!(ghost && QM.reduced)) wordTrail.push(x, y); }, path: (t) => wordTrail.path(t) });
</script>
</body>
</html>
