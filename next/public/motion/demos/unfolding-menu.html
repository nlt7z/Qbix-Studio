/* Unfolding menu. Rows are ink, uncovered top down by a clip each. */
.um { position: relative; display: flex; gap: 2px; }
.um-main, .um-caret { height: 64px; border: 0; background: #121417; color: #f3f4f5; cursor: pointer; user-select: none; transition: transform 160ms cubic-bezier(.22, 1, .36, 1); }
.um-main { padding: 0 32px; font: 500 19px/1 Geist, system-ui, sans-serif; letter-spacing: -.011em; }
.um-caret { width: 64px; display: grid; place-items: center; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.um-main:active, .um-caret:active { transform: translateY(2px); }
.um-caret svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; transition: transform 300ms cubic-bezier(.65, 0, .35, 1); }
.um.is-open .um-caret svg { transform: rotate(180deg); }
.um button:focus-visible { outline: 2px solid #B8FF00; outline-offset: -6px; }

.um-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 340px; z-index: 5; }
.um-row { display: block; width: 100%; height: 58px; padding: 0 20px; border: 0; background: #121417; color: #f3f4f5; text-align: left; cursor: pointer;
  clip-path: inset(0 0 100% 0); transition: clip-path 260ms cubic-bezier(.65, 0, .35, 1) calc(var(--o) * 40ms), background 160ms cubic-bezier(.4, 0, .2, 1); }
.um-in { height: 100%; display: flex; align-items: center; gap: 14px; font: 400 16px/1 Geist, system-ui, sans-serif; letter-spacing: -.011em; }
.um-in svg { flex: none; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.um-in b { flex: 1; font-weight: 400; white-space: nowrap; }
.um-in kbd { font: 11px/1 'Encode Sans', Geist, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: rgba(243, 244, 245, .5); }
.um-row:hover, .um-row.is-hot { background: #20242a; }
.um.is-open .um-row { clip-path: inset(0); transition: clip-path 420ms cubic-bezier(.16, 1, .3, 1) calc(var(--i) * 40ms), background 160ms cubic-bezier(.4, 0, .2, 1); }

/* the lime marker: one bar that slides between rows */
.um-bar { position: absolute; left: 0; top: 0; width: 4px; height: 58px; z-index: 2; pointer-events: none; background: #B8FF00;
  transform: translateY(calc(var(--k, 0) * 58px)); clip-path: inset(0 0 100% 0); transition: transform 300ms cubic-bezier(.65, 0, .35, 1), clip-path 200ms cubic-bezier(.5, 0, .75, 0); }
.um.is-open.has-mark .um-bar { clip-path: inset(0); transition: transform 300ms cubic-bezier(.65, 0, .35, 1), clip-path 320ms cubic-bezier(.16, 1, .3, 1); }
@media (prefers-reduced-motion: reduce) { .um-row, .um-bar, .um-caret svg, .um-main, .um-caret { transition: none !important; } }

<script data-code>
/* Unfolding menu. One class, is-open, unfolds the rows (their delays are CSS vars); --k places the marker. */
const um = document.getElementById('um');
const umCaret = document.getElementById('um-caret');
const umMenu = document.getElementById('um-menu');
const umRows = Array.from(umMenu.querySelectorAll('.um-row'));
let umPinned = false, umGrace = 0;

function umOpen() {
  clearTimeout(umGrace);
  um.classList.add('is-open');
  umCaret.setAttribute('aria-expanded', 'true');
  umMenu.inert = false;
}
function umClose() {
  clearTimeout(umGrace);
  umPinned = false;
  um.classList.remove('is-open', 'has-mark');
  umCaret.setAttribute('aria-expanded', 'false');
  umMenu.inert = true;
  umRows.forEach((r) => r.classList.remove('is-hot'));
}
function umMark(i) {
  um.style.setProperty('--k', i);
  um.classList.add('has-mark');
  umRows.forEach((r, k) => r.classList.toggle('is-hot', k === i));
}
umCaret.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') umOpen(); });
um.addEventListener('pointerenter', () => clearTimeout(umGrace));
um.addEventListener('pointerleave', () => { if (!umPinned) umGrace = setTimeout(umClose, 140); });
umCaret.addEventListener('click', () => { if (umPinned) umClose(); else { umPinned = true; umOpen(); } });
umCaret.addEventListener('keydown', (e) => { if (e.key === 'ArrowDown') { e.preventDefault(); umPinned = true; umOpen(); umRows[0].focus(); } });
umRows.forEach((r, i) => {
  r.addEventListener('pointerenter', () => umMark(i));
  r.addEventListener('focus', () => umMark(i));
  r.addEventListener('click', umClose);
});
document.addEventListener('pointerdown', (e) => { if (!um.contains(e.target)) umClose(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { umClose(); umCaret.focus(); } });
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let timers = [];
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const centre = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width * 0.45, r.top + r.height * 0.55]; };
  // the ghost script: open on the caret, then walk the three rows
  function enter() {
    clear();
    umOpen();
    umRows.forEach((r, i) => {
      at(900 + i * 800, () => { const [x, y] = centre(r); QM.ghostTo(x, y, 520); });
      at(1250 + i * 800, () => umMark(i));
    });
  }
  function leave() { clear(); umClose(); }
  if (!QM.tile) {
    // a real mouse takes over: drop the scripted timers, keep what the pointer itself opened
    addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse' || !timers.length) return;
      clear();
      if (!um.matches(':hover')) umClose();
    }, { passive: true });
  }
  QM.demo({ kind: 'hover', targets: '#um-caret', dur: 4200, travel: 900, enter, leave });
  if (reduced) { /* still state: the menu stays folded, hover and press still open it, with no transition */ }
})();
</script>
