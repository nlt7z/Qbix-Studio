<main class="qm-stage">
  <div class="sm">
    <div class="sm-head">

      <p class="lede">Moodboard in, one build, a live domain out. The panel tells the client where it stands.</p>
    </div>
    <div class="sm-pad">
<!-- code -->
<div class="sm-surf-box">
  <div class="sm-surf" id="surf">
    <div class="sm-c sm-1" id="c1"><div class="sm-stack" id="stack"></div><div class="sm-t"><b id="bdT">Building 3 pages</b><span id="bdS">1 of 3 pages</span></div><div class="sm-bar"><i id="bdBar"></i></div></div>

    <div class="sm-c sm-4" id="c4"><div class="sm-ok"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#0c1300" stroke-width="2" stroke-linecap="square"><path d="M3.5 8.5l3 3 6-6.5"/></svg></div><div class="sm-t"><b>Live at forma.studio</b><span>Opened by 1 person</span></div></div>
  </div>
</div>
<!-- /code -->

    </div>

</main>
<script src="../kit/stage.js"></script>
<script data-code>
(() => {
  const $ = (s) => document.querySelector(s);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const surf = $('#surf');
  const PICS = ['../assets/art/objects.webp', '../assets/art/calla.webp', '../assets/art/curves.webp', '../assets/art/vase.webp', '../assets/art/block.webp'];

  /* a tiny clock: jobs at a time, ticks every frame */
  let T = 0, last = performance.now(), raf = 0;
  const jobs = [], ticks = new Set();
  const at = (ms, fn) => jobs.push({ t: T + ms, fn });
  function loop(now) {
    const dt = Math.min(64, now - last); last = now; T += dt;
    for (let i = 0; i < jobs.length; i++) if (jobs[i].t <= T) { const j = jobs.splice(i, 1)[0]; i--; j.fn(); }
    ticks.forEach((f) => f(dt));
    raf = requestAnimationFrame(loop);
  }
  const spring = (x, k, c) => ({ x, v: 0, t: x, k, c, step(dt) {
    let s = dt / 1000, n = Math.max(1, Math.ceil(s / 0.008)); s /= n;
    while (n--) { const a = -this.k * (this.x - this.t) - this.c * this.v; this.v += a * s; this.x += this.v * s; }
  } });
  const E = { io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2) };
  function tween(d, f, done) {
    const t0 = T;
    const g = () => { const p = d <= 0 ? 1 : Math.min(1, (T - t0) / d); f(E.io(p)); if (p >= 1) { ticks.delete(g); done && done(); } };
    ticks.add(g); g();
  }

  /* the surface: width and height spring to the size of whatever is inside */
  const W = spring(120, 210, 21), H = spring(60, 210, 21);
  const C = [$('#c1'), $('#c2'), $('#c3'), $('#c4')];
  ticks.add((dt) => {
    W.step(dt); H.step(dt);
    if (RM) { W.x = W.t; H.x = H.t; }
    surf.style.cssText = `width:${W.x.toFixed(2)}px;height:${H.x.toFixed(2)}px;transform:translate(-50%,-50%)`;
  });

  /* old content is clipped away upward, new content is uncovered from below, a piece at a time */
  const pieces = (c) => Array.from(c.children).filter((el) => !el.classList.contains('sm-bar'));
  let cur = -1;
  function show(i) {
    const prev = cur; cur = i;
    const nc = C[i];
    nc.classList.add('is-in');
    W.t = nc.offsetWidth; H.t = nc.offsetHeight;
    $('#count').textContent = `0${i + 1} / 04`;
    if (RM) { C.forEach((c, k) => c.classList.toggle('is-in', k === i)); return; }
    if (prev >= 0 && prev !== i) {
      const oc = C[prev];
      oc.getAnimations({ subtree: true }).forEach((a) => a.cancel());
      pieces(oc).forEach((el, k) => el.animate(
        [{ transform: 'translateY(0)', clipPath: 'inset(0)' }, { transform: 'translateY(-16px)', clipPath: 'inset(0 0 100% 0)' }],
        { duration: 280, delay: k * 30, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }));
      setTimeout(() => { if (cur !== prev) oc.classList.remove('is-in'); }, 280 + 100);
    }
    nc.getAnimations({ subtree: true }).forEach((a) => a.cancel());
    pieces(nc).forEach((el, k) => el.animate(
      [{ transform: 'translateY(18px)', clipPath: 'inset(100% 0 0 0)' }, { transform: 'translateY(0)', clipPath: 'inset(0)' }],
      { duration: 460, delay: (prev >= 0 ? 110 : 0) + k * 60, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'backwards' }));
  }

  /* each status runs its own little progress, then hands on */
  let flow = 0;
  function buildStack(n) {
    const st = $('#stack'); st.innerHTML = ''; st.style.width = (2.6 + (n - 1) * 0.75) + 'em';
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div'); d.className = 'sm-ph'; d.style.left = (i * 0.75) + 'em'; d.style.zIndex = i;
      d.innerHTML = `<img alt="" src="${PICS[i % PICS.length]}">`; st.appendChild(d);
    }
  }
  function build(f) {
    const n = 3;
    buildStack(n); $('#bdT').textContent = `Building ${n} pages`; $('#bdS').textContent = `0 of ${n} pages`; $('#bdBar').style.width = '0%';
    show(0);
    const ph = Array.from($('#stack').children); let done = 0;
    tween(RM ? 0 : 2600, (p) => {
      if (f !== flow) return;
      $('#bdBar').style.width = (p * 100).toFixed(1) + '%';
      const k = Math.min(n, Math.floor(p * n + 0.02));
      while (done < k) { ph[done].classList.add('is-up'); done++; }
      $('#bdS').textContent = `${k} of ${n} pages`;
    }, () => { if (f === flow) at(RM ? 0 : 500, () => { if (f === flow) deploy(f); }); });
  }
  function deploy(f) {
    $('#pct').textContent = '0%'; $('#dFill').style.height = '0%';
    show(1);
    tween(RM ? 0 : 3000, (p) => {
      if (f !== flow) return;
      $('#pct').textContent = Math.round(p * 100) + '%'; $('#dFill').style.height = (p * 100).toFixed(1) + '%';
      $('#dEta').textContent = p < 1 ? `About ${Math.max(1, Math.ceil((1 - p) * 20))} s left` : 'Done';
    }, () => { if (f === flow) at(RM ? 0 : 450, () => { if (f === flow) ready(f); }); });
  }
  function ready(f) {
    show(2);
    if (RM) return;
    at(2400, () => {
      if (f !== flow) return;
      $('#send').animate([{ transform: 'translateY(0)' }, { transform: 'translateY(2px)' }, { transform: 'translateY(0)' }], { duration: 300, easing: 'ease-out' });
      at(260, () => { if (f === flow) live(f); });
    });
  }
  function live(f) { show(3); at(1900, () => { if (f === flow) build(f); }); }

  /* a click skips ahead to the next state */
  surf.addEventListener('click', () => {
    const f = ++flow;
    [() => deploy(f), () => ready(f), () => live(f), () => build(f)][cur]();
  });

  function start() { flow++; jobs.length = 0; if (RM) { buildStack(3); ready(flow); } else build(flow); }
  window.__statusMorph = { restart: () => { cur = -1; C.forEach((c) => c.classList.remove('is-in')); start(); } };
  (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 500))]) : Promise.resolve()).then(start);
  raf = requestAnimationFrame(loop);
})();
</script>
<script>
  QM.demo({ kind: 'loop', restart() { /* the story runs by itself; a click skips ahead */ } });
</script>
</body>
</html>
