/* Product scrub. Picture frame #F5F7F1, ink #0B0C0D, Outfit Light / Geist / Geist Mono. Easings: expo out (.16,1,.3,1), move (.65,0,.35,1). */
.ps-grid { display: grid; grid-template-columns: repeat(3, 228px); gap: 16px; align-items: start; color: #0B0C0D; font: 400 14px/1.3 Geist, system-ui, sans-serif; letter-spacing: -.011em; }
.ps-tile { display: block; }
.ps-pic { position: relative; height: 260px; background: #F5F7F1; overflow: hidden; --cut: 16px;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%); }

/* the four photographs in one strip; the strip slides */
.ps-view { position: absolute; left: 0; top: 0; width: 228px; height: 232px; overflow: hidden; touch-action: pan-y; cursor: ew-resize; outline: 0; }
.ps-strip { display: flex; width: 912px; height: 100%; transform: translateX(calc(var(--i, 0) * -228px)); transition: transform var(--ms, 460ms) cubic-bezier(.16, 1, .3, 1); will-change: transform; }
.ps-strip img { flex: none; width: 228px; height: 232px; object-fit: cover; display: block; user-select: none; -webkit-user-drag: none; }
.ps-chip { position: absolute; left: 12px; top: 12px; padding: 5px 8px 4px; background: #fff; font: 400 13px/1 'Geist Mono', ui-monospace, monospace; letter-spacing: -.01em; pointer-events: none; }
.ps-pic:has(.ps-view:focus-visible) { box-shadow: inset 0 0 0 2px #0B0C0D; }

/* ticks in the picture's foot: they only report where you are */
.ps-ticks { position: absolute; left: 16px; right: 16px; bottom: 0; height: 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; align-content: center; pointer-events: none; }
.ps-ticks i { display: block; height: 3px; background: #ECF0E6; overflow: hidden; }
.ps-ticks b { display: block; height: 100%; background: #0B0C0D; transform: scaleX(0); transform-origin: left; transition: transform 320ms cubic-bezier(.65, 0, .35, 1); }
.ps-ticks i.on b { transform: none; }

.ps-info { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-top: 14px; }

<script data-code>
/* Product scrub. The photo is the band under the pointer; the strip slides, the ticks fill up to it. */
const Scrub = (() => {
  const view = document.getElementById('ps-view'), strip = document.getElementById('ps-strip');
  const ticks = [...document.querySelectorAll('#ps-ticks i')];
  const N = 4;
  let cur = 0, over = false;
  const set = (i, ms) => {
    i = Math.max(0, Math.min(N - 1, i));
    if (i === cur) return;
    cur = i;
    strip.style.setProperty('--ms', ms + 'ms');
    strip.style.setProperty('--i', i);
    ticks.forEach((t, k) => t.classList.toggle('on', k <= i));
    view.setAttribute('aria-label', 'Fold vessel, photo ' + (i + 1) + ' of 4. Move across or use the arrow keys.');
  };
  // client x -> band; null when the pointer is outside the picture
  function at(cx, cy) {
    const r = view.getBoundingClientRect();
    if (cx < r.left || cx >= r.right || cy < r.top || cy >= r.bottom) return null;
    return Math.floor(((cx - r.left) / r.width) * N);
  }
  const back = () => set(0, 360);
  function ghost(x, y) { const b = at(x, y); if (b === null) back(); else set(b, 460); }
  // a real pointer: on the picture only; leaving slides back to the first photo
  view.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') over = true; });
  view.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') over = true; const b = at(e.clientX, e.clientY); if (b !== null) set(b, 460); });
  view.addEventListener('pointerdown', (e) => { const b = at(e.clientX, e.clientY); if (b !== null) set(b, 460); });
  view.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') over = false; if (e.pointerType === 'mouse' || e.pointerType === 'touch') back(); });
  view.addEventListener('pointerup', (e) => { if (e.pointerType === 'touch') back(); });
  view.addEventListener('keydown', (e) => {
    const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    if (d) { e.preventDefault(); set(cur + d, 460); }
  });
  view.addEventListener('blur', back);
  return { view, ghost, back, get over() { return over; } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  // the ghost's hand: [seconds, x, y] as fractions of the picture, stop to stop; it leaves below, comes back along the foot
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ez = QM.bezier(0.65, 0, 0.35, 1);
  const KEYS = [
    [0, 0.12, 1.55], [1.0, 0.12, 0.55], [2.4, 0.12, 0.55],
    [3.3, 0.37, 0.5], [4.7, 0.37, 0.5],
    [5.6, 0.62, 0.55], [7.0, 0.62, 0.55],
    [7.9, 0.88, 0.5], [9.3, 0.88, 0.5],
    [10.2, 0.88, 1.55], [11.2, 0.88, 1.55], [12.2, 0.12, 1.55],
  ];
  const PERIOD = KEYS[KEYS.length - 1][0];
  QM.demo({
    kind: 'pointer',
    move: (x, y, ghost) => { if (ghost && !reduced && !Scrub.over) Scrub.ghost(x, y); },
    leave: () => { if (!Scrub.over) Scrub.back(); },
    path(t) {
      const r = Scrub.view.getBoundingClientRect();
      const u = Math.max(0, t) % PERIOD;
      let i = 0; while (i < KEYS.length - 2 && u >= KEYS[i + 1][0]) i++;
      const a = KEYS[i], b = KEYS[i + 1], p = ez(Math.min(1, Math.max(0, (u - a[0]) / (b[0] - a[0]))));
      // a little drift while it rests, so the hand is never dead still
      const wob = Math.sin(t * 2.1) * 0.012;
      return [r.left + (a[1] + (b[1] - a[1]) * p + wob) * r.width, r.top + (a[2] + (b[2] - a[2]) * p + wob * 2) * r.height];
    },
  });
</script>
