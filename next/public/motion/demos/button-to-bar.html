/* Button to bar: one control, three states, one height */
.bb { --cut: 1.1em; position: relative; display: block; height: 4.5em; width: 16em; padding: 0; border: 0; cursor: pointer; overflow: hidden;
  background: #0B0C0D; color: #f4f5f2; font: 500 1.05em/1 Geist, system-ui, sans-serif; letter-spacing: -.011em;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: width 520ms cubic-bezier(.65, 0, .35, 1), background-color 360ms cubic-bezier(.65, 0, .35, 1), transform 300ms cubic-bezier(.22, 1, .36, 1); }
.bb:active { transform: translateY(2px); transition-duration: 520ms, 360ms, 140ms; }
.bb.press { transform: translateY(2px); }
.bb[data-s='bar'] { width: 11em; background: #E3E8DA; color: #0B0C0D; }
.bb-l { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: .6em; white-space: nowrap;
  transition: transform 480ms cubic-bezier(.16, 1, .3, 1); }
.bb-idle { transform: none; }
.bb[data-s='bar'] .bb-idle, .bb[data-s='done'] .bb-idle, .bb[data-s='idle2'] .bb-idle { transform: translateY(-110%); }
.bb-bar { transform: translateY(110%); }
.bb[data-s='bar'] .bb-bar { transform: none; }
.bb[data-s='done'] .bb-bar, .bb[data-s='idle2'] .bb-bar { transform: translateY(-110%); }
.bb-done { transform: translateY(110%); }
.bb[data-s='done'] .bb-done { transform: none; }
.bb[data-s='idle2'] .bb-done { transform: translateY(-110%); }
.bb-done svg { width: 1.2em; height: 1.2em; fill: none; stroke: #f4f5f2; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }
.bb-done path { stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 480ms cubic-bezier(.16, 1, .3, 1) .2s; }
.bb[data-s='done'] .bb-done path { stroke-dashoffset: 0; }
.bb-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; overflow: hidden; background: #0B0C0D; color: #f4f5f2;
  transition: width 600ms cubic-bezier(.45, 0, .25, 1), background-color 300ms cubic-bezier(.45, 0, .25, 1), color 300ms cubic-bezier(.45, 0, .25, 1); }
.bb-fill.is-lime { background: #B8FF00; color: #0c1300; }

<script data-code>
/* States idle → bar → done, set on data-s. The count is two copies (track and fill), rolled together. */
const BB = (() => {
  const btn = document.getElementById('bb'), fill = document.getElementById('bb-fill');
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;
  const count = (n) => btn.querySelectorAll('.bb-dg > span').forEach((s) => { s.style.transform = `translateY(${-n * 1.2}em)`; });
  const reach = (pct, n, lime) => { fill.style.width = pct + '%'; fill.classList.toggle('is-lime', !!lime); setTimeout(() => count(n), 380); };   // the digit lands as the fill arrives
  function reset() {
    btn.classList.add('nt');
    btn.dataset.s = 'idle';
    fill.style.width = '0%'; fill.classList.remove('is-lime'); count(0);
    void btn.offsetWidth;
    btn.classList.remove('nt');
  }
  async function upload() {
    if (busy) return;
    busy = true;
    if (still) { btn.classList.add('nt'); btn.dataset.s = 'done'; busy = false; return; }
    btn.dataset.s = 'bar';
    await w(620);
    reach(33.3, 1); await w(700);
    reach(66.6, 2); await w(700);
    reach(100, 3, true); await w(900);
    btn.dataset.s = 'done';
    await w(700);
    busy = false;
  }
  async function back() {                  // done rolls up out, then the idle label comes back from below
    btn.dataset.s = 'idle2';
    await w(560);
    reset();
  }
  btn.addEventListener('click', upload);
  return { btn, reset, upload, back, get busy() { return busy; } };
})();
</script>
<script>
  let run = 0, resumeT = 0;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  async function start() {
    const my = ++run;
    while (BB.busy) await w(100);
    BB.reset();
    if (QM.reduced) return;
    QM.ghostShow();
    await w(1000); if (my !== run) return;
    const r = BB.btn.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * .6, r.top + r.height * .6, 800))) return;
    if (my !== run) return;
    BB.btn.classList.add('press');
    await w(160); BB.btn.classList.remove('press');
    if (my !== run) return;
    BB.upload();
    await w(900);
    QM.ghostTo(r.left + r.width + 140, r.top + r.height + 70, 900);
    await w(4000); if (my !== run) return;
    await w(2200); if (my !== run) return;
    await BB.back(); if (my !== run) return;
    start();
  }
  const takeOver = () => { if (QM.tile) return; run++; QM.ghostHide(); clearTimeout(resumeT); resumeT = setTimeout(start, 7000); };
  addEventListener('pointerdown', takeOver, true);
  QM.demo({ kind: 'loop', restart: start });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(start));
</script>
