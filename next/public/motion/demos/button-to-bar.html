/* Button to bar: one control, three states, one height */
.bb { --cut: 1em; position: relative; display: block; height: 4.5em; width: 16em; padding: 0; border: 0; cursor: pointer; overflow: hidden;
  background: #E3E8DA; color: #0B0C0D; font: 500 1em/1 Geist, system-ui, sans-serif; letter-spacing: -.011em;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: width 520ms cubic-bezier(.65, 0, .35, 1), transform 300ms cubic-bezier(.22, 1, .36, 1); }
/* the ink body (with its white labels) is a layer over the sage track: it is drawn back to the left and out again, never faded through grey */
.bb-ink { position: absolute; inset: 0; background: #0B0C0D; clip-path: inset(0);
  transition: clip-path 520ms cubic-bezier(.65, 0, .35, 1), background-color 120ms cubic-bezier(.4, 0, .2, 1); }
.bb[data-s='bar'] .bb-ink { clip-path: inset(0 100% 0 0); }
.bb[data-s='idle']:hover .bb-ink, .bb[data-s='idle'].is-hot .bb-ink, .bb[data-s='done']:hover .bb-ink { background-color: #222427; }
.bb:not([data-s='bar']):active, .bb.press { transform: translateY(2px); transition-duration: 520ms, 100ms; }
.bb[data-s='bar'] { width: 11em; cursor: progress; }
/* the clip-path would cut an outside ring and the layers sit above an outline, so the ring is a layer of its own, inside the button */
.bb:focus-visible { outline: 0; }
.bb:focus-visible::after { content: ''; position: absolute; inset: 6px; z-index: 3; pointer-events: none; background: #f4f5f2; --rc: calc(var(--cut) - 3.5px);
  clip-path: polygon(evenodd, 0 0, calc(100% - var(--rc)) 0, 100% var(--rc), 100% 100%, 0 100%, 0 0,
    2px 2px, 2px calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) calc(var(--rc) + .83px), calc(100% - var(--rc) - .83px) 2px, 2px 2px); }
.bb[data-s='bar']:focus-visible::after { background: #0B0C0D; }
.bb-l { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: .6em; white-space: nowrap;
  transition: transform 480ms cubic-bezier(.16, 1, .3, 1); }
.bb-idle, .bb-done { right: auto; width: 16em; color: #f4f5f2; }              /* a fixed width: the label travels only up or down while the button changes width */
.bb-idle { transform: none; transition-delay: 90ms; }
.bb[data-s='bar'] .bb-idle, .bb[data-s='done'] .bb-idle { transform: translateY(-110%); transition-delay: 0ms; }
.bb[data-s='idle2'] .bb-idle { transform: none; transition-delay: 120ms; }       /* coming back: from below, as the finished label leaves up */

.bb[data-s='done'] .bb-bar, .bb[data-s='idle2'] .bb-bar { transform: translateY(-110%); }

.bb-done svg { width: 1.2em; height: 1.2em; fill: none; stroke: #f4f5f2; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }

<script data-code>
/* States idle → bar → done, set on data-s. The count is two copies (track and fill), rolled together.
   Clicks are ignored while the bar fills (aria-disabled, so focus stays); a click on "done" rolls back. */
const BB = (() => {
  const btn = document.getElementById('bb'), fill = document.getElementById('bb-fill'), say = document.getElementById('bb-say');
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let busy = false;
  const count = (n) => btn.querySelectorAll('.bb-dg > span').forEach((s) => { s.style.transform = `translateY(${-n * 1.5}em)`; });
  const reach = (pct, n, lime) => { fill.style.width = pct + '%'; fill.classList.toggle('is-lime', !!lime); setTimeout(() => count(n), 380); say.textContent = `Uploading, ${n} of 3 files`; };   // the digit lands as the fill arrives
  const label = (t) => btn.setAttribute('aria-label', t);
  function reset() {
    btn.classList.add('nt');
    btn.dataset.s = 'idle';
    fill.style.width = '0%'; fill.classList.remove('is-lime'); count(0);
    label('Upload moodboard'); btn.removeAttribute('aria-disabled'); say.textContent = '';
    void btn.offsetWidth;
    btn.classList.remove('nt');
  }
  async function upload() {
    if (busy || btn.dataset.s !== 'idle') return;
    busy = true;
    btn.setAttribute('aria-disabled', 'true'); label('Uploading');
    if (still) { btn.classList.add('nt'); btn.dataset.s = 'done'; label('3 files uploaded'); say.textContent = '3 files uploaded'; btn.removeAttribute('aria-disabled'); busy = false; return; }
    btn.dataset.s = 'bar';
    await w(620);
    reach(33.3, 1); await w(700);
    reach(66.6, 2); await w(700);
    reach(100, 3, true); await w(900);
    btn.dataset.s = 'done';
    label('3 files uploaded'); say.textContent = '3 files uploaded'; btn.removeAttribute('aria-disabled');
    await w(700);
    busy = false;
  }
  async function back() {                  // done rolls up out, then the idle label comes back from below
    if (busy || btn.dataset.s !== 'done') return;
    busy = true;
    if (still) { reset(); busy = false; return; }
    const idle = btn.querySelector('.bb-idle');             // park the idle label below its sleeve, then let it rise
    idle.style.transition = 'none'; idle.style.transform = 'translateY(110%)'; void idle.offsetWidth;
    idle.style.transition = ''; idle.style.transform = '';
    btn.dataset.s = 'idle2';
    await w(640);
    reset();
    busy = false;
  }
  btn.addEventListener('click', () => (btn.dataset.s === 'done' ? back() : upload()));
  return { btn, reset, upload, back, get busy() { return busy; }, get state() { return btn.dataset.s; } };
})();
</script>
<script>
  let run = 0, resumeT = 0, ghosting = false;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  async function start() {
    const my = ++run;
    while (BB.busy) await w(100);
    if (my !== run) return;
    if (BB.state === 'done') await BB.back(); else BB.reset();   // never snap a finished button: roll it back
    if (my !== run) return;
    ghosting = true;
    if (QM.reduced) { ghosting = false; return; }
    await w(1000); if (my !== run) return;
    QM.ghostShow();                         // after the harness has hidden it for its own start
    const r = BB.btn.getBoundingClientRect();
    if (!(await QM.ghostTo(r.left + r.width * .6, r.top + r.height * .6, 800))) return;
    if (my !== run) return;
    BB.btn.classList.add('is-hot');
    await w(220); if (my !== run) return;
    BB.btn.classList.add('press');
    await w(110); BB.btn.classList.remove('press', 'is-hot');
    if (my !== run) return;
    BB.upload();
    await w(900); if (my !== run) return;
    QM.ghostTo(r.left + r.width + 140, r.top + r.height + 70, 900);
    await w(4000); if (my !== run) return;
    await w(2200); if (my !== run) return;
    await BB.back(); if (my !== run) return;
    start();
  }
  /* a real pointer or key ends the ghost until it has been quiet for 7 s */
  function real(e) {
    if (QM.tile || !e.isTrusted || (e.type === 'pointermove' && e.pointerType !== 'mouse')) return;
    if (ghosting) { ghosting = false; run++; QM.ghostHide(); BB.btn.classList.remove('is-hot', 'press'); }
    clearTimeout(resumeT);
    resumeT = setTimeout(start, 7000);
  }
  ['pointermove', 'pointerdown', 'keydown'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  QM.demo({ kind: 'loop', restart: start });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(start));
</script>
