<script data-code>
/* The word is measured, not guessed: its font-size is whatever makes it fill the page. Its letters rise once;
   the ones near the pointer darken. */
const word = document.getElementById('word');
const text = 'Design. Code. Ship.';
const root = document.documentElement;
word.innerHTML = [...text].map((c, i) => `<span class="fw-l" aria-hidden="true"><i style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</i></span>`).join('');
const ls = [...word.querySelectorAll('i')];
function fitWord() {
  const g = Math.min(64, Math.max(20, innerWidth * 0.04));
  root.style.setProperty('--gutter', g + 'px');
  const fs = parseFloat(getComputedStyle(word).fontSize), w = word.getBoundingClientRect().width || 1;
  const target = innerWidth - 2 * g;
  if (Math.abs(w - target) > 1) root.style.setProperty('--fs', (fs * target / w) + 'px');
}
document.fonts.ready.then(fitWord); document.fonts.addEventListener('loadingdone', fitWord);
new ResizeObserver(fitWord).observe(word); fitWord(); addEventListener('resize', fitWord);

let centers = [];
function measure() { centers = ls.map((n) => { const r = n.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }); }
function near(x, y) {                                       // colour only: letters near the pointer darken
  const R = parseFloat(getComputedStyle(root).getPropertyValue('--fs')) * 0.9;
  measure();
  ls.forEach((n, i) => { const d = Math.hypot(centers[i].x - x, (centers[i].y - y) * 0.5); n.style.setProperty('--n', Math.max(0, 1 - d / R).toFixed(3)); });
}
const calm = () => ls.forEach((n) => n.style.setProperty('--n', 0));
addEventListener('pointermove', (e) => near(e.clientX, e.clientY));
document.addEventListener('pointerleave', calm);
async function enter() { word.classList.remove('is-in'); void word.offsetWidth; await new Promise((r) => setTimeout(r, 80)); word.classList.add('is-in'); }
if (matchMedia('(prefers-reduced-motion: reduce)').matches) word.classList.add('is-in');
else setTimeout(() => word.classList.add('is-in'), 100);
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  /* loop kind: the letters rise, then the ghost walks the word from end to end */
  let passes = 0;
  PickGhost.start({
    moves: true,
    hot: '.fw-signin, .fw-cta',
    reset: calm,
    still: () => { calm(); word.classList.add('is-in'); },
    async script(g) {
      calm();
      if (passes++) await enter();                  // the first pass keeps the entrance the page has just made
      await g.wait(1200);
      const r = word.getBoundingClientRect(), y = r.top + r.height * 0.45;
      await g.to({ x: r.left + 20, y }, { ms: 500 });
      await g.to({ x: r.right - 20, y }, { ms: 3200 });
      await g.to({ x: r.left + r.width * 0.5, y: y - 40 }, { ms: 1000 });
      await g.wait(600);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
