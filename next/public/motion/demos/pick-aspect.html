<style data-code>

.asp { width: 360px; height: 560px; background: var(--surface); border-radius: 14px; padding: 20px; display: grid; grid-template-rows: 300px auto auto; gap: 16px; font-size: 14px; line-height: 1.5; letter-spacing: 0; color: var(--fg); }
.asp-well { position: relative; display: grid; place-items: center; }
.asp-cover { position: relative; overflow: hidden; border-radius: 8px; background: var(--sunk); }
.asp-cover img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; display: block; object-fit: cover; object-position: 62% 50%; -webkit-user-drag: none; }

.asp-pick:hover, .asp-pick.is-hot { background: var(--fill); }

<body>
<span class="qm-hint">Pick a crop</span>
<main class="qm-stage">
<div class="asp-fit" id="fit">
<!-- code -->
<article class="asp" id="card">
  <div class="asp-well"><div class="asp-cover" id="cover"><img src="../assets/art/cross.webp" alt="Forma's Knot stool" draggable="false"></div></div>
  <div class="asp-who"><img src="../assets/art/cross.webp" alt=""><div><h1>Forma · Knot stool</h1><p>Cropped for a print, a post and a story</p></div></div>
  <div class="asp-bar">
    <div class="asp-picks" role="radiogroup" aria-label="Picture crop" id="picks"></div>
    <span class="asp-dims" id="dims"></span>
  </div>
</article>
<!-- /code -->
</div>
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const $ = (s) => document.querySelector(s);
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
/* a cubic-bezier as a function of progress, and a tween that runs one */
const bezier = (x1, y1, x2, y2) => {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    return sy(Math.min(1, Math.max(0, t)));
  };
};
const EASE_OUT = bezier(0.16, 1, 0.3, 1);
const tween = (ms, fn, ease) => new Promise((res) => {
  const t0 = performance.now();
  const f = (now) => { const p = Math.min(1, (now - t0) / ms); fn(ease(p)); if (p < 1) requestAnimationFrame(f); else res(); };
  requestAnimationFrame(f);
});

/* the three crops hold one area: every one fits inside a 300 square */
const A = 300 * 225;
const SHAPES = [
  { id: 'land', label: '4:3', name: 'Print', w: Math.sqrt(A * 4 / 3), h: Math.sqrt(A * 3 / 4) },
  { id: 'square', label: '1:1', name: 'Post', w: Math.sqrt(A), h: Math.sqrt(A) },
  { id: 'tall', label: '3:4', name: 'Story', w: Math.sqrt(A * 3 / 4), h: Math.sqrt(A * 4 / 3) },
];
const mark = (s) => { const k = 14 / Math.sqrt(s.w * s.h); const w = s.w * k, h = s.h * k; return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="${(16 - w) / 2}" y="${(16 - h) / 2}" width="${w}" height="${h}" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`; };
const picks = $('#picks');
picks.innerHTML = SHAPES.map((s, i) => `<button class="asp-pick" type="button" role="radio" aria-checked="${i === 1}" aria-label="${s.name}, ${s.label}" data-i="${i}">${mark(s)}${s.label}</button>`).join('');
const cover = $('#cover'), dims = $('#dims');
let cur = { w: SHAPES[1].w, h: SHAPES[1].h }, at = 1, token = 0;
function paint() {
  cover.style.width = cur.w + 'px'; cover.style.height = cur.h + 'px';
  dims.textContent = Math.round(cur.w * 4) + ' × ' + Math.round(cur.h * 4);
}
async function pick(i) {
  if (i === at) return; at = i;
  [...picks.children].forEach((b, j) => b.setAttribute('aria-checked', j === i));
  const from = { ...cur }, to = SHAPES[i], my = ++token;
  if (still) { cur.w = to.w; cur.h = to.h; paint(); return; }
  await tween(520, (k) => { if (my !== token) return; cur.w = from.w + (to.w - from.w) * k; cur.h = from.h + (to.h - from.h) * k; paint(); }, EASE_OUT);
}
picks.addEventListener('click', (e) => { const b = e.target.closest('.asp-pick'); if (b) pick(+b.dataset.i); });
picks.addEventListener('keydown', (e) => {
  const d = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key]; if (!d) return;
  e.preventDefault(); const i = (at + d + 3) % 3; pick(i); picks.children[i].focus();
});
paint();
</script>
<script src="../assets/picks/p3-ghost.js"></script>
<script>
  /* loop kind: the ghost picks the landscape crop, then the portrait one, then back to the square */
  PickGhost.fit($('#fit'), 360, 560, { max: 1.4 });
  PickGhost.start({
    hot: '.asp-pick',
    reset: () => { token++; at = 1; cur = { w: SHAPES[1].w, h: SHAPES[1].h }; [...picks.children].forEach((b, j) => b.setAttribute('aria-checked', j === 1)); paint(); },
    still: () => {},
    async script(g) {
      await g.wait(900);
      await g.click(picks.children[0], { ms: 700 }); await g.wait(1500);
      await g.click(picks.children[2], { ms: 600 }); await g.wait(1700);
      await g.click(picks.children[1], { ms: 600 }); await g.wait(1200);
    },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
</body>
