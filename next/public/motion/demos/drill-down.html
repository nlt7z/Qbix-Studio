      } else { H.mode = 'off'; kick(); return; }
    }
    if (H.mode !== 'drag') return;
    const raw = (ev.clientX - H.ax) / sc, d = depth();
    H.raw = raw;
    H.rows.push([ev.timeStamp, raw]);
    while (H.rows.length > 2 && ev.timeStamp - H.rows[0][0] > 100) H.rows.shift();
    S.x = reduced ? 0 : raw >= 0 ? (d >= 1 ? Math.min(raw, W) : rb(raw, W)) : -rb(-raw, W);
    kick();
  }, { passive: true });
  function up(ev, cancel) {
    if (!H || ev.pointerId !== H.id) return;
    const h = H; H = null; pressIdx = -1;
    if (h.mode === 'drag') {
      const v = cancel ? 0 : vel(h.rows, ev.timeStamp), commit = !cancel && depth() >= 1 && (h.raw > W / 3 || (v > 500 && h.raw > 0));
      S.drag = false; S.v = reduced ? 0 : v; S.on = true; peekOn = peekOn && !reduced;
      if (commit) back(false); else kick();
      setTimeout(() => { swallow = 0; }, 60);
    }
    kick();
  }
  addEventListener('pointerup', (ev) => up(ev, false));
  addEventListener('pointercancel', (ev) => up(ev, true));
  view.addEventListener('touchmove', (ev) => { if (H && H.mode === 'drag' && ev.cancelable) ev.preventDefault(); }, { passive: false });
  view.addEventListener('dragstart', (ev) => ev.preventDefault());
  view.addEventListener('click', (ev) => {
    if (swallow) { ev.stopPropagation(); ev.preventDefault(); swallow = 0; return; }
    const r = rowOf(ev.target);
    if (!r || sh[r.s] !== front() || !isRest()) return;
    const row = front().rows[r.i];
    if (row.open) open(r.i, ev.isTrusted && ev.detail === 0);
  }, true);
  slotsEl.addEventListener('click', (ev) => { const b = ev.target.closest('.dd-crumb'); if (b) popTo(+b.dataset.s); });

  /* ---- keys: Up and Down move, Enter or Right opens, Left, Backspace and Escape go up ---- */
  addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    const k = ev.key, ae = document.activeElement, inCard = card.contains(ae) || ae === document.body || ae === document.documentElement;
    if (!inCard) return;
    if (k === 'Escape' || k === 'Backspace' || k === 'ArrowLeft') { if (back(true)) ev.preventDefault(); return; }
    if (!isRest() && !held) { if ((k === 'ArrowRight' || k === 'Enter') && PH.goal === 0 && e + 1 < path.length) { ev.preventDefault(); open(K, true); } return; }
    const f = front(), i = f.rows.findIndex((r) => r.btn === ae), n = level().n;
    let to = -1;
    if (k === 'ArrowDown') to = i < 0 ? 0 : Math.min(n - 1, i + 1);
    else if (k === 'ArrowUp') to = i < 0 ? n - 1 : Math.max(0, i - 1);
    else if (k === 'Home') to = 0; else if (k === 'End') to = n - 1;
    else if (k === 'ArrowRight') { if (i >= 0 && f.rows[i].open) { ev.preventDefault(); open(i, true); } return; }

    ev.preventDefault();
    if (held) release();
    rove(to); f.rows[to].btn.focus({ preventScroll: true });
  });
  card.addEventListener('focusin', (ev) => {
    const r = rowOf(ev.target);
    if (!r || sh[r.s] !== front()) return;
    rove(r.i);
    if (ev.target.matches(':focus-visible')) { setFocus(r.i, 'key'); const it = front().rows[r.i].it; if (it) say(`${it.name}, ${fmt(it.v)}, ${Math.round((it.v * 100) / level().total)}% of ${level().title}${front().rows[r.i].open ? '. Press Enter to open' : ''}`); }
  });
  card.addEventListener('focusout', (ev) => { if (fsrc === 'key' && !(ev.relatedTarget && rowOf(ev.relatedTarget))) setFocus(-1); });

  /* ---- the key frame: played, not drawn. Food is pressed and the open stepped through at 60 Hz until it has settled (the tile), or to 0.60 s and then left to run (the detail view) ---- */
  function pose(hold) {
    cancelAnimationFrame(raf); raf = 0;
    held = false; pops = 0; kbdPending = false; H = null; peekOn = false;
    path = [TOP]; e = 0; ia = 0; K = 1;
    PH.x = PH.v = PH.rt = PH.goal = 0; S.x = S.v = 0; S.on = S.drag = false; pressIdx = -1; fsrcClear();
    fillSheet(sh[0], TOP);
    sh.forEach((s) => { s.list.classList.remove('is-front'); });
    const food = TOP.items[1];
    path[1] = levelOf(food, TOP, 1);
    if (reduced) {
      fillSheet(sh[1], path[1]); PH.x = PH.goal = T; PH.rt = T;
      render(); ended(); return;
    }
    fillSheet(sh[1], path[1]);
    PH.goal = hold ? T : POSE;
    ff(hold ? 2.4 : 1.6);
    if (hold) { fi = 1; fsrc = 'pose'; ff(0.5); } else { setGoal(T); fillTable(TOP); }
    render();
  }
  measure();
  fillSheet(sh[0], TOP);
  render();
  const api = {
    pose, open, back, popTo, release, setFocus, measure, render, advance, ff, kick, PH, S, sh, TOP, T, W, X0, LEN, P, ROW0, BH,
    get held() { return held; }, get e() { return e; }, get K() { return K; }, get path() { return path; }, get depth() { return depth(); }, get rest() { return isRest(); }, get front() { return front(); },
    get focus() { return fi; }, slot: (s) => slots[s].b, level, win, T0: 0, crumbs: slots, titleCol, totalCol, shareEl, ctx, peek, peekIn, view,
    scale: () => sc, letGo() { if (fsrc === 'ghost' || fsrc === 'pose') setFocus(-1); },
  };
  return api;
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('dd-fit');
  // the card is drawn 600 px wide and 440 tall and scaled to the room it is given
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    let s = Math.max(0.5, Math.min((0.82 * W) / 600, (H - 2 * pad - ui) / 440, 1.5));
    s = Math.round(s * 100) / 100;
    fit.style.setProperty('--s', s.toFixed(2));
    DD.measure(); DD.render();
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);

  /* the ghost: it moves a pointer and presses what a hand presses (the same events on the same handlers) */
  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const fire = (type, x, y, Ctor = PointerEvent) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 75, isPrimary: true, button: 0, view: window }));
    return t;
  };
  async function glide(my, to, ms = 760) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.88 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y }; fire('pointermove', x, y);
      if (p >= 1) break;
    }
  }
  const mid = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  async function tap(my) {
    const { x, y } = pos, el = fire('pointerdown', x, y);
    await gap(my, 120);
    fire('pointerup', x, y);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  }
  const sheetRow = (i) => DD.front.rows[i].btn;
  const until = async (my, f, max = 4000) => { const t0 = performance.now(); while (!f()) { await raf(); if (my !== epoch) throw 0; if (performance.now() - t0 > max) break; } };
  async function openRow(my, i, ms = 760) { const b = sheetRow(i).querySelector('.dd-bar'), p = mid(b, 0.3); await glide(my, { x: p.x, y: p.y }, ms); await gap(my, 220); await tap(my); await until(my, () => DD.rest); }
  async function swipe(my, dx = 270, ms = 420) {
    const v = DD.view.getBoundingClientRect(), s = DD.scale(), x0 = v.left + 70 * s, y0 = v.top + 150 * s;
    await glide(my, { x: x0, y: y0 }, 620); await gap(my, 140);
    fire('pointerdown', x0, y0);
    const t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), x = x0 + dx * s * (1 - Math.pow(1 - p, 2.2));
      QM.ghostAt(x, y0); pos = { x, y: y0 }; fire('pointermove', x, y0);
      if (p >= 1) break;
    }
    fire('pointerup', pos.x, pos.y);
    await until(my, () => DD.rest);
  }
  async function toTop(my) { while (DD.depth > 0) { const b = DD.slot(0); await glide(my, mid(b), 700); await gap(my, 160); await tap(my); await gap(my, 100); await until(my, () => DD.rest); await gap(my, 500); } }
  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile || QM.live ? 5000 : 3000) : 700);
      QM.ghostShow();
      if (DD.held) { DD.release(); await until(my, () => DD.rest); await gap(my, 1100); }
      for (;;) {
        if (DD.depth > 0 && DD.level().title !== 'Food') await toTop(my);
        if (DD.depth === 0) { await openRow(my, 1); await gap(my, 1200); }                   // Food
        if (DD.depth === 2) { await glide(my, mid(DD.slot(1)), 700); await gap(my, 160); await tap(my); await until(my, () => DD.rest); await gap(my, 700); }
        await openRow(my, 1); await gap(my, 1100);                                          // Restaurants
        await glide(my, mid(DD.slot(1)), 700); await gap(my, 200); await tap(my); await until(my, () => DD.rest); await gap(my, 800);   // pop by the crumb
        await swipe(my); await gap(my, 900);                                                // pop by a swipe
        await openRow(my, 0); await gap(my, 1200);                                          // Housing
        await glide(my, { x: mid(DD.view).x, y: mid(DD.view).y }, 500);
        card.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true })); await until(my, () => DD.rest); await gap(my, 1300);   // back, by key
        DD.setFocus(-1, 'ghost');
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  const card = document.getElementById('dd-card');
  function stopScript() { epoch++; QM.ghostHide(); pos = null; DD.letGo(); }
  if (!QM.tile && !reduced) {
    const busyHand = () => card.matches(':hover') || (card.contains(document.activeElement) && document.activeElement !== document.body);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                                // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  const hold = () => QM.tile || QM.live;
  QM.demo({ kind: 'loop', restart() { stopScript(); DD.pose(hold()); if (!reduced) script(true); } });
  DD.pose(hold());
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => script(true), 300));
})();
</script>
