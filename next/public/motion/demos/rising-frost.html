<style data-code>
/* Rising frost. A frosted sheet; its blur grows with its height (--h, 0 to 1). */
.rf { --h: 0; --cut: 16px;
  --rf-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  position: absolute; left: 0; right: 0; bottom: 0; height: 180px;
  transform: translateY(calc((1 - var(--h)) * 100%));
  background: rgba(255, 255, 255, .5);
  -webkit-backdrop-filter: blur(calc(3px + var(--h) * 31px)) saturate(1.3); backdrop-filter: blur(calc(3px + var(--h) * 31px)) saturate(1.3);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  color: #0B0C0D; font-family: 'Geist', Geist, sans-serif; }
.rf::after { content: ''; position: absolute; inset: 0; background: var(--rf-grain) 0 0 / 140px; opacity: .12; pointer-events: none; }
.rf::before { content: ''; position: absolute; inset: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); pointer-events: none; z-index: 2; }

<script data-code>
(function () {
  const rf = document.getElementById('rf'), grip = document.getElementById('rfGrip');
  const expoOut = (t) => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);          // ~ cubic-bezier(.16, 1, .3, 1)
  const move = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;  // move easing
  let h = 0, raf = 0, drag = false;
  function set(v) { h = Math.max(0, Math.min(1, v)); rf.style.setProperty('--h', h.toFixed(4)); }
  function go(to, ms, ease) {
    cancelAnimationFrame(raf);
    const from = h, t0 = performance.now();
    return new Promise((res) => {
      (function step(now) {
        const t = Math.min(1, (now - t0) / ms);
        set(from + (to - from) * ease(t));
        if (t < 1) raf = requestAnimationFrame(step); else res();
      })(t0);
    });
  }
  const rise = () => go(1, 1600, expoOut), sink = () => go(0, 1100, move);
  grip.addEventListener('pointerdown', (e) => { drag = true; grip.setPointerCapture(e.pointerId); cancelAnimationFrame(raf); });
  grip.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const box = rf.parentNode.getBoundingClientRect(), k = box.height / rf.parentNode.offsetHeight;
    set((box.bottom - e.clientY + 15 * k) / (rf.offsetHeight * k));
  });
  const end = () => { drag = false; };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
  window.RisingFrost = { set, rise, sink, go, get h() { return h; }, get dragging() { return drag; } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  let lastReal = -1e9, running = false, stop = false;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const busy = () => RisingFrost.dragging || (!QM.tile && performance.now() - lastReal < 4000);
  async function nap(ms) { const t0 = performance.now(); while (performance.now() - t0 < ms) { await wait(80); if (busy()) throw 0; } }
  if (QM.reduced) RisingFrost.set(1);
  else {
    if (!QM.tile) ['pointerdown', 'pointermove', 'keydown'].forEach((n) => addEventListener(n, (e) => {
      if (!e.isTrusted || (n === 'pointermove' && e.pointerType !== 'mouse' && !RisingFrost.dragging)) return;
      if (n === 'pointermove' && !RisingFrost.dragging) return;
      lastReal = performance.now(); if (running) { stop = true; }
    }, { capture: true, passive: true }));
    (async function idle() {
      await wait(500);
      for (;;) {
        await wait(200);
        if (document.hidden || busy()) continue;
        running = true; stop = false;
        try {
          if (RisingFrost.h > .02) await RisingFrost.sink();
          await nap(700); await RisingFrost.rise(); await nap(2400); await RisingFrost.sink(); await nap(1000);
        } catch (e) { if (e !== 0) throw e; }
        running = false;
      }
    })();
  }
  QM.demo({ kind: 'loop', restart() { lastReal = -1e9; RisingFrost.set(0); } });
</script>
