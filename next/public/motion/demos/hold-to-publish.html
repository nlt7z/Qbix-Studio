<script data-code>
/* Hold to publish. A tiny state machine: idle → hold → (drain → idle | done → reset → idle). */
const hpBtn = document.getElementById('hp-btn');
const hpFill = document.getElementById('hp-fill');
const HOLD = 1200, DRAIN = 400, RESET = 450, STAY = 2200;
let hpP = 0, hpMode = 'idle', hpRaf = 0, hpLast = 0, hpRate = 1 / DRAIN, hpStay = 0;

function hpFrame(now) {
  const dt = Math.min(64, now - hpLast); hpLast = now;
  if (hpMode === 'hold') { hpP = Math.min(1, hpP + dt / HOLD); if (hpP >= 1) hpComplete(); }
  else if (hpMode === 'drain') { hpP = Math.max(0, hpP - dt * hpRate); if (hpP <= 0) hpMode = 'idle'; }
  hpFill.style.setProperty('--p', hpP);
  hpRaf = (hpMode === 'hold' || hpMode === 'drain') ? requestAnimationFrame(hpFrame) : 0;
}
function hpKick() { if (!hpRaf) { hpLast = performance.now(); hpRaf = requestAnimationFrame(hpFrame); } }
function hpStart() {
  if (hpMode === 'done') return;
  hpMode = 'hold'; hpKick();
}
function hpRelease() {
  if (hpMode !== 'hold') return;
  hpMode = 'drain'; hpRate = 1 / DRAIN; hpKick();
}
function hpComplete() {
  hpMode = 'done'; hpP = 1;
  hpBtn.classList.add('is-done', 'is-press');
  setTimeout(() => hpBtn.classList.remove('is-press'), 160);
  hpStay = setTimeout(hpReset, STAY);
}
function hpReset() {
  clearTimeout(hpStay);
  hpBtn.classList.remove('is-done', 'is-press');
  hpMode = 'drain'; hpRate = 1 / RESET; hpKick();
}
hpBtn.addEventListener('pointerdown', (e) => { hpBtn.setPointerCapture(e.pointerId); hpStart(); });
hpBtn.addEventListener('pointerup', hpRelease);
hpBtn.addEventListener('pointercancel', hpRelease);
hpBtn.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); hpBtn.classList.add('is-press'); hpStart(); } });
hpBtn.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') { hpBtn.classList.remove('is-press'); hpRelease(); } });
hpBtn.addEventListener('pointerdown', () => { if (hpMode === 'hold') hpBtn.classList.add('is-press'); });
['pointerup', 'pointercancel'].forEach((n) => hpBtn.addEventListener(n, () => { if (hpMode !== 'done') hpBtn.classList.remove('is-press'); }));
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  let epoch = 0, resumeT = 0;
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const aim = () => { const r = hpBtn.getBoundingClientRect(); return [r.left + r.width * 0.5, r.top + r.height * 0.6]; };
  const press = (on) => hpBtn.classList.toggle('is-press', on);
  function reset() { clearTimeout(hpStay); hpMode = 'idle'; hpP = 0; hpFill.style.setProperty('--p', 0); hpBtn.classList.remove('is-done', 'is-press'); }
  async function script() {
    const my = ++epoch;
    try {
      QM.ghostShow();
      for (;;) {
        await gap(my, 700);
        const [x, y] = aim();
        await QM.ghostTo(x, y, 800);
        await gap(my, 250);
        press(true); hpStart();                      // too short: 600 ms
        await gap(my, 600);
        press(false); hpRelease();
        await gap(my, 1000);
        press(true); hpStart();                      // the whole hold
        await gap(my, 1450);
        press(false); hpRelease();
        await gap(my, 2900);                         // Published, then the reset
        await QM.ghostTo(x + 90, y + 70, 600);
        await gap(my, 900);
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); }
  if (!QM.tile && !reduced) {
    const touch = (e) => {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(() => { if (hpMode === 'idle' && !hpBtn.matches(':hover')) { reset(); script(); } else touch({}); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}), { passive: true });
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); reset(); if (!reduced) script(); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(script, 300));
})();
</script>
