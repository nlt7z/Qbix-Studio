<script data-code>
/* ---- lib/scene/quiet.ts — whether the page is being scrolled right now. The generative drawings
   hold still while it is, so the scroll keeps every frame (they pick up again once it stops). */
let lastScroll = -1e9;
let listening = false;
function scrolling() {
  if (!listening) {
    listening = true;
    window.addEventListener('scroll', () => (lastScroll = performance.now()), { passive: true });
  }
  return performance.now() - lastScroll < 180;
}

/* ---- components/scene/Generative.tsx · useArt — one canvas, drawn at its own device pixels (or at
   `density`) the first time it comes on the screen; one that moves is redrawn a few frames a second
   while it is on the screen, the tab is open and the page isn't being scrolled; a still for reduced motion.
   paint(g, W, H, k, t): k is canvas pixels per css pixel, t seconds. */
function art(cv, paint, { moves = false, fps = 24, density, ratio } = {}) {
  const g = cv.getContext('2d');
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const live = moves && !calm;
  const t0 = performance.now();
  let W = 0, H = 0, k = 1, seen = false, raf = 0, last = -1e9, stale = true;
  const loop = (now) => {
    raf = 0;
    if (!seen || document.hidden || !W) return;
    if (stale || (live && now - last >= 1000 / fps - 2 && !scrolling())) {
      last = now;
      stale = false;
      paint(g, W, H, k, live ? (now - t0) / 1000 : 0);
    }
    if (live) raf = requestAnimationFrame(loop);
  };
  const wake = () => { if (!raf && seen) raf = requestAnimationFrame(loop); };
  const again = () => { stale = true; wake(); };
  const size = (w, h) => {
    if (w < 2 || h < 2 || (w === W && h === H)) return;
    W = cv.width = w;
    H = cv.height = h;
    k = W / Math.max(1, cv.clientWidth);
    stale = true;
    wake();
  };
  const ro = new ResizeObserver(([e]) => {
    const d = e.devicePixelContentBoxSize?.[0];
    if (density) size(Math.round(e.contentRect.width * density), Math.round(e.contentRect.height * density));
    // (added for a gallery tile: `ratio` canvas pixels a css pixel as drawn on the screen, whatever the zoom)
    else if (ratio) { const r = cv.getBoundingClientRect(); size(Math.round(r.width * ratio), Math.round(r.height * ratio)); }
    else if (d) size(d.inlineSize, d.blockSize);
    else size(Math.round(e.contentRect.width * devicePixelRatio), Math.round(e.contentRect.height * devicePixelRatio));
  });
  try { ro.observe(cv, { box: 'device-pixel-content-box' }); } catch { ro.observe(cv); }
  const io = new IntersectionObserver(([e]) => { seen = e.isIntersecting; wake(); });
  io.observe(cv);
  document.addEventListener('visibilitychange', wake);
  return {
    again,
    stop() {
      ro.disconnect();
      io.disconnect();
      document.removeEventListener('visibilitychange', wake);
      if (raf) cancelAnimationFrame(raf);
    },
  };
}

const ground = (g, W, H, c) => {
  if (c) {
    g.fillStyle = `rgb(${c})`;
    g.fillRect(0, 0, W, H);
  } else g.clearRect(0, 0, W, H);
};

/* ---- Halftone: a picture as dots, each as big as what is there ------------------------------
   src · ink · bg · cell (the dots' pitch, in css px) · pos (the picture's crop: which part of it stays
   in view, as object-position) · gamma · mode:
     'ink'    a dot is as big as the ink the pixel would take: 1 minus its dimmest channel, stretched between
              `black` and `white`. Ink dots on white, for a bright render: lime takes full ink, white none.
     'light'  a dot is as big as the light there (the site's own: lime dots on the post's ink). */
function halftone(cv, { src, ink = '18, 20, 23', bg = '255, 255, 255', cell = 4.5, pos = [0.5, 0.5], mode = 'ink', gamma = mode === 'light' ? 1.2 : 1, black = 0.04, white = 0.86, moves = false, fps = 20, ratio } = {}) {
  let img = null;
  let grid = null;
  const a = art(cv, (g, W, H, k, t) => {
    ground(g, W, H, bg);
    const im = img;
    if (!im || !im.complete || !im.naturalWidth) return;
    const c = cell * k;
    const cols = Math.ceil(W / c), rows = Math.ceil(H / c);
    let gr = grid;
    if (!gr || gr.W !== W || gr.H !== H) {
      // the picture, cropped to cover, read at one pixel a dot
      const off = document.createElement('canvas');
      off.width = cols;
      off.height = rows;
      const o = off.getContext('2d', { willReadFrequently: true });
      const s = Math.max(cols / im.naturalWidth, rows / im.naturalHeight);
      const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
      o.drawImage(im, (cols - dw) * pos[0], (rows - dh) * pos[1], dw, dh);
      const px = o.getImageData(0, 0, cols, rows).data;
      const amt = new Float32Array(cols * rows);   // how big each dot wants to be, 0 to 1
      for (let i = 0; i < cols * rows; i++) {
        const R = px[i * 4], G = px[i * 4 + 1], B = px[i * 4 + 2];
        amt[i] = mode === 'light'
          ? (0.2126 * R + 0.7152 * G + 0.0722 * B) / 255
          : 1 - Math.min(1, Math.max(0, (Math.min(R, G, B) / 255 - black) / (white - black)));
      }
      gr = grid = { W, H, cols, rows, amt };
    }
    g.fillStyle = `rgb(${ink})`;
    g.beginPath();
    for (let j = 0; j < rows; j++)
      for (let i = 0; i < cols; i++) {
        const l = Math.pow(gr.amt[j * cols + i], gamma);
        const wave = moves ? 1 + 0.16 * Math.sin((i + j) * 0.42 - t * 1.8) : 1;
        const r = (c / 2) * Math.min(1, Math.sqrt(l) * wave) * 0.96;
        if (r < 0.35 * k) continue;
        const x = (i + 0.5) * c, y = (j + 0.5) * c;
        g.moveTo(x + r, y);
        g.arc(x, y, r, 0, Math.PI * 2);
      }
    g.fill();
  }, { moves, fps, ratio });
  const im = new Image();
  im.decoding = 'async';
  im.onload = () => {
    img = im;
    grid = null;
    a.again();   // the picture has loaded: draw again
  };
  im.src = src;
  return { again: a.again, stop() { im.onload = null; a.stop(); } };
}

/* The mark in dots: one of the object renders, ink on white, each dot as big as the ink there (the Brand upgrade's last step) */
let mark = halftone(document.querySelector('.lst-gen .gen'), {
  src: '../assets/art/objects.webp', ink: '18, 20, 23', bg: '255, 255, 255', cell: 3.6, pos: [0.6, 0.5], moves: true, fps: 12,
});

  };
  const cv = document.querySelector('.lst-gen .gen');
  const label = document.querySelector('.lst-label');
  const st = { pic: 'objects', cell: 3.6, moves: true };
  const LABELS = { objects: 'The mark', cross: 'The icon' };
  const POS = { objects: [0.6, 0.5], cross: [0.55, 0.5] };   // which part of each render stays in the post
  function mount() {
    mark.stop();
    mark = halftone(cv, {
      src: PICS[st.pic], ink: '18, 20, 23', bg: '255, 255, 255', cell: st.cell,
      pos: POS[st.pic],
      moves: st.moves, fps: st.moves && st.cell === 3.6 ? 12 : 20,
      ratio: QM.tile ? 1 : undefined,                       // a gallery tile: one canvas pixel a css pixel
    });
    label.textContent = LABELS[st.pic];
  }
  // the post is laid out at its own size (111 px) and zoomed to its box, as the scenes are
  const box = document.getElementById('post-box'), scn = document.getElementById('post-scn');
  const fit = () => { const k = Math.min(box.clientWidth / 111, box.clientHeight / 111); if (k > 0) scn.style.setProperty('zoom', String(Math.round(k * 1000) / 1000)); };
  fit();
  new ResizeObserver(fit).observe(box);
  mount();
  const on = (sel, key, fn) => document.querySelectorAll(sel).forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll(sel).forEach((x) => x.classList.toggle('is-on', x === b));
    fn(b.dataset[key]);
  }));
  on('[data-pic]', 'pic', (v) => { st.pic = v; mount(); });
  on('[data-cell]', 'cell', (v) => { st.cell = Number(v); mount(); });
  on('[data-moves]', 'moves', (v) => { st.moves = v === '1'; mount(); });
  QM.demo({ kind: 'loop', restart: mount });
</script>
