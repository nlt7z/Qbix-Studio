<style data-code>
/* One tooltip for a whole toolbar: it travels, its words roll, its box follows the words. */
.tb { position: relative; display: inline-flex; gap: 4px; padding: 8px; background: var(--fg, #0B0C0D); }
.tb-btn { all: unset; box-sizing: border-box; width: 64px; height: 64px; display: grid; place-items: center; cursor: pointer; color: var(--ground, #ffffff); transition: background 120ms var(--ease, cubic-bezier(.4, 0, .2, 1)), color 120ms var(--ease, cubic-bezier(.4, 0, .2, 1)), transform 160ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.tb-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: miter; stroke-linecap: square; }
.tb-btn.is-hot { background: rgba(244, 245, 242, 0.14); }
.tb-btn[aria-pressed='true'] { background: var(--signal, #B8FF00); color: var(--on-lime, #0c1300); }
.tb-btn:active { transform: translateY(2px); }
.tb-btn:focus-visible { outline: 2px solid var(--ground, #ffffff); outline-offset: -6px; }
.tt {
  position: absolute; bottom: calc(100% + 10px); left: 0; z-index: 3; pointer-events: none;
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 8px 0 14px; background: var(--fg, #0B0C0D); color: var(--ground, #ffffff);
  font: 500 14px/1 var(--font-sans, 'Geist', sans-serif); letter-spacing: -0.005em; white-space: nowrap;
  transform: translateX(-50%); --cut: 10px;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  transition: left 300ms var(--ease-move, cubic-bezier(.65, 0, .35, 1));
}
.tt.is-off { visibility: hidden; clip-path: polygon(0 100%, calc(100% - var(--cut)) 100%, 100% 100%, 100% 100%, 0 100%); transition: clip-path 180ms var(--ease-in, cubic-bezier(.5, 0, .75, 0)), visibility 0s 180ms; }
.tt:not(.is-off) { transition: left 300ms var(--ease-move, cubic-bezier(.65, 0, .35, 1)), clip-path 260ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.tt-slot { position: relative; display: block; height: 18px; overflow: hidden; transition: width 300ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.tt-slot > span { position: absolute; left: 0; top: 0; height: 18px; line-height: 18px; white-space: nowrap; transition: transform 280ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.tt-slot > .is-in { transform: translateY(0); }
.tt-slot > .is-out { transform: translateY(-110%); }
.tt-slot > .is-park { transition: none; transform: translateY(110%); }
.tt-key { height: 24px; padding: 0 7px; display: grid; place-items: center; background: rgba(244, 245, 242, 0.16); }
.tt-key .tt-slot { height: 14px; }
.tt-key .tt-slot > span { height: 14px; line-height: 14px; font: 500 11px/14px var(--font-mono, 'Geist Mono', sans-serif); letter-spacing: 0; }
@media (prefers-reduced-motion: reduce) { .tt, .tt-slot, .tt-slot > span { transition: none !important; } }
</style>

<script data-code>
(function () {
  const tb = document.getElementById('tb'), tt = document.getElementById('tt');
  const btns = [...tb.querySelectorAll('.tb-btn')];
  const slots = { l: document.getElementById('tt-l'), k: document.getElementById('tt-k') };
  const SHOW = 350, HIDE = 250;
  let cur = null, open = false, tShow = 0, tHide = 0;

  // roll a slot to a new word: the old one leaves up, the new one rises from below, the slot glides to its width
  function roll(slot, text, instant) {
    const old = slot.querySelector('.is-in');
    if (old && old.textContent === text) return;
    const n = document.createElement('span'); n.textContent = text; n.className = 'is-park';
    slot.appendChild(n);
    const w = n.offsetWidth; void n.offsetWidth;
    if (instant) { slot.style.transition = 'none'; slot.style.width = w + 'px'; void slot.offsetWidth; slot.style.transition = ''; if (old) old.remove(); n.className = 'is-in'; return; }
    n.className = 'is-in'; slot.style.width = w + 'px';
    if (old) { old.className = 'is-out'; setTimeout(() => old.remove(), 320); }
  }
  function point(b, instant) {
    roll(slots.l, b.dataset.tip, instant); roll(slots.k, b.dataset.key, instant);
    const bx = b.offsetLeft + b.offsetWidth / 2;
    if (instant) { tt.style.transition = 'none'; tt.style.left = bx + 'px'; void tt.offsetWidth; tt.style.transition = ''; } else tt.style.left = bx + 'px';
  }
  function over(b) {
    clearTimeout(tHide);
    if (b === cur) return;
    if (cur) cur.classList.remove('is-hot');
    cur = b; b.classList.add('is-hot');
    if (open) { point(b, false); return; }
    clearTimeout(tShow);
    tShow = setTimeout(() => { point(b, true); open = true; tt.classList.remove('is-off'); tt.setAttribute('aria-hidden', 'false'); }, SHOW);
  }
  function out() {
    clearTimeout(tShow); clearTimeout(tHide);
    tHide = setTimeout(() => { if (cur) cur.classList.remove('is-hot'); cur = null; open = false; tt.classList.add('is-off'); tt.setAttribute('aria-hidden', 'true'); }, HIDE);
  }
  // pointer in client px; the toolbar's tiles are the hit areas
  function move(x, y) {
    const r = tb.getBoundingClientRect();
    if (x < r.left || x > r.right || y < r.top || y > r.bottom) { if (cur || open || tShow) out(); return; }
    const b = btns.find((e) => { const q = e.getBoundingClientRect(); return x >= q.left && x < q.right + 4; });
    if (b) over(b);
  }
  tb.addEventListener('pointermove', (e) => move(e.clientX, e.clientY));
  tb.addEventListener('pointerleave', out);
  btns.forEach((b) => { b.addEventListener('click', () => btns.forEach((o) => o.setAttribute('aria-pressed', o === b))); b.addEventListener('focus', () => { if (b.matches(':focus-visible')) over(b); }); b.addEventListener('blur', out); });
  window.Tips = { move, out, tb, reset() { clearTimeout(tShow); clearTimeout(tHide); if (cur) cur.classList.remove('is-hot'); cur = null; open = false; tt.classList.add('is-off'); } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  // the ghost's route: out of frame, then tool to tool with a dwell on each, and away again
  const ez = QM.bezier(0.65, 0, 0.35, 1);
  const STOPS = [ // [arrive at, leave at, button | -1 = away below]
    [1.0, 2.9, 0], [3.5, 4.5, 1], [5.0, 6.2, 2], [6.7, 7.5, 3], [8.1, 9.4, -1],
    [10.5, 11.5, 4], [12.0, 13.1, 5], [13.8, 15.2, -1],
  ];
  const PERIOD = 16.6;
  function spot(k) {
    const r = Tips.tb.getBoundingClientRect();
    if (k < 0) return [r.right + r.width * 0.16, r.bottom + 70];
    const b = Tips.tb.querySelectorAll('.tb-btn')[k].getBoundingClientRect();
    return [b.left + b.width * 0.55, b.top + b.height * 0.6];
  }
  QM.demo({
    kind: 'pointer',
    move: (x, y) => Tips.move(x, y),
    leave: () => Tips.out(),
    path(t) {
      const u = t % PERIOD;
      let from = spot(-1), tPrev = 0;
      for (const [a, l, k] of STOPS) {
        const p = spot(k);
        if (u < a) { const f = ez(Math.max(0, (u - tPrev) / (a - tPrev))); return [from[0] + (p[0] - from[0]) * f, from[1] + (p[1] - from[1]) * f]; }
        if (u < l) return p;
        from = p; tPrev = l;
      }
      const e = spot(-1); return e;
    },
  });
</script>
