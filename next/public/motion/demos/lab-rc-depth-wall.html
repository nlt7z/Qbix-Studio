<!doctype html>
<html lang="en" data-tone="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift wall · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{
  "id": "lab-rc-depth-wall",
  "title": "Drift wall",
  "group": "lab",
  "cat": "images",
  "order": 120,
  "kind": "pointer",
  "tone": "paper",
  "line": "one depth value · size, focus, fog, order · 26 cards",
  "summary": "A slow flight over a wall of pictures. Each card has one depth number from 0 (far) to 1 (at the lens) and perspective size, position, focus, fog and stacking are all functions of it, so every cue agrees. Out of focus is a coarse mosaic of the same picture rather than a blur; cards are uncovered at the back and cleared at the lens, then recycled to a new spot.",
  "spec": [
    ["Depth", "z = 7 − 6d, scale 2.2 / z; Halton (2, 3) placement so coverage is even"],
    ["Flight", "base 0.035 depth a second; drag adds speed with momentum, damped at 1.4 /s, clamped ±0.6"],
    ["Focus", "plane at d = 0.62; sharp within 0.1 of the plane, a 28 px mosaic to 0.23, a 12 px mosaic beyond"],
    ["Fog", "a paper layer at (1 − d) × 0.55"],
    ["Camera", "the pointer nudges it 12% / 8%; near cards move more than far ones"],
    ["Open", "click a card and that frame grows to the middle in 700 ms; the flight pauses"]
  ],
  "source": ["Qbix studio library · 04-depth-wall"],
  "where": "The portfolio chapter: a wall of the studio's launches the visitor flies over.",
  "rules": [
    "One number drives every depth cue, so they never disagree.",
    "No blur filter runs: focus is a stepped mosaic, in keeping with the grid.",
    "A card is uncovered from the bottom as it appears; the loop is seamless because the recycling happens while it is hidden."
  ],
  "tags": ["recipe", "depth", "wall", "images"],
  "shot": 3000
}
</script>
<style data-code>
.dw-wall { position: relative; isolation: isolate; overflow: hidden; touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.dw-wall.dragging { cursor: grabbing; }
.dw-card { position: absolute; left: 0; top: 0; overflow: hidden; background: #e6e8ea; padding: 0; border: 0; cursor: pointer; will-change: transform; }
.dw-card img, .dw-card canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dw-card canvas { image-rendering: pixelated; display: none; }
.dw-fog { position: absolute; inset: 0; background: #f3f4f5; }
.dw-detail { position: fixed; inset: 0; z-index: 30; }
.dw-detail[hidden] { display: none; }
.dw-bg { position: absolute; inset: 0; background: #f3f4f5; clip-path: inset(0 0 100% 0); transition: clip-path 500ms cubic-bezier(.16, 1, .3, 1); }
.dw-detail.show .dw-bg { clip-path: inset(0); }
.dw-frame { position: fixed; overflow: hidden; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
.dw-frame img { width: 100%; height: 100%; object-fit: cover; }
.dw-cap { position: fixed; left: 0; right: 0; bottom: 24px; padding: 0 clamp(18px, 4vw, 48px); display: flex; justify-content: space-between; gap: 12px; overflow: hidden; }
.dw-cap > * { transform: translateY(120%); transition: transform 450ms cubic-bezier(.16, 1, .3, 1); }
.dw-detail.text .dw-cap > * { transform: none; }
.dw-cap strong { font: 400 clamp(24px, 3.4vw, 40px)/1 Eurostile, Geist, sans-serif; letter-spacing: -.03em; font-weight: 400; }
.dw-close { position: fixed; top: 14px; right: 18px; background: none; border: 0; color: #121417; cursor: pointer; padding: 8px; font: 500 15px Geist, sans-serif; }
</style>
<style>
  .qm-stage { display: flex; flex-direction: column; padding: clamp(14px, 3vmin, 32px) 0 0; place-items: unset; }
  .dw-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 32px; flex-wrap: wrap; padding: 0 clamp(18px, 4vw, 48px) 12px; }
  .dw-title h1 { font: 400 clamp(34px, min(6vw, 9vh), 80px)/.95 Eurostile, Geist, sans-serif; letter-spacing: -.03em; margin-top: 6px; }
  .dw-title p.sub { color: var(--fg2); max-width: 30ch; font-size: 14px; }
  .dw-wall { flex: 1; min-height: 0; }
</style>
</head>
<body>
<main class="qm-stage">
  <div class="dw-title"><div><p class="kicker">Qbix · Selected work</p><h1>Our work, so far.</h1></div><p class="sub">Forty launches. Drag to fly, click to look closer.</p></div>
<!-- code -->
<section class="dw-wall" id="wall" aria-label="Picture wall. Drag to fly forward or back. Click a picture to open it."></section>
<div class="dw-detail" id="detail" hidden role="dialog" aria-modal="true">
  <div class="dw-bg"></div>
  <div class="dw-frame" id="frame"><img alt="" id="big"></div>
  <div class="dw-cap"><strong id="cap-t"></strong><span class="mono kicker" id="cap-m"></span></div>
  <button class="dw-close" id="close">Close</button>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const wallApi = (() => {
  // [picture, title, kind of work]: a caption always belongs to the picture it opens
  const WORK = [['wall', 'Kova', 'Brand'], ['glass', 'Glaze set', 'Product page'], ['block', 'Prism block', 'Product page'], ['objects', 'Forma', 'Launch site'], ['vase', 'Dream', 'Concept'],
    ['calla', 'Willow Counseling', 'Practice site'], ['bottle', 'Carafe', 'Product page'], ['container', 'Interview Assistant', 'Landing page'], ['curves', 'Kova', 'App design'],
    ['slices', 'Qbix Labs', 'Brand'], ['ribbon', 'Strata', 'Design system'], ['ring', 'Halo lamp', 'Product page'], ['cross', 'Knot stool', 'Product page']];
  const SRC = WORK.map(([n]) => `../assets/art/${n}.webp`);
  const wall = document.getElementById('wall');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v)), damp = (a, b, k, dt) => a + (b - a) * (1 - Math.exp(-k * dt));
  const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };
  const FOCUS = 0.62, NEAR = 1, FAR = 7;
  let W = wall.clientWidth, H = wall.clientHeight, seq = 0;
  const cards = [], imgs = [];
  let paused = false, speed = 0.035, drag = null;
  const BASE = reduced ? 0 : 0.035, cam = { x: 0, y: 0 }, ptr = { nx: 0, ny: 0, inside: false };

  function mosaic(canvas, img, n) {
    const a = img.naturalWidth / img.naturalHeight;
    canvas.width = n; canvas.height = Math.max(1, Math.round(n / a));
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  }
  function place(c, d) {
    seq++;
    const k = (seq * 5) % SRC.length;
    c.src = SRC[k];
    const img = imgs[k];
    c.img = img;
    c.aspect = clamp(img.naturalWidth / img.naturalHeight, 0.7, 1.6);
    c.name = WORK[k][1]; c.role = WORK[k][2]; c.year = 2024 + (k % 3);
    c.x = (halton(seq, 2) * 2 - 1) * 1.6; c.y = (halton(seq, 3) * 2 - 1) * 1.1; c.d = d;
    const baseW = W < 600 ? W * 0.34 : Math.min(W, 1400) * 0.2;
    c.w = baseW * Math.sqrt(c.aspect); c.h = c.w / c.aspect;
    c.el.style.width = c.w + 'px'; c.el.style.height = c.h + 'px';
    c.sharp.src = c.src;
    mosaic(c.s1, img, 28); mosaic(c.s2, img, 12);
  }
  function project(c) {
    const z = FAR - (FAR - NEAR) * c.d, s = NEAR / z * 2.2;
    return { s, sx: W / 2 + (c.x - cam.x * (1 + c.d)) * s * W * 0.42, sy: H / 2 + (c.y - cam.y * (1 + c.d)) * s * H * 0.42 };
  }
  function tick(dt) {
    if (!paused) { speed = clamp(damp(speed, BASE, 1.4, dt), -0.6, 0.6); }
    const v = paused ? 0 : speed;
    cam.x = damp(cam.x, ptr.inside ? ptr.nx * 0.12 : 0, 3, dt); cam.y = damp(cam.y, ptr.inside ? ptr.ny * 0.08 : 0, 3, dt);
    for (const c of cards) {
      c.d += v * dt;
      if (c.d >= 1) place(c, c.d - 1); else if (c.d < 0) place(c, c.d + 1);
      const { s, sx, sy } = project(c);
      const appear = sstep(0.02, 0.2, c.d) * (1 - sstep(0.84, 0.97, c.d));
      const blur = clamp(Math.abs(c.d - FOCUS) * 2.6, 0, 1);
      c.el.style.transform = `translate(${(sx - c.w / 2).toFixed(1)}px, ${(sy - c.h / 2).toFixed(1)}px) scale(${s.toFixed(4)})`;
      // uncovered from below as it appears, never faded
      c.el.style.clipPath = appear >= 0.999 ? 'none' : `inset(${((1 - appear) * 100).toFixed(1)}% 0 0 0)`;
      c.el.style.zIndex = Math.round(c.d * 1000);
      c.s1.style.display = blur > 0.25 && blur <= 0.6 ? 'block' : 'none';
      c.s2.style.display = blur > 0.6 ? 'block' : 'none';
      c.fog.style.opacity = ((1 - c.d) * 0.55).toFixed(3);
      c.el.style.pointerEvents = appear > 0.6 ? '' : 'none';
    }
  }
  function build() {
    const N = innerWidth < 600 ? 16 : 26;
    for (let i = 0; i < N; i++) {
      const el = document.createElement('button'); el.className = 'dw-card'; el.setAttribute('aria-label', 'Open picture');
      el.innerHTML = '<img class="sharp" alt=""><canvas class="s1"></canvas><canvas class="s2"></canvas><span class="dw-fog"></span>';
      wall.append(el);
      const c = { el, sharp: el.children[0], s1: el.children[1], s2: el.children[2], fog: el.children[3] };
      place(c, i / N); cards.push(c);
    }
    tick(0);
    let last = performance.now();
    (function loop(now) { requestAnimationFrame(loop); const dt = Math.min(0.05, (now - last) / 1000) || 0.016; last = now; tick(dt); })(performance.now());
  }
  let loaded = 0;
  SRC.forEach((s, i) => { const im = new Image(); im.onload = im.onerror = () => { if (++loaded === SRC.length) build(); }; im.src = s; imgs[i] = im; });
  new ResizeObserver(() => { W = wall.clientWidth; H = wall.clientHeight; }).observe(wall);

  wall.addEventListener('pointerdown', (e) => { if (e.button === 0) drag = { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0, v: 0, id: e.pointerId }; });
  wall.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = (drag.y - e.clientY) + (e.clientX - drag.x) * 0.5, now = performance.now();
    drag.moved += Math.abs(dy); drag.v = dy / Math.max(now - drag.t, 8); speed += dy * 0.0009;
    drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
    if (drag.moved > 6 && !drag.captured) { drag.captured = true; wall.classList.add('dragging'); try { wall.setPointerCapture(drag.id); } catch (_) {} }
  });
  const endDrag = () => { if (drag) { speed += drag.v * 0.02; drag.wasDrag = drag.moved > 6; } wall.classList.remove('dragging'); setTimeout(() => (drag = null), 0); };
  wall.addEventListener('pointerup', endDrag); wall.addEventListener('pointercancel', endDrag);

  /* open a card: freeze the field, grow the exact card */
  const detail = document.getElementById('detail'), box = document.getElementById('frame'), big = document.getElementById('big');
  let openCard = null;
  function morph(from, to, ms) {
    box.style.cssText = `left:${to.left}px;top:${to.top}px;width:${to.width}px;height:${to.height}px`;
    return box.animate([{ left: from.left + 'px', top: from.top + 'px', width: from.width + 'px', height: from.height + 'px' }, { left: to.left + 'px', top: to.top + 'px', width: to.width + 'px', height: to.height + 'px' }], { duration: reduced ? 1 : ms, easing: 'cubic-bezier(.65,0,.35,1)' }).finished;
  }
  async function openEl(el) {
    const c = cards.find((k) => k.el === el); if (!c || openCard) return;
    openCard = c; paused = true;
    const from = el.getBoundingClientRect();
    const w = Math.min(innerWidth - 32, (innerHeight * 0.72) * c.aspect), h = w / c.aspect;
    const to = { width: w, height: h, left: (innerWidth - w) / 2, top: (innerHeight - h) / 2 - 20 };
    big.src = c.src;
    document.getElementById('cap-t').textContent = c.name;
    document.getElementById('cap-m').textContent = `${c.role} · ${c.year}`;
    detail.hidden = false; el.style.visibility = 'hidden';
    requestAnimationFrame(() => detail.classList.add('show'));
    await morph(from, to, 700);
    detail.classList.add('text');
  }
  async function close() {
    if (!openCard) return;
    detail.classList.remove('text', 'show');
    const c = openCard; c.el.style.visibility = '';
    const to = c.el.getBoundingClientRect(); c.el.style.visibility = 'hidden';
    await morph(box.getBoundingClientRect(), to, 520);
    c.el.style.visibility = ''; detail.hidden = true; paused = false; openCard = null;
  }
  wall.addEventListener('click', (e) => { const el = e.target.closest('.dw-card'); if (el && !(drag && drag.wasDrag)) openEl(el); });
  document.getElementById('close').addEventListener('click', close);
  detail.querySelector('.dw-bg').addEventListener('click', close);
  addEventListener('keydown', (e) => { if (e.key === 'Escape') close(); });
  return {
    move(x, y) { const r = wall.getBoundingClientRect(); ptr.nx = clamp((x - r.left) / r.width * 2 - 1, -1, 1); ptr.ny = clamp((y - r.top) / r.height * 2 - 1, -1, 1); ptr.inside = true; },
    leave() { ptr.inside = false; }
  };
})();
document.addEventListener('pointermove', (e) => wallApi.move(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => wallApi.leave());
</script>
<script>
  QM.demo({ kind: 'pointer', move: (x, y) => wallApi.move(x, y), leave: () => wallApi.leave() });
</script>
</body>
</html>
