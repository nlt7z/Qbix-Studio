/* Plan rewrite. The plan is an array; every edit changes it and one layout pass (relayout) gives every row its target y and number.
   Everything that moves is a critically damped spring that starts from the value and velocity on screen (and so can be retargeted at any moment):
   each row's y, its cover p (a clip-path), its number roll, ring, tick, strike and lift, a reason's cover, the card's height.
   The agent is a clock that only runs while the plan is not paused; the choreography of an edit (later()) runs on its own clock. */
const PR = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const ROW = 44, NOTEH = 12, NOTEY = 35, HEADH = 78, PADB = 12, UNDOH = 44, WH = 412, CELL = 28, RH = 18;
  const RESP = { row: 0.32, moved: 0.46, arrive: 0.3, leave: 0.14, num: 0.34, arc: 0.3, tick: 0.3, strike: 0.42, lift: 0.22, press: 0.1, noteIn: 0.3, noteOut: 0.18, card: 0.34, hdr: 0.3 };
  const REVISE_AT = 0.56;  // s after the strike starts, the two new rows are inserted

  /* a spring: the critically damped closed form; it always starts from the x and v on screen */
  const mk = (x = 0, resp = 0.3, eps = 0.002) => ({ x, v: 0, T: x, w: TAU / resp, on: false, eps });
  function step(s, dt) {
    if (!s.on) return false;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.T + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.T) < s.eps && Math.abs(s.v) < s.eps * 12) { s.x = s.T; s.v = 0; s.on = false; }
    return s.on;
  }
  function aim(s, T, resp) {
    if (resp) s.w = TAU / resp;
    s.T = T;
    if (reduced) { s.x = T; s.v = 0; s.on = false; } else s.on = true;
    kick();
  }
  const snap = (s, x) => { s.x = s.T = x; s.v = 0; s.on = false; };

  /* the plan: five steps; the agent revises step 3 while it works on it, and moves the last step up later */
  const PLAN = [
    { k: 'brief', t: 'Read the brief and tokens', dur: 2.4 },
    { k: 'audit', t: 'Audit the current page', dur: 2.6 },
    { k: 'copy', t: 'Rewrite all copy', dur: 3.0 },
    { k: 'grid', t: 'Rebuild the product grid', dur: 3.2 },
    { k: 'check', t: 'Check contrast', dur: 2.2 }
  ];
  const REV = { key: 'copy', at: 1.4, why: 'Client asked for a lighter edit', to: [
    { k: 'head', t: 'Tighten the headline', dur: 3.4 }, { k: 'care', t: 'Shorten care notes', dur: 3.2 }] };
  const MOVE = { key: 'check', before: 'grid', after: 'care', at: 0.3, why: 'Colours first, then the grid' };
  const SR = { pending: 'Pending', active: 'In progress', done: 'Done', struck: 'Replaced', skipped: 'Skipped' };

  const $ = (id) => document.getElementById(id);
  const card = $('pr-card'), list = $('pr-list'), ex = $('pr-ex'), pill = $('pr-pp'), pillc = $('pr-ppc'), live = $('pr-live'), srl = $('pr-sr');
  const rnc = $('pr-rn'), rmc = $('pr-rm');
  const S = { t: 0, run: 0, paused: false, finished: false, limeOn: false, revised: false, moved: false, cur: null, vis: true, say: 0 };
  const H = mk(WH, RESP.card, 0.05), HN = mk(1, RESP.hdr), HM = mk(5, RESP.hdr);
  let plan = [], rows = [], K = new Map(), Q = [], raf = 0, last = 0, inFrame = false;
  const UN = { el: $('pr-un'), tx: $('pr-unc'), btn: $('pr-unb'), y: mk(0, RESP.row, 0.05), p: mk(0, RESP.arrive), on: false, want: false, rec: null, tok: 0 };

  const say = (m) => { live.textContent = ''; clearTimeout(S.say); S.say = setTimeout(() => { live.textContent = m; }, 40); };
  const mkEl = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  for (let d = 0; d <= 9; d++) { const a = mkEl('i'), b = mkEl('i'); a.textContent = b.textContent = d; rnc.append(a); rmc.append(b); }

  /* the clock of the edits: later(ms, fn) runs on the same clock as the springs, so it stops with them and never races them */
  function later(ms, fn) { Q.push({ at: S.t + ms / 1000, fn }); Q.sort((a, b) => a.at - b.at); kick(); }
  function pump() { while (Q.length && Q[0].at <= S.t) Q.shift().fn(); }

  /* a row: the number cell, the words and their strike, the Skip hint, the real button */
  function mkRow(st) {
    const el = mkEl('li', 'pr-row');
    el.hidden = true;
    el.innerHTML = '<span class="pr-n" aria-hidden="true"><svg class="pr-ring" viewBox="0 0 28 28" focusable="false"><circle class="pr-tr" cx="14" cy="14" r="11.5" pathLength="1"/><circle class="pr-arc" cx="14" cy="14" r="11.5" pathLength="1"/></svg>'
      + '<span class="pr-dg"><span class="pr-dc">' + '123456789'.replace(/./g, '<i>$&</i>') + '</span></span>'
      + '<svg class="pr-tk" viewBox="0 0 28 28" focusable="false"><path d="M8.4 14.8l3.9 3.9 7.4-8.6" pathLength="1"/></svg></span>'
      + '<span class="pr-lb"><span class="pr-lbi"><span class="pr-tx"></span><i class="pr-st"></i></span></span>'
      + '<span class="pr-sk" aria-hidden="true">Skip</span><span class="sr-only pr-ss"></span><button class="pr-hit" type="button"></button>';
    const q = (c) => el.querySelector(c);
    const r = { key: st.k, text: st.t, dur: st.dur, el, state: 'pending', t: 0, ghosted: false, on: false, want: false, numT: 1, ty: 0, moving: false, note: null, dead: false,
      y: mk(0, RESP.row, 0.05), p: mk(0, RESP.arrive), nm: mk(1, RESP.num), tr: mk(0, RESP.arc), v: mk(0, RESP.arc), d: mk(0, RESP.tick), cv: mk(0, 0.2), s: mk(0, RESP.strike), lf: mk(0, RESP.lift), pz: mk(1, RESP.press, 0.0005),
      dg: q('.pr-dg'), dc: q('.pr-dc'), trc: q('.pr-tr'), arc: q('.pr-arc'), tkp: q('.pr-tk path'), st: q('.pr-st'), ss: q('.pr-ss'), hit: q('.pr-hit') };
    q('.pr-tx').textContent = st.t;
    r.hit.setAttribute('aria-label', 'Skip ' + st.t);
    r.hit.addEventListener('click', () => skip(r));
    r.hit.addEventListener('pointerdown', (e) => { if (e.button === 0) aim(r.pz, 0.985, RESP.press); });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => r.hit.addEventListener(ev, () => { if (r.pz.T !== 1) aim(r.pz, 1, RESP.press); }));
    setState(r, 'pending');
    list.append(el);
    rows.push(r); K.set(r.key, r);
    return r;
  }
  function setState(r, st) {

    r.ss.textContent = '. ' + SR[st];

    r.hit.hidden = st !== 'pending';
  }

  /* the layout: which rows, in what order, at which y and with which number. Rows that stay retarget their springs; rows that come are put

  function put(r, ty) {
    r.want = true;
    if (!r.on) { r.on = true; r.el.hidden = false; snap(r.y, ty); snap(r.p, 0); snap(r.nm, r.numT); r.fresh = true; }

  function reveal(r, ms) { r.fresh = false; r.el.removeAttribute('aria-hidden'); later(ms, () => { if (r.want) aim(r.p, 1, RESP.arrive); }); }

      if (!UN.on) { UN.on = true; UN.el.hidden = false; snap(UN.y, y); snap(UN.p, 0); UN.fresh = true; } else aim(UN.y, y, RESP.row);

  function syncHeader(now) {
    const liveRows = plan.filter((r) => !r.ghosted), M = liveRows.length, done = liveRows.filter((r) => r.state === 'done').length;
    const N = clamp(done + 1, 1, Math.max(1, M));
    if (now) { snap(HN, N); snap(HM, M); } else { aim(HN, N, RESP.hdr); aim(HM, M, RESP.hdr); }
    srl.textContent = S.finished ? 'Done' : `Step ${N} of ${M}`;
    card.classList.toggle('is-done', S.finished);
  }

  /* reasons */
  function showNote(r, text) {
    if (!r.note) { const el = mkEl('div', 'pr-nt'); ex.append(el); r.note = { el, p: mk(0, RESP.noteIn), want: false }; }
    r.note.el.textContent = text; r.note.want = true; snap(r.note.p, 0);
    relayout();

  function hideNote(r, quick) {

  }

  /* the agent: a clock that runs only while it is not paused; the active step's arc follows its progress */
  function activate(r) {
    if (r.state !== 'pending') return;

    syncHeader();
  }
  function nextPending() { return plan.find((r) => r.state === 'pending'); }
  function finish(r) {
    setState(r, 'done'); S.cur = null;
    aim(r.tr, 2, RESP.arc); aim(r.v, 2, RESP.arc); aim(r.cv, 1, 0.2);
    later(80, () => aim(r.d, 1, RESP.tick));

  function agent(dt) {

  }

  /* a revision: the old step is struck, two steps are uncovered under it 60 ms apart, the rows below glide, the numbers roll, a reason is

  function revise() {

      if (plan.indexOf(old) < 0) return;

      const rs = REV.to.map(mkRow);

      old.el.after(rs[0].el); rs[0].el.after(rs[1].el);
      relayout();

      later(110, () => activate(rs[0]));
      later(650, () => { if (rs[0].want) showNote(rs[0], REV.why); });
      later(1300, () => { const i = plan.indexOf(old); if (i >= 0) plan.splice(i, 1); unput(old); relayout(); syncHeader(); });

    later(150, () => {
      const i = plan.indexOf(c), j = plan.indexOf(g);

      g.el.before(c.el);
      relayout();

    later(1100, () => { c.moving = false; aim(c.lf, 0, RESP.lift); });
    later(950, () => { if (c.want && plan.indexOf(c) >= 0) showNote(c, MOVE.why); });
    if (!reduced) later(950 + 3600, () => hideNote(c));

  /* skip and undo: a pending step is struck, covered, the rest close up; an Undo line is uncovered at the foot for five seconds */

    later(380, () => {

      r.ghosted = true;
      plan.splice(plan.indexOf(r), 1);

      showUndo({ r, idx });
      if (hadFocus) UN.btn.focus({ preventScroll: true });
    });
  }
  function rollUn(text) {
    const col = UN.tx;
    if (reduced || !UN.want) { col.textContent = ''; const s = mkEl('span'); s.textContent = text; col.append(s); col.style.transition = 'none'; col.style.transform = ''; return; }
    clearTimeout(col._t);
    while (col.children.length > 1) col.firstElementChild.remove();
    const s = mkEl('span'); s.textContent = text; col.append(s);
    col.style.transition = 'none'; col.style.transform = 'translateY(0)'; void col.offsetHeight;
    col.style.transition = ''; col.style.transform = 'translateY(-20px)';

  }

    if (first || UN.p.T === 0) later(100, () => { if (UN.want && UN.tok === tok) aim(UN.p, 1, RESP.arrive); });

  }
  function hideUndo() { UN.want = false; UN.rec = null; aim(UN.p, 0, RESP.leave); relayout(); }

    } else {

  /* the one quiet control: Pause, Resume, and Run again (lime, only when the plan is done) */

    rows.forEach((r) => {
      r.dead = true; r.want = false; r.hit.hidden = true; r.el.setAttribute('aria-hidden', 'true');
      if (r.note) { r.note.want = false; aim(r.note.p, 0, RESP.leave); }
      if (animated && r.on) aim(r.p, 0, RESP.leave); else { snap(r.p, 0); r.on = false; r.el.hidden = true; }
    });

    if (animated && UN.on) aim(UN.p, 0, RESP.leave); else { snap(UN.p, 0); UN.on = false; UN.el.hidden = true; }
    K = new Map(); plan = PLAN.map(mkRow);
    relayout(); syncHeader(!animated); syncPill();
    if (animated) { plan.forEach((r, i) => reveal(r, 240 + 40 * i)); later(240 + 40 * 5 + 380, () => activate(plan[0])); }
    else plan.forEach((r) => { snap(r.p, 1); r.fresh = false; r.el.removeAttribute('aria-hidden'); });
    if (!animated) { snap(H, HEADH + plan.length * ROW + PADB); H.on = false; }
  }
  /* the pose the piece loads in (the thumbnail): two ticks, Rewrite all copy struck, its two replacements in, the reason arriving */
  function pose() {
    rebuild(false);
    const [a, b, c] = plan;
    [a, b].forEach((r) => { setState(r, 'done'); snap(r.d, 1); snap(r.cv, 1); snap(r.tr, 2); snap(r.v, 2); });
    c.t = 1.15; activate(c); snap(c.tr, 1); snap(c.v, c.v.T);
    syncHeader(true);
    // the pose is played, not drawn: the revision starts now and the world is stepped 1.4 s at 60 Hz, so the first frame is the same on a slow machine and a fast one
    c.t = REV.at; agent(0.001);

    else advance(1.4);

  }

  /* one step of the world, and one frame that writes it */
  function simStep(dt) {
    S.t += dt; pump(); agent(dt);
    let any = false;
    [H, HN, HM, UN.y, UN.p].forEach((s) => { any = step(s, dt) || any; });
    for (const r of rows) {
      if (r.note) any = step(r.note.p, dt) || any;
      if (!r.on) continue;
      ['y', 'p', 'nm', 'tr', 'v', 'd', 'cv', 's', 'lf', 'pz'].forEach((k) => { any = step(r[k], dt) || any; });
      if (!r.want && r.p.x < 0.002 && !r.p.on) { r.on = false; r.el.hidden = true; }
    }
    if (UN.on && !UN.want && UN.p.x < 0.002 && !UN.p.on) { UN.on = false; UN.el.hidden = true; }

    return any || Q.length > 0 || (S.cur && !S.paused);
  }
  function advance(sec) { for (let i = 0, n = Math.round(sec * 60); i < n; i++) simStep(1 / 60); }

    const hh = H.x;
    card.style.height = hh.toFixed(2) + 'px';
    const cy = (WH - hh) / 2;
    card.style.transform = `translate3d(0, ${(H.on ? cy : Math.round(cy)).toFixed(2)}px, 0)`;
    for (const r of rows) {
      if (r.note) {
        const n = r.note, pp = clamp(n.p.x, 0, 1);
        n.el.style.visibility = pp < 0.002 ? 'hidden' : 'visible';
        n.el.style.transform = `translate3d(0, ${(r.y.x + NOTEY).toFixed(2)}px, 0)`;
        n.el.style.clipPath = pp >= 0.999 ? 'none' : `inset(0 0 ${((1 - pp) * 100).toFixed(2)}% 0)`;
      }
      if (!r.on) continue;
      const pp = clamp(r.p.x, 0, 1), lf = clamp(r.lf.x, 0, 1), st = r.el.style;
      st.transform = `translate3d(0, ${r.y.x.toFixed(2)}px, 0)`;

      st.setProperty('--lf', lf.toFixed(3));
      st.scale = ((1 + 0.02 * lf) * r.pz.x).toFixed(4);
      st.zIndex = lf > 0.01 ? 3 : '';
      r.dc.style.transform = `translate3d(0, ${(-(r.nm.x - 1) * CELL).toFixed(2)}px, 0)`;
      r.dg.style.clipPath = r.cv.x < 0.003 ? 'none' : `inset(0 0 ${(clamp(r.cv.x, 0, 1) * 100).toFixed(2)}% 0)`;
      const t = r.tr.x, a = r.v.x, d = r.d.x, s = clamp(r.s.x, 0, 1);
      r.trc.style.strokeDashoffset = (1 - t).toFixed(4); r.trc.style.visibility = t > 0.004 && t < 1.996 ? 'visible' : 'hidden';
      r.arc.style.strokeDashoffset = (1 - a).toFixed(4); r.arc.style.visibility = a > 0.004 && a < 1.996 ? 'visible' : 'hidden';
      r.tkp.style.strokeDashoffset = (1 - clamp(d, 0, 1)).toFixed(4); r.tkp.style.visibility = d > 0.005 ? 'visible' : 'hidden';
      r.st.style.transform = `scaleX(${s.toFixed(4)})`; r.st.style.visibility = s > 0.003 ? 'visible' : 'hidden';
    }
    if (UN.on) {
      const pp = clamp(UN.p.x, 0, 1);
      UN.el.style.transform = `translate3d(0, ${UN.y.x.toFixed(2)}px, 0)`;
      UN.el.style.clipPath = pp >= 0.999 ? 'none' : `inset(0 0 ${((1 - pp) * 100).toFixed(2)}% 0)`;
    }
    rnc.style.transform = `translate3d(0, ${(-HN.x * RH).toFixed(2)}px, 0)`;
    rmc.style.transform = `translate3d(0, ${(-HM.x * RH).toFixed(2)}px, 0)`;
  }
  function frame(now) {
    raf = 0;
    if (!S.vis || document.hidden) return;
    const dt = clamp((now - last) / 1000 || 0.016, 0.001, 0.034);

    S, card, pill, undoBtn: UN.btn, pose, rebuild, skip, undoSkip, togglePause, render, kick, advance,
    plan: () => plan, row: (k) => K.get(k), hasUndo: () => !!UN.rec,
    running: () => !!S.cur && !S.paused && !S.finished,

    snapshot() { return { plan: plan.map((r) => `${r.key}:${r.state}:${r.numT}`), paused: S.paused, finished: S.finished, run: S.run, H: H.x, undo: !!UN.rec, ys: plan.map((r) => +r.y.x.toFixed(1)), ty: plan.map((r) => r.ty) }; }
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('pr-fit'), world = document.getElementById('pr-world');
  // the card is drawn 480 px wide in a 412 px frame and scaled to the room it is given
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    let s = Math.max(0.5, Math.min(0.9 * W / 480, (H - 2 * pad - ui) / 412, 1.4));
    s = Math.round(44 * s) / 44;          // a row is a whole number of pixels tall, so nothing rests on a fraction
    fit.style.width = (480 * s).toFixed(2) + 'px'; fit.style.height = (412 * s).toFixed(2) + 'px';
    world.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);

  /* the ghost: it moves the same pointer and clicks the same buttons a hand does (untrusted events on the same handlers) */
  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const fire = (type, x, y, Ctor = PointerEvent) => {
    const t = document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: 74, isPrimary: true, button: 0, view: window }));
    return t;
  };
  async function glide(my, to, ms = 760) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;

      if (p >= 1) break;
    }
  }
  const mid = (el, fx = 0.55) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * 0.52 }; };

    const { x, y } = pos;
    const el = fire('pointerdown', x, y); await gap(my, 110); fire('pointerup', x, y);
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window }));
  }
  async function until(my, ok, max = 90000) { let t = 0; while (!ok() && t < max) { await gap(my, 100); t += 100; } }
  const away = () => { const r = PR.card.getBoundingClientRect(); return { x: Math.min(innerWidth - 24, r.right + 28), y: r.top + r.height * 0.55 }; };

  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 5000 : 3600) : 800);
      let cycle = 0;
      for (;;) {
        // the agent is working; the ghost pauses it, taps a pending step, reads the Undo line, resumes
        await until(my, () => PR.running() && PR.pending().length > 0 && (cycle === 0 || PR.S.cur.key === 'care'));
        QM.ghostShow();
        await glide(my, mid(PR.pill, 0.5), 760); await gap(my, 260); await tap(my);              // Pause
        await gap(my, 1300);
        const want = cycle % 2 ? 'check' : 'grid', pend = PR.pending();
        const tgt = pend.find((r) => r.key === want) || pend[pend.length - 1];
        if (tgt && tgt.state === 'pending') {
          await glide(my, mid(tgt.el, 0.6), 700); tgt.el.classList.add('is-hot'); await gap(my, 700);
          await tap(my); tgt.el.classList.remove('is-hot');                                    // Skip
          await gap(my, 2400);
          if (cycle % 2 && PR.hasUndo()) { await glide(my, mid(PR.undoBtn, 0.5), 700); await gap(my, 260); await tap(my); await gap(my, 1500); }   // Undo
        }
        await glide(my, mid(PR.pill, 0.5), 720); await gap(my, 260); await tap(my);              // Resume
        await gap(my, 500);
        await glide(my, away(), 800); QM.ghostHide(); pos = null; fire('pointermove', -10, -10);
        // the plan runs to its end and is written again; then once more
        const run = PR.S.run;
        await until(my, () => PR.S.run !== run);
        cycle++;
        await gap(my, 600);
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() {
    epoch++; QM.ghostHide();
    document.querySelectorAll('.pr-row.is-hot').forEach((el) => el.classList.remove('is-hot'));
    if (pos) { pos = null; fire('pointermove', -10, -10); }
  }
  if (!QM.tile && !reduced) {
    const busyHand = () => PR.card.matches(':hover') || (PR.card.contains(document.activeElement) && document.activeElement !== document.body);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                    // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); if (reduced) PR.pose(); else PR.rebuild(true); if (!reduced) script(true); } });
  if (!reduced) (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => script(true), 300));
})();
</script>
