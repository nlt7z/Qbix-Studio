/* Step ring. The run is a clock (S.rt); the picture is springs. Every arc has four: its fill (f), its width when born (b), its lift (lf) and the gap after it (cl).
   render() draws the arcs from them: the caps are round, so each arc is pulled in by half the stroke at both ends and the gap stays 6 degrees at any width.
   The page loads on a pose that is played, not drawn: the run is stepped, with the same code, to Run checks two thirds full. */
const SR = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TILE = new URLSearchParams(location.search).has('tile');
  const TAU = Math.PI * 2, RAD = 180 / Math.PI;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const smooth = (x) => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };
  const NS = 'http://www.w3.org/2000/svg';
  const C = 110, R = 96, GAP = 6, W0 = 14, W1 = 18, FIN = 0.2, LIME = [184, 255, 0], INK = [29, 29, 31];
  const RESP = { fill: 0.2, close: 0.18, born: 0.26, lift: 0.26, roll: 0.34, gap: 0.22, count: 0.2, disc: 0.3, tick: 0.3, pill: 0.4, cover: 0.22 };

  /* a spring: the critically damped closed form; it always starts from the x and v on screen */
  const mk = (x = 0, resp = 0.3, eps = 0.002) => ({ x, v: 0, T: x, w: TAU / resp, on: false, eps });
  function step(s, dt) {
    if (!s.on) return;
    const A = s.x - s.T, w = s.w, B = s.v + w * A, e = Math.exp(-w * dt);

  const snap = (s, x) => { s.x = s.T = x; s.v = 0; s.on = false; };

  /* the steps: usual is what the ring is drawn to, slot is what this run took (11.6 s in all) */
  const STEPS = [
    { t: 'Build', usual: 2.6, slot: 2.71 },
    { t: 'Optimise images', usual: 3.4, slot: 3.52, n: 96, unit: 'images', m: [[0, 0], [0.06, 5], [0.13, 12], [0.2, 18], [0.27, 26], [0.34, 31], [0.41, 38], [0.49, 46], [0.56, 53], [0.63, 60], [0.7, 68], [0.77, 75], [0.84, 83], [0.91, 90], [0.96, 94]] },
    { t: 'Run checks', usual: 1.8, slot: 1.88 },

    { t: 'Go live', usual: 1.2, slot: 1.18 }

    s.a0 = ang; s.a1 = ang + (s.usual * (360 - GAP * N)) / USUAL; ang = s.a1 + GAP;     // visual ends of the arc: where the round caps end

  const disc = svg.querySelector('.sr-disc'), tickP = svg.querySelector('.sr-tk');

  const hex = ([r, g, b]) => `rgb(${r},${g},${b})`;
  const mix = (k) => hex(LIME.map((v, j) => Math.round(v + (INK[j] - v) * k)));

    r.btn = el('button', 'sr-hit'); r.btn.type = 'button';
    r.btn.style.clipPath = 'polygon(' + o.concat(n).map((p) => p[0].toFixed(1) + 'px ' + p[1].toFixed(1) + 'px').join(',') + ')';
    r.btn.tabIndex = i === 2 ? 0 : -1;
    hits.append(r.btn);
    r.li = el('span', 'sr-li', '<svg viewBox="0 0 10 10" focusable="false"><path d="M1.6 5.4l2.3 2.3 4.5-5.4" pathLength="1"/></svg>' + st.t);
    legEl.append(r.li);
    r.oli = el('li'); ol.append(r.oli);
    return r;
  });

  /* rolling windows: a new line is added beside the old one and the column rolls a line on a spring; it can be aimed again mid-roll */
  function roller(win, H) {
    const col = el('div', 'sr-col'); win.append(col);
    const o = { key: null, items: [], P: mk(0, RESP.roll, 0.0006), shown: '' };
    const wrap = (node) => { const w = el('div', 'sr-it'); w.append(node); return w; };
    o.set = (key, make, dir) => {
      if (key === o.key) return;
      o.key = key;
      const w = wrap(make());
      if (reduced) { col.replaceChildren(w); o.items = [w]; snap(o.P, 0); col.style.transform = ''; return; }
      if (dir >= 0) { col.append(w); o.items.push(w); aim(o.P, o.items.length - 1); }
      else { col.prepend(w); o.items.unshift(w); o.P.x += 1; aim(o.P, 0); }
    };

      step(o.P, dt);
      if (!o.P.on && o.items.length > 1) { const keep = o.items[Math.round(o.P.T)]; col.replaceChildren(keep); o.items = [keep]; o.P.x = o.P.T = 0; }
    };

    o.reset = (key, make) => { o.key = key; const w = wrap(make()); col.replaceChildren(w); o.items = [w]; snap(o.P, 0); col.style.transform = ''; o.t = ''; };

  const countNode = () => el('span', '', dg('c-t', [''].concat(seq(10).slice(1))) + dg('c-o', seq(10).concat(0)) + ` of ${STEPS[1].n} ${STEPS[1].unit}`);
  const totalNode = () => el('span', '', 'Done in ' + dg('t-t', ['', 1]) + dg('t-o', seq(10)) + '.' + dg('t-d', seq(10)) + ' s');
  const sec = (x) => x.toFixed(1) + ' s';

  const S = { t: 0, rt: 0, state: 'run', L: 0, hold: 0, endT: 0, rwT: 0, epoch: 0, posing: false, say: 0, manual: false, endText: false, tickOn: false, cDirty: false };
  const CN = mk(0, RESP.count), DISC = mk(0, RESP.disc), TICK = mk(0, RESP.tick), PL = mk(0, RESP.pill);
  const TT = { t: mk(0, 0.5), o: mk(0, 0.5), d: mk(0, 0.6) };
  const H = { ptr: null, foc: null, tap: null, lift: -1 };
  let Q = [], last = 0, raf = 0;

  /* the clock of the choreography: later(s, fn) runs on the same clock as the springs, so it stops with them and never races them */
  function later(s, fn) { Q.push({ at: S.t + s, fn, ep: S.epoch }); Q.sort((a, b) => a.at - b.at); }
  function pump() { while (Q.length && Q[0].at <= S.t) { const e = Q.shift(); if (e.ep === S.epoch) e.fn(); } }

  const say = (m) => { if (S.posing) return; live.textContent = ''; clearTimeout(S.say); S.say = setTimeout(() => { live.textContent = m; }, 40); };
  function setState(r, state) {
    r.state = state;
    r.li.classList.toggle('is-live', state === 'live'); r.li.classList.toggle('is-done', state === 'done');
    const t = r.st.t + ', ' + (state === 'done' ? 'done in ' + r.st.slot.toFixed(1) + ' seconds' : state === 'live' ? 'in progress' : 'pending');
    r.oli.textContent = t; r.btn.setAttribute('aria-label', t);
    if (state === 'live') r.oli.setAttribute('aria-current', 'step'); else r.oli.removeAttribute('aria-current');
  }
  function setAria(text, now) {
    svg.setAttribute('aria-valuenow', now); svg.setAttribute('aria-valuetext', text);
  }

  /* what the words say: the live step, or the step a hand is on, or the end */
  const kindOf = (i) => { const r = segs[i]; return r.state === 'done' ? 'done' : r.state === 'live' || (S.state === 'rewind' && i === 0) ? 'live' : 'next'; };
  const detailFor = (i) => {
    const r = segs[i], st = r.st, k = kindOf(i);
    if (k === 'done') return { key: i + ':done', make: () => txt('Done in ' + sec(st.slot)) };
    if (k === 'live') return st.n ? { key: i + ':count', make: countNode } : { key: i + ':work', make: () => txt('Working · usually ' + sec(st.usual)) };
    return { key: i + ':next', make: () => txt('Up next · usually ' + sec(st.usual)) };
  };
  const order = (i) => (i < 0 ? N : i);
  let shownNum = 0, shownTx = 0, shownDt = 0;
  function centre() {
    S.cDirty = false;
    const hov = H.lift, ending = S.state === 'end' && hov < 0;
    const ni = hov >= 0 ? hov : ending ? -1 : S.L;
    // the number: it never shares the middle with the tick, so one leaves before the other arrives
    if (ni >= 0) {
      if (DISC.x > 0.04 || DISC.T > 0 || TICK.T > 0 || TICK.x > 0.04) { aim(DISC, 0, RESP.cover); aim(TICK, 0, 0.14); S.cDirty = true; }
      else { NUM.set('#' + ni, () => numNode(ni), order(ni) >= order(shownNum) ? 1 : -1); shownNum = ni; }
    } else { NUM.set('', () => txt(''), 1); shownNum = -1; }
    if (ending && NUM.key === '' && NUM.rest() && S.tickOn) {
      if (DISC.T !== 1) { aim(DISC, 1, RESP.disc); later(0.1, () => { if (DISC.T === 1) aim(TICK, 1, RESP.tick); }); }
    } else if (ending && S.tickOn) S.cDirty = true;
    // the name and the detail line: frozen between the last step ending and the end line arriving
    if (!(ending && !S.endText)) {
      const ti = ending ? -1 : ni, dir = order(ti) >= order(shownTx) ? 1 : -1, nk = ti < 0 ? 'end' : 'n' + ti;
      const moved = NAME.key !== nk;
      NAME.set(nk, () => txt(ti < 0 ? 'Live at forma.studio' : STEPS[ti].t), dir);
      shownTx = ti;
      // the detail line follows the name by 60 ms, so the two never roll over each other
      if (moved && !reduced) later(0.06, detail); else detail();
    }
  }
  function detail() {
    const ending = S.state === 'end' && H.lift < 0, ti = H.lift >= 0 ? H.lift : ending ? -1 : S.L, dir = order(ti) >= order(shownDt) ? 1 : -1;
    if (ending && !S.endText) return;
    if (ti < 0) DET.set('end', totalNode, dir); else { const d = detailFor(ti); DET.set(d.key, d.make, dir); }
    shownDt = ti;
  }

  /* the agent */
  function activate(i) {
    const r = segs[i], st = r.st;
    setState(r, 'live');
    snap(r.f, 0); snap(r.b, 0); snap(r.cl, 0); r.ck0 = r.ck1 = 0; r.ckT = -9; r.cnT = 0; r.dr = false;
    if (st.n) snap(CN, 0);
    later(0.1, () => { if (r.state === 'live') aim(r.b, 1, RESP.born); });
    if (reduced) snap(r.b, 1);
    if (!rov()) for (const o of segs) o.btn.tabIndex = o === r ? 0 : -1;
    setAria(`Step ${i + 1} of ${N}, ${st.t}`, i + 1);
    say(`Step ${i + 1} of ${N}, ${st.t}`);
    centre();
  }
  const ckNow = (r) => r.ck0 + (r.ck1 - r.ck0) * smooth((S.t - r.ckT) / 0.2);
  function work(i, local) {
    const r = segs[i], st = r.st;
    if (st.n) {
      const c = countAt(st, local / (st.slot - FIN));
      if (c !== r.cnT) { r.cnT = c; aim(CN, c, RESP.count); aim(r.f, Math.max(0.03, c / st.n), RESP.fill); }
    } else aim(r.f, reduced ? 2 / 3 : prog(local / st.usual), RESP.fill);
  }
  function finish(i) {
    const r = segs[i];
    r.fin = true;
    aim(r.f, 1, RESP.close);
    if (r.st.n) aim(CN, r.st.n, RESP.close);
  }
  function next() {
    const r = segs[S.L];
    setState(r, 'done'); r.fin = false;
    r.ck0 = ckNow(r); r.ck1 = 1; r.ckT = reduced ? -9 : S.t;
    if (S.L < LAST) { S.L++; activate(S.L); } else conclude();
  }
  /* the end: the last arc is ink, the gaps close one after another round the ring, then the tick, the line, the total, Run again */
  function conclude() {
    S.state = 'end'; S.endT = 0; S.endText = false; S.tickOn = false;
    setAria('Live at forma.studio', N);
    for (let k = 0; k < N; k++) later(0.16 + 0.07 * k, () => aim(segs[k].cl, 1, RESP.gap));
    later(0.05, centre);
    later(0.6, () => { S.endText = true; S.tickOn = true; centre(); aim(TT.t, 1, 0.5); later(0.08, () => aim(TT.o, 1, 0.5)); later(0.16, () => aim(TT.d, 6, 0.6)); });
    later(1.45, () => aim(PL, 1, RESP.pill));
    say(`Live at forma.studio. Done in ${TOTS} seconds. Run again is available.`);
    centre();
  }
  function begin() {
    S.state = 'run'; S.rt = 0; S.L = 0;
    segs.forEach((r) => { r.fin = false; });
    activate(0);
  }
  function restart() {
    S.epoch++; Q.length = 0;
    S.state = 'rewind'; S.rwT = 0; S.L = 0; S.endText = false; S.tickOn = false; S.hold = 0;
    for (const r of segs) setState(r, 'pending');
    aim(PL, 0, RESP.cover);
    for (let k = N - 1; k >= 0; k--) {
      const r = segs[k], n = N - 1 - k;
      later(0.04 * n, () => aim(r.cl, 0, RESP.gap));                 // the gaps part again, last first
      later(0.1 + 0.055 * n, () => { r.dr = true; aim(r.f, 0, RESP.gap); });                                   // and each arc empties counter-clockwise
    }
    snap(TT.t, 0); snap(TT.o, 0); snap(TT.d, 0);
    setAria('Step 1 of 5, Build', 1);
    centre();
  }
  /* the pose: step the world, with the same code as the run, to Run checks two thirds full, let the springs rest, hold, then the run goes on */
  function pose() {
    S.epoch++; Q.length = 0; S.posing = true; S.hold = 0; S.t = 0; S.endText = false; S.tickOn = false;
    for (const r of segs) { setState(r, 'pending'); snap(r.f, 0); snap(r.b, 0); snap(r.lf, 0); snap(r.cl, 0); r.ck0 = r.ck1 = 0; r.ckT = -9; r.fin = false; r.dr = false; }
    snap(CN, 0); snap(DISC, 0); snap(TICK, 0); snap(PL, 0); snap(TT.t, 0); snap(TT.o, 0); snap(TT.d, 0);
    H.ptr = H.foc = H.tap = null; H.lift = -1;
    NUM.reset('#0', () => numNode(0)); NAME.reset('n0', () => txt(STEPS[0].t)); DET.reset('0:work', () => txt('Working · usually ' + sec(STEPS[0].usual)));
    shownNum = shownTx = shownDt = 0;
    begin();
    while (S.rt < POSE_RT) tick(1 / 60);
    S.hold = 99; for (let k = 0; k < 60; k++) tick(1 / 60);
    S.hold = reduced ? 8 : 1.3;
    S.posing = false;
    say(`Step 3 of ${N}, ${STEPS[2].t}`);
    render();
  }

  /* one tick of the world */
  function tick(dt) {
    S.t += dt; pump();
    if (S.hold > 0) S.hold -= dt;
    else if (S.state === 'run') {
      S.rt += dt;
      const st = STEPS[S.L], r = segs[S.L], local = S.rt - st.T;
      if (local >= st.slot) next();
      else if (!r.fin && local >= st.slot - FIN) finish(S.L);
      else if (!r.fin) work(S.L, local);
    } else if (S.state === 'end') {
      S.endT += dt;
      if (S.endT >= (TILE ? 4.3 : 7) && !reduced && H.lift < 0 && !again.matches(':hover, :focus-visible')) restart();
    } else if (S.state === 'rewind') {
      S.rwT += dt;
      if (S.rwT >= 0.78) begin();
    }
    for (const r of segs) { step(r.f, dt); step(r.b, dt); step(r.lf, dt); step(r.cl, dt); }
    step(CN, dt); step(DISC, dt); step(TICK, dt); step(PL, dt); step(TT.t, dt); step(TT.o, dt); step(TT.d, dt);
    NUM.tick(dt); NAME.tick(dt); DET.tick(dt);
    if (S.cDirty) centre();
  }

  /* the picture, from the springs */
  const put = (e, k, v) => { if (e['_' + k] !== v) { e.setAttribute(k, v); e['_' + k] = v; } };
  const sty = (e, k, v) => { if (e['_' + k] !== v) { e.style[k] = v; e['_' + k] = v; } };
  function render() {
    const cap = (r) => ((W0 + (W1 - W0) * r.lf.x) / 2 / R) * RAD;            // the cap's share of the angle at this width
    for (const r of segs) {
      const w = W0 + (W1 - W0) * r.lf.x, d = cap(r), dn = cap(segs[(r.i + 1) % N]);
      // closing a gap grows the end to the next arc's start: body onto body, so the joint has no notch where two round caps meet
      const a0 = r.st.a0 + d, a1 = Math.max(a0 + 0.02, r.st.a1 - d + r.cl.x * (GAP + d + dn));
      const full = r.f.x >= 0.999 && r.b.x >= 0.999, f = clamp(r.f.x, 0, 1), dA = arc(a0, a1);
      put(r.tr, 'd', dA); put(r.tr, 'stroke-width', w.toFixed(2)); sty(r.tr, 'visibility', full ? 'hidden' : 'visible');
      const fw = w * clamp(r.b.x, 0, 1) * (r.dr ? clamp(f / 0.1, 0, 1) : 1);          // an arc being emptied takes its round start with it
      if (fw < 0.4 || (f < 0.001 && r.b.x < 0.02)) sty(r.fl, 'visibility', 'hidden');
      else { sty(r.fl, 'visibility', 'visible'); put(r.fl, 'd', arc(a0, a0 + Math.max(0.02, f * (a1 - a0)))); put(r.fl, 'stroke-width', fw.toFixed(2)); sty(r.fl, 'stroke', mix(clamp(ckNow(r), 0, 1))); }
      if (r.focus) { put(r.hk, 'd', dA); put(r.hk, 'stroke-width', (w + 8).toFixed(2)); put(r.hl, 'd', dA); put(r.hl, 'stroke-width', (w + 4).toFixed(2)); }
    }
    NUM.render(); NAME.render(); DET.render();
    // digit columns are set on the card: every counter on screen follows
    const o = ((CN.x % 10) + 10) % 10, setv = (k, v) => { v = v.toFixed(3); if (card['_' + k] !== v) { card.style.setProperty('--' + k, v); card['_' + k] = v; } };
    setv('ct', Math.floor(CN.x / 10) + clamp(o - 9, 0, 1)); setv('co', o); setv('tt', TT.t.x); setv('to', TT.o.x); setv('td', TT.d.x);
    // the tick: a lime disc and a tick drawn in one stroke
    const df = DISC.x, tk = TICK.x;
    if (df < 0.01) sty(disc, 'visibility', 'hidden'); else { sty(disc, 'visibility', 'visible'); sty(disc, 'transform', `scale(${df.toFixed(4)})`); }
    if (tk < 0.01) sty(tickP, 'visibility', 'hidden'); else { sty(tickP, 'visibility', 'visible'); sty(tickP, 'strokeDasharray', tk.toFixed(4) + ' 3'); }
    const shown = PL.x > 0.002;
    sty(again, 'visibility', shown ? 'visible' : 'hidden');
    if (shown) sty(again, 'clipPath', PL.x >= 0.999 ? 'none' : `inset(0 0 ${((1 - clamp(PL.x, 0, 1)) * 100).toFixed(2)}% 0 round 18px)`);
    const can = PL.T === 1 && S.state === 'end';
    if (can === again.inert) again.inert = !can;
  }

  /* by hand: pointer, focus and a tap all lift an arc; the latest wins, and the run never notices */
  const rov = () => hits.contains(document.activeElement);
  function resolve() {
    let best = null;
    for (const c of [H.ptr, H.foc, H.tap]) if (c && (!best || c.ts > best.ts)) best = c;
    const i = best ? best.i : -1;
    if (i === H.lift) return;
    H.lift = i;
    segs.forEach((r, k) => { aim(r.lf, k === i ? 1 : 0, RESP.lift); r.li.classList.toggle('is-hot', k === i); });
    centre();
  }
  const stamp = () => performance.now();
  function over(i, e) { if (e.pointerType === 'touch') return; H.ptr = { i, ts: stamp() }; resolve(); }
  function out(i, e) { if (e.pointerType === 'touch') return; if (H.ptr && H.ptr.i === i) H.ptr = null; resolve(); }
  function tap(i, e) {
    if (e.pointerType !== 'touch') return;
    const ts = stamp();
    H.tap = H.tap && H.tap.i === i ? null : { i, ts };
    resolve();
    if (H.tap) setTimeout(() => { if (H.tap && H.tap.ts === ts) { H.tap = null; resolve(); } }, 3200);
  }
  segs.forEach((r, i) => {
    for (const t of [r.btn, r.li]) {
      t.addEventListener('pointerenter', (e) => over(i, e));
      t.addEventListener('pointerleave', (e) => out(i, e));
      t.addEventListener('pointerdown', (e) => tap(i, e));
    }
    r.btn.addEventListener('focus', () => {
      for (const o of segs) o.btn.tabIndex = o === r ? 0 : -1;
      if (r.btn.matches(':focus-visible')) { r.focus = true; r.hk.style.display = r.hl.style.display = ''; H.foc = { i, ts: stamp() }; resolve(); }
    });
    r.btn.addEventListener('blur', () => {
      r.focus = false; r.hk.style.display = r.hl.style.display = 'none';
      if (H.foc && H.foc.i === i) H.foc = null;
      resolve();
    });
    r.btn.addEventListener('keydown', (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const k = e.key; let t = -1;
      if (k === 'ArrowRight' || k === 'ArrowDown') t = (i + 1) % N;
      else if (k === 'ArrowLeft' || k === 'ArrowUp') t = (i + N - 1) % N;
      else if (k === 'Home') t = 0;
      else if (k === 'End') t = LAST;
      else if (k === 'Escape') { H.tap = H.ptr = H.foc = null; resolve(); return; }          // lets go; the focus stays where it is
      else return;
      e.preventDefault();
      segs[t].btn.focus();
    });
  });
  document.addEventListener('pointerdown', (e) => { if (e.pointerType === 'touch' && H.tap && !e.target.closest('.sr-hit, .sr-li')) { H.tap = null; resolve(); } });
  again.addEventListener('click', () => { if (S.state === 'end') restart(); });

  function frame(now) {
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now;
    if (S.manual) return;
    tick(dt); render();
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  pose();
  last = performance.now();
  raf = requestAnimationFrame(frame);
  return { S, H, segs, STEPS, TOTAL, tick, render, pose, restart, resolve, again, card, svg, NUM, NAME, DET, DISC, TICK, PL };
})();
</script>
<script>
(() => {
  const fit = document.getElementById('sr-fit'), world = document.getElementById('sr-world');
  // the card is drawn 520 px wide and 440 px tall and scaled to the room it is given
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    let s = Math.max(0.5, Math.min(0.9 * W / 520, (H - 2 * pad - ui) / 440, 1.5));
    s = Math.floor(s * 16) / 16;
    fit.style.width = (520 * s).toFixed(2) + 'px'; fit.style.height = (440 * s).toFixed(2) + 'px';
    world.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);
  if (document.fonts) document.fonts.ready.then(size);
  QM.demo({ kind: 'loop', restart() { SR.pose(); } });
})();
</script>
</body>
</html>
