<style data-code>
/* Permission rows with a stretching thumb */
.pt-list { display: flex; flex-direction: column; gap: 8px; width: 440px; }
.pt-row { background: #ffffff; cursor: pointer; overflow: hidden; }
.pt-top { display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 16px 0 18px; }
.pt-top svg.i { width: 20px; height: 20px; flex: none; }
.pt-top b { flex: 1; font-size: 15px; font-weight: 500; }
.pt-tg { position: relative; width: 52px; height: 32px; flex: none; }
.pt-kn { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; }
.pt-kn svg { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; }
.pt-ex { height: 0; overflow: hidden; }
.pt-ex p { margin: 0; padding: 0 18px 16px 52px; font-size: 13.5px; line-height: 1.5; color: rgba(18, 20, 23, 0.64); }
</style>
<style>
  .qm-stage { padding: 0; }
  #pt-stage { position: absolute; left: 50%; top: 47%; width: 820px; height: 400px; transform-origin: 50% 50%; }
  .pt-copy { position: absolute; left: 0; top: 70px; width: 320px; display: grid; gap: 14px; }
  .pt-copy .title { font-size: 52px; }
  .pt-copy .lede { font-size: 15px; max-width: 20em; }
  #pt-right { position: absolute; right: 0; top: 0; width: 440px; }
  #pt-foot { margin-top: 14px; }
  #pt-cur { position: absolute; left: 0; top: 0; width: 22px; height: 28px; pointer-events: none; z-index: 9; opacity: 0; }
</style>
</head>
<body>
<main class="qm-stage">
<div id="pt-stage">
  <div class="pt-copy">
    <p class="kicker">Agent · Permissions</p>
    <h2 class="title">What can your agent do?</h2>
    <p class="lede">Qbix build agent. Change these any time.</p>
  </div>
  <div id="pt-right">
<!-- code -->
<div class="pt-list" id="pt-list"></div>
<!-- /code -->
    <p class="kicker" id="pt-foot">It asks you first for anything not on this list.</p>
  </div>
  <svg id="pt-cur" viewBox="0 0 22 28" aria-hidden="true"><path d="M1.5 1.5 L1.5 21.2 L6.3 16.6 L9.6 24.4 L13.2 22.9 L9.9 15.2 L16.4 15.2 Z" fill="#0b0c0e" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg>
</div>
<div class="qm-ui"><span>Click any row to switch it</span></div>
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const $ = (s) => document.querySelector(s);
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const list = $('#pt-list');
let T = 0, lastNow = performance.now();
const jobs = [], ticks = new Set();
const at = (ms, fn) => jobs.push({ t: T + ms, fn });
function frame(now) {
  const dt = Math.min(64, now - lastNow); lastNow = now; T += dt;
  for (let i = 0; i < jobs.length; i++) if (jobs[i].t <= T) { const j = jobs.splice(i, 1)[0]; i--; j.fn(); }
  ticks.forEach((f) => f(dt)); requestAnimationFrame(frame);
}
const E = { io: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2), out: (t) => 1 - Math.pow(1 - t, 3), o2: (t) => 1 - (1 - t) * (1 - t), i2: (t) => t * t, lin: (t) => t };
function tween(d, e, f, done) {
  const t0 = T;
  const g = () => { const p = d <= 0 ? 1 : Math.min(1, (T - t0) / d); f(e(p)); if (p >= 1) { ticks.delete(g); if (done) done(); } };
  ticks.add(g); g(); return g;
}

const icons = {
  branch: '<path d="M4 3h3v3H4zM4 14h3v3H4zM13 14h3v3h-3z"/><path d="M5.5 6v8"/><path d="M14.5 14V9.5H9.5"/>',
  window: '<path d="M3 4h14v12H3z"/><path d="M3 8h14"/><path d="M10 14v-3.5M8.5 12L10 10.5 11.5 12"/>',
  mail: '<path d="M3 5.5h14v10H3z"/><path d="M3.3 5.8L10 11l6.7-5.2"/>',
  coin: '<path d="M10 3l7 4v6l-7 4-7-4V7z"/><path d="M10 7v6M8 9h3M8 11h3"/>',
};
const perms = [
  ['branch', 'Open pull requests', 'Pushes its work to a branch and opens a pull request. It never merges without you.'],
  ['window', 'Deploy previews', 'Builds a preview link for every change. Nothing reaches the live domain.'],
  ['mail', 'Email the client', 'Sends review links and weekly updates to the client, once a day at most.'],
  ['coin', 'Spend on tools', 'Buys fonts and stock images up to $50 a week. Anything more needs your yes.'],
];

/* the thumb's glyph: the same three points move from a dash to a check */
const OFF = [[7, 11], [11, 11], [15, 11]], ON = [[6.3, 11.4], [9.6, 14.6], [15.6, 8.1]];
const mix = (a, b, p) => a + (b - a) * p;
const col = (a, b, p) => `rgb(${a.map((v, i) => Math.round(mix(v, b[i], p))).join(',')})`;
const rows = perms.map(([ic, label, ex], i) => {
  const r = document.createElement('div'); r.className = 'pt-row';
  r.innerHTML = `<div class="pt-top"><svg class="i" viewBox="0 0 20 20" fill="none" stroke="#121417" stroke-width="1.5" stroke-linecap="square">${icons[ic]}</svg><b>${label}</b>
    <div class="pt-tg"><div class="pt-kn"><svg viewBox="0 0 22 22" fill="none" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path/></svg></div></div></div>
    <div class="pt-ex"><p>${ex}</p></div>`;
  list.appendChild(r);
  const R = { el: r, tg: r.querySelector('.pt-tg'), kn: r.querySelector('.pt-kn'), path: r.querySelector('.pt-kn path'), ex: r.querySelector('.pt-ex'), p: r.querySelector('.pt-ex p'), on: false, anim: null };
  R.draw = (p, l, w) => {
    R.kn.style.left = l.toFixed(2) + 'px'; R.kn.style.width = w.toFixed(2) + 'px';
    R.tg.style.background = p <= 0 ? 'rgba(18,20,23,.14)' : p >= 1 ? '#b8ff00' : `color-mix(in srgb, #b8ff00 ${(p * 100).toFixed(1)}%, rgba(18,20,23,.14))`;
    R.kn.style.background = col([18, 20, 23], [12, 19, 0], p);
    R.path.setAttribute('stroke', col([244, 245, 242], [184, 255, 0], p));
    R.path.setAttribute('d', 'M' + OFF.map((o, k) => `${mix(o[0], ON[k][0], p).toFixed(2)} ${mix(o[1], ON[k][1], p).toFixed(2)}`).join('L'));
  };
  R.draw(0, 4, 24);
  r.addEventListener('click', () => { real(); toggle(i); });
  return R;
});

/* toggle: the leading edge runs ahead, the trailing edge catches up; the note opens under the row */
function toggle(i, force) {
  const R = rows[i], on = force === undefined ? !R.on : force; if (on === R.on) return;
  R.on = on; R.el.classList.toggle('on', on);
  if (R.anim) ticks.delete(R.anim);
  R.anim = tween(RM ? 0 : 420, E.lin, (t) => {
    const lead = E.o2(t), trail = E.i2(t); let l, r;
    if (on) { r = 28 + 20 * lead; l = 4 + 20 * trail; } else { l = 24 - 20 * lead; r = 48 - 20 * trail; }
    const p = on ? E.io(t) : 1 - E.io(t); R.draw(p, l, r - l);
  });
  const h0 = R.ex.offsetHeight, h1 = on ? R.p.offsetHeight : 0;
  tween(RM ? 0 : 460, E.io, (p) => { R.ex.style.height = (h0 + (h1 - h0) * p).toFixed(2) + 'px'; });
  if (on && !RM) R.p.animate([{ transform: 'translateY(-100%)' }, { transform: 'none' }], { duration: 460, delay: 60, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' });
  const n = rows.filter((r) => r.on).length;
  $('#pt-foot').textContent = n ? `${n} of 4 allowed. It asks you first for anything else.` : 'Nothing allowed yet. It asks you first for everything.';
}

/* real input */
let lastIn = -1e9, gen = 0, ghostGen = -1;
const cur = $('#pt-cur');
function real() { lastIn = T; gen++; cur.style.opacity = 0; }
addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') real(); });
addEventListener('pointerdown', real);
toggle(1, true);
requestAnimationFrame(frame);
</script>
<script>
  /* harness glue: a ghost pointer walks through a set of changes */
  let scaleK = 1;
  const stageEl = document.getElementById('pt-stage');
  const P = { x: 700, y: 430, s: 1 };
  ticks.add(() => { cur.style.transform = `translate(${(P.x - 2).toFixed(1)}px,${(P.y - 2).toFixed(1)}px) scale(${P.s.toFixed(3)})`; });
  const wait = (ms, g) => new Promise((res, rej) => at(ms, () => (g === gen ? res() : rej(0))));
  const glide = (el, d, g) => new Promise((res, rej) => {
    const x0 = P.x, y0 = P.y, t0 = T;
    const f = () => {
      if (g !== gen) { ticks.delete(f); rej(0); return; }
      const r = stageEl.getBoundingClientRect(), b = el.getBoundingClientRect();
      const x = (b.left + b.width * 0.62 - r.left) / scaleK, y = (b.top + b.height * 0.62 - r.top) / scaleK;
      const p = Math.min(1, (T - t0) / d), q = E.io(p);
      P.x = x0 + (x - x0) * q; P.y = y0 + (y - y0) * q - Math.sin(q * Math.PI) * 14; if (p >= 1) { ticks.delete(f); res(); }
    };
    ticks.add(f);
  });
  const plan = [0, 1, 2, 0, 3, 2, 1, 3]; let pi = 0;
  async function ghost(g) {
    try {
      cur.style.opacity = 1;
      for (;;) {
        const i = plan[pi++ % plan.length];
        await glide(rows[i].tg, 700, g); await wait(160, g);
        tween(100, E.out, (p) => (P.s = 1 - 0.14 * p)); await wait(110, g); toggle(i); tween(160, E.out, (p) => (P.s = 0.86 + 0.14 * p));
        await wait(1500, g);
      }
    } catch (e) { /* the viewer took over */ }
  }
  ticks.add(() => { if (RM) return; if (T - lastIn > 2500 && ghostGen !== gen) { ghostGen = ++gen; ghost(gen); } });
  function fit() {
    const s = Math.min(innerWidth / 860, (innerHeight - 70) / 400) * 0.96;
    scaleK = Math.min(s, 1.7);
    stageEl.style.transform = `translate(-50%,-50%) scale(${scaleK})`;
  }
  addEventListener('resize', fit); fit();
  QM.demo({ kind: 'loop', restart() { lastIn = -1e9; } });
</script>
</body>
</html>
