<style data-code>
/* Practice: two halves of the price (app/globals.css, components/offers/PriceHalves.tsx) */
.ph { display: grid; grid-template-columns: 1fr 1fr; margin: 4px 0 22px; perspective: 900px; max-width: 560px; }
.ph-half {
  display: flex; flex-direction: column; gap: 6px; padding: 18px 20px;
  background: var(--surface);
  /* apart and turned away: --side is -1 for the left half, 1 for the right */
  transform: translateX(calc(var(--side) * 34%)) rotateY(calc(var(--side) * -18deg));
  transition: transform 1400ms cubic-bezier(0.65, 0, 0.35, 1) 150ms;
}
/* the seam between them */
.ph-half + .ph-half { box-shadow: inset 2px 0 0 #0B0C0D; clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.ph.is-in .ph-half { transform: none; }
.ph-half b { font-family: var(--font-headline); font-weight: 300; font-size: 28px; letter-spacing: -0.035em; color: #0B0C0D; }
.ph-half span { font-size: 15px; color: rgba(11, 12, 13, 0.66); }
@media (prefers-reduced-motion: reduce) {
  .ph-half { transform: none; transition: none; }
}
</style>

<script data-code>
/* The pair slides together once, as it scrolls in (margin −20% 0). */
const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    e.target.classList.add('is-in');
    io.unobserve(e.target);
  }
}, { rootMargin: '-20% 0px' });
document.querySelectorAll('.ph').forEach((ph) => io.observe(ph));
</script>
<script>
  io.disconnect();
  const ph = document.querySelector('.ph');
  const reset = () => {
    ph.classList.add('is-reset');
    ph.classList.remove('is-in');
    void ph.offsetWidth;
    ph.classList.remove('is-reset');
  };
  const play = () => ph.classList.add('is-in');
  QM.demo({ kind: 'play', lead: 800, dur: 1550, hold: 2800, reset, play });
</script>
</body>
