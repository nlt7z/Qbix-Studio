/* Live rescale. One clock T (seconds) draws everything. Samples arrive every 0.9 s from a seeded function; the chart shows time T - 0.9 so its head can
   ease from the last sample to the newest. The y-range (top), the tick step and each tick slot's cover are critically damped springs, so a spike
   widens the range, the gridlines slide and the numbers roll; the tick step changes only by hysteresis. Crosshair and bubble are springs too. */
const LR = (() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (id) => document.getElementById(id);
  const card = $('lr-card'), chart = $('lr-chart'), gridC = $('lr-grid'), dataC = $('lr-data'), ylab = $('lr-ylab'), xlab = $('lr-xlab'), bub = $('lr-bub'), msg = $('lr-msg');
  const gx = gridC.getContext('2d'), dx = dataC.getContext('2d');
  // geometry in the card's own px: label gutter, plot, room for the end dot's breath; the plot's top pad and height
  const GUT = 34, WP = 510, WC = GUT + WP + 14, R = GUT + WP, PADT = 10, HP = 206, BOT = PADT + HP, HC = BOT;
  const P = 0.9, WIN = 30, DX = WP / WIN, V = DX / P, SEED = 2611, CLOCK0 = 14 * 3600 + 2 * 60;   // 0.9 s samples, 30 of them in view (27 s), 18.9 px/s
  const TAU = 2 * Math.PI, W_UP = TAU / 0.55, W_DOWN = TAU / 1.6, W_STEP = TAU / 0.9, W_SLOT = TAU / 0.4, W_CH = TAU / 0.16, W_BUB = TAU / 0.26, W_FADE = TAU / 0.2, W_DIG = TAU / 0.28;
  const NS = 9, BW = 96, BH = 46, POSE_T = 5.82, STILL_T = 18.5;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const pad2 = (n) => (n < 10 ? '0' : '') + n;
  const fmt = (s) => { s = Math.floor(s); return pad2(Math.floor(s / 3600) % 24) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60); };

  /* a critically damped spring: the closed form, always from the x and v on screen */
  const mk = (x = 0) => ({ x, v: 0, t: x });
  function spring(s, dt, w) {
    const A = s.x - s.t, B = s.v + w * A, e = Math.exp(-w * dt);
    s.x = s.t + (A + B * dt) * e; s.v = (B - w * (A + B * dt)) * e;
    if (Math.abs(s.x - s.t) < 1e-4 && Math.abs(s.v) < 1e-3) { s.x = s.t; s.v = 0; }
  }

  /* the data: a hash of the sample index and the seed, a baseline of about 46, plus bursts (a five-sample ramp, then a decaying tail) */
  const hash = (a, b = 0) => { let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(SEED, 2246822519)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const RAMP = [0.12, 0.3, 0.55, 0.82, 1], AUTO_N0 = 3, AUTO_EVERY = 38;
  const burst = (n, n0, A) => { const k = n - n0; if (k < 0 || k > 22) return 0; return A * (k < 5 ? RAMP[k] : Math.exp(-(k - 4) / 2.7)) * (1 + 0.1 * (hash(n, 2) - 0.5)); };
  let events = [], userN = 0;
  function gen(n) {
    let v = 46 + 6 * Math.sin(n * 0.37) + 3.5 * Math.sin(n * 0.91 + 1.3) + 8 * (hash(n, 1) - 0.5);
    const q = Math.floor((n - AUTO_N0) / AUTO_EVERY);
    if (q >= 0) v += burst(n, AUTO_N0 + q * AUTO_EVERY, 112 + 36 * hash(q, 3));
    for (const e of events) v += burst(n, e.n0, e.A);
    return Math.max(8, Math.round(v));
  }

  /* the digits of a number: each place is a strip of 0 to 9 (three times over) on its own spring, taking the shortest way round */
  function roller(el, lh, places) {
    const strip = Array.from({ length: 30 }, (_, i) => i % 10).join('\n');
    el.innerHTML = places.map(() => `<span class="lr-d"><span class="lr-st">${strip}</span></span>`).join('');
    const ds = [...el.children].map((d, i) => ({ d, st: d.firstChild, p: places[i], dg: 0, pos: 10, tgt: 10, vel: 0, off: false }));
    const draw = (o) => { o.st.style.transform = `translateY(${(-o.pos * lh).toFixed(2)}px)`; };
    return {
      set(n, instant) {
        for (const o of ds) {
          const dg = Math.floor(n / o.p) % 10;
          if (instant || reduced) { o.dg = dg; o.pos = o.tgt = 10 + dg; o.vel = 0; draw(o); }
          else if (dg !== o.dg) { o.tgt += ((dg - o.dg + 15) % 10) - 5; o.dg = dg; }
          const off = o.p > 1 && n < o.p;
          if (off !== o.off) { o.off = off; o.d.classList.toggle('is-off', off); }
        }
      },
      step(dt) {
        for (const o of ds) {
          if (o.tgt >= 20) { o.tgt -= 10; o.pos -= 10; } else if (o.tgt < 10) { o.tgt += 10; o.pos += 10; }
          if (o.pos === o.tgt && !o.vel) continue;
          const A = o.pos - o.tgt, B = o.vel + W_DIG * A, e = Math.exp(-W_DIG * dt);
          let x = o.tgt + (A + B * dt) * e, v = (B - W_DIG * (A + B * dt)) * e;
          if (Math.abs(x - o.tgt) < 0.003 && Math.abs(v) < 0.03) { x = o.tgt; v = 0; }
          o.pos = x; o.vel = v; draw(o);
        }
      },
    };
  }
  const hdr = roller($('lr-num'), 60, [100, 10, 1]), pkr = roller($('lr-pk'), 28, [100, 10, 1]);

  /* state: the clock, the samples that have arrived, and the springs */
  let T = 0, nNext = 1, nMin = -40, S = [];
  const top = mk(70), step = mk(20), slots = [], ch = { x: mk(), y: mk(), a: mk(), bx: mk(), by: mk() };
  let stepT = 20, hdrN = -1, pkN = -1, ptr = null, X = [], Y = [], n0 = 0, tv = 0, fr = 0, headV = 0, chIdx = -1, bubKey = '', msgT = 0;
  for (let k = 0; k < NS; k++) {
    const el = document.createElement('span'); el.className = 'lr-yl'; el.style.visibility = 'hidden'; ylab.appendChild(el);
    slots.push({ s: mk(k < 4 ? 1 : 0), el, on: false, txt: '' });
  }
  const xls = Array.from({ length: 9 }, () => { const el = document.createElement('span'); el.className = 'lr-xl'; xlab.appendChild(el); return el; });
  const val = (n) => S[n - nMin];

  /* a nice step: 1, 2 or 5 times a power of ten, about 5 of them to the top; the one in use is kept while its count stays in a band (hysteresis) */
  function pickStep(Tt, cur) {
    if (cur && Tt / cur >= 3.2 && Tt / cur <= 8) return cur;
    let best = cur || 20, bd = 1e9;
    for (let e = 0; e <= 4; e++) for (const m of [1, 2, 5]) { const c = m * Math.pow(10, e), d = Math.abs(Tt / c - 5); if (d < bd) { bd = d; best = c; } }
    return best;
  }

  function reset() {
    T = 0; nNext = 1; nMin = -40; S = []; events = []; userN = 0;
    for (let n = -40; n <= 0; n++) S.push(gen(n));
    const i = Math.floor((T - P) / P);
    let M = 0; for (let n = i - WIN - 1; n <= i + 1; n++) M = Math.max(M, val(n));
    const need = Math.max(60, M * 1.22);
    stepT = pickStep(need, 0);
    top.x = top.t = need; top.v = 0; step.x = step.t = stepT; step.v = 0;
    slots.forEach((o, k) => { o.s.x = o.s.t = k * stepT <= need ? 1 : 0; o.s.v = 0; });
    ch.a.x = ch.a.t = 0; ch.a.v = 0; ptr = null; chIdx = -1; hdrN = -1; pkN = -1;
    hdr.set(val(i + 1), true); hdrN = val(i + 1); pkr.set(M, true); pkN = M;
  }

  /* the frame: advance the clock and the data, aim the springs, step them */
  function update(dt) {
    T += dt;
    while (nNext * P <= T) { S.push(gen(nNext)); nNext++; }
    while (S.length > 90) { S.shift(); nMin++; }
    tv = T - P;
    const i = Math.floor(tv / P);
    fr = tv / P - i;
    let M = 0; for (let n = i - WIN - 1; n <= i + 1; n++) M = Math.max(M, val(n));
    const need = Math.max(60, M * 1.22);
    top.t = need; stepT = pickStep(need, stepT); step.t = stepT;
    spring(top, dt, need > top.x ? W_UP : W_DOWN); spring(step, dt, W_STEP);
    slots.forEach((o, k) => { o.s.t = k * stepT <= need + 1e-6 ? 1 : 0; spring(o.s, dt, W_SLOT); });
    const cur = val(i + 1);
    if (cur !== hdrN) { hdrN = cur; hdr.set(cur); }
    if (M !== pkN) { pkN = M; pkr.set(M); }
    hdr.step(dt); pkr.step(dt);
    layout();
    aimCross();
    spring(ch.x, dt, W_CH); spring(ch.y, dt, W_CH); spring(ch.a, dt, W_FADE); spring(ch.bx, dt, W_BUB); spring(ch.by, dt, W_BUB);
  }

  /* the line's points: sample i is f of a step left of the edge, the head sits on the edge and eases to the newest sample over the first 72% */
  const yv = (v) => BOT - (v / Math.max(20, top.x)) * HP;
  function layout() {
    const i = Math.floor(tv / P), a = val(i), b = val(i + 1), u = Math.min(1, fr / 0.72);
    headV = a + (b - a) * (1 - Math.pow(1 - u, 3));
    n0 = i - WIN - 2; X = []; Y = [];
    for (let n = n0; n <= i; n++) { X.push(R - (fr + (i - n)) * DX); Y.push(yv(val(n))); }
    X.push(R); Y.push(yv(headV));
  }

  /* the crosshair snaps to the sample nearest the pointer, and its spring then follows that sample as it slides */
  function aimCross() {
    if (!ptr) { ch.a.t = 0; return; }
    let j = -1, bd = 1e9;
    for (let k = 0; k < X.length; k++) { if (X[k] < GUT - 1) continue; const d = Math.abs(X[k] - ptr.x); if (d < bd) { bd = d; j = k; } }
    if (j < 0) { ch.a.t = 0; return; }
    if (ch.a.x < 0.02 || reduced) { ch.x.x = X[j]; ch.y.x = Y[j]; ch.x.v = ch.y.v = 0; }
    ch.x.t = X[j]; ch.y.t = Y[j]; ch.a.t = 1; chIdx = j;
    // the bubble sits above the point; near the top it steps to the side of it
    const above = Y[j] - 14 - BH >= PADT - 16;
    let tx = X[j], ty = Y[j] - 14 - BH;
    if (!above) { const left = X[j] > GUT + WP * 0.5; tx = X[j] + (left ? -1 : 1) * (BW / 2 + 16); ty = Y[j] - BH / 2; }
    tx = clamp(tx, GUT + BW / 2, R + 8 - BW / 2); ty = clamp(ty, PADT - 16, BOT - BH);
    if (ch.a.x < 0.02 || reduced) { ch.bx.x = tx; ch.by.x = ty; ch.bx.v = ch.by.v = 0; }
    ch.bx.t = tx; ch.by.t = ty;
  }

  /* drawing: the grid canvas, the tick numbers, the line canvas, the bubble, the time axis */
  let K = 1, dpr = 1, kx = 1, ky = 1;
  function resize() {
    const w = card.getBoundingClientRect().width;
    dpr = window.devicePixelRatio || 1; K = dpr * ((w / 600) || 1);
    for (const c of [gridC, dataC]) { c.width = Math.max(1, Math.round(WC * K)); c.height = Math.max(1, Math.round(HC * K)); }
    kx = gridC.width / WC; ky = gridC.height / HC;
  }
  function draw() {
    const hw = Math.max(1, Math.round(dpr)), hair = hw / K, snap = (y) => (Math.floor(y * K) + hw / 2) / K;
    gx.setTransform(kx, 0, 0, ky, 0, 0); gx.clearRect(0, 0, WC, HC); gx.lineWidth = hair;
    for (let k = 0; k < NS; k++) {
      const o = slots[k], v = k * step.x, y = yv(v), a = o.s.x;
      if (a < 0.004 || y < PADT - 0.6 || y > BOT + 0.6) { if (o.on) { o.on = false; o.el.style.visibility = 'hidden'; } continue; }
      const yy = snap(y);
      gx.strokeStyle = k === 0 ? '#d2d2d7' : '#e8e8ed';
      gx.beginPath(); gx.moveTo(GUT, yy); gx.lineTo(GUT + a * WP, yy); gx.stroke();
      const t = String(Math.round(v));
      if (t !== o.txt) { o.txt = t; o.el.textContent = t; }
      if (!o.on) { o.on = true; o.el.style.visibility = 'visible'; }
      o.el.style.transform = `translateY(${(yy - 8).toFixed(2)}px)`;
      o.el.style.clipPath = `inset(${(50 * (1 - a)).toFixed(1)}% 0)`;
    }

    dx.setTransform(kx, 0, 0, ky, 0, 0); dx.clearRect(0, 0, WC, HC);
    dx.save(); dx.beginPath(); dx.rect(GUT, 0, WC - GUT, HC); dx.clip();
    const n = X.length, d = [], m = new Array(n);
    for (let k = 0; k < n - 1; k++) d[k] = (Y[k + 1] - Y[k]) / (X[k + 1] - X[k]);
    m[0] = d[0]; m[n - 1] = d[n - 2];
    for (let k = 1; k < n - 1; k++) m[k] = d[k - 1] * d[k] <= 0 ? 0 : (d[k - 1] + d[k]) / 2;
    for (let k = 0; k < n - 1; k++) {
      if (d[k] === 0) { m[k] = m[k + 1] = 0; continue; }
      const p = m[k] / d[k], q = m[k + 1] / d[k], s2 = p * p + q * q;
      if (s2 > 9) { const tt = 3 / Math.sqrt(s2); m[k] = tt * p * d[k]; m[k + 1] = tt * q * d[k]; }
    }
    const trace = () => { for (let k = 0; k < n - 1; k++) { const h = X[k + 1] - X[k]; dx.bezierCurveTo(X[k] + h / 3, Y[k] + (m[k] * h) / 3, X[k + 1] - h / 3, Y[k + 1] - (m[k + 1] * h) / 3, X[k + 1], Y[k + 1]); } };
    let hi = BOT; for (const y of Y) if (y < hi) hi = y;
    const g = dx.createLinearGradient(0, hi, 0, BOT); g.addColorStop(0, 'rgba(29,29,31,.10)'); g.addColorStop(1, 'rgba(29,29,31,0)');
    dx.beginPath(); dx.moveTo(X[0], BOT); dx.lineTo(X[0], Y[0]); trace(); dx.lineTo(X[n - 1], BOT); dx.closePath(); dx.fillStyle = g; dx.fill();
    dx.beginPath(); dx.moveTo(X[0], Y[0]); trace(); dx.lineWidth = 2; dx.lineJoin = 'round'; dx.lineCap = 'round'; dx.strokeStyle = '#1d1d1f'; dx.stroke();
    // the line and its area fade out over the first 40 px of the plot, where they slide off the left edge
    const fd = dx.createLinearGradient(GUT, 0, GUT + 40, 0); fd.addColorStop(0, 'rgba(0,0,0,1)'); fd.addColorStop(1, 'rgba(0,0,0,0)');
    dx.globalCompositeOperation = 'destination-out'; dx.fillStyle = fd; dx.fillRect(GUT, 0, 40, HC); dx.globalCompositeOperation = 'source-over';
    dx.restore();

    // the crosshair: a hairline, a white marker with an ink ring, then the bubble
    const a = clamp(ch.a.x, 0, 1);
    if (a > 0.004) {
      dx.save(); dx.globalAlpha = a;
      const cx = ch.x.x, cy = Math.min(ch.y.x, BOT);
      dx.beginPath(); dx.moveTo(cx, PADT - 4); dx.lineTo(cx, BOT); dx.lineWidth = hair; dx.strokeStyle = 'rgba(29,29,31,.32)'; dx.stroke();
      dx.beginPath(); dx.arc(cx, cy, 4.5, 0, TAU); dx.fillStyle = '#fff'; dx.fill(); dx.lineWidth = 2; dx.strokeStyle = '#1d1d1f'; dx.stroke();
      dx.restore();
    }
    // the live end dot: lime with an ink ring, and one breath per sample
    const hy = clamp(Y[n - 1], 5, BOT), br = 1 - fr;
    if (br > 0.002) { dx.beginPath(); dx.arc(R, hy, 5.5 + 9 * (1 - Math.pow(1 - fr, 3)), 0, TAU); dx.lineWidth = 2; dx.strokeStyle = `rgba(184,255,0,${(0.6 * br * br).toFixed(3)})`; dx.stroke(); }
    dx.beginPath(); dx.arc(R, hy, 5.5, 0, TAU); dx.fillStyle = '#B8FF00'; dx.fill(); dx.lineWidth = 1.5; dx.strokeStyle = '#1d1d1f'; dx.stroke();

    if (a > 0.004 && chIdx >= 0) {
      const head = chIdx === n - 1, nn = n0 + chIdx, v = head ? Math.round(headV) : val(nn), key = v + '|' + (head ? 'now' : nn);
      if (key !== bubKey) {
        bubKey = key; bub.firstChild.textContent = v + ' orders'; bub.lastChild.textContent = fmt(CLOCK0 + (head ? tv : nn * P));
      }
      bub.style.opacity = a.toFixed(3); bub.style.transform = `translate3d(${(ch.bx.x - BW / 2).toFixed(1)}px, ${ch.by.x.toFixed(1)}px, 0)`;
    } else if (bub.style.opacity !== '0') bub.style.opacity = '0';

    // the time axis: a label every 5 s, sliding left with the line
    const lo = Math.ceil((tv - (WP + 40) / V) / 5), hiN = Math.floor((tv + 40 / V) / 5);
    for (let q = 0; q < xls.length; q++) {
      const m5 = lo + q, el = xls[q];
      if (m5 > hiN) { el.style.visibility = 'hidden'; continue; }
      el.style.visibility = 'visible';
      const t = fmt(CLOCK0 + m5 * 5);
      if (el.textContent !== t) el.textContent = t;
      const x = R - GUT - (tv - m5 * 5) * V - 32;
      el.style.transform = `translateX(${(Math.round(x * K) / K).toFixed(2)}px)`;
    }
  }

  /* the loop: pauses off screen and in a hidden tab, and continues on the same clock */
  let raf = 0, last = 0, started = false, held = false, vis = true;
  const live = () => started && !held && vis && !document.hidden && !reduced;
  function loop(now) { raf = 0; if (!live()) return; const dt = clamp((now - last) / 1000, 0.001, 0.05); last = now; update(dt); draw(); raf = requestAnimationFrame(loop); }
  function kick() { if (!raf && live()) { last = performance.now(); raf = requestAnimationFrame(loop); } }
  new IntersectionObserver((es) => { vis = es[es.length - 1].isIntersecting; kick(); }).observe(card);
  document.addEventListener('visibilitychange', kick);

  const ff = (until) => { while (T < until) update(1 / 60); };
  function refresh() { layout(); aimCross(); if (reduced) { for (const s of [ch.x, ch.y, ch.a, ch.bx, ch.by]) { s.x = s.t; s.v = 0; } } draw(); }
  function pose() {
    reset();
    ff(reduced ? STILL_T : POSE_T);
    refresh();
    card.classList.add('is-still');
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('is-still')));
  }

  /* the pointer: a hand or the ghost; px, py in the card's own px */
  function toLocal(cx, cy) { const r = dataC.getBoundingClientRect(); return { x: ((cx - r.left) * WC) / r.width, y: ((cy - r.top) * HC) / r.height }; }
  function hover(cx, cy, ghost = false) {
    const p = toLocal(cx, cy);
    if (p.x < GUT - 4 || p.x > R + 14 || p.y < 0 || p.y > HC + 8) { leave(); return; }
    ptr = { x: clamp(p.x, GUT, R), y: p.y, ghost };
    if (reduced) { refresh(); announce(); } else kick();
  }
  function leave(onlyGhost = false) {
    if (!ptr || (onlyGhost && !ptr.ghost)) return;
    ptr = null; chIdx = -1;
    if (reduced) refresh();
  }
  function announce() {
    clearTimeout(msgT);
    msgT = setTimeout(() => { if (chIdx >= 0) { const head = chIdx === X.length - 1; msg.textContent = `${head ? Math.round(headV) : val(n0 + chIdx)} orders per minute at ${fmt(CLOCK0 + (head ? tv : (n0 + chIdx) * P))}`; } }, 350);
  }
  dataC.addEventListener('pointermove', (e) => { hover(e.clientX, e.clientY); });
  dataC.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') hover(e.clientX, e.clientY); });
  dataC.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') leave(); });
  dataC.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') leave(); });
  dataC.addEventListener('pointercancel', () => leave());
  /* a spike on demand: a burst that starts at the next sample */
  function spike() {
    // a burst the axis has to answer: at least 154 to 194 orders, and 1.5 times what is already in view (capped at 420), so a second press still moves the range
    const i = Math.floor(tv / P); let M = 0; for (let n = i - WIN - 1; n <= i + 1; n++) M = Math.max(M, val(n));
    events.push({ n0: nNext, A: Math.min(420, Math.max(154 + 40 * hash(userN++, 9), 1.5 * M)) - 46 });
    msg.textContent = 'Spike: a burst of orders is arriving';
    if (reduced) { ff(T + 5.4); refresh(); } else kick();      // reduced motion: the chart steps ahead to the spike's peak in place
  }
  chart.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      e.preventDefault();
      const x = ptr ? ptr.x : (ch.x.x || R);
      ptr = { x: clamp(x + (k === 'ArrowLeft' ? -DX : DX), GUT, R), y: PADT + HP / 2, ghost: false };
      if (reduced) { refresh(); announce(); } else { kick(); announce(); }
    } else if (k === 'Escape') { leave(); } else if (k === 's' || k === 'S') { spike(); }
  });
  chart.addEventListener('blur', () => { if (ptr && !ptr.ghost && !dataC.matches(':hover')) leave(); });
  new ResizeObserver(() => { resize(); if (!live()) draw(); }).observe(card.parentElement);

  resize(); pose();
  return {
    card, chart, dataC, pose, spike, hover, leave, kick, hdr, pkr, ffTo: ff,
    // hold: ms the pose stays still before the clock runs (a tile holds its key frame for a moment so its picture is the same every time)
    begin(hold = 0) { started = true; if (hold) { held = true; setTimeout(() => { held = false; kick(); }, hold); } kick(); },
    plot() { const r = dataC.getBoundingClientRect(), sx = r.width / WC, sy = r.height / HC; return { l: r.left + GUT * sx, r: r.left + R * sx, t: r.top + PADT * sy, b: r.top + BOT * sy }; },
    get state() { return { T, top: top.x, topT: top.t, step: step.x, stepT, n: nNext, head: headV, x: ch.x.x, a: ch.a.x, hdr: hdrN, pk: pkN, ptr: !!ptr }; },
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('lr-fit');
  // the card is drawn at 600 × 372 and scaled to the room it is given (about 80% of the width, 1.5× at most)
  function size() {
    const W = innerWidth, H = innerHeight, pad = Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = document.documentElement.classList.contains('qm-tile') ? 0 : 46;
    const s = Math.max(0.4, Math.min((0.8 * W) / 600, (H - 2 * pad - ui - 32) / 372, 1.5));
    fit.style.setProperty('--s', s.toFixed(4));
  }
  size();
  addEventListener('resize', size);
  document.getElementById('lr-spike').addEventListener('click', () => LR.spike());

  let epoch = 0, resumeT = 0, pos = null;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  // the ghost uses the chart's own hover, exactly as a hand does, so the tile shows the real crosshair
  async function glide(my, to, ms, hov) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      const x = from.x + (to.x - from.x) * k, y = from.y + (to.y - from.y) * k;
      QM.ghostAt(x, y); pos = { x, y };
      if (hov) LR.hover(x, y, true);
      if (p >= 1) break;
    }
  }
  const at = (f, g = 0.5) => { const p = LR.plot(); return { x: p.l + (p.r - p.l) * f, y: p.t + (p.b - p.t) * g }; };
  async function script() {
    const my = ++epoch;
    try {
      await gap(my, QM.tile ? 5000 : 3000);
      QM.ghostShow();
      for (;;) {
        await glide(my, at(0.93, 0.42), 800, true);                 // in from the right, onto the newest samples
        await gap(my, 900);
        await glide(my, at(0.5, 0.5), 2600, true); await gap(my, 700);   // scrub back through the data
        await glide(my, at(0.18, 0.4), 2200, true); await gap(my, 800);
        await glide(my, at(0.72, 0.5), 2400, true); await gap(my, 1100);
        LR.leave(true);
        await glide(my, { x: LR.plot().r + 40, y: LR.plot().t + 40 }, 900, false);
        QM.ghostHide(); pos = null;
        await gap(my, 8000);
        QM.ghostShow();
      }
    } catch (e) { /* cancelled */ }
  }
  function stopScript() { epoch++; QM.ghostHide(); pos = null; LR.leave(true); }
  if (!QM.tile && !reduced) {
    const idle = () => LR.chart.matches(':hover') || LR.chart.contains(document.activeElement);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!idle()) script(); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); LR.pose(); if (!reduced) script(); } });
  requestAnimationFrame(() => { LR.begin(QM.tile ? 1200 : 0); if (!reduced) script(); });          // the face is the system's; nothing here waits for a font, so the pose's moment is the same every load
})();
</script>
</body>
