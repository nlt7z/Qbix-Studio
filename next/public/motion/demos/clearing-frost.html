<style data-code>
/* Clearing frost. The picture, and over it a frost layer (blurred copy + tint + grain) masked by a feathered gradient. */
.cf { position: relative; width: 520px; height: 320px; overflow: hidden; background: #EEF1E8; --cut: 16px; --a: 0deg;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%); }
.cf-img { position: absolute; left: 50%; top: 50%; width: 1200px; height: 676px; margin: -338px 0 0 -600px; object-fit: cover; display: block; max-width: none;
  transform: rotate(var(--a)); }
/* the frost: the same picture blurred, clipped to the pane, then white tint and grain */
.cf-frost { position: absolute; inset: 0; overflow: hidden; }
.cf-frost .cf-img { filter: blur(32px) saturate(1.2); }
.cf-tint { position: absolute; inset: 0; background: rgba(255, 255, 255, .56); }
.cf-grain { position: absolute; inset: 0; opacity: .11; background-size: 128px 128px; }
.cf-edge { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); }

<script data-code>
/* Clearing frost. One clock drives everything: the picture's angle, the feathered mask, the number. */
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = document.getElementById('cf'), fr = document.getElementById('cf-frost'), num = document.getElementById('cf-n');
  const CLEAR = 5200, HOLD = 1200, BACK = 1600, REST = 500, TOTAL = CLEAR + HOLD + BACK + REST, F = 28;
  const ez = QM.bezier(0.65, 0, 0.35, 1);

  // grain tile
  const t = document.createElement('canvas'); t.width = t.height = 128;
  const tc = t.getContext('2d'), d = tc.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  tc.putImageData(d, 0, 0);
  document.getElementById('cf-grain').style.backgroundImage = 'url(' + t.toDataURL() + ')';

  function setMask(css) { fr.style.webkitMaskImage = fr.style.maskImage = css; }
  // clearing: frost stays to the right of the edge e (percent, -F .. 100+F)
  function clearing(p) {
    const e = -F + p * (100 + 2 * F);
    setMask('linear-gradient(90deg, transparent ' + (e - F / 2).toFixed(2) + '%, #000 ' + (e + F / 2).toFixed(2) + '%)');
  }
  // frost back: frost to the left of the edge
  function fogging(p) {
    const e = -F + p * (100 + 2 * F);
    setMask('linear-gradient(90deg, #000 ' + (e - F / 2).toFixed(2) + '%, transparent ' + (e + F / 2).toFixed(2) + '%)');
  }
  function show(ms, spin) {
    box.style.setProperty('--a', (spin * 4).toFixed(3) + 'deg');
    let v = 0;
    if (ms < CLEAR) { const p = ez(ms / CLEAR); clearing(p); v = p; }
    else if (ms < CLEAR + HOLD) { clearing(1); v = 1; }
    else if (ms < CLEAR + HOLD + BACK) { const p = ez((ms - CLEAR - HOLD) / BACK); fogging(p); v = 1 - p; }
    else { fogging(1); v = 0; }
    num.textContent = String(Math.round(v * 100)).padStart(3, '0') + '%';
  }

  let t0 = performance.now(), raf = 0;
  function frame(now) {
    if (!document.hidden) { const el = now - t0; show(el % TOTAL, el / 1000); }
    raf = requestAnimationFrame(frame);
  }
  if (reduced) { box.style.setProperty('--a', '-12deg'); clearing(0.56); num.textContent = '056%'; }
  else raf = requestAnimationFrame(frame);

  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();

  QM.demo({ kind: 'loop', restart() { t0 = performance.now(); } });
})();
</script>
