<!doctype html>
<html lang="en" data-tone="paper">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stacked bars · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{
  "id": "lab-stacked-bars", "title": "Stacked bars", "group": "lab", "cat": "data", "order": 360,
  "kind": "pointer", "tone": "paper",
  "line": "950 ms grow · 70 ms apart · hover widens a segment",
  "summary": "Eight weeks of briefs, stacked by where they came from (Referral, Search, Social, Direct). Each bar grows from the floor, one after another. The segment under the pointer turns lime, widens and shows its value, the others step back, and the headline reads that week's total. Everything eases with exponential interpolation.",
  "spec": [["Grow", "950 ms cubic-out, 70 ms between bars, 150 ms lead"], ["Hover", "1 − e^(−12 dt) on width (×1.9), height (+12px) and dim"], ["Dim", "other bars to 50%, others in the bar to 70%"], ["Segments", "3px gap between, top right of each bar cut"], ["Readout", "text slides up out of a mask (170 ms in, 280 ms out)"], ["Idle", "a ghost visits six segments, 1.7 s each"]],
  "source": ["Qbix studio library · stacked-bars"],
  "where": "A studio dashboard or Practice chapter that shows where new briefs come from.",
  "rules": ["Sources are told apart by a short ladder (moss, ink, mist, pale lime), never by a rainbow; the saturated lime is only the segment being read.", "No gridlines: the rows are dotted.", "Numbers are Encode Sans, the percentage is Eurostile."],
  "tags": ["canvas", "chart", "hover", "data"],
  "shot": 1550
}
</script>
<style data-code>
.sb { position: absolute; inset: 0; display: flex; flex-direction: column; padding: clamp(18px, 5vmin, 48px) clamp(18px, 5vmin, 56px) clamp(12px, 3vmin, 28px); user-select: none; }
.sb-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 28px; }
.sb-head h2 { font: 400 clamp(28px, 4.6vw, 52px)/1 Eurostile, Geist, sans-serif; letter-spacing: -0.03em; margin: 8px 0 0; }
.sb-sub { height: 1.5em; overflow: hidden; margin-top: 10px; color: rgba(18,20,23,.64); font-size: clamp(13px, 1.3vw, 15px); }
.sb-sub span { display: block; }
.sb-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 11px 'Encode Sans', Geist, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: rgba(18,20,23,.64); }
.sb-legend i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; vertical-align: -1px; }
.sb-plot { position: relative; flex: 1; min-height: 0; margin-top: clamp(8px, 2vmin, 20px); }
.sb-plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
</style>
<style>.qm-stage { display: block; padding: 0; }</style>
</head>
<body>
<main class="qm-stage">
<!-- code -->
<div class="sb">
  <div class="sb-head">
    <div>
      <p class="kicker">Design service · Last 8 weeks</p>
      <h2>Briefs by source</h2>
      <div class="sb-sub" id="sb-sub"><span>Eight weeks</span></div>
    </div>
    <div class="sb-legend" id="sb-legend"></div>
  </div>
  <div class="sb-plot" id="sb-plot"><canvas id="sb-c"></canvas></div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const StackedBars = (() => {
  const LIME = '#B8FF00', ON_LIME = '#0c1300', FG = '18, 20, 23';
  const S = [
    { n: 'Referral', c: '#6fae00' }, { n: 'Search', c: '#121417' },
    { n: 'Social', c: '#dadfd6' }, { n: 'Direct', c: '#eaf9b0' },
  ];
  const WK = ['Sep 1', 'Sep 8', 'Sep 15', 'Sep 22', 'Sep 29', 'Oct 6', 'Oct 13', 'Oct 20'];
  const D = [[4, 2, 3, 2], [5, 3, 2, 3], [6, 3, 3, 2], [6, 4, 4, 3], [7, 5, 3, 3], [8, 6, 4, 4], [7, 5, 5, 4], [9, 6, 5, 4]];
  const TOT = D.map((r) => r.reduce((a, b) => a + b, 0));
  const ALL = TOT.reduce((a, b) => a + b, 0);
  const MAXV = Math.ceil(Math.max(...TOT) / 5) * 5;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MONO = '"Encode Sans", Geist, sans-serif', HEAD = 'Eurostile, Geist, sans-serif';

  const legend = document.getElementById('sb-legend');
  S.forEach((s) => { const d = document.createElement('span'); d.innerHTML = `<i style="background:${s.c}"></i>${s.n}`; legend.appendChild(d); });

  // the line under the title slides out of a mask and the next slides in
  const sub = document.getElementById('sb-sub');
  let subBusy = false, subWant = null, subCur = sub.firstElementChild.textContent;
  function setSub(t) { subWant = t; if (!subBusy) runSub(); }
  function runSub() {
    if (subWant === null || subWant === subCur) return;
    const el = sub.firstElementChild, t = subWant;
    if (reduce) { el.textContent = subCur = t; return; }
    subBusy = true;
    el.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(-110%)' }], { duration: 170, easing: 'cubic-bezier(.5,0,.75,0)', fill: 'forwards' }).onfinish = () => {
      el.textContent = subCur = t;
      el.animate([{ transform: 'translateY(110%)' }, { transform: 'translateY(0)' }], { duration: 280, easing: 'cubic-bezier(.16,1,.3,1)', fill: 'forwards' }).onfinish = () => { subBusy = false; runSub(); };
    };
  }
  setSub(`Eight weeks, ${ALL} briefs`);

  const cv = document.getElementById('sb-c'), ctx = cv.getContext('2d'), wrap = document.getElementById('sb-plot');
  let W = 0, H = 0, dpr = 1, L = 0, R = 0, T = 0, B = 0, colW = 0, bw = 0;
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    const r = wrap.getBoundingClientRect(); W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    L = W > 700 ? 36 : 30; R = W; T = Math.min(78, H * 0.2); B = H - 26;
    colW = (R - L) / D.length; bw = Math.max(14, Math.min(colW * 0.56, 64));
  }
  addEventListener('resize', resize); resize();

  const ex = D.map((r) => r.map(() => 0));
  let hb = -1, hs = -1, dim = 0, lastHB = 0, lastHS = 0;
  const ptr = { x: -1, y: -1, on: false };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  let growStart = performance.now() + 150;
  const G = (i, now) => (reduce ? 1 : ease(clamp((now - growStart - i * 70) / 950, 0, 1)));

  let geo = [];
  function hit(x, y) {
    for (let i = 0; i < geo.length; i++) {
      const g = geo[i]; if (x < g.x0 || x > g.x1) continue;
      for (let j = 0; j < g.s.length; j++) { const s = g.s[j]; if (y >= s.y0 - 2 && y <= s.y1 + 2) return [i, j]; }
      if (y < (g.s[g.s.length - 1] || { y0: B }).y0 && y > T - 40) return [i, g.s.length - 1];
    }
    return [-1, -1];
  }
  // a rectangle with its top right corner cut
  function cutRect(x, y, w, h, c) {
    c = Math.min(c, w / 2, h);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
  }

  function draw(now) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const plotH = B - T, fs = Math.round(clamp(W * 0.011, 11, 13));
    ctx.font = `400 ${fs}px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (let v = 0; v <= MAXV; v += 5) {
      const y = Math.round(B - v / MAXV * plotH);
      ctx.fillStyle = `rgba(${FG}, ${v === 0 ? 0.38 : 0.16})`;
      if (v === 0) ctx.fillRect(L, y, R - L, 2);
      else for (let x = L; x < R; x += 8) ctx.fillRect(x, y, 2, 2);
      ctx.fillStyle = `rgba(${FG}, .38)`; ctx.fillText(String(v), 0, y);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    const every = colW < 40 ? 2 : 1;
    WK.forEach((w, i) => { if ((D.length - 1 - i) % every) return; ctx.fillStyle = i === hb ? `rgb(${FG})` : `rgba(${FG}, .38)`; ctx.fillText(w.toUpperCase(), L + (i + 0.5) * colW, H - 6); });

    geo = [];
    const gap = 3;
    for (let i = 0; i < D.length; i++) {
      const cx = L + (i + 0.5) * colW, g = G(i, now), totalPx = TOT[i] / MAXV * plotH;
      let y = B, acc = 0;
      const segs = [], barA = hb >= 0 && i !== hb ? 1 - 0.5 * dim : 1;
      for (let j = 0; j < S.length; j++) {
        const segH = D[i][j] / MAXV * plotH;
        const vis = clamp(g * totalPx - acc, 0, segH); acc += segH;
        const e = ex[i][j], h = vis + (vis >= segH - 0.5 ? e * 12 : 0);
        if (h < 0.5) { segs.push({ y0: y, y1: y }); continue; }
        const w = bw + e * (Math.min(colW - 8, bw * 1.9) - bw);
        const top = y - h, hh = Math.max(0, h - (j > 0 ? gap : 0));
        ctx.globalAlpha = barA * (hb === i && j !== hs ? 1 - 0.3 * dim : 1);
        ctx.fillStyle = e > 0.5 ? LIME : S[j].c;
        cutRect(cx - w / 2, top, w, hh, j === S.length - 1 || e > 0.5 ? 6 + e * 4 : 0);
        segs.push({ y0: top, y1: y });
        if (e > 0.4 && hh > 18) {
          ctx.globalAlpha = barA * clamp((e - 0.4) / 0.6, 0, 1);
          ctx.fillStyle = ON_LIME; ctx.font = `500 ${Math.round(Math.min(15, hh * 0.55))}px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.fillText(String(D[i][j]), cx, top + hh / 2 + 1);
        }
        y -= h;
      }
      ctx.globalAlpha = 1;
      geo.push({ x0: L + i * colW, x1: L + (i + 1) * colW, s: segs });
    }
    if (dim > 0.01 && lastHB >= 0) {
      const i = lastHB, j = lastHS, g = geo[i], topY = g.s[g.s.length - 1].y0, cx = L + (i + 0.5) * colW;
      const num = Math.round(D[i][j] / TOT[i] * 100) + '%';
      ctx.globalAlpha = dim;
      const nf = Math.round(clamp(W * 0.05, 28, 46)), lf = Math.round(clamp(W * 0.011, 11, 13));
      ctx.font = `400 ${nf}px ${HEAD}`; const nw = ctx.measureText(num).width;
      ctx.font = `500 ${lf}px ${MONO}`; const lw = ctx.measureText(S[j].n.toUpperCase()).width;
      const tw = nw + 10 + lw, x0 = clamp(cx - tw / 2, L, W - tw - 2), by = topY - 14 - (1 - dim) * 8;
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = `rgb(${FG})`; ctx.font = `400 ${nf}px ${HEAD}`; ctx.fillText(num, x0, by);
      ctx.font = `500 ${lf}px ${MONO}`; ctx.fillStyle = `rgba(${FG}, .64)`; ctx.fillText(S[j].n.toUpperCase(), x0 + nw + 10, by - 2);
      ctx.globalAlpha = 1;
    }
  }

  function move(cx, cy) { const r = cv.getBoundingClientRect(); ptr.x = cx - r.left; ptr.y = cy - r.top; ptr.on = true; }
  function leave() { ptr.on = false; }
  cv.addEventListener('pointermove', (e) => move(e.clientX, e.clientY));
  cv.addEventListener('pointerleave', leave);

  let last = performance.now(), still = reduce;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(50, now - last) / 1000; last = now;
    const grown = G(D.length - 1, now) > 0.98;
    [hb, hs] = grown && ptr.on ? hit(ptr.x, ptr.y) : [-1, -1];
    if (reduce && !ptr.on) { hb = 5; hs = 1; }
    if (hb >= 0) { lastHB = hb; lastHS = hs; }
    const kk = reduce ? 1 : 1 - Math.exp(-dt * 12);
    for (let i = 0; i < D.length; i++) for (let j = 0; j < S.length; j++) ex[i][j] += ((i === hb && j === hs ? 1 : 0) - ex[i][j]) * kk;
    dim += ((hb >= 0 ? 1 : 0) - dim) * kk;
    setSub(hb >= 0 ? `${WK[hb]}, ${TOT[hb]} briefs that week` : `Eight weeks, ${ALL} briefs`);
    draw(now);
  }
  requestAnimationFrame(frame);
  // where a segment's centre is, in client pixels (for a guided tour)
  function center(i, j) {
    const r = cv.getBoundingClientRect(), g = geo[i];
    if (!g) return [r.left + r.width / 2, r.top + r.height / 2];
    const s = g.s[j]; return [r.left + L + (i + 0.5) * colW, r.top + (s.y0 + s.y1) / 2];
  }
  return { move, leave, center };
})();
</script>
<script>
  // the ghost tours six segments, 1.7 s each: 0.6 s travelling, 1.1 s resting on it
  const TOUR = [[2, 1], [3, 3], [5, 1], [6, 2], [7, 0], [4, 3]];
  const ez = QM.bezier(0.65, 0, 0.35, 1);
  let from = null;
  QM.demo({
    kind: 'pointer',
    move: (x, y) => StackedBars.move(x, y),
    leave: () => StackedBars.leave(),
    path(t) {
      if (!from) from = [innerWidth * 0.92, innerHeight * 0.16];
      const lead = 1.9, T = 1.7;
      if (t < lead) return from;
      const u = (t - lead) / T, k = Math.floor(u) % TOUR.length, f = u - Math.floor(u);
      const a = k === 0 ? from : StackedBars.center(...TOUR[k - 1]), b = StackedBars.center(...TOUR[k]);
      const m = ez(Math.min(1, f / 0.36));
      return [a[0] + (b[0] - a[0]) * m, a[1] + (b[1] - a[1]) * m];
    },
  });
</script>
</body>
</html>
