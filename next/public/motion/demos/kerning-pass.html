<script data-code>
/* The line is built per letter. PAIRS: [index of the letter after the gap, its kern in 1/1000 em].
   Loose state: the gap is wider by -kern/1000 em (a negative kern means "pull in"). */
const KP_PAIRS = [[1, -96], [2, 44], [3, -60], [6, 52], [7, -72], [8, 40], [11, -84], [12, 48], [13, -64], [14, 56]];
const KP_STRIDE = 360, KP_T0 = 700, KP_CLOSE = 420, KP_HOP = 240;
const KP_WIPE = KP_T0 + (KP_PAIRS.length - 1) * KP_STRIDE + 700;   // when the lime starts
const KP_END = KP_WIPE + 620;

const kpLine = document.getElementById('kp-line');
const kpCh = [...kpLine.dataset.text].map((c) => { const s = document.createElement('span'); s.className = 'kp-ch'; s.textContent = c; kpLine.append(s); return s; });
kpLine.setAttribute('aria-label', kpLine.dataset.text);
kpCh.forEach((s) => s.setAttribute('aria-hidden', 'true'));
const kpCaret = document.createElement('i'); kpCaret.className = 'kp-caret'; kpCaret.setAttribute('aria-hidden', 'true'); kpLine.append(kpCaret);
const kpTags = KP_PAIRS.map(([, v]) => { const t = document.createElement('span'); t.className = 'kp-tag'; t.setAttribute('aria-hidden', 'true'); t.textContent = (v > 0 ? '+' : '−') + Math.abs(v); kpLine.append(t); return t; });

const kpClamp = (x) => Math.min(1, Math.max(0, x));
function kpBez(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t, dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => { if (x <= 0) return 0; if (x >= 1) return 1; let t = x; for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; } return sy(kpClamp(t)); };
}
const kpOut = kpBez(0.16, 1, 0.3, 1), kpMove = kpBez(0.65, 0, 0.35, 1), kpIn = kpBez(0.5, 0, 0.75, 0);

function kernRender(t) {
  // 1. the gaps
  KP_PAIRS.forEach(([i, v], k) => {
    const c = kpOut(kpClamp((t - (KP_T0 + k * KP_STRIDE)) / KP_CLOSE));
    kpCh[i].style.marginLeft = ((-v / 1000) * (1 - c)).toFixed(4) + 'em';
  });
  // 2. live gap centres
  const base = kpLine.getBoundingClientRect(), r = kpCh.map((s) => s.getBoundingClientRect());
  const mid = KP_PAIRS.map(([i]) => (r[i - 1].right + r[i].left) / 2 - base.left);
  const capTop = r[0].height * 0.2, capH = r[0].height * 0.72;
  // 3. the caret hops between centres
  let k = -1;
  KP_PAIRS.forEach((_, j) => { if (t >= KP_T0 + j * KP_STRIDE - KP_HOP) k = j; });
  let x = 0, show = 0;
  if (k >= 0) {
    const h = kpMove(kpClamp((t - (KP_T0 + k * KP_STRIDE - KP_HOP)) / KP_HOP));
    x = k === 0 ? mid[0] : mid[k - 1] + (mid[k] - mid[k - 1]) * h;
    show = k === 0 ? kpOut(kpClamp((t - (KP_T0 - KP_HOP)) / 200)) : 1;
    if (t > KP_WIPE - 400) show = 1 - kpIn(kpClamp((t - (KP_WIPE - 400)) / 200));
  }
  const cTop = (r[0].top - base.top) + capTop;
  kpCaret.style.cssText = `left:${x.toFixed(2)}px;top:${cTop.toFixed(1)}px;height:${capH.toFixed(1)}px;clip-path:inset(${((1 - show) * 100).toFixed(1)}% 0 0 0)`;
  // 4. the tags: up into view, held, up and away
  kpTags.forEach((tag, j) => {
    const s = KP_T0 + j * KP_STRIDE;
    const a = kpOut(kpClamp((t - s) / 180)), b = kpIn(kpClamp((t - (s + 260)) / 100));
    tag.style.left = mid[j].toFixed(2) + 'px';
    tag.style.top = (cTop - 34).toFixed(1) + 'px';
    tag.style.clipPath = b > 0 ? `inset(0 0 ${(b * 100).toFixed(1)}% 0)` : `inset(${((1 - a) * 100).toFixed(1)}% 0 0 0)`;
  });
  // 5. the counter and the lime
  let n = 0; KP_PAIRS.forEach((_, j) => { if (t >= KP_T0 + j * KP_STRIDE) n = j + 1; });
  document.getElementById('kp-n').textContent = n;
  const w = kpOut(kpClamp((t - KP_WIPE) / 620));
  document.getElementById('kp-done').style.clipPath = `inset(0 ${((1 - w) * 100).toFixed(2)}% 0 0)`;
}
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let raf = 0;
  const still = () => kernRender(KP_END + 1);
  const stop = () => { cancelAnimationFrame(raf); raf = 0; };
  function reset() { stop(); if (reduced) still(); else kernRender(0); }
  function play() {
    stop();
    if (reduced) return still();
    const t0 = performance.now();
    const step = (now) => { const t = now - t0; kernRender(Math.min(t, KP_END + 1)); if (t < KP_END + 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
  }
  QM.demo({
    kind: 'play', lead: 500, dur: KP_END, hold: 2400, reset, play,
    seekPlay(v) { stop(); kernRender(QM.clamp01(v) * KP_END); },
  });
  if (document.fonts) document.fonts.ready.then(() => { if (!raf) reset(); });
  reset();
})();
</script>
