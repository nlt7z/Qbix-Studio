      st.zIndex = lf > 0.01 || r.moving ? 4 : 2;
      st.clipPath = below <= 0 ? 'none' : below >= ROW - 0.5 ? 'inset(0 0 100% 0)' : 'inset(0 0 ' + px(below) + 'px 0)';
      st.visibility = below >= ROW - 0.5 ? 'hidden' : 'visible';
      st.setProperty('--lf', lf.toFixed(3)); st.setProperty('--c', clamp(r.c.x, 0, 1).toFixed(3)); st.setProperty('--f', clamp(r.f.x, 0, 1).toFixed(3));
      r.el.classList.toggle('is-rest', !r.moving && lf < 0.01);
      const d = clamp(r.d.x, 0, 1), s = clamp(r.s.x, 0, 1), f = clamp(r.f.x, 0, 1);
      r.box.style.transform = 'scale(' + r.pz.x.toFixed(4) + ')';
      r.fill.style.visibility = f > 0.004 ? 'visible' : 'hidden';
      r.tick.style.strokeDashoffset = (1 - d).toFixed(4); r.tick.style.visibility = d > 0.005 ? 'visible' : 'hidden';
      r.st.style.transform = 'scaleX(' + s.toFixed(4) + ')'; r.st.style.visibility = s > 0.003 ? 'visible' : 'hidden';
    }
    grp.style.transform = 'translate3d(0,' + px(hdr.y.x) + 'px,0)'; grp.style.zIndex = 1;
    chev.style.setProperty('--cv', clamp(CV.x, 0, 1).toFixed(3));
    // the header
    const a = clamp(AR.x, 0, 1), ds = clamp(DS.x, 0, 1), ht = clamp(HT.x, 0, 1);
    arc.style.strokeDashoffset = (1 - a).toFixed(4); arc.style.visibility = a > 0.004 ? 'visible' : 'hidden';
    disc.style.transform = 'scale(' + ds.toFixed(4) + ')'; disc.style.visibility = ds > 0.004 ? 'visible' : 'hidden';
    htk.style.strokeDashoffset = (1 - ht).toFixed(4); htk.style.visibility = ht > 0.005 ? 'visible' : 'hidden';
    subs.style.transform = 'translate(0,' + px(-clamp(SH.x, 0, 1) * 18) + 'px)';
    for (const R of [HN, DN, CN]) R.col.style.transform = 'translate(0,' + px(-clamp(R.sp.x, 0, 9) * R.lh) + 'px)';
    // the quiet line, the chip, the Undo bar: covered from below, uncovered from the top
    const ep = clamp(EP.x, 0, 1);
    emptyEl.hidden = ep < 0.002 && !S.all;
    emptyEl.style.clipPath = ep >= 0.999 ? 'none' : 'inset(0 0 ' + ((1 - ep) * 100).toFixed(2) + '% 0)';
    const cp = clamp(CP.x, 0, 1), chipW = chip.offsetWidth || 28;
    chip.style.visibility = cp < 0.002 ? 'hidden' : 'visible';
    chip.style.left = px(64 + S.cw0 + (S.cw1 - S.cw0) * clamp(SH.x, 0, 1) + 8) + 'px';
    chip.style.clipPath = cp >= 0.999 ? 'none' : 'inset(0 ' + (chipW * (1 - cp)).toFixed(2) + 'px 0 0 round 11px)';
    if (UN.on) { const u = clamp(UN.p.x, 0, 1); UN.el.style.clipPath = u >= 0.999 ? 'none' : 'inset(-24px -24px ' + (34 - 58 * u).toFixed(2) + 'px -24px)'; }   // the edge and shadow stay in the clip
  }
  function frame(now) {
    raf = 0;
    if (!S.vis || document.hidden) return;
    const dt = clamp((now - last) / 1000 || 0.016, 0.001, 0.034);
    last = now;
    inFrame = true;
    const more = simStep(dt);
    render();
    inFrame = false;
    if (more) raf = requestAnimationFrame(frame);
  }
  function kick() { if (raf || inFrame || !S.vis || document.hidden) return; last = performance.now(); raf = requestAnimationFrame(frame); }
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => { S.vis = es[es.length - 1].isIntersecting; if (S.vis) kick(); }).observe(card);
  document.addEventListener('visibilitychange', kick);

  TASKS.forEach((t) => { const r = mkRow(t); rows.push(r); byId[r.id] = r; });
  setup();
  return {
    S, card, rows, byId, setup, render, advance, kick, resetAll, undo, commit, toggleFold, measureScale(s) { S.scale = s; measure(); },
    endGhost() { if (G && G.ghost) endGesture(false, null); },
    holding: () => !!G, hasUndo: () => !!rec, undoBtn: UN.btn, foldBtn: gbtn,
    open: () => open.slice(), done: () => done.slice(),
    snapshot() { return { open: open.map((r) => r.id), done: done.map((r) => r.id), checked: rows.filter((r) => r.checked).map((r) => r.id), folded: S.folded, all: S.all, H: H.x, L: LS.x, ys: rows.map((r) => +r.y.x.toFixed(1)), hy: +hdr.y.x.toFixed(1), rec: rec ? recText() : null, count: HN.sp.x, dn: DN.sp.x, arc: AR.x }; }
  };
})();
</script>
<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fit = document.getElementById('tk-fit'), world = document.getElementById('tk-world');
  // the card is drawn 660 px wide in a 516 px frame (its tallest state) and scaled to the room it is given; a row is a whole number of pixels
  function size() {
    const W = innerWidth, H = innerHeight, tile = document.documentElement.classList.contains('qm-tile');
    const pad = tile ? 4 : Math.min(72, Math.max(24, 0.06 * Math.min(W, H))), ui = tile ? 0 : 46;
    let s = Math.max(0.5, Math.min(0.96 * W / 660, (H - 2 * pad - ui) / 516, 1.5));
    s = Math.round(40 * s) / 40;
    fit.style.width = (660 * s).toFixed(2) + 'px'; fit.style.height = (516 * s).toFixed(2) + 'px';
    world.style.setProperty('--s', s.toFixed(4));
    TK.measureScale(s);
  }
  TK.S.autoReset = QM.tile || QM.live;          // in a tile the list starts again by itself, 3 s after the last task
  size();
  addEventListener('resize', size);

  /* the ghost: it moves the same pointer events a hand does (untrusted events on the same handlers) and clicks the same buttons */
  let epoch = 0, resumeT = 0, pos = null, poseT = 0;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const raf = () => new Promise((r) => requestAnimationFrame(r));
  const mv = QM.bezier(0.65, 0, 0.35, 1);
  const PID = 94;
  const fire = (type, x, y, Ctor = PointerEvent, target) => {
    const t = target || document.elementFromPoint(x, y) || document.body;
    t.dispatchEvent(new Ctor(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, pointerType: 'mouse', pointerId: PID, isPrimary: true, button: 0, view: window }));
    return t;
  };
  const at = (x, y) => { pos = { x, y }; QM.ghostAt(x, y); fire('pointermove', x, y); };
  async function glide(my, to, ms = 700) {
    const from = pos || { x: innerWidth * 0.82, y: innerHeight * 0.86 }, t0 = performance.now();
    for (;;) {
      await raf();
      if (my !== epoch) throw 0;
      const p = Math.min(1, (performance.now() - t0) / ms), k = mv(p);
      at(from.x + (to.x - from.x) * k, from.y + (to.y - from.y) * k);
      if (p >= 1) break;
    }
  }
  const box = (r) => { const b = r.hit.getBoundingClientRect(); return { x: b.left + b.width * 0.48, y: b.top + b.height * 0.5 }; };
  const mid = (el, fx = 0.5) => { const b = el.getBoundingClientRect(); return { x: b.left + b.width * fx, y: b.top + b.height * 0.52 }; };
  async function tap(my) { const { x, y } = pos; fire('pointerdown', x, y); await gap(my, 110); fire('pointerup', x, y); }
  async function click(my, el) { const { x, y } = pos; fire('pointerdown', x, y); await gap(my, 90); fire('pointerup', x, y); el.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: x, clientY: y, view: window })); }
  async function until(my, ok, max = 20000) { let t = 0; while (!ok() && t < max) { await gap(my, 100); t += 100; } }
  // press on a row's box and drag through the next rows, with the pointer's own path
  async function sweep(my, from, to, ms) {
    await glide(my, box(from), 620); await gap(my, 220);
    fire('pointerdown', pos.x, pos.y); await gap(my, 160);
    await glide(my, box(to), ms); await gap(my, 360);
    fire('pointerup', pos.x, pos.y);
  }

  /* the pose the piece loads in, made through the real input path and played: the pointer presses on the first open box and drags down three rows, held */
  function pose() {
    stopPose();
    TK.setup();
    if (reduced) return;
    const op = TK.open(), a = box(op[0]), b = box(op[1]), c = box(op[2]);
    QM.ghostShow(); QM.ghostAt(a.x, a.y); pos = { x: a.x, y: a.y };
    fire('pointerdown', a.x, a.y, PointerEvent, op[0].hit); TK.advance(0.14);
    const n1 = 14;
    for (let i = 1; i <= n1; i++) { const k = mv(i / n1); at(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k); TK.advance(1 / 60); }
    TK.advance(0.5); TK.render();
    // the last row is reached in real time, so the thumbnail catches its tick being drawn
    poseT = setTimeout(async () => {
      const my = epoch, t0 = performance.now(), from = pos;
      for (;;) {
        await raf();
        if (my !== epoch || !TK.holding()) return;
        const p = Math.min(1, (performance.now() - t0) / 150), k = mv(p);
        at(from.x + (c.x - from.x) * k, from.y + (c.y - from.y) * k);
        if (p >= 1) return;
      }
    }, 150);
  }
  function stopPose() { clearTimeout(poseT); }

  async function script(first) {
    const my = ++epoch;
    try {
      await gap(my, first ? (QM.tile ? 4850 : 3400) : 600);
      let cycle = first ? 0 : 1;
      QM.ghostShow();
      if (first && TK.holding() && pos) {              // finish the sweep: let go
        fire('pointerup', pos.x, pos.y);
        await gap(my, 1700);
      }
      for (;;) {
        if (cycle % 2 === 0) {
          // tick one, untick one from Done, fold and open Done, Undo, reset
          const r = TK.byId.form.grp === 'open' ? TK.byId.form : TK.open()[0];
          if (r) { await glide(my, box(r), 640); await gap(my, 200); await tap(my); await gap(my, 1750); }
          const d = TK.byId.photos.grp === 'done' ? TK.byId.photos : TK.done()[0];
          if (d) { await glide(my, box(d), 640); await gap(my, 200); await tap(my); await gap(my, 1750); }
          await glide(my, mid(TK.foldBtn, 0.2), 640); await gap(my, 200); await click(my, TK.foldBtn);
          await gap(my, 1100); await click(my, TK.foldBtn);
          await gap(my, 1100);
          if (TK.hasUndo()) { await glide(my, mid(TK.undoBtn, 0.5), 640); await gap(my, 220); await click(my, TK.undoBtn); await gap(my, 1300); }
          TK.resetAll(); await gap(my, 1300);
        } else {
          // sweep every open row to the end: the ring closes, the tick is drawn
          const op = TK.open();
          if (op.length > 1) await sweep(my, op[0], op[op.length - 1], 520 + 120 * op.length);
          else if (op.length) { await glide(my, box(op[0]), 600); await gap(my, 200); await tap(my); }
          await until(my, () => TK.S.all, 6000);
          await gap(my, 3000);
          if (TK.S.all) TK.resetAll();
          await gap(my, 1600);
        }
        cycle++;
        await glide(my, { x: Math.min(innerWidth - 24, TK.card.getBoundingClientRect().right + 28), y: innerHeight * 0.55 }, 700);
        QM.ghostHide(); pos = null; fire('pointermove', -10, -10);
        await gap(my, 900);
        QM.ghostShow();
      }
    } catch (e) { if (e !== 0) console.error(e); }
  }
  function stopScript() {
    epoch++; stopPose();
    TK.endGhost();
    QM.ghostHide();
    if (pos) { pos = null; fire('pointermove', -10, -10); }
  }
  if (!QM.tile && !reduced) {
    const busyHand = () => TK.card.matches(':hover') || (TK.card.contains(document.activeElement) && document.activeElement !== document.body);
    const touch = (e) => {
      if (e && e.isTrusted === false) return;                    // the ghost's own events do not count
      stopScript();
      clearTimeout(resumeT);
      resumeT = setTimeout(function again() { if (!busyHand()) script(false); else resumeT = setTimeout(again, 1500); }, 4500);
    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', touch);
  }
  QM.demo({ kind: 'loop', restart() { stopScript(); pose(); if (!reduced) script(true); } });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { size(); pose(); if (!reduced) script(true); }, 60));
})();
</script>
