<!doctype html>
<html lang="en" data-tone="paper">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checked run · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{
  "id": "lab-rc-agent",
  "title": "Checked run",
  "group": "lab",
  "cat": "loading",
  "order": 820,
  "kind": "play",
  "tone": "paper",
  "line": "steps spin then tick · two calls for you · an orb on springs",
  "summary": "A run you can see, check and correct: a build agent makes Forma's launch site from 9 moodboard pictures. Each step is a sentence with its result under it: running steps turn a spinner, finished ones draw a tick. The agent will not guess, so two design checks (a picture too dark for the hero, a button low on contrast) are put to you with two clear choices, and the summary says what happened. Beside it a flat orb changes speed, size and wobble on springs between idle, thinking and speaking.",
  "spec": [
    ["Steps", "three, 1.3 s / 1.6 s / 1.3 s; each is uncovered with a clip, spinner turns 900 ms, the tick draws in 320 ms"],
    ["Review", "uncovered with a grid-rows transition 0fr → 1fr, 600 ms expo out"],
    ["Orb", "three wobbling outlines from sine waves; speed 0.35 / 1.6 / 0.9, wobble and size on springs 60 / 14 and 140 / 16"],
    ["Story", "run → review → Brighten → Leave → summary, then the orb rests"],
    ["Trigger", "click a choice under each check; Run again restarts"]
  ],
  "source": ["Qbix studio library · 12-agent-ui"],
  "where": "The run view of a Qbix build agent: making a launch site from a moodboard and asking before it changes anything.",
  "rules": [
    "Everything the agent does is a sentence on screen. Nothing happens off screen.",
    "Uncertain items are asked, never guessed: two buttons each, in the same place every time.",
    "The lime is the orb's core only. Steps, ticks and buttons stay sage, white and ink; a chosen answer turns ink."
  ],
  "tags": ["agent", "run", "orb", "steps", "ui kit", "launch site"],
  "shot": 7600
}
</script>
<style data-code>
/* Agent run: a sage panel with the cut corner, steps as white rows, a review that opens under them */
.ag { --c: 14px; background: #EEF1E8; padding: 14px 16px 12px; display: grid; gap: 8px; min-width: 0;
  clip-path: polygon(0 0, calc(100% - var(--c)) 0, 100% var(--c), 100% 100%, 0 100%); }
.ag-req { font-family: 'Outfit', Geist, sans-serif; font-size: clamp(20px, 2.4vw, 26px); font-weight: 300; line-height: 1.1; letter-spacing: -0.03em; }
.ag-meta { display: flex; gap: 16px; font: 400 12px/1 'Geist', Geist, sans-serif; letter-spacing: 0; color: rgba(11, 12, 13, 0.5); }
.ag-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ag-st { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; background: #ffffff; padding: 6px 12px; clip-path: inset(0 0 100% 0); transition: clip-path 600ms cubic-bezier(0.16, 1, 0.3, 1); }
.ag-st.in { clip-path: inset(0 0 0 0); }
.ag-st .t { font-size: 13px; font-weight: 500; line-height: 1.3; }
.ag-st small { display: block; font-size: 12px; font-weight: 400; color: rgba(11, 12, 13, 0.55); line-height: 1.35; }
.ag-ic { position: relative; width: 20px; height: 20px; margin-top: 1px; }
.ag-ic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ag-spin { animation: ag-spin 900ms linear infinite; }
.ag-tick path { stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset 320ms cubic-bezier(0.16, 1, 0.3, 1); }
.ag-st[data-s='done'] .ag-spin { visibility: hidden; }
.ag-st[data-s='done'] .ag-tick path { stroke-dashoffset: 0; }
@keyframes ag-spin { to { transform: rotate(360deg); } }
.ag-review { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 600ms cubic-bezier(0.16, 1, 0.3, 1); }
.ag-review.on { grid-template-rows: 1fr; }
.ag-review > div { overflow: hidden; display: grid; gap: 6px; }
.ag-review h3 { font-size: 16px; font-weight: 300; letter-spacing: -0.03em; margin-top: 2px; }
.ag-chg { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: #ffffff; padding: 8px 8px 8px 12px; font-size: 13px; line-height: 1.3; }
.ag-chg small { display: block; color: rgba(11, 12, 13, 0.55); font-size: 12px; }
.ag-chg .acts { display: flex; gap: 6px; }
.ag-chg button { all: unset; cursor: pointer; height: 32px; padding: 0 12px; display: grid; place-items: center; font: 500 13px/1 Geist, sans-serif; background: #EEF1E8; color: #0B0C0D; }
.ag-chg button.press, .ag-chg button:hover { background: #0B0C0D; color: #ffffff; }
.ag-chg.kept button[data-a='keep'], .ag-chg.changed button[data-a='change'] { background: #0B0C0D; color: #ffffff; }
.ag-end { min-height: 1.2em; font-size: 13px; color: rgba(11, 12, 13, 0.7); }
.ag-end b { color: #0B0C0D; font-weight: 500; }
.ag-orbbox { display: grid; justify-items: center; gap: 14px; align-content: center; }
.ag-orb { width: clamp(120px, 20vw, 200px); aspect-ratio: 1; display: block; }
.ag-seg { display: flex; gap: 14px; font: 400 12px/1 'Geist', Geist, sans-serif; letter-spacing: 0; }
.ag-seg button { all: unset; cursor: pointer; padding: 4px 0; color: rgba(11, 12, 13, 0.38); }
.ag-seg button.on { color: #0B0C0D; box-shadow: 0 2px 0 #0B0C0D; }
.ag-line { font: 400 12px/1.4 'Geist', Geist, sans-serif; letter-spacing: 0; color: rgba(11, 12, 13, 0.64); text-align: center; min-height: 2.8em; }
.ag.is-reset * { transition: none !important; }
/* the page: the run and the orb side by side, two sage panels 8px apart */
.agw { width: min(100%, 980px); display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 8px; align-items: stretch; }
.agw .ag-orbbox { background: #EEF1E8; }
.ag-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ag-replay { all: unset; cursor: pointer; font: 400 12px/1 'Geist', Geist, sans-serif; letter-spacing: 0; color: rgba(11, 12, 13, 0.5); }
.ag-replay:hover { color: #0B0C0D; }
@media (max-width: 720px) { .agw { grid-template-columns: 1fr; } .ag-orbbox { display: none; } }
@media (prefers-reduced-motion: reduce) { .ag-spin { animation: none; } }
</style>
</head>
<body>
<main class="qm-stage">
<!-- code -->
<div class="agw">
  <div class="ag" id="run" aria-live="polite">
    <div class="ag-top"><p class="kicker">Qbix · Forma launch</p><button class="ag-replay" id="replay">Run again</button></div>
    <p class="ag-req">Build the launch site for Forma</p>
    <div class="ag-meta"><span id="elapsed">0:00</span><span>9 pictures</span></div>
    <ul class="ag-steps" id="steps"></ul>
    <div class="ag-review" id="review"><div>
      <h3>2 checks need your call</h3>
      <div class="ag-chg" data-id="a"><p>Picture 4 is too dark for the hero<small>Shot in low light</small></p><div class="acts"><button data-a="keep">Brighten</button><button data-a="change">Flag</button></div></div>
      <div class="ag-chg" data-id="b"><p>The waitlist button is low on contrast<small>White text on lime, 1.3 to 1</small></p><div class="acts"><button data-a="keep">Use ink text</button><button data-a="change">Leave</button></div></div>
      <p class="ag-end" id="endline"></p>
    </div></div>
  </div>
  <div class="ag-orbbox">
    <canvas class="ag-orb" id="orb" aria-hidden="true"></canvas>
    <div class="ag-seg" role="group" aria-label="Agent state"><button class="on" data-m="idle">Idle</button><button data-m="think">Thinking</button><button data-m="speak">Speaking</button></div>
    <p class="ag-line" id="orbline">Waiting for a task</p>
  </div>
</div>
<!-- /code -->
  <div class="qm-ui"><span>Click a choice under each check</span></div>
</main>
<script src="../kit/stage.js"></script>
<script data-code>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
  const $ = (id) => document.getElementById(id);
  const ICON = '<span class="ag-ic"><svg class="ag-spin" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 0 1 9 9" stroke="#0B0C0D" stroke-width="2.4"/><path d="M12 3a9 9 0 1 0 9 9" stroke="#0B0C0D" stroke-width="2.4" opacity="0"/></svg><svg class="ag-tick" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#0B0C0D" stroke-width="2.4"/></svg></span>';
  const STEPS = [
    { t: 'Reading 9 moodboard pictures', done: '9 read, 5 colours pulled', ms: 1300 },
    { t: 'Placing each picture in the layout', done: '8 placed, 1 too dark for the hero', ms: 1600 },
    { t: 'Checking contrast and sizes', done: '14 pairs pass, 1 button fails', ms: 1300 },
  ];
  const stepsEl = $('steps'), review = $('review'), elapsed = $('elapsed'), endline = $('endline');
  let runId = 0, t0 = 0, timer = 0;
  async function run() {
    const id = ++runId; stepsEl.innerHTML = ''; review.classList.remove('on'); endline.textContent = '';
    document.querySelectorAll('.ag-chg').forEach((c) => c.classList.remove('kept', 'changed'));
    t0 = performance.now(); clearInterval(timer); elapsed.textContent = '0:00';
    timer = setInterval(() => { const s = Math.floor((performance.now() - t0) / 1000); elapsed.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }, 250);
    setOrb('think');
    for (const s of STEPS) {
      if (id !== runId) return;
      const li = document.createElement('li'); li.className = 'ag-st'; li.dataset.s = 'run';
      li.innerHTML = `${ICON}<div class="t">${s.t}<small>Working</small></div>`; stepsEl.append(li);
      requestAnimationFrame(() => requestAnimationFrame(() => li.classList.add('in')));
      await wait(s.ms); if (id !== runId) return;
      li.dataset.s = 'done'; li.querySelector('small').textContent = s.done;
    }
    if (id !== runId) return;
    clearInterval(timer); review.classList.add('on'); setOrb('idle', 'Waiting for your call on 2 checks');
  }
  $('replay').addEventListener('click', run);
  document.querySelectorAll('.ag-chg').forEach((c) => c.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    c.classList.toggle('kept', b.dataset.a === 'keep'); c.classList.toggle('changed', b.dataset.a === 'change');
    const left = [...document.querySelectorAll('.ag-chg')].filter((x) => !x.classList.contains('kept') && !x.classList.contains('changed')).length;
    endline.innerHTML = left ? `${left} left to decide.` : '<b>All decided.</b> 8 pictures placed, 1 flagged for Mia.';
    if (!left) { setOrb('speak', 'Writing the summary'); setTimeout(() => setOrb('idle', 'Done. Waiting for a task'), 2200); }
  }));
  /* the orb: three wobbling outlines from sine waves; the state moves speed, size and wobble on springs */
  const cv = $('orb'), g = cv.getContext('2d'), orbline = $('orbline');
  const MODES = { idle: { speed: 0.35, wob: 0.035, size: 0.8 }, think: { speed: 1.6, wob: 0.09, size: 0.72 }, speak: { speed: 0.9, wob: 0.06, size: 0.86 } };
  const spring = (v, k, c) => ({ value: v, target: v, vel: 0, step(dt) { this.vel += (k * (this.target - this.value) - c * this.vel) * dt; this.value += this.vel * dt; } });
  const sp = { speed: spring(0.35, 60, 14), wob: spring(0.035, 60, 14), size: spring(0.8, 140, 16) };
  let mode = 'idle', phase = 0;
  function setOrb(m, line) {
    mode = m; Object.keys(sp).forEach((k) => { sp[k].target = MODES[m][k]; });
    document.querySelectorAll('.ag-seg button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    orbline.textContent = line || { idle: 'Waiting for a task', think: 'Working through the pictures', speak: 'Explaining what it found' }[m];
  }
  document.querySelector('.ag-seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setOrb(b.dataset.m); });
  function sizeOrb() { const px = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect(); cv.width = r.width * px; cv.height = r.height * px; }
  function blob(R, w, layer, N = 96) { const W = cv.width, H = cv.height; g.beginPath(); for (let i = 0; i <= N; i++) { const a = i / N * Math.PI * 2, wv = Math.sin(a * 3 + phase * (1 + layer * 0.4)) * 0.5 + Math.sin(a * 5 - phase * 1.3 + layer) * 0.3 + Math.sin(a * 2 + phase * 0.7) * 0.2, r = R * (1 + wv * w), x = W / 2 + Math.cos(a) * r, y = H / 2 + Math.sin(a) * r; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.closePath(); }
  let last = performance.now(), running = false;
  function drawOrb(now) {
    if (document.hidden) { running = false; return; }
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    Object.values(sp).forEach((s) => s.step(dt)); phase += dt * sp.speed.value * (reduced ? 0.2 : 1);
    const W = cv.width, H = cv.height, R = Math.min(W, H) / 2, lw = Math.max(2, W / 90);
    const amp = mode === 'speak' && !reduced ? (Math.sin(phase * 9) * 0.5 + 0.5) * 0.06 : 0, base = R * (sp.size.value + amp);
    g.clearRect(0, 0, W, H);
    g.lineWidth = lw; g.strokeStyle = 'rgba(11, 12, 13,0.16)'; blob(base * 1.16, sp.wob.value * 1.2, 2); g.stroke();
    g.strokeStyle = 'rgba(11, 12, 13,0.5)'; blob(base * 1.0, sp.wob.value, 1); g.stroke();
    g.fillStyle = '#B8FF00'; blob(base * 0.72, sp.wob.value * 1.1, 0); g.fill();
    requestAnimationFrame(drawOrb);
  }
  sizeOrb(); addEventListener('resize', sizeOrb); requestAnimationFrame(drawOrb);
  window.agApi = { run, setOrb, reset() { runId++; clearInterval(timer); const r = $('run'); r.classList.add('is-reset'); stepsEl.innerHTML = ''; review.classList.remove('on'); endline.textContent = ''; document.querySelectorAll('.ag-chg').forEach((c) => c.classList.remove('kept', 'changed')); elapsed.textContent = '0:00'; setOrb('idle'); void r.offsetWidth; r.classList.remove('is-reset'); } };
})();
</script>
<script>
  (function () {
    const api = window.agApi; let run = 0;
    const at = (e) => { const r = e.getBoundingClientRect(); return [r.left + r.width * 0.5, r.top + r.height * 0.55]; };
    const tap = async (b) => { b.classList.add('press'); await QM.wait(130); b.classList.remove('press'); b.click(); };
    async function play() {
      const my = ++run, ok = () => my === run;
      QM.ghostAt(innerWidth * 0.8, innerHeight * 0.3); QM.ghostShow();
      api.run();
      await QM.wait(4600); if (!ok()) return;                       // three steps, then the review opens
      const a = document.querySelector('.ag-chg[data-id=a] button[data-a=keep]'), b = document.querySelector('.ag-chg[data-id=b] button[data-a=change]');
      await QM.ghostTo(...at(a), 900); if (!ok()) return;
      await QM.wait(200); await tap(a); await QM.wait(500); if (!ok()) return;
      await QM.ghostTo(...at(b), 800); if (!ok()) return;
      await QM.wait(200); await tap(b); if (!ok()) return;
      await QM.ghostTo(innerWidth * 0.8, innerHeight * 0.75, 800);
    }
    if (QM.reduced) { api.run(); }
    QM.demo({ kind: 'play', lead: 500, dur: 11500, hold: 600, reset() { run++; api.reset(); }, play });
  })();
</script>
</body>
</html>
