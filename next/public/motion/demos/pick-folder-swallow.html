<script data-code>
/* Into the folder · Idea: Qbix studio library · folder-upload
   The card follows the hand; the lid opens as it nears the mouth. Let go there and the folder takes the card in
   (up to the mouth, then down behind the front panel), closes, and says what it read. */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const q = (sel) => document.querySelector(sel);
const folder = q('.fd-folder'), doc = q('.fd-doc'), res = q('.fd-res'), tip = q('.fd-tip');
const HOME = { x: 70, y: 80 };                          // the card's top-left at rest, in the stage's own pixels
const MOUTH = { x: 330 + 56, y: 24 + 30 };              // …and when it sits over the mouth
let pos = { ...HOME }, busy = false, drag = null, pass = 0;   // pass: a new move cancels the glide before it

/* a CSS cubic-bezier as a function of progress */
function bezier(x1, y1, x2, y2) {
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t, dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
  return (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const e = X(t) - x, d = dX(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
    return Y(Math.min(1, Math.max(0, t)));
  };
}
const OUT = bezier(0.16, 1, 0.3, 1), IN_OUT = bezier(0.65, 0, 0.35, 1);
const tween = (ms, fn, ease, my) => new Promise((done) => {      // resolves true when it arrives, false if cancelled
  if (reduce) { fn(1); return done(true); }
  const t0 = performance.now();
  const step = (now) => {
    if (my !== pass) return done(false);
    const p = Math.min(1, (now - t0) / ms);
    fn(ease(p));
    if (p < 1) requestAnimationFrame(step); else done(true);
  };
  requestAnimationFrame(step);
});
const sleep = (ms, my) => new Promise((done) => setTimeout(() => done(my === pass), reduce ? 0 : ms));

const put = (p) => { pos = p; doc.style.transform = `translate(${p.x}px, ${p.y}px)`; };
const glide = (to, ms, ease, my) => { const from = { ...pos }; return tween(ms, (t) => put({ x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t }), ease, my); };
const near = () => Math.hypot(pos.x - MOUTH.x, pos.y - (MOUTH.y - 40)) < 150;
const scale = () => doc.getBoundingClientRect().width / 128;     // the page may be scaled

doc.addEventListener('pointerdown', (e) => {
  if (busy) return;
  pass++;                                                        // a glide home gives way to the hand
  drag = { sx: e.clientX, sy: e.clientY, p: { ...pos } };
  try { doc.setPointerCapture(e.pointerId); } catch (_) { /* a scripted pointer */ }
  doc.classList.add('dragging');
});
function cancel() {                                              // the press ended without a release: back home
  if (!drag) return;
  drag = null; doc.classList.remove('dragging'); folder.classList.remove('fd-open');
  glide(HOME, 260, OUT, pass);
}
doc.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (e.isTrusted && e.pointerType === 'mouse' && !e.buttons) return cancel();   // a press that ended out of sight
  const k = scale();
  put({ x: drag.p.x + (e.clientX - drag.sx) / k, y: drag.p.y + (e.clientY - drag.sy) / k });
  folder.classList.toggle('fd-open', near());                    // the lid opens as the card nears
});
async function release() {
  if (!drag) return;
  drag = null; doc.classList.remove('dragging');
  if (near()) await swallow();
  else { folder.classList.remove('fd-open'); await glide(HOME, 260, OUT, pass); }
}
doc.addEventListener('pointerup', release);
doc.addEventListener('pointercancel', cancel);

async function swallow() {
  const my = ++pass;
  busy = true; folder.classList.add('fd-open'); doc.classList.add('in');
  if (!(await glide({ x: MOUTH.x, y: MOUTH.y - 20 }, 220, OUT, my))) return;
  if (!(await glide({ x: MOUTH.x, y: 102 }, 420, IN_OUT, my))) return;     // behind the front panel
  folder.classList.remove('fd-open');                                       // the lid closes
  if (!(await sleep(260, my))) return;
  settle();
  busy = false;
}
function settle() { doc.style.visibility = 'hidden'; res.classList.add('on'); tip.style.opacity = 0; }   // the card is in, the row says so
function reset() {
  pass++; busy = false; drag = null;
  folder.classList.remove('fd-open'); res.classList.remove('on'); tip.style.opacity = 1;
  doc.classList.remove('in', 'dragging'); doc.style.visibility = ''; put(HOME);
}
reset();
if (reduce) settle();
</script>
<script>
  /* harness glue: a ghost drags the card into the folder, through the page's own handlers */
  PickGhost.fit(document.getElementById('pk'), 640, 430, { max: 1.7 });
  PickGhost.start({
    reset,
    async script(g) {
      await g.to('.fd-doc', { ms: 500 });
      await g.down();
      const p = g.at('.fd-doc');                                              // the ghost holds the card by its middle
      await g.to({ x: p.x + 60, y: p.y - 70 }, { ms: 520 });                  // lifts it up and away
      await g.to(() => {                                                      // then over the mouth, the card's top-left on MOUTH
        const r = q('.fd-stage').getBoundingClientRect(), k = scale();
        return { x: r.left + (MOUTH.x + 64) * k, y: r.top + (MOUTH.y + 70) * k };
      }, { ms: 800 });
      await g.wait(220);
      await g.up();
      await g.wait(900 + 2600 + 400);                                          // in, closed, read; a hold; the gap before the next loop
    },
    still() { settle(); },
  });
  QM.demo({ kind: 'loop', restart: PickGhost.restart });
</script>
