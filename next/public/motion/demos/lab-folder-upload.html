<script data-code>
/* Folder upload: a folder with a recomputed flap, eyes that follow the file, and springs for everything. */
function folderUpload(root) {
  const $ = (id) => root.querySelector('#' + id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = $('fu-svg'), folder = $('folder'), flap = $('flap'), back = $('back'), mid = $('mid'), topL = $('top'), file = $('file');
  const eyeL = $('eyeL'), eyeR = $('eyeR'), happy = $('happy'), copy = $('fu-copy'), bar = $('fu-bar'), fillb = $('fu-fill');
  // the back panel: a tab, with its top right corner cut
  back.setAttribute('d', 'M-100,-150 L-40,-150 L-30,-138 L86,-138 L100,-124 L100,0 L-100,0 Z');
  const p1 = $('pap1'), p2 = $('pap2');
  [[p1, -84, -130, 166, 110, -3], [p2, -80, -124, 162, 110, 2.5]].forEach(([e, x, y, w, h, r]) => { e.setAttribute('x', x); e.setAttribute('y', y); e.setAttribute('width', w); e.setAttribute('height', h); e.setAttribute('transform', `rotate(${r})`); });
  let W, H, S, CX, BY, home = { x: 0, y: 0 };
  function resize() {
    const o = root.getBoundingClientRect(); W = o.width; H = o.height; svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    S = Math.max(0.62, Math.min(1.45, Math.min(W / 430, H / 560)));
    CX = W / 2; BY = H * 0.46 + 40 * S;
    copy.style.top = BY + 26 * S + 'px';
    home = { x: Math.min(W - 16 - 62 * S, CX + 150 * S), y: Math.min(H - 16 - 70 * S, BY + 170 * S) };
    if (W < 520) home = { x: W - 16 - 58 * S, y: Math.min(H - 26 - 56 * S, BY + 190 * S) };
    if (st === 'idle' && !dragging) { F.x.x = home.x; F.y.x = home.y; }
  }
  const spr = (x, k = 170, c = 18) => ({ x, v: 0, t: x, k, c });
  const step = (s, dt) => { if (reduce) { s.x = s.t; s.v = 0; return; } s.v += (s.k * (s.t - s.x) - s.c * s.v) * dt; s.x += s.v * dt; };
  const open = spr(0, 260, 16), sq = spr(0, 420, 14), hop = spr(0, 220, 16), lookX = spr(0, 120, 16), lookY = spr(0, 120, 16);
  const F = { x: spr(0, 300, 30), y: spr(0, 300, 30), s: spr(1, 260, 20), r: spr(0, 200, 18) };
  let st = 'idle', dragging = false, prog = 0, blinkT = 2, blink = 0, chew = 0, happyOn = 0, clock = 0, seq = 0;
  function setText(el, txt, quick) {
    const old = [...el.querySelectorAll('span')];
    if (old.length && old[old.length - 1].textContent === txt) return;
    if (quick && old.length) { old[old.length - 1].textContent = txt; return; }
    const sp = document.createElement('span'); sp.textContent = txt;
    if (reduce || !old.length) { old.forEach((o) => o.remove()); el.appendChild(sp); return; }
    sp.className = 'in'; el.appendChild(sp); old.forEach((o) => { o.className = 'out'; setTimeout(() => o.remove(), 650); });
    requestAnimationFrame(() => requestAnimationFrame(() => { if (sp.className === 'in') sp.className = ''; }));
  }
  const say = (a, b, q) => { setText($('fu-t'), a); setText($('fu-sb'), b, q); };
  const local = (wx, wy) => ({ x: (wx - CX) / S, y: (wy - BY) / S });
  const overFolder = (x, y) => { const l = local(x, y); return l.x > -130 && l.x < 130 && l.y > -230 && l.y < 30; };
  const setParent = (p) => { const t = p === 'mid' ? mid : topL; if (file.parentNode !== t) t.appendChild(file); };
  function flapPath(o) {   // the front flap: a trapezoid whose top edge rises and widens as it opens
    const th = o * 0.95, c = Math.cos(th), e = 1 + 0.13 * Math.sin(th), ty = -112 * c, hw = 100 * e;
    return { d: `M-100,0 L100,0 L${hw},${ty} L${-hw},${ty} Z`, ty, e, c };
  }
  function render() {
    const fp = flapPath(Math.max(-0.05, open.x));
    flap.setAttribute('d', fp.d);
    const sy = 1 + sq.x, sx = 1 - sq.x * 0.6;
    folder.setAttribute('transform', `translate(${CX},${BY + hop.x * S}) scale(${S * sx},${S * sy})`);
    const ey = fp.ty + (0 - fp.ty) * 0.34, ex = 30 * fp.e, ry = 13 * Math.max(0.35, fp.c) * (1 - blink * 0.9), rx = 11;
    [[eyeL, -ex], [eyeR, ex]].forEach(([g, x]) => {
      const a = g.children[0], pu = g.children[1], hh = Math.max(1.6, ry * 2), pr = Math.min(11, Math.max(1.5, ry * 0.84));
      a.setAttribute('x', x - rx); a.setAttribute('y', ey - hh / 2); a.setAttribute('width', rx * 2); a.setAttribute('height', hh);
      pu.setAttribute('x', x + lookX.x * 4.5 - pr / 2); pu.setAttribute('y', ey + lookY.x * 5 * Math.max(0.4, fp.c) - pr / 2); pu.setAttribute('width', pr); pu.setAttribute('height', pr);
      g.style.display = happyOn > 0.5 ? 'none' : '';
    });
    happy.setAttribute('d', `M${-ex - 9},${ey + 5} L${-ex},${ey - 6} L${-ex + 9},${ey + 5} M${ex - 9},${ey + 5} L${ex},${ey - 6} L${ex + 9},${ey + 5}`);
    happy.style.display = happyOn > 0.5 ? '' : 'none';   // the eyes swap, they are not faded
    file.setAttribute('transform', file.parentNode === topL ? `translate(${F.x.x},${F.y.x}) rotate(${F.r.x}) scale(${F.s.x * S})` : `translate(${F.x.x},${F.y.x}) rotate(${F.r.x}) scale(${F.s.x})`);
  }
  let last = performance.now();
  (function frame(now) {
    requestAnimationFrame(frame);
    if (CX === undefined) return;   // not laid out yet
    const dt = Math.min(0.04, (now - last) / 1000); last = now; clock += dt;
    blinkT -= dt; if (blinkT < 0) { blink = Math.min(1, blink + dt * 14); if (blink >= 1) blinkT = reduce ? 99 : 2.2 + Math.random() * 2.4; } else blink = Math.max(0, blink - dt * 10);
    if (st === 'upload' && !reduce) { chew += dt; open.t = 0.08 + 0.16 * (0.5 - 0.5 * Math.cos(chew * 9.5)); sq.t = -0.03 * Math.sin(chew * 9.5); }
    if (st === 'drag' || st === 'hover') { const l = local(F.x.x, F.y.x), d = Math.hypot(l.x, l.y + 110) || 1; lookX.t = l.x / d; lookY.t = (l.y + 110) / d; }
    else if (st === 'upload') { lookX.t = 0.35 * Math.sin(clock * 1.3); lookY.t = -0.5; }
    else { lookX.t = 0.25 * Math.sin(clock * 0.7); lookY.t = 0.1; }
    const n = reduce ? 1 : 3;
    for (let i = 0; i < n; i++) [open, sq, hop, lookX, lookY, F.x, F.y, F.s, F.r].forEach((s) => step(s, dt / n));
    render();
  })(last);
  const setState = (s) => { st = s; };
  const idleText = () => say('Drop the moodboard here', 'Drag the pictures onto the folder');
  function hoverOn(on) {
    if (on && st === 'drag') { setState('hover'); open.t = 1; sq.t = 0.04; say('Let go to drop', 'The folder is ready'); }
    else if (!on && st === 'hover') { setState('drag'); open.t = 0; sq.t = 0; idleText(); }
  }
  const wait = (ms) => { const my = seq; return new Promise((r, j) => setTimeout(() => (my === seq ? r() : j(0)), reduce ? Math.min(ms, 30) : ms)); };
  async function swallow(n) {
    const my = ++seq; setState('swallow'); say('Got it', n + (n === 1 ? ' picture' : ' pictures'));
    const l = local(F.x.x, F.y.x);
    setParent('mid'); F.x.x = l.x; F.y.x = l.y; F.s.t = F.s.x;
    F.x.t = 0; F.y.t = -150; F.s.t = 0.78; F.r.t = 0; open.t = 1.05;
    try {
      await wait(260);
      F.y.k = 520; F.y.t = -46; await wait(240);
      open.t = 0; sq.t = -0.12; sq.v = -2; await wait(150); sq.t = 0.06; await wait(120); sq.t = 0; F.y.k = 300;
      setState('upload'); chew = 0; bar.classList.add('is-on');
      const dur = reduce ? 300 : 2600, t0 = performance.now();
      for (;;) {
        const u = Math.min(1, (performance.now() - t0) / dur);
        prog = u < 1 ? Math.min(0.99, (u * 0.92 + 0.08 * Math.sin(u * Math.PI * 0.5)) * (1 - 0.12 * Math.sin(u * Math.PI * 3) * (1 - u))) : 1;
        fillb.style.transform = `scaleX(${prog})`;
        say('Uploading ' + n + (n === 1 ? ' picture' : ' pictures'), Math.round(prog * 100) + '%', prog > 0.011);
        if (u >= 1) break; await wait(50);
      }
      setState('done'); open.t = 0; sq.t = 0; hop.v = -520; hop.t = 0; sq.v = 3;
      happyOn = 1; bar.classList.remove('is-on'); say(n + (n === 1 ? ' picture' : ' pictures') + ' added', 'Forma moodboard · clay, glaze and light');
      await wait(2600);
      happyOn = 0;
      setParent('top'); F.x.x = home.x; F.y.x = home.y; F.x.t = home.x; F.y.t = home.y; F.s.x = 0.2; F.s.t = 1; F.r.t = 0;   // the picture grows back at its home
      fillb.style.transform = 'scaleX(0)'; setState('idle'); idleText();
    } catch (e) { /* cancelled by a newer story */ }
  }
  let grab = { dx: 0, dy: 0 }, lastPX = 0;
  function pickAt(x, y) {
    if (st !== 'idle') return false;
    if (Math.hypot(x - F.x.x, y - F.y.x) > 56 * S) return false;
    dragging = true; setState('drag'); grab = { dx: F.x.x - x, dy: F.y.x - y }; F.s.t = 1.08; lastPX = x; return true;
  }
  function moveTo(x, y) {
    if (!dragging) return;
    F.x.t = x + grab.dx; F.y.t = y + grab.dy; F.r.t = Math.max(-14, Math.min(14, (x - lastPX) * 0.9)); lastPX = x;
    hoverOn(overFolder(F.x.t, F.y.t));
  }
  function release() {
    if (!dragging) return; dragging = false; F.r.t = 0;
    if (st === 'hover') swallow(3); else { setState('idle'); F.x.t = home.x; F.y.t = home.y; F.s.t = 1; open.t = 0; idleText(); }
  }
  svg.addEventListener('pointerdown', (e) => { const o = root.getBoundingClientRect(); if (pickAt(e.clientX - o.left, e.clientY - o.top)) svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', (e) => { const o = root.getBoundingClientRect(); moveTo(e.clientX - o.left, e.clientY - o.top); });
  svg.addEventListener('pointerup', release); svg.addEventListener('pointercancel', release);
  // real files dropped from the desktop
  addEventListener('dragover', (e) => { e.preventDefault(); if (st === 'idle') setState('drag'); hoverOn(true); });
  addEventListener('drop', (e) => { e.preventDefault(); const n = (e.dataTransfer && e.dataTransfer.files.length) || 1; if (st === 'hover' || st === 'drag') { F.x.x = CX; F.y.x = BY - 200 * S; F.s.x = 0.9; swallow(n); } });
  addEventListener('resize', resize);
  resize(); idleText(); F.x.x = F.x.t = home.x; F.y.x = F.y.t = home.y;
  if (reduce) render();
  const o0 = () => root.getBoundingClientRect();
  return {
    // the scripted drag, for a ghost: pick the file up, carry it over the folder, let go
    state: () => st, home: () => ({ x: home.x + o0().left, y: home.y + o0().top }), mouth: () => ({ x: CX + 10 * S + o0().left, y: BY - 150 * S + o0().top }), S: () => S,
    pick(x, y) { const o = o0(); return pickAt(x - o.left, y - o.top); }, move(x, y) { const o = o0(); moveTo(x - o.left, y - o.top); }, release, get dragging() { return dragging; },
  };
}
const fu = folderUpload(document.getElementById('fu'));
</script>
<script>
  /* the ghost carries the file to the folder, lets go, and drifts off while it chews */
  let lastReal = -1e9, gen = 0;
  ['pointerdown', 'keydown'].forEach((n) => addEventListener(n, (e) => { if (e.isTrusted) { lastReal = performance.now(); gen++; QM.ghostHide(); if (fu.dragging) fu.release(); } }, true));
  const guard = (g) => { if (g !== gen) throw 0; };
  async function toss(g) {
    const h = fu.home(), S = fu.S();
    QM.ghostShow(); QM.ghostAt(Math.min(innerWidth - 30, h.x + 90), Math.min(innerHeight - 30, h.y + 80));
    await QM.ghostTo(h.x + 6, h.y + 10, 600); guard(g);
    fu.pick(h.x + 6, h.y + 10); await QM.wait(200); guard(g);
    const m = fu.mouth(), t0 = performance.now(), sx = h.x + 6, sy = h.y + 10, tx = m.x, ty = m.y - 20 * S;
    while (performance.now() - t0 < 1100) { guard(g); const k = Math.min(1, (performance.now() - t0) / 1100), e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; const x = sx + (tx - sx) * e, y = sy + (ty - sy) * e - Math.sin(Math.PI * e) * Math.min(60, Math.abs(tx - sx) * 0.25); QM.ghostAt(x, y); fu.move(x, y); await QM.wait(16); }
    await QM.wait(350); guard(g);
    fu.release(); await QM.wait(300); guard(g);
    await QM.ghostTo(Math.min(innerWidth - 30, h.x + 40), Math.min(innerHeight - 30, h.y + 90), 900); guard(g);
    QM.ghostHide();
  }
  async function loop() {
    for (;;) {
      await QM.wait(250);
      if (QM.reduced || document.hidden || performance.now() - lastReal < 2500 || fu.state() !== 'idle' || fu.dragging) continue;
      const g = gen;
      try { await toss(g); } catch (e) { if (fu.dragging) fu.release(); }
    }
  }
  QM.demo({ kind: 'loop', restart() {} });
  loop();
</script>
