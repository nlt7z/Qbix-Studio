/* Message branches. One heavy thing: the Send pill while editing. White surfaces with a soft ring; one lime point (the agent's dot).

.mb { position: relative; width: 480px; max-width: 100%; padding: 20px 20px 18px; background: #fff; color: #0B0C0D; border-radius: 20px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(11, 12, 13, .07), 0 12px 32px -16px rgba(11, 12, 13, .18);
  font: 400 15px/22px Geist, system-ui, sans-serif; letter-spacing: -.011em; }
.mb :where(button, input) { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; }
.mb button { cursor: pointer; }

/* the message zone: two layers, the bubble and the editor, uncovered under a clip */
.mb-zone { position: relative; height: 88px; }
.mb-lay { position: absolute; inset: 0; margin: 0;
  transition: clip-path 360ms cubic-bezier(.16, 1, .3, 1) 60ms, transform 360ms cubic-bezier(.16, 1, .3, 1) 60ms; }
.mb-view { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; clip-path: inset(-8px); }
.mb-ed { display: flex; flex-direction: column; gap: 8px; clip-path: inset(calc(100% + 8px) -8px -8px -8px); transform: translateY(6px); }
.mb-zone[data-m="edit"] .mb-view { clip-path: inset(-8px -8px calc(100% + 8px) -8px); transform: translateY(-6px);
  transition: clip-path 220ms cubic-bezier(.5, 0, .75, 0), transform 220ms cubic-bezier(.5, 0, .75, 0); }
.mb-zone[data-m="edit"] .mb-ed { clip-path: inset(-8px); transform: none; }

/* the bubble: white with a ring, its words are spans whose width the diff opens and closes */
.mb-bub { max-width: 100%; padding: 11px 16px; background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px rgba(11, 12, 13, .1); white-space: nowrap; }
.mb-w { display: inline-block; vertical-align: top; height: 22px; overflow: hidden; margin-right: 4px;
  transition: width 420ms cubic-bezier(.16, 1, .3, 1), margin-right 420ms cubic-bezier(.16, 1, .3, 1); }
.mb-w:last-child { margin-right: 0; }

.mb-w.off i { transform: translateY(-105%); transition-duration: 260ms; transition-timing-function: cubic-bezier(.5, 0, .75, 0); }

.mb-tools { display: flex; align-items: center; justify-content: flex-end; height: 32px; }

  font-size: 13px; font-weight: 500; line-height: 1; color: rgba(11, 12, 13, .66);
  clip-path: inset(100% 0 0 0); transform: translateY(4px); pointer-events: none;

.mb-zone:hover .mb-edit, .mb-zone:focus-within .mb-edit, .mb-zone.hot .mb-edit { clip-path: inset(-6px); transform: none; pointer-events: auto;
  transition: clip-path 260ms cubic-bezier(.16, 1, .3, 1), transform 260ms cubic-bezier(.16, 1, .3, 1), color 160ms cubic-bezier(.4, 0, .2, 1); }

.mb-edit:hover { color: #0B0C0D; }

/* the pager: a clipped box that opens to its own width */

/* the editor: a field with the one ink pill */
.mb-in { height: 44px; width: 100%; padding: 0 16px; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px rgba(11, 12, 13, .07); outline: none;
  transition: box-shadow 160ms cubic-bezier(.4, 0, .2, 1); }
.mb-in:focus { box-shadow: 0 0 0 1.5px rgba(11, 12, 13, .55); }
.mb-bt { display: flex; align-items: center; justify-content: flex-end; gap: 4px; height: 36px; }

  transition: color 160ms cubic-bezier(.4, 0, .2, 1), transform 100ms cubic-bezier(.4, 0, .2, 1); }
.mb-cancel:hover { color: #0B0C0D; }
.mb-send { height: 36px; padding: 0 18px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1; background: #0B0C0D; color: #fff;
  transition: background 220ms cubic-bezier(.4, 0, .2, 1), color 220ms cubic-bezier(.4, 0, .2, 1), transform 100ms cubic-bezier(.4, 0, .2, 1); }
.mb-send:disabled { background: #EEF1E8; color: rgba(11, 12, 13, .38); cursor: default; }
.mb-send:active:not(:disabled), .mb-cancel:active { transform: translateY(1px); }

/* the answers: a row of panels in a window as wide as the card, the current one in view */
.mb-who { display: flex; align-items: center; gap: 8px; height: 22px; margin-top: 8px; font-size: 13px; font-weight: 500; color: rgba(11, 12, 13, .66); }

<script data-code>
/* Message branches. Branches are {q, a, el}: the message, the answer and its panel. Only the current panel is in view, older ones wait
   left, newer ones right. The message is a row of word spans: a word diff decides which close, which open and which stay. */
const mb = document.getElementById('mb'), mbZone = document.getElementById('mb-zone'), mbBub = document.getElementById('mb-bub');
const mbEditB = document.getElementById('mb-edit'), mbView = document.getElementById('mb-view'), mbEd = document.getElementById('mb-ed');
const mbIn = document.getElementById('mb-in'), mbSendB = document.getElementById('mb-send'), mbWin = document.getElementById('mb-win');
const mbPgw = document.getElementById('mb-pgw'), mbPg = document.getElementById('mb-pg'), mbPrev = document.getElementById('mb-prev'), mbNext = document.getElementById('mb-next');
const mbCurN = document.getElementById('mb-cur'), mbTotN = document.getElementById('mb-tot'), mbLive = document.getElementById('mb-live');

const MB_POOLS = {
  calm: [['Slow clay, quiet mornings.', 'Softer, with fewer claims and more room to breathe.'], ['Made slowly, kept close.', 'Quieter still, one idea and no adjectives.']],
  bold: [['Clay, turned up.', 'Louder: short words and a firm full stop.'], ['Loud colour, steady hands.', 'A bolder line that still sounds handmade.']],
  base: [['Made by hand. Kept for years.', 'Direct and warm, built around the hand-thrown pieces.'], ['Every piece, one pair of hands.', 'A plainer line that puts the maker first.'], ['Made small. Made well.', 'Short enough to sit under the logo.']],
};
function mbAnswer(q, n) {
  const k = /calm|quiet|soft|gentle/i.test(q) ? 'calm' : /bold|loud|punch|strong/i.test(q) ? 'bold' : 'base';
  const a = MB_POOLS[k][n % MB_POOLS[k].length];
  return { t: a[0], p: a[1] };
}
const mbB = [{ q: 'Draft a tagline for Forma', a: mbAnswer('Draft a tagline', 0), el: null }];
let mbCur = 0, mbMode = 'view', mbSp = [], mbSettle = 0, mbPgOpen = false;
const mbWords = (s) => s.trim().split(/\s+/).filter(Boolean);
const mbSnap = (fn) => { mb.classList.add('snap'); fn(); mb.getBoundingClientRect(); mb.classList.remove('snap'); };

/* a number that rolls: dir +1 brings the new one from below, -1 from above */
function mbRoll(el, txt, dir, snap) {
  const last = el.lastElementChild;
  if (last && last.textContent === txt) return;
  if (snap || !last) { el.innerHTML = '<i>' + txt + '</i>'; return; }
  const n = document.createElement('i');
  n.textContent = txt; n.style.transform = `translateY(${dir * 100}%)`;
  el.appendChild(n); el.getBoundingClientRect();
  [...el.children].forEach((c) => { if (c !== n) c.style.transform = `translateY(${-dir * 100}%)`; });
  n.style.transform = 'none';
  setTimeout(() => { [...el.children].forEach((c) => { if (c !== el.lastElementChild) c.remove(); }); }, 460);
}

/* the message: a word diff */
function mbDiff(a, b) {
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ops = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: 'k', i, j }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) { ops.push({ t: 'd', i }); i++; }
    else { ops.push({ t: 'a', j }); j++; }
  }
  while (i < n) ops.push({ t: 'd', i: i++ });
  while (j < m) ops.push({ t: 'a', j: j++ });
  return ops;
}
function mbMorph(text, snap) {
  const B = mbWords(text);
  if (snap) {
    mbBub.textContent = '';
    mbSp = B.map((w) => { const el = document.createElement('span'); el.className = 'mb-w'; el.innerHTML = '<i></i>'; el.firstChild.textContent = w; mbBub.appendChild(el); const s = { el, w, on: true }; el._s = s; return s; });
    return;
  }
  const vis = mbSp.filter((s) => s.on), ops = mbDiff(vis.map((s) => s.w), B);
  let ref = null;
  for (let k = ops.length - 1; k >= 0; k--) {
    const o = ops[k];
    if (o.t === 'k') ref = vis[o.i].el;
    else if (o.t === 'd') {
      const s = vis[o.i]; s.on = false; s.el.style.width = s.el.getBoundingClientRect().width + 'px'; s.el.getBoundingClientRect(); s.el.classList.add('off'); ref = s.el;
    } else {
      const el = document.createElement('span'); el.className = 'mb-w off pre'; el.innerHTML = '<i></i>'; el.firstChild.textContent = B[o.j];
      mbBub.insertBefore(el, ref); const s = { el, w: B[o.j], on: true }; el._s = s;
      const w = el.firstChild.offsetWidth; el.getBoundingClientRect();
      el.classList.remove('off', 'pre'); el.style.width = w + 'px'; ref = el;
    }
  }
  mbSp = [...mbBub.children].map((el) => el._s);
  clearTimeout(mbSettle);
  mbSettle = setTimeout(() => { mbSp = mbSp.filter((s) => { if (!s.on) { s.el.remove(); return false; } s.el.style.width = ''; return true; }); }, 520);
}

/* an answer panel: its words are uncovered one by one when it streams */
function mbPanel(a) {
  const el = document.createElement('div');
  el.className = 'mb-pa'; el.dataset.pos = 'right'; el.setAttribute('aria-hidden', 'true');
  const fill = (cls, text) => {
    const p = document.createElement('p'); p.className = cls;
    mbWords(text).forEach((w, k) => {
      if (k) { const sp = document.createElement('span'); sp.className = 'sw sp'; p.appendChild(sp); }
      const s = document.createElement('span'); s.className = 'sw'; s.innerHTML = '<i></i>'; s.firstChild.textContent = w; p.appendChild(s);
    });
    el.appendChild(p);
  };
  fill('mb-t', a.t); fill('mb-p', a.p);
  mbWin.appendChild(el);
  return el;
}
function mbStream(el, snap) {
  const ws = [...el.querySelectorAll('.sw:not(.sp)')];
  if (snap) { ws.forEach((w) => w.classList.add('in')); return; }
  ws.forEach((w, k) => setTimeout(() => w.classList.add('in'), 260 + k * 38));
}
function mbPlace() {
  mbB.forEach((b, k) => { b.el.dataset.pos = k < mbCur ? 'left' : k > mbCur ? 'right' : 'in'; b.el.setAttribute('aria-hidden', String(k !== mbCur)); });
}
function mbFit(snap) {
  mbPgw.style.width = mbPgOpen ? mbPg.offsetWidth + 'px' : '0px';
  if (snap) { mbPgw.getBoundingClientRect(); }
}
function mbPager(snap, dir) {
  mbRoll(mbCurN, String(mbCur + 1), dir, snap); mbRoll(mbTotN, String(mbB.length), 1, snap);
  mbPrev.disabled = mbCur === 0; mbNext.disabled = mbCur === mbB.length - 1;
  mbFit(snap);
}
function mbSay() { mbLive.textContent = mbB.length > 1 ? `Branch ${mbCur + 1} of ${mbB.length}. ${mbB[mbCur].q}. ${mbB[mbCur].a.t}` : ''; }

/* page to branch i: panels slide, the message morphs, the number rolls */
function mbGo(i, snap) {
  i = Math.max(0, Math.min(mbB.length - 1, i));
  if (i === mbCur) return;
  const dir = i > mbCur ? 1 : -1;
  mbCur = i;
  mbPlace(); mbMorph(mbB[i].q, snap); mbPager(snap, dir); mbSay();
}
function mbOpenPager(snap) { mbPgOpen = true; mbPgw.dataset.open = ''; mbPgw.inert = false; mbPager(snap, 1); }
function mbClosePager(snap) { mbPgOpen = false; delete mbPgw.dataset.open; mbPgw.inert = true; mbFit(snap); }

function mbEdit() {
  if (mbMode === 'edit') return;
  mbMode = 'edit'; mbIn.value = mbB[mbCur].q; mbSyncSend();
  mbZone.dataset.m = 'edit'; mbView.inert = true; mbEd.inert = false;
  mbIn.focus({ preventScroll: true }); mbIn.setSelectionRange(mbIn.value.length, mbIn.value.length);
}
function mbLeaveEdit(refocus) {
  mbMode = 'view'; mbZone.dataset.m = 'view'; mbView.inert = false; mbEd.inert = true;
  if (refocus) mbEditB.focus({ preventScroll: true }); else if (mbEd.contains(document.activeElement)) document.activeElement.blur();
}
function mbSyncSend() { const v = mbIn.value.trim(); mbSendB.disabled = !v || v === mbB[mbCur].q; }
function mbSend(refocus) {
  const v = mbIn.value.trim().replace(/\s+/g, ' ');
  if (!v || v === mbB[mbCur].q) { mbLeaveEdit(refocus); return; }
  const first = mbB.length === 1, a = mbAnswer(v, mbB.length);
  const el = mbPanel(a);
  mbSnap(() => { el.dataset.pos = 'right'; });
  mbB.push({ q: v, a, el }); mbCur = mbB.length - 1;
  mbLeaveEdit(refocus);
  mbPlace(); mbStream(el);
  setTimeout(() => mbMorph(v), 200);                 // the bubble is back in view by then
  if (first) { mbPager(true, 1); setTimeout(() => { if (mbB.length > 1) mbOpenPager(); }, 220); } else mbPager(false, 1);
  mbSay();
}
/* drop every branch but the first: used by the loop to start over */
function mbDrop() {
  if (mbMode === 'edit') mbLeaveEdit(false);
  mbGo(0);
  const extra = mbB.splice(1);
  mbClosePager();
  setTimeout(() => { if (mbB.length === 1) { extra.forEach((b) => b.el.remove()); mbPager(true, 1); } else extra.forEach((b) => { if (!mbB.includes(b)) b.el.remove(); }); }, 560);
  mbSay();
}

<script>
(() => {

  const mid = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

    });

        for (let k = 1; k <= 7; k++) {                        // "calmer " goes in after "Draft a "
          mbIn.value = base.slice(0, 8) + 'calmer '.slice(0, k) + base.slice(8); mbIn.setSelectionRange(8 + k, 8 + k);

        { const r = mbWin.getBoundingClientRect(); await to(my, r.right - 64, r.top + 44, 800); }   // park beside the answer, off the pager

    };
    addEventListener('pointermove', touch, { passive: true });
    addEventListener('pointerdown', touch, { passive: true });
    addEventListener('keydown', () => touch({}));
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => { if (reduced || QM.tile) rest(); if (!reduced) script(); }, 300));
})();
