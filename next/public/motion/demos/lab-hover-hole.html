<script data-code>
const holeApi = (() => {
  const top = document.getElementById('top');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = innerWidth, H = innerHeight;
  addEventListener('resize', () => { W = innerWidth; H = innerHeight; });
  const ptr = { x: W * 0.55, y: H * 0.45, inside: true };
  // hole: a main blob plus a short trail of followers
  const trail = [0.62, 0.42, 0.28, 0.18].map((s) => ({ x: ptr.x, y: ptr.y, s }));
  let hx = ptr.x, hy = ptr.y, px0 = ptr.x, py0 = ptr.y;
  let speed = 0, calm = 0.2, r = 0, rv = 0;
  // hard edge: the lime is cut, not feathered
  const maskFor = (x, y, rad) => `radial-gradient(circle ${Math.max(0.1, rad).toFixed(1)}px at ${x.toFixed(1)}px ${y.toFixed(1)}px, transparent ${Math.max(0, rad - 1).toFixed(1)}px, #000 ${rad.toFixed(1)}px)`;
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.25, (now - last) / 1000) || 0.016; last = now;
    const k = 1 - Math.exp(-dt * 22);
    hx += (ptr.x - hx) * k; hy += (ptr.y - hy) * k;
    const v = Math.hypot(hx - px0, hy - py0) / dt; px0 = hx; py0 = hy;
    speed += (v - speed) * (1 - Math.exp(-dt * 8));
    if (speed < 90) calm = Math.min(1, calm + dt / 1.5);
    else calm = Math.max(0, calm - dt * speed / 420);
    const mn = Math.min(W, H), rMin = Math.max(24, mn * 0.07), rMax = Math.hypot(W, H) * 0.24;
    const c = calm * calm * (3 - 2 * calm);
    let target = ptr.inside ? rMin + (rMax - rMin) * c : 0;
    if (reduce) target = ptr.inside ? mn * 0.26 : 0;
    const breathe = reduce ? 0 : Math.sin(now / 520) * mn * 0.008 * c;
    for (let n = 0, h = dt / 5; n < 5; n++) { rv += ((target + breathe - r) * 90 - rv * 13) * h; r += rv * h; }
    if (r < 0) { r = 0; rv = 0; }
    let lx = hx, ly = hy;
    trail.forEach((p, i) => {
      const kk = 1 - Math.exp(-dt * (16 - i * 3));
      p.x += (lx - p.x) * kk; p.y += (ly - p.y) * kk; lx = p.x; ly = p.y;
    });
    const masks = [maskFor(hx, hy, r)];
    trail.forEach((p) => masks.push(maskFor(p.x, p.y, r * p.s)));
    const m = masks.join(',');
    top.style.webkitMaskImage = m; top.style.maskImage = m;
  }
  requestAnimationFrame(frame);
  return {
    move(x, y) { ptr.x = x; ptr.y = y; ptr.inside = true; },
    leave() { ptr.inside = false; }
  };
})();
document.addEventListener('pointermove', (e) => holeApi.move(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => holeApi.leave());
</script>
<script>
  /* ghost: travel quickly between spots, then rest so the hole can grow */
  const SPOTS = [[0.3, 0.36], [0.72, 0.3], [0.62, 0.7], [0.24, 0.66], [0.5, 0.5]];
  const MOVE = 0.7, REST = 2.6;
  const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  QM.demo({ kind: 'pointer',
    move: (x, y) => holeApi.move(x, y),
    leave: () => holeApi.leave(),
    path: (t) => {
      const per = MOVE + REST, k = Math.floor(t / per), u = Math.min(1, (t - k * per) / MOVE);
      const a = SPOTS[k % SPOTS.length], b = SPOTS[(k + 1) % SPOTS.length], e = ease(u);
      const dx = b[0] - a[0], dy = b[1] - a[1], arc = Math.sin(u * Math.PI) * 0.12;
      return [innerWidth * (a[0] + dx * e - dy * arc), innerHeight * (a[1] + dy * e + dx * arc)];
    } });
</script>
