    const s = clamp(Math.floor(t + 0.5), 1, 5);
    roll(countEl, String(s).padStart(2, '0') + ' / 05'); roll(labelEl, labels[s - 1]);
  }

  /* ------------------------------------------------------------------ public */
  api.seek = (t) => { if (qs.has('still')) return; target = t; if (reduced || !raf) { u = t; draw(u, 0.016); updateReadout(u); } };
  api.show = (t, o = {}) => { target = u = t; vel = 0; api.idleT = o.idle || 0; if (o.az != null) { CK.forEach((c) => { c[1] = o.az; }); } draw(u, 0.016); updateReadout(u); };
  api.dirty = () => { if (!raf) draw(u, 0.016); };
  api.parts = P; api.size = size; api.chain = CHAIN; api.tgt = tgt; api.camKeys = CK; api.setCam = (i, vals) => { Object.assign(CK[i], vals); };
  api.info = () => ({ composer: !!composer, gtao: !!gtao, bokeh: !!bokeh, soft: SOFT, tris: renderer.info.render.triangles, calls: renderer.info.render.calls, explode: [expMin, expMax], gap: GAP, parts: (() => { let n = 0; lens.traverse((o) => { if (o.isMesh) n++; }); return n; })() });
  size(); buildPost(); size();
  api.show(qs.has('t') ? parseFloat(qs.get('t')) : 1);
  if (!reduced && !qs.has('still')) play();
  return api;
})();
QM.demo({ kind: 'states', n: 5, first: 3600, dwell: 3200, hold: 700, rewind: 2800, seek(t) { LENS.seek(t); } });
