<style data-code>
/* Glass tabs. A frosted bar; a brighter slab of the same glass slides under the chosen word. */
.gt { --gt-grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.2'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 112px; padding: 6px; --cut: 14px;
  background: rgba(255, 255, 255, .5);
  -webkit-backdrop-filter: blur(32px) saturate(1.3); backdrop-filter: blur(32px) saturate(1.3);
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%); }
.gt::after { content: ''; position: absolute; inset: 0; background: var(--gt-grain) 0 0 / 140px; opacity: .14; pointer-events: none; z-index: 0; }
.gt::before { content: ''; position: absolute; inset: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .7); pointer-events: none; z-index: 3; }
.gt-tab { all: unset; box-sizing: border-box; position: relative; z-index: 2; height: 48px; display: grid; place-items: center; cursor: pointer;
  font: 500 15px/1 'Geist', Geist, sans-serif; letter-spacing: -.011em; color: rgba(11, 12, 13, .66); transition: color 320ms cubic-bezier(.65, 0, .35, 1); }
.gt-tab[aria-checked='true'] { color: #0B0C0D; }
.gt-tab:focus-visible { outline: 2px solid #0B0C0D; outline-offset: -6px; }
.gt-slab { position: absolute; z-index: 1; left: 6px; top: 6px; width: 112px; height: 48px; pointer-events: none;
  background: var(--gt-grain) 0 0 / 140px, rgba(255, 255, 255, .72); background-blend-mode: soft-light, normal;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .9);
  transform: translateX(calc(var(--i, 0) * 112px)); transition: transform 640ms cubic-bezier(.65, 0, .35, 1); }
@media (prefers-reduced-motion: reduce) { .gt-slab, .gt-tab { transition: none; } }
</style>

<script data-code>
(function () {
  const gt = document.getElementById('gt'), tabs = [...gt.querySelectorAll('.gt-tab')], slab = gt.querySelector('.gt-slab');
  let cur = 0;
  function select(i, focus, snap) {
    cur = i;
    tabs.forEach((t, k) => { t.setAttribute('aria-checked', k === i); t.tabIndex = k === i ? 0 : -1; });
    if (snap) slab.style.transition = 'none';
    gt.style.setProperty('--i', i);
    if (snap) { void slab.offsetWidth; slab.style.transition = ''; }
    if (focus) tabs[i].focus();
  }
  tabs.forEach((t, i) => t.addEventListener('click', () => select(i)));
  gt.addEventListener('keydown', (e) => {
    const k = { ArrowRight: cur + 1, ArrowDown: cur + 1, ArrowLeft: cur - 1, ArrowUp: cur - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (k === undefined) return;
    e.preventDefault(); select(Math.max(0, Math.min(tabs.length - 1, k)), true);
  });
  window.GlassTabs = { select, tabs, get cur() { return cur; } };
})();
</script>
<script>
  const fit = () => document.getElementById('fit').style.setProperty('--s', Math.max(0.5, Math.min(1.8, innerWidth / 800, innerHeight / 500)).toFixed(3));
  addEventListener('resize', fit); fit();
  // the drift only runs while it is on screen
  if ('IntersectionObserver' in window) new IntersectionObserver((es) => es.forEach((e) => document.getElementById('drift').classList.toggle('is-off', !e.isIntersecting))).observe(document.getElementById('st'));

  const ABORT = {};
  let gen = 0, lastReal = -1e9, running = false;
  async function press(g, z, i) {
    const el = GlassTabs.tabs[i], r = el.getBoundingClientRect();
    await QM.ghostTo(r.left + r.width * 0.5, r.top + r.height * 0.62, 760); if (g !== gen) throw ABORT;
    await z(120); GlassTabs.select(i);
  }
  async function story(g) {
    const z = async (ms) => { await QM.wait(ms); if (g !== gen) throw ABORT; };
    QM.ghostShow();
    await z(700);
    for (const i of [1, 2, 3, 0]) { await press(g, z, i); await z(1500); }
  }
  if (QM.reduced) GlassTabs.select(1, false, true);
  else {
    if (!QM.tile) ['pointerdown', 'keydown', 'pointermove'].forEach((n) => addEventListener(n, (e) => {
      if (!e.isTrusted || (n === 'pointermove' && e.pointerType !== 'mouse')) return;
      lastReal = performance.now(); if (running) { gen++; QM.ghostHide(); }
    }, { capture: true, passive: true }));
    (async function idle() {
      for (;;) {
        await QM.wait(250);
        if (document.hidden || (!QM.tile && performance.now() - lastReal < 4000)) continue;
        running = true; const g = gen;
        try { await story(g); } catch (e) { if (e !== ABORT) throw e; }
        QM.ghostHide(); running = false;
      }
    })();
  }
  QM.demo({ kind: 'loop', restart() { lastReal = -1e9; if (running) { gen++; QM.ghostHide(); } GlassTabs.select(0, false, true); } });
</script>
