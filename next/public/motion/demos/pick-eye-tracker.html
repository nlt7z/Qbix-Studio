<script data-code>
/* Two eyes on a board block. Yaw and pitch are springs; the eyes sit on a sphere, so they narrow as they turn away. */
const $ = (id) => document.getElementById(id);
const board = $('board'), eL = $('eL'), eR = $('eR');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const S = (x = 0) => ({ x, v: 0, to: x });
const yaw = S(), pitch = S(), blink = S(1);
const stepS = (s, dt, k, c) => { s.v += (k * (s.to - s.x) - c * s.v) * dt; s.x += s.v * dt; };
const R = 92, GAP = 0.46, EW = 30, EH = 62;
let seen = false, blinkT = -1, raf = 0, last = 0;

function look(x, y) {
  const b = board.getBoundingClientRect();
  const dx = x - (b.left + b.width / 2), dy = y - (b.top + b.height / 2);
  const d = Math.hypot(dx, dy), reach = Math.max(b.width, 240);
  const m = Math.min(1, d / reach);
  const a = Math.atan2(dy, dx);
  yaw.to = Math.cos(a) * m * 1.05; pitch.to = Math.sin(a) * m * 0.62;
  if (d < b.width * 0.75 && !seen) { seen = true; blinkT = 0; }          // it notices you coming near: one blink
  else if (d > b.width * 1.6) seen = false;
  wake();
}
function away() { yaw.to = 0; pitch.to = 0; seen = false; wake(); }
addEventListener('pointermove', (e) => look(e.clientX, e.clientY), { passive: true });
document.documentElement.addEventListener('mouseleave', away);

function draw() {
  const cy = 160 - 4;
  for (const [el, sign] of [[eL, -1], [eR, 1]]) {
    const lon = sign * GAP + yaw.x, lat = pitch.x;
    const z = Math.cos(lon) * Math.cos(lat);
    const x = 160 + R * Math.sin(lon) * Math.cos(lat), y = cy + R * Math.sin(lat) * 0.9;
    const w = EW * Math.max(0.22, z), h = EH * (0.7 + 0.3 * Math.max(0, z)) * Math.max(0.06, blink.x);
    el.setAttribute('x', (x - w / 2).toFixed(2)); el.setAttribute('y', (y - h / 2).toFixed(2));
    el.setAttribute('width', w.toFixed(2)); el.setAttribute('height', h.toFixed(2));
    el.setAttribute('rx', Math.min(w, h) / 2.2);
    el.setAttribute('transform', `rotate(${(-yaw.x * 8 + sign * 4).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})`);
  }
  board.firstElementChild.style.transform = `translate(${(yaw.x * 6).toFixed(1)}px, ${(pitch.x * 6).toFixed(1)}px)`;
}
// frames run while the eyes are turning or blinking, then the loop parks; a timer starts the random blinks
const settled = () => blinkT < 0 && [yaw, pitch].every((s) => Math.abs(s.to - s.x) < 0.0005 && Math.abs(s.v) < 0.001);
function tick(now) {
  raf = 0;
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  stepS(yaw, dt, 130, 15); stepS(pitch, dt, 130, 15);
  if (blinkT >= 0) { blinkT += dt; const u = blinkT / 0.2; blink.x = u < 0.5 ? 1 - u * 2 * 0.94 : Math.min(1, 0.06 + (u - 0.5) * 2 * 0.94); if (u >= 1) { blinkT = -1; blink.x = 1; } }
  draw();
  if (!settled()) raf = requestAnimationFrame(tick);
}
function wake() { if (!still && !raf) { last = performance.now(); raf = requestAnimationFrame(tick); } }
function blinkLater(ms) { setTimeout(() => { blinkT = 0; wake(); blinkLater((2.4 + Math.random() * 2.6) * 1000); }, ms); }
if (!still) blinkLater(2200);
draw();
</script>
<script>
  /* pointer kind: the ghost comes in from the right, crosses, goes round the back of the block and ends close to it */
  const ease = QM.bezier(0.65, 0, 0.35, 1);
  function route(steps) {
    const total = steps.reduce((s, k) => s + k[1] + k[2], 0);
    return (t) => {
      let u = (t * 1000) % total, from = steps[steps.length - 1][0]();
      for (const [p, travel, hold] of steps) {
        const to = p();
        if (u < travel) { const k = ease(u / travel); return [from[0] + (to[0] - from[0]) * k, from[1] + (to[1] - from[1]) * k]; }
        u -= travel;
        if (u < hold) return to;
        u -= hold; from = to;
      }
      return from;
    };
  }
  const at = (fx, fy) => () => { const b = board.getBoundingClientRect(); return [b.left + b.width / 2 + b.width * fx, b.top + b.height / 2 + b.height * fy]; };
  const walk = route([[at(1.6, -0.5), 300, 0], [at(0.6, -0.1), 900, 500], [at(-0.8, 0.6), 1300, 400], [at(-0.5, -0.9), 1000, 300], [at(0.05, 0.1), 1000, 900]]);
  QM.demo({
    kind: 'pointer',
    path: walk,
    move(x, y) { if (!QM.reduced) look(x, y); },
    leave() { if (!QM.reduced) away(); },
  });
</script>
