<script data-code>
/* Agent cursor. Positions the agent uses are relative to .ac (thumbX, at()). The agent drives the same controls a person does: setRadius(), setBrand(), setScale(), publish().
   Its cursor is a separate element moved along eased arcs; take over() aborts the script cleanly and resume() plans again from the panel's real state. */
const $ = (id) => document.getElementById(id);
const acEl = $('ac'), acPanel = $('ac-panel'), acCur = $('ac-cur'), acSl = $('ac-sl'), acThumb = $('ac-thumb'), acFill = $('ac-fill'), acPub = $('ac-pub');
const acReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const BRANDS = [['Ink', '#0B0C0D', '#fff'], ['Sage', '#C5D1AA', '#0c1300'], ['Fern', '#6FAE00', '#0c1300'], ['Forest', '#263A0A', '#fff']];
const SCALES = [1.2, 1.25, 1.333];
const RAD = { MAX: 16, THUMB: 20, START: 12, GOAL: 4 };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
let acVal = RAD.START, acBrand = 0, acScale = 1, acState = 'draft';   // draft | pending | done

$('ac-sw').innerHTML = BRANDS.map((b, i) => `<button type="button" role="radio" aria-checked="${i === 0}" aria-label="${b[0]}" style="--c:${b[1]}"></button>`).join('');
$('ac-sc').innerHTML = SCALES.map((s, i) => `<button type="button" role="radio" aria-checked="${i === 1}">${s}</button>`).join('');
const acSw = [...$('ac-sw').children], acSc = [...$('ac-sc').children];

/* text that changes rolls inside its clip: the old line leaves up (or down), the new one arrives from the other side */
function roll(el, text, dir = 1, delay = 0) {
  const cur = el.lastElementChild;
  if (cur.textContent === text) return;
  if (acReduced || !cur.animate) { cur.textContent = text; return; }
  while (el.children.length > 2) el.firstElementChild.remove();
  const nb = document.createElement('b'); nb.textContent = text; el.appendChild(nb);
  const o = { duration: 420, delay, easing: 'cubic-bezier(.16, 1, .3, 1)', fill: 'both' };
  cur.animate([{ transform: 'translateY(0)' }, { transform: `translateY(${-110 * dir}%)` }], o).finished.then(() => cur.remove(), () => {});
  nb.animate([{ transform: `translateY(${110 * dir}%)` }, { transform: 'translateY(0)' }], o);
}

/* the radius: one number, drawn everywhere. Float while dragging, the whole pixel on release. */
function drawRadius(v, snap) {
  acVal = v;
  const span = acSl.clientWidth - RAD.THUMB, x = (v / RAD.MAX) * span, r = Math.round(v);
  acSl.classList.toggle('is-settle', !!snap);
  acThumb.style.transform = `translate3d(${snap ? Math.round(x) : x.toFixed(2)}px, 0, 0)`;
  acFill.style.transform = `scaleX(${((snap ? Math.round(x) : x) + RAD.THUMB / 2) / acSl.clientWidth})`;
  $('ac-prev').style.setProperty('--r', r + 'px');
  $('ac-rad-v').textContent = r + ' px';
  $('ac-token').textContent = `--radius: ${r}px`;
  acSl.setAttribute('aria-valuenow', String(r));
  acSl.setAttribute('aria-valuetext', r + ' px');
}
const thumbX = (v) => acSl.getBoundingClientRect().left - acEl.getBoundingClientRect().left + (v / RAD.MAX) * (acSl.clientWidth - RAD.THUMB) + RAD.THUMB / 2;
function setBrand(i) {
  acBrand = i;
  acSw.forEach((b, k) => b.setAttribute('aria-checked', String(k === i)));
  const p = $('ac-prev').style; p.setProperty('--brand', BRANDS[i][1]); p.setProperty('--on', BRANDS[i][2]);
  $('ac-brand-v').textContent = BRANDS[i][0];
}
function setScale(i) {
  acScale = i;
  acSc.forEach((b, k) => b.setAttribute('aria-checked', String(k === i)));
  $('ac-prev').style.setProperty('--h', (14 * SCALES[i] * SCALES[i]).toFixed(1) + 'px');
  $('ac-sc-v').textContent = String(SCALES[i]);
}
acSw.forEach((b, i) => b.addEventListener('click', () => setBrand(i)));
acSc.forEach((b, i) => b.addEventListener('click', () => setScale(i)));

/* publish: Publishing with a bar that tracks time, then Published; a person and the agent press the same button */
let pubT = 0;
function publish() {
  if (acState !== 'draft') return;
  acState = 'pending';
  acPub.classList.add('is-pending'); acPub.setAttribute('aria-disabled', 'true');
  roll($('ac-pub-t'), 'Publishing');
  pubT = setTimeout(() => {
    acState = 'done';
    acPub.classList.remove('is-pending'); acPub.classList.add('is-done');
    roll($('ac-pub-t'), 'Published');
    $('ac-tag').classList.add('is-live'); roll($('ac-tag-t'), 'Live');
    $('ac-msg').textContent = 'Published to forma.studio';
  }, 900);
}
function unpublish(instant) {
  clearTimeout(pubT);
  acState = 'draft';
  acPub.classList.remove('is-pending', 'is-done'); acPub.removeAttribute('aria-disabled');
  $('ac-tag').classList.remove('is-live');
  if (instant) { $('ac-pub-t').innerHTML = '<b>Publish</b>'; $('ac-tag-t').innerHTML = '<b>Draft</b>'; }
  else { roll($('ac-pub-t'), 'Publish', -1); roll($('ac-tag-t'), 'Draft', -1); }
}
acPub.addEventListener('click', publish);

/* the slider, for a pointer and the keyboard */
let slDrag = null;
const valueAt = (cx) => clamp(((cx - acSl.getBoundingClientRect().left - RAD.THUMB / 2) / (acSl.clientWidth - RAD.THUMB)) * RAD.MAX, 0, RAD.MAX);
acSl.addEventListener('pointerdown', (e) => {
  if (e.button > 0) return;
  acSl.setPointerCapture(e.pointerId);
  slDrag = e.pointerId; acSl.classList.add('is-grab');
  drawRadius(valueAt(e.clientX), false);
});
acSl.addEventListener('pointermove', (e) => { if (slDrag === e.pointerId) drawRadius(valueAt(e.clientX), false); });
const slEnd = (e) => { if (slDrag !== e.pointerId) return; slDrag = null; acSl.classList.remove('is-grab'); drawRadius(Math.round(acVal), true); };
acSl.addEventListener('pointerup', slEnd); acSl.addEventListener('pointercancel', slEnd);
acSl.addEventListener('keydown', (e) => {
  const k = e.key, d = k === 'ArrowRight' || k === 'ArrowUp' ? 1 : k === 'ArrowLeft' || k === 'ArrowDown' ? -1 : k === 'PageUp' ? 4 : k === 'PageDown' ? -4 : 0;
  if (d) { e.preventDefault(); drawRadius(clamp(Math.round(acVal) + d, 0, RAD.MAX), true); }
  else if (k === 'Home') { e.preventDefault(); drawRadius(0, true); }
  else if (k === 'End') { e.preventDefault(); drawRadius(RAD.MAX, true); }
});
drawRadius(RAD.START, true); setBrand(0); setScale(1);
</script>
<script>
(() => {
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  const soft = QM.bezier(0.45, 0, 0.25, 1);
  let epoch = 0, mode = 'run', resumeT = 0;     // mode: run | user (Take over) | hover (the real pointer is in the panel)
  const cur = { x: 0, y: 0 };

  const at = (el, fx = 0.5, fy = 0.5) => {
    const r = el.getBoundingClientRect(), a = acEl.getBoundingClientRect();
    return { x: r.left - a.left + r.width * fx, y: r.top - a.top + r.height * fy };
  };
  const park = () => { const p = acPanel.getBoundingClientRect(), a = acEl.getBoundingClientRect(); return { x: p.right - a.left + 40, y: p.top - a.top + 56 }; };
  const place = (x, y) => { cur.x = x; cur.y = y; acCur.style.transform = `translate3d(${(x - 1.5).toFixed(1)}px, ${(y - 1.5).toFixed(1)}px, 0)`; };
  function jump(p) { acCur.classList.add('is-move', 'is-in'); place(p.x, p.y); acCur.getBoundingClientRect(); acCur.classList.remove('is-move'); }

  const say = (text, n, dir = 1) => { roll($('ac-cap'), text, dir); roll($('ac-n'), n, dir); $('ac-msg').textContent = text; };

  /* an arc: a quadratic curve bowed to the side, travelled on an ease that starts quick and lands slowly */
  function glide(my, to, ms, bow) {
    const p0 = { x: cur.x, y: cur.y }, dx = to.x - p0.x, dy = to.y - p0.y, d = Math.hypot(dx, dy) || 1;
    const time = ms || clamp(380 + d * 1.25, 420, 1100);
    const b = (bow ?? clamp(d * 0.16, 6, 28)) * (dx >= 0 ? -1 : 1);
    const c = { x: (p0.x + to.x) / 2 - (dy / d) * b, y: (p0.y + to.y) / 2 + (dx / d) * b };
    acCur.classList.add('is-move');
    return new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (my !== epoch) return res(false);
        const p = Math.min(1, (now - t0) / time), t = soft(p), u = 1 - t;
        place(u * u * p0.x + 2 * u * t * c.x + t * t * to.x, u * u * p0.y + 2 * u * t * c.y + t * t * to.y);
        if (p < 1) requestAnimationFrame(f); else res(true);
      };
      requestAnimationFrame(f);
    });
  }
  const gap = async (my, ms) => { await w(ms); if (my !== epoch) throw 0; };
  const go = async (my, to, ms, bow) => { if (!(await glide(my, to, ms, bow))) throw 0; };
  function ring() {
    const r = document.createElement('i'); r.className = 'ac-ring';
    r.style.transform = `translate3d(${cur.x}px, ${cur.y}px, 0)`;
    acEl.appendChild(r);
    const a = r.animate([{ transform: `translate3d(${cur.x}px, ${cur.y}px, 0) scale(.3)`, opacity: 1 }, { transform: `translate3d(${cur.x}px, ${cur.y}px, 0) scale(1.15)`, opacity: 0 }], { duration: 520, easing: 'cubic-bezier(.16, 1, .3, 1)' });
    a.finished.then(() => r.remove(), () => r.remove());
  }
  const down = () => { acCur.classList.remove('is-move'); acCur.classList.add('is-down'); if (!acReduced) ring(); };
  const up = () => acCur.classList.remove('is-down');
  const hot = (el, on) => el.classList.toggle('is-hot', on);

  // the radius slider as the agent drags it: the thumb is held at its centre and follows the cursor along the arc
  async function dragRadius(my, to, ms) {
    const from = acVal, p0 = { x: cur.x, y: cur.y }, p1 = { x: thumbX(to), y: p0.y };
    const d = Math.hypot(p1.x - p0.x, 0), b = 7 * (p1.x >= p0.x ? -1 : 1);
    const c = { x: (p0.x + p1.x) / 2, y: p0.y + b };
    acSl.classList.add('is-grab'); acCur.classList.add('is-move');
    await new Promise((res) => {
      const t0 = performance.now();
      const f = (now) => {
        if (my !== epoch) return res();
        const p = Math.min(1, (now - t0) / ms), t = soft(p), u = 1 - t;
        place(u * u * p0.x + 2 * u * t * c.x + t * t * p1.x, u * u * p0.y + 2 * u * t * c.y + t * t * p1.y);
        drawRadius(from + (to - from) * t, false);
        if (p < 1) requestAnimationFrame(f); else res();
      };
      requestAnimationFrame(f);
    });
    if (my !== epoch) throw 0;
  }
  const letGo = () => { up(); acSl.classList.remove('is-grab'); hot(acSl, false); if (!slDrag) drawRadius(Math.round(acVal), true); };
  const labelBack = () => acCur.classList.remove('is-left');

  // a value glides: radius back to its start for the next draft
  function tweenRadius(my, to, ms) {
    const from = acVal;
    return new Promise((res) => {
      const t0 = performance.now(), e = QM.bezier(0.16, 1, 0.3, 1);
      const f = (now) => {
        if (my !== epoch) return res();
        const p = Math.min(1, (now - t0) / ms);
        drawRadius(from + (to - from) * e(p), false);
        if (p < 1) requestAnimationFrame(f); else { drawRadius(to, true); res(); }
      };
      requestAnimationFrame(f);
    });
  }

  /* the plan, read from the panel as it is now: so Resume after a person changed something does the right thing */
  async function script(fresh) {
    const my = ++epoch;
    try {
      for (;;) {
        if (fresh) { jump(park()); say('Reading the settings', '1 / 4'); await gap(my, 700); }
        else say('Back at it. Checking the panel', '1 / 4');
        // 1 · read the panel: the brand colour, then how the radius shows in the preview
        await go(my, at(acSw[acBrand], 0.5, 0.6));
        hot(acSw[acBrand], true); await gap(my, 400); hot(acSw[acBrand], false);
        await go(my, at(document.querySelector('.ac-buy'), 0.86, 0.5)); await gap(my, 320);   // how the corner reads in the preview
        // 2 · the radius
        if (Math.round(acVal) !== RAD.GOAL) {
          say(`Radius is ${Math.round(acVal)}. Dragging to ${RAD.GOAL}`, '2 / 4');
          acCur.classList.add('is-left');                          // the label steps to the left of the tip while the slider is worked, clear of every value
          await go(my, { x: thumbX(acVal), y: at(acSl).y });
          hot(acSl, true); await gap(my, 240);
          down(); await gap(my, 130);
          await dragRadius(my, RAD.GOAL, Math.round(clamp(Math.abs(thumbX(acVal) - thumbX(RAD.GOAL)) * 7, 760, 1600)));
          await gap(my, 110);
          letGo(); await gap(my, 300);
          labelBack();
        }
        say(`Radius is ${RAD.GOAL}. The preview follows`, '3 / 4');
        await gap(my, 1100);
        // 3 · publish
        if (acState === 'draft') {
          say('Publishing r2 to forma.studio', '4 / 4');
          await go(my, at(acPub, 0.5, 0.55));
          hot(acPub, true); await gap(my, 260);
          down(); await gap(my, 130);
          up(); hot(acPub, false); publish();
          await gap(my, 1100);
        }
        if (acState === 'done') say('Published. forma.studio is on r2', '4 / 4');
        await gap(my, 1500);
        await go(my, park(), 760);
        await gap(my, 1300);
        // 4 · the next draft opens: values glide back, nothing jumps
        say('A new draft is open', '1 / 4', -1);
        unpublish(false);
        setBrand(0); setScale(1);
        await tweenRadius(my, RAD.START, 760);
        await gap(my, 1500);
        fresh = true;
      }
    } catch (e) { /* aborted: a hand-over, or a restart */ }
  }

  /* hand-over: pausing is clean (no half press, no stuck drag); the plan is read again on Resume */
  function takeOver(why) {
    if (mode !== 'run') { if (why === 'user') { mode = 'user'; clearTimeout(resumeT); } return; }
    mode = why; epoch++;
    clearTimeout(resumeT);
    up(); labelBack(); hot(acSw[acBrand], false); hot(acSl, false); hot(acPub, false);
    if (!slDrag) { acSl.classList.remove('is-grab'); drawRadius(Math.round(acVal), true); }
    acCur.classList.add('is-paused'); acEl.classList.add('is-paused');
    $('ac-take').setAttribute('aria-pressed', 'true'); roll($('ac-take-t'), 'Resume');
    say('Paused. You have the controls', 'Paused');
  }
  function resume() {
    if (mode === 'run') return;
    mode = 'run'; clearTimeout(resumeT);
    acCur.classList.remove('is-paused'); acEl.classList.remove('is-paused');
    $('ac-take').setAttribute('aria-pressed', 'false'); roll($('ac-take-t'), 'Take over', -1);
    script(false);
  }
  $('ac-take').addEventListener('click', () => (mode === 'run' ? takeOver('user') : resume()));

  if (!QM.tile && !acReduced) {
    let usedKeys = false;   // a focused control only holds the agent back when the keyboard put the focus there
    const armResume = () => {
      clearTimeout(resumeT);
      if (mode !== 'hover') return;
      resumeT = setTimeout(() => {
        if (mode !== 'hover') return;
        if (acPanel.matches(':hover') || (usedKeys && acPanel.contains(document.activeElement)) || slDrag) armResume(); else resume();
      }, 4500);
    };
    acPanel.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { clearTimeout(resumeT); takeOver('hover'); } });
    acPanel.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') armResume(); });
    acPanel.addEventListener('pointerdown', () => { usedKeys = false; clearTimeout(resumeT); takeOver('hover'); });
    acPanel.addEventListener('pointerup', () => armResume());
    acPanel.addEventListener('keydown', () => { usedKeys = true; takeOver('hover'); armResume(); });
  }

  /* reduced motion: a complete still. The radius is already 4, the cursor rests on Publish; the controls still work. */
  function still() {
    drawRadius(RAD.GOAL, true);
    jump(at(acPub, 0.5, 0.55));
    say(`Radius is ${RAD.GOAL}. Next: publish`, '3 / 4');
    $('ac-take').hidden = true;
  }
  function hardReset() {
    epoch++; clearTimeout(resumeT); mode = 'run';
    up(); labelBack(); acCur.classList.remove('is-paused'); acEl.classList.remove('is-paused');
    $('ac-take').setAttribute('aria-pressed', 'false'); $('ac-take-t').innerHTML = '<b>Take over</b>';
    unpublish(true); setBrand(0); setScale(1); drawRadius(RAD.START, true);
    acSl.classList.remove('is-grab');
  }
  const begin = () => { hardReset(); if (acReduced) still(); else { jump(park()); script(true); } };
  QM.demo({ kind: 'loop', restart() { begin(); } });
  if (acReduced) still();
  else (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(begin, 300));
})();
</script>
</body>
