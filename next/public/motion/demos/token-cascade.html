/* a sleeve: lines stacked in a one-line window, rolled by --r (lines) */

<script data-code>
/* Token cascade. cascade(t) draws the whole scene at beat t (0 … 4): a pure function, so a scrub or a rewind is exact.
   State k (1 … 4) plays while t runs from k − 1 to k. */
const tcRoot = document.getElementById('tc');
const tcq = (k) => tcRoot.querySelector(`[data-k="${k}"]`);
const tcEl = Object.fromEntries(['step', 'swatch', 'val', 'uses', 'btn', 'tag', 'foot', 'p-nav', 'p-cta', 'p-tag', 'p-f1', 'p-f2', 'p-ul',
  'w1', 'w2', 'w3', 'n1a', 'n1b', 'n2a', 'n2b', 'n3a', 'n3b'].map((k) => [k, tcq(k)]));

const tcClamp = (x) => Math.min(1, Math.max(0, x));
const tcMove = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);   // --ease-move
const tcOut = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));                          // ~ --ease-out-expo
/* progress of state k between a and b (fractions of its beat) */
const tcSeg = (t, k, a, b) => tcClamp((t - (k - 1) - a) / (b - a));

function cascade(t) {
  const p = (name, v) => tcEl[name].style.setProperty('--p', v.toFixed(4));
  const wire = (w, a, b, v) => {                       // v: the wire's own 0 … 1
    tcEl[w].style.strokeDashoffset = (1 - v).toFixed(4);
    const sc = (n, s) => (tcEl[n].style.transform = `scale(${s.toFixed(3)})`);
    sc(a, tcOut(tcClamp(v * 8)));                      // the start node lands first
    sc(b, tcOut(tcClamp((v - 0.85) / 0.15)));          // the end node lands as the wire arrives
  };
  // 1 — the token: the swatch is uncovered from below, the value rolls with it
  const s1 = tcOut(tcSeg(t, 1, 0, 0.8));
  p('swatch', s1);
  tcEl.val.style.setProperty('--r', s1.toFixed(4));
  // 2 — a wire to the Button, which is uncovered from the side the wire arrives on
  wire('w1', 'n1a', 'n1b', tcMove(tcSeg(t, 2, 0, 0.5)));
  const s2 = tcOut(tcSeg(t, 2, 0.45, 1));
  p('btn', s2);
  // 3 — on to the Card: its tag, then its foot bar
  wire('w2', 'n2a', 'n2b', tcMove(tcSeg(t, 3, 0, 0.45)));
  const s3a = tcOut(tcSeg(t, 3, 0.35, 0.8)), s3b = tcOut(tcSeg(t, 3, 0.5, 1));
  p('tag', s3a); p('foot', s3b);
  // 4 — on to the page: every use changes at once
  wire('w3', 'n3a', 'n3b', tcMove(tcSeg(t, 4, 0, 0.5)));
  const s4 = tcOut(tcSeg(t, 4, 0.45, 1));
  ['p-nav', 'p-cta', 'p-tag', 'p-f1', 'p-f2', 'p-ul'].forEach((k) => p(k, s4));
  // the counter: Uses 0 → 1 → 3 → 9, and the step label 00 … 04
  tcEl.uses.style.setProperty('--r', (s2 + s3b + s4).toFixed(4));
  tcEl.step.style.setProperty('--r', Math.min(4, Math.max(0, t)).toFixed(4));
}
</script>
<script>
  // --- harness glue: fit the scene to its box, then play it by beats ------------------------
  const box = document.getElementById('tc-box');
  const fit = () => { const z = box.clientWidth / 640; if (z > 0) box.style.setProperty('--z', String(Math.round(z * 1000) / 1000)); };
  fit();
  new ResizeObserver(fit).observe(box);
  // reduced motion: a still per state, no slide between them (as the site's driver does)
  const seek = (t) => cascade(QM.reduced ? (t > 0 ? Math.max(1, Math.round(t)) : 0) : t);
  cascade(0);
  QM.demo({ kind: 'states', n: 4, seek, first: 2200, dwell: 2000, hold: 1400, rewind: 1700 });
</script>
