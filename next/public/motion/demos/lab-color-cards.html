<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuffle cards · Qbix Motion</title>
<link rel="stylesheet" href="../kit/qbix.css">
<script type="application/json" id="qm-meta">
{

  "summary": "Six palette cards from one moodboard sit in a stack, fan out, lift under the pointer, enlarge and flip to read their colours, then shuffle back. Every step only changes a card's target transform; one transition eases it there. Click a card to flip it, click empty space to switch between stack and fan.",
  "spec": [["Move", "950 ms cubic-bezier(0.65, 0, 0.35, 1) on transform"], ["Flip", "900 ms, rotateY 180°, backface hidden"], ["Fan", "radius 1.45 × card height, up to ±30°"], ["Rise in", "70 ms between cards"], ["Story", "14.4 s loop: stack 0, fan 1.6, lift 2.7, enlarge 3.5, flip 4.3, unflip 7, close 8, stack 9.2, two shuffles"], ["Idle", "the story resumes 2.5 s after the last input"]],
  "source": ["Qbix studio library · color-cards"],
  "where": "Strata and the Design service: the palettes a moodboard gives, shown as a deck of cards.",
  "rules": ["Cards are flat blocks with the top right corner cut, set on the face (clip-path on the 3D parent would flatten the card).", "No shadows: depth is only the stack's offset and its z.", "The deck is always uncovered by moving, never faded."],

<style data-code>
.cc-deck { position: absolute; inset: 0; perspective: 1400px; }
.cc-card { position: absolute; left: 0; top: 0; transform-style: preserve-3d; cursor: pointer; will-change: transform;
  transition: transform .95s cubic-bezier(.65, 0, .35, 1); }
.cc-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.65, 0, .35, 1); }
.cc-card.back .cc-flip { transform: rotateY(180deg); }
.cc-face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  clip-path: polygon(0 0, calc(100% - var(--cutc)) 0, 100% var(--cutc), 100% 100%, 0 100%); }
.cc-front { display: flex; flex-direction: column; }
.cc-band { position: relative; flex: 1; }
.cc-band:last-child { flex: 2.2; }
.cc-band span { position: absolute; left: var(--pad); bottom: calc(var(--pad) * .55); font: 11px/1 'Encode Sans', Geist, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
.cc-band:last-child span { bottom: var(--pad); }
.cc-name { position: absolute; left: var(--pad); right: var(--pad); bottom: calc(var(--pad) + 26px); font: 400 var(--big)/1 Eurostile, Geist, sans-serif; letter-spacing: -.03em; }
.cc-backf { transform: rotateY(180deg); padding: var(--pad); display: flex; flex-direction: column; background: #ffffff; color: #121417; }
.cc-backf h2 { margin: 0 0 auto; font: 400 var(--big)/1 Eurostile, Geist, sans-serif; letter-spacing: -.03em; }
.cc-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 13px; }
.cc-chip { width: 22px; height: 22px; flex: none; }
.cc-row b { font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
.cc-row i { font: 11px 'Encode Sans', Geist, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: rgba(18,20,23,.64); }
@media (prefers-reduced-motion: reduce) { .cc-card, .cc-flip { transition: none; } }
</style>
<style>
  .qm-stage { display: block; padding: 0; }
  .cc-cap { position: absolute; left: clamp(16px, 4vmin, 44px); top: clamp(16px, 4vmin, 40px); z-index: 1; pointer-events: none; }
  .cc-cap .title { font-size: clamp(26px, 5.2vmin, 48px); margin-top: 8px; }
</style>
</head>
<body>
<main class="qm-stage">
  <div class="cc-cap"><p class="kicker">Strata · 06 palettes</p><h1 class="title">From one moodboard.</h1></div>
<!-- code -->
<div class="cc-deck" id="cc-deck"></div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const ColorCards = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const deck = document.getElementById('cc-deck');
  const PALETTES = [
    { name: 'Bright', c: [['#6fae00', 'Moss'], ['#b8ff00', 'Lime'], ['#d2f26a', 'Zest'], ['#eaf9b0', 'Pith']] },
    { name: 'Calm', c: [['#4e8068', 'Pine'], ['#8db59b', 'Sage'], ['#b7d3bf', 'Fern'], ['#dcebe0', 'Frost']] },
    { name: 'Warm', c: [['#c2603a', 'Clay'], ['#e08c66', 'Peach'], ['#f2bea3', 'Blush'], ['#f9e1d3', 'Cream']] },
    { name: 'Cool', c: [['#3c6fa8', 'Denim'], ['#7fa6d0', 'Sky'], ['#b5cfe8', 'Haze'], ['#dce8f4', 'Ice']] },
    { name: 'Soft', c: [['#7b5cb3', 'Iris'], ['#a88bd6', 'Lilac'], ['#cdbaea', 'Lavender'], ['#e8def6', 'Petal']] },
    { name: 'Sunny', c: [['#d9a21b', 'Honey'], ['#ebc65a', 'Butter'], ['#f5de96', 'Straw'], ['#faefc8', 'Oat']] },
  ];
  const lum = (h) => { const v = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255); return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2]; };
  const ink = (h) => (lum(h) > 0.5 ? '#121417' : '#f4f5f2');

  const cards = PALETTES.map((p, i) => {
    const el = document.createElement('div');
    el.className = 'cc-card';
    const bands = p.c.slice().reverse().map(([hex]) => `<div class="cc-band" style="background:${hex};color:${ink(hex)}"><span>${hex}</span></div>`).join('');
    el.innerHTML = `<div class="cc-flip"><div class="cc-face cc-front">${bands}<div class="cc-name" style="color:${ink(p.c[0][0])}">${p.name}</div></div>` +
      `<div class="cc-face cc-backf"><h2>${p.name}</h2>` +
      p.c.map(([hex, n]) => `<div class="cc-row"><div class="cc-chip" style="background:${hex}"></div><b>${n}</b><i>${hex}</i></div>`).join('') + '</div></div>';
    deck.appendChild(el);
    return { el, i };
  });

  let W = 0, H = 0, cw = 0, ch = 0, cx = 0, cy = 0;
  let order = cards.map((c) => c.i);
  let mode = 'stack', focus = -1, lift = -1, flipped = -1, slide = -1;

  function size() {
    W = innerWidth; H = innerHeight;
    const capH = Math.min(110, H * 0.17);
    ch = Math.max(160, Math.min(400, Math.min((H - capH) * 0.6, W * 0.66)));
    cw = ch * 0.68;
    cx = W / 2; cy = capH + (H - capH) * 0.47;
    const s = deck.style;
    s.setProperty('--cutc', Math.round(ch * 0.07) + 'px');
    s.setProperty('--pad', Math.round(ch * 0.055) + 'px');
    s.setProperty('--big', Math.round(ch * 0.105) + 'px');
    cards.forEach(({ el }) => { el.style.width = cw + 'px'; el.style.height = ch + 'px'; });
    place();
  }

  // every card's place is worked out from the mode, then eased there by CSS
  function place() {
    const n = cards.length, R = ch * 1.45;
    const maxA = Math.min(30, (Math.asin(Math.min(0.95, (W / 2 - cw * 0.66 - 16) / R)) * 180) / Math.PI);
    order.forEach((ci, pos) => {
      const el = cards[ci].el;
      let x = cx - cw / 2, y = cy - ch / 2, rot = 0, z = 0, sc = 1;
      if (mode === 'stack') {
        const depth = n - 1 - pos;
        x += (pos - (n - 1) / 2) * 1.5; y += (pos - (n - 1) / 2) * -2.5; rot = [-2.5, 1.8, -1.2, 2.6, -0.6, 1.1][ci];
        z = -depth * 2;
        if (ci === slide) { x += cw * 0.95; y -= ch * 0.06; rot = 9; z = 40; }
      } else {
        const a = n > 1 ? -maxA + (2 * maxA * pos) / (n - 1) : 0, rad = (a * Math.PI) / 180;
        x += Math.sin(rad) * R; y += R - Math.cos(rad) * R + ch * 0.06; rot = a; z = pos;
        if (ci === lift) { y -= ch * 0.1; x += Math.sin(rad) * ch * 0.1; }
        if (ci === focus) { x = cx - cw / 2; y = cy - ch / 2; rot = 0; sc = Math.min(1.12, (H * 0.8) / ch); z = 200; }
      }
      el.style.zIndex = ci === focus ? 100 : ci === slide ? 50 : pos;
      el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) rotate(${rot}deg) scale(${sc})`;
      el.classList.toggle('back', ci === flipped);
    });
  }

  // the story a passive viewer sees, on a loop
  const STEPS = [
    [0, () => { mode = 'stack'; focus = lift = flipped = slide = -1; }],
    [1.6, () => { mode = 'fan'; }],
    [2.7, () => { lift = order[2]; }],
    [3.5, () => { focus = lift; lift = -1; }],
    [4.3, () => { flipped = focus; }],
    [7.0, () => { flipped = -1; }],
    [8.0, () => { focus = -1; }],
    [9.2, () => { mode = 'stack'; }],
    [10.4, () => { slide = order[order.length - 1]; }],
    [11.0, () => { order.unshift(order.pop()); }],
    [11.3, () => { slide = -1; }],
    [12.3, () => { slide = order[order.length - 1]; }],
    [12.9, () => { order.unshift(order.pop()); }],
    [13.2, () => { slide = -1; }],
  ];
  const LOOP = 14.4;
  let t = 0, si = 0, lastInput = -1e9, resumed = true, prev = 0, raf = 0;

  deck.addEventListener('click', (e) => {
    lastInput = performance.now();
    const hit = e.target.closest('.cc-card');
    const ci = hit ? cards.findIndex((c) => c.el === hit) : -1;
    if (ci >= 0 && mode === 'fan') {
      if (focus === ci) flipped = flipped === ci ? -1 : ci;
      else { focus = ci; flipped = ci; lift = -1; }
    } else if (ci >= 0 && mode === 'stack') {
      slide = order[order.length - 1]; place();
      setTimeout(() => { order.unshift(order.pop()); place(); setTimeout(() => { slide = -1; place(); }, 300); }, 560);
      return;
    } else if (focus >= 0) { focus = -1; flipped = -1; }
    else mode = mode === 'fan' ? 'stack' : 'fan';
    place();
  });
  deck.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse') return;
    lastInput = performance.now();
    if (mode !== 'fan' || focus >= 0) return;
    const hit = e.target.closest('.cc-card');
    const ci = hit ? cards.findIndex((c) => c.el === hit) : -1;
    if (ci !== lift) { lift = ci; place(); }
  });

  function frame(now) {
    const dt = Math.min(0.1, (now - (prev || now)) / 1000); prev = now;
    if (now - lastInput > 2500) {
      if (!resumed) { resumed = true; t = 0; si = 0; order = cards.map((c) => c.i); }
      t += dt;
      let changed = false;
      while (si < STEPS.length && t >= STEPS[si][0]) { STEPS[si][1](); si++; changed = true; }
      if (t >= LOOP) { t = 0; si = 0; }
      if (changed) place();
    } else resumed = false;
    raf = requestAnimationFrame(frame);
  }
  function start() {
    cancelAnimationFrame(raf);
    // the deck rises in from below, one card after another
    cards.forEach(({ el }, i) => { el.style.transition = 'none'; el.style.transform = `translate3d(${cx - cw / 2}px, ${H + 40}px, 0) rotate(${(i - 3) * 4}deg)`; });
    deck.offsetWidth;
    cards.forEach(({ el }, i) => { el.style.transition = ''; el.style.transitionDelay = i * 70 + 'ms'; });
    order = cards.map((c) => c.i); mode = 'stack'; focus = lift = flipped = slide = -1;
    place();
    setTimeout(() => cards.forEach(({ el }) => (el.style.transitionDelay = '')), 1200);
    si = 1; t = 0.01; prev = 0; lastInput = -1e9; resumed = true;
    raf = requestAnimationFrame(frame);
  }
  addEventListener('resize', size);
  size();
  if (reduce) { mode = 'fan'; place(); }
  return { start, still: reduce };
})();
</script>
<script>
  QM.demo({ kind: 'loop', restart() { if (!ColorCards.still) ColorCards.start(); } });
  if (!ColorCards.still) ColorCards.start();
</script>
</body>
</html>
