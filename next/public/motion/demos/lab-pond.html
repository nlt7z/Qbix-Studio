  "spec": [

<body>
<main class="qm-stage" style="padding:0">
<!-- code -->
<div class="pd">
  <canvas id="c"></canvas>
  <div class="pd-cap"><p class="kicker">Qbix Labs · The pond</p><h1>Feed the fish.</h1><p class="sub">Move across the water, click to drop a pellet.</p></div>
</div>
<!-- /code -->
</main>
<script src="../kit/stage.js"></script>
<script data-code>
const pond = (() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  let W, H, dpr, S;
  function resize() { dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; S = Math.min(W, H); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  resize();
  // ---------- fish ----------
  const N = 11;
  const PROFILE = [0.62, 0.86, 0.96, 0.98, 0.92, 0.8, 0.66, 0.5, 0.36, 0.24, 0.14];
  const SKINS = [
    { body: '#f4f5f2', fin: '#9AA0A9', spot: '#0B0C0D', spots: [[0.18, 0.35, 0.42], [0.42, -0.4, 0.5], [0.62, 0.2, 0.34]] },
    { body: '#D0D6E0', fin: '#838892', spot: '#26282C', spots: [[0.3, -0.2, 0.55], [0.55, 0.45, 0.3]] },
    { body: '#9AA0A9', fin: '#5f646c', spot: '#f4f5f2', spots: [[0.12, 0, 0.36], [0.5, 0.35, 0.28]] },
    { body: '#f4f5f2', fin: '#838892', spot: '#26282C', spots: [[0.26, 0.3, 0.32], [0.48, -0.15, 0.4], [0.7, 0.1, 0.22]] },
    { body: '#838892', fin: '#5f646c', spot: '#f4f5f2', spots: [[0.35, 0.3, 0.38]] },
    { body: '#E6E8EA', fin: '#9AA0A9', spot: '#0B0C0D', spots: [[0.2, -0.3, 0.4], [0.58, 0.2, 0.45]] }
  ];
  function makeFish(i, count) {
    const len = Math.max(72, Math.min(165, S * 0.21)) * (0.82 + Math.random() * 0.36);
    const a = Math.random() * TAU;
    const x = W * (0.2 + 0.6 * Math.random()), y = H * (0.25 + 0.6 * Math.random());
    const f = { len, seg: len / (N - 1), w: len * 0.125, skin: SKINS[i % SKINS.length], j: [], ang: [],
      vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, phase: Math.random() * TAU, wander: Math.random() * TAU, ring: (i / count) * TAU, lastRip: 0 };
    for (let k = 0; k < N; k++) { f.j.push({ x: x - Math.cos(a) * f.seg * k, y: y - Math.sin(a) * f.seg * k }); f.ang.push(a); }
    return f;
  }
  let fish = [];
  (function populate() {
    const count = Math.max(4, Math.min(7, Math.round(W * H / 110000)));
    fish = []; for (let i = 0; i < count; i++) fish.push(makeFish(i, count));
  })();
  // ---------- pond dressing: flat lily pads ----------
  let pads = [];
  function placePads() {
    const r = S * 0.085;
    const spots = [[0.86, 0.2, 1.1], [0.1, 0.82, 1.25], [0.78, 0.86, 0.8], [0.93, 0.55, 0.65]];
    pads = spots.map(([x, y, s], i) => ({ x: x * W, y: y * H, r: r * s, rot: i * 1.7, notch: 0.5 + i * 0.13, flower: i === 0, ox: 0, oy: 0, vx: 0, vy: 0 }));
  }
  placePads();
  const ripples = [];
  const ripple = (x, y, size, strength) => ripples.push({ x, y, r: 2, max: size, t: 0, life: 1.6 + size / 260, s: strength });
  // ---------- pointer ----------
  const ptr = { x: W / 2, y: H / 2, has: false, ghost: false, lastRipX: 0, lastRipY: 0 };
  let food = 0, pellet = null, nextTap = 1.6, last = performance.now();
  function feed(x, y) { ripple(x, y, S * 0.22, 1); setTimeout(() => ripple(x, y, S * 0.14, 0.7), 180); food = 1; pellet = { x, y, t: 0 }; }
  function wake() {
    if (Math.hypot(ptr.x - ptr.lastRipX, ptr.y - ptr.lastRipY) > S * 0.06) { ripple(ptr.x, ptr.y, S * 0.07, 0.45); ptr.lastRipX = ptr.x; ptr.lastRipY = ptr.y; }
  }
  // ---------- simulation ----------
  function steer(f, dt, tx, ty, attract) {
    const h = f.j[0];
    let ax = 0, ay = 0;
    const maxSpeed = (S * 0.22 + 40) * (1 + food * 0.6) * (reduce ? 0.5 : 1);
    f.wander += (Math.random() - 0.5) * 2.4 * dt;
    const sp = Math.hypot(f.vx, f.vy) || 1, hx = f.vx / sp, hy = f.vy / sp;
    ax += (hx + Math.cos(f.wander) * 0.8) * maxSpeed * 0.6 - f.vx * 0.6;
    ay += (hy + Math.sin(f.wander) * 0.8) * maxSpeed * 0.6 - f.vy * 0.6;
    if (attract > 0) {
      const rr = S * (0.13 + 0.06 * Math.sin(f.ring * 3)) * (1 - food * 0.55);
      f.ring += dt * 0.5;
      const gx = tx + Math.cos(f.ring) * rr, gy = ty + Math.sin(f.ring) * rr;
      const dx = gx - h.x, dy = gy - h.y, d = Math.hypot(dx, dy) || 1;
      const want = Math.min(maxSpeed, d * 1.6);
      ax += (dx / d * want - f.vx) * 1.4 * attract;
      ay += (dy / d * want - f.vy) * 1.4 * attract;
    }
    for (const o of fish) {
      if (o === f) continue;
      const dx = h.x - o.j[0].x, dy = h.y - o.j[0].y, d = Math.hypot(dx, dy), m = f.len * 0.85;
      if (d < m && d > 0) { const k = (m - d) / m; ax += dx / d * k * maxSpeed * 2.2; ay += dy / d * k * maxSpeed * 2.2; }
    }
    const mg = f.len * 0.7;
    if (h.x < mg) ax += (mg - h.x) * 6;
    if (h.x > W - mg) ax -= (h.x - (W - mg)) * 6;
    if (h.y < mg) ay += (mg - h.y) * 6;
    if (h.y > H - mg) ay -= (h.y - (H - mg)) * 6;
    f.vx += ax * dt; f.vy += ay * dt;
    const s2 = Math.hypot(f.vx, f.vy), minS = maxSpeed * 0.25;
    if (s2 > maxSpeed) { f.vx *= maxSpeed / s2; f.vy *= maxSpeed / s2; }
    else if (s2 < minS && s2 > 0) { f.vx *= minS / s2; f.vy *= minS / s2; }
    const speed = Math.hypot(f.vx, f.vy);
    f.phase += dt * (3 + speed / f.len * 3.2);
    h.x += f.vx * dt; h.y += f.vy * dt;
    // the spine follows the head with a limited bend; a small sway travels down it
    f.ang[0] = Math.atan2(f.vy, f.vx) + Math.sin(f.phase) * 0.22;
    const maxBend = 0.32;
    for (let k = 1; k < N; k++) {
      const p = f.j[k - 1], q = f.j[k];
      let a = Math.atan2(p.y - q.y, p.x - q.x);
      let d = a - f.ang[k - 1]; d = Math.atan2(Math.sin(d), Math.cos(d));
      if (d > maxBend) a = f.ang[k - 1] + maxBend; else if (d < -maxBend) a = f.ang[k - 1] - maxBend;
      f.ang[k] = a;
      q.x = p.x - Math.cos(a) * f.seg; q.y = p.y - Math.sin(a) * f.seg;
    }
    f.lastRip += dt;
    if (f.lastRip > 1.4 + Math.random() * 1.5 && speed > maxSpeed * 0.5) { ripple(h.x, h.y, f.len * 0.55, 0.28); f.lastRip = 0; }
  }
  // ---------- drawing ----------
  function smoothClosed(pts) {
    ctx.beginPath();
    const n = pts.length;
    ctx.moveTo((pts[n - 1][0] + pts[0][0]) / 2, (pts[n - 1][1] + pts[0][1]) / 2);
    for (let i = 0; i < n; i++) { const p = pts[i], q = pts[(i + 1) % n]; ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2); }
    ctx.closePath();
  }
  function drawFish(f) {
    const { j, ang, w, skin } = f;
    const nrm = (k) => [-Math.sin(ang[k]), Math.cos(ang[k])];
    const fwd = (k) => [Math.cos(ang[k]), Math.sin(ang[k])];
    ctx.fillStyle = skin.fin;
    const [n2x, n2y] = nrm(2), flap = Math.sin(f.phase * 0.7) * 0.25;
    for (const side of [1, -1]) {
      const bx = j[2].x + n2x * w * 0.8 * side, by = j[2].y + n2y * w * 0.8 * side;
      const a = ang[2] + side * (2.25 + flap);
      ctx.beginPath(); ctx.ellipse(bx + Math.cos(a) * w * 0.8, by + Math.sin(a) * w * 0.8, w * 1.05, w * 0.42, a, 0, TAU); ctx.fill();
    }
    // the tail fin flicks with the bend of the tail
    const t = N - 1, [tfx, tfy] = fwd(t), [tnx, tny] = nrm(t);
    const bend = Math.atan2(Math.sin(ang[t] - ang[t - 3]), Math.cos(ang[t] - ang[t - 3]));
    const fl = f.len * 0.3, spread = w * 1.5;
    const bx = j[t].x, by = j[t].y, sway = -bend * spread * 1.2;
    const tipL = [bx - tfx * fl + tnx * (spread + sway), by - tfy * fl + tny * (spread + sway)];
    const tipR = [bx - tfx * fl - tnx * (spread - sway), by - tfy * fl - tny * (spread - sway)];
    const notch = [bx - tfx * fl * 0.55 + tnx * sway * 0.6, by - tfy * fl * 0.55 + tny * sway * 0.6];
    ctx.beginPath();
    ctx.moveTo(j[t - 1].x + tnx * w * 0.2, j[t - 1].y + tny * w * 0.2);
    ctx.quadraticCurveTo(bx - tfx * fl * 0.5 + tnx * spread * 0.9, by - tfy * fl * 0.5 + tny * spread * 0.9, tipL[0], tipL[1]);
    ctx.lineTo(notch[0], notch[1]);
    ctx.lineTo(tipR[0], tipR[1]);
    ctx.quadraticCurveTo(bx - tfx * fl * 0.5 - tnx * spread * 0.9, by - tfy * fl * 0.5 - tny * spread * 0.9, j[t - 1].x - tnx * w * 0.2, j[t - 1].y - tny * w * 0.2);
    ctx.closePath(); ctx.fill();
    // the body outline from the spine
    const L = [], R = [];
    for (let k = 0; k < N; k++) { const [nx, ny] = nrm(k), ww = w * PROFILE[k]; L.push([j[k].x + nx * ww, j[k].y + ny * ww]); R.push([j[k].x - nx * ww, j[k].y - ny * ww]); }
    const [f0x, f0y] = fwd(0), [n0x, n0y] = nrm(0);
    const nose = [j[0].x + f0x * w * 0.95, j[0].y + f0y * w * 0.95];
    const noseL = [j[0].x + f0x * w * 0.7 + n0x * w * 0.45, j[0].y + f0y * w * 0.7 + n0y * w * 0.45];
    const noseR = [j[0].x + f0x * w * 0.7 - n0x * w * 0.45, j[0].y + f0y * w * 0.7 - n0y * w * 0.45];
    smoothClosed([nose, noseL, ...L, [j[t].x - tfx * w * 0.1, j[t].y - tfy * w * 0.1], ...R.reverse(), noseR]);
    ctx.fillStyle = skin.body; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.fillStyle = skin.spot;
    for (const [u, side, r] of skin.spots) {
      const fk = u * (N - 1), k = Math.min(N - 2, Math.floor(fk)), fr = fk - k;
      const x = j[k].x + (j[k + 1].x - j[k].x) * fr, y = j[k].y + (j[k + 1].y - j[k].y) * fr;
      const [nx, ny] = nrm(k);
      ctx.beginPath(); ctx.ellipse(x + nx * side * w, y + ny * side * w, w * r * 1.5, w * r, ang[k], 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle = '#0B0C0D';
    for (const side of [1, -1]) {
      const ex = j[0].x + f0x * w * 0.35 + n0x * w * 0.5 * side, ey = j[0].y + f0y * w * 0.35 + n0y * w * 0.5 * side;
      ctx.beginPath(); ctx.arc(ex, ey, Math.max(1.2, w * 0.11), 0, TAU); ctx.fill();
    }
  }
  function drawPad(p, time) {
    const x = p.x + p.ox, y = p.y + p.oy, rot = p.rot + Math.sin(time * 0.2 + p.rot) * 0.06;
    ctx.fillStyle = '#18191B';
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.arc(x, y, p.r, rot + p.notch * 0.5, rot + TAU - p.notch * 0.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#26282C'; ctx.lineWidth = Math.max(1, p.r * 0.03);
    for (let k = 1; k < 6; k++) { const a = rot + p.notch * 0.5 + (TAU - p.notch) * k / 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * p.r * 0.86, y + Math.sin(a) * p.r * 0.86); ctx.stroke(); }
    if (p.flower) {
      const fx = x + Math.cos(rot + 3.6) * p.r * 0.35, fy = y + Math.sin(rot + 3.6) * p.r * 0.35, pr = p.r * 0.34;
      ctx.fillStyle = '#D0D6E0';
      for (let k = 0; k < 7; k++) { const a = rot + k * TAU / 7; ctx.beginPath(); ctx.ellipse(fx + Math.cos(a) * pr * 0.55, fy + Math.sin(a) * pr * 0.55, pr * 0.6, pr * 0.26, a, 0, TAU); ctx.fill(); }
      ctx.fillStyle = '#0B0C0D'; ctx.beginPath(); ctx.arc(fx, fy, pr * 0.26, 0, TAU); ctx.fill();
    }
  }
  function frame(nowMs) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.04, (nowMs - last) / 1000) || 0.016; last = nowMs;
    const time = nowMs / 1000;
    const attract = ptr.has ? (ptr.ghost ? 0.65 : 1) : 0;
    food = Math.max(0, food - dt * 0.4);
    if (pellet) { pellet.t += dt; if (pellet.t > 3) pellet = null; }
    fish.forEach((f) => steer(f, dt, ptr.x, ptr.y, attract));
    // ripples push the pads a little
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i]; r.t += dt; if (r.t > r.life) { ripples.splice(i, 1); continue; }
      const u = r.t / r.life; r.r = r.max * (1 - Math.pow(1 - u, 2.2));
      pads.forEach((p) => { const d = Math.hypot(p.x + p.ox - r.x, p.y + p.oy - r.y); if (Math.abs(d - r.r) < p.r * 0.5 && d > 0) { p.vx += (p.x + p.ox - r.x) / d * r.s * 6 * dt; p.vy += (p.y + p.oy - r.y) / d * r.s * 6 * dt; } });
    }
    pads.forEach((p) => { p.vx += -p.ox * 0.6 * dt; p.vy += -p.oy * 0.6 * dt; p.vx *= 0.985; p.vy *= 0.985; p.ox += p.vx; p.oy += p.vy; });
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#0B0C0D'; ctx.fillRect(0, 0, W, H);
    // slow pools of deeper water: flat discs, not a gradient
    [[0.3, 0.38, 0.5], [0.76, 0.62, 0.42]].forEach(([bx, by, br], i) => {
      ctx.fillStyle = '#0c0d0f'; ctx.beginPath();
      ctx.arc(W * (bx + Math.sin(time * 0.07 + i * 2) * 0.05), H * (by + Math.cos(time * 0.05 + i) * 0.04), Math.max(W, H) * br, 0, TAU); ctx.fill();
    });
    ctx.lineWidth = 2;
    for (const r of ripples) {
      const u = r.t / r.life, a = (1 - u) * (1 - u) * r.s;
      ctx.strokeStyle = `rgba(244,245,242,${(a * 0.55).toFixed(3)})`;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
    }
    fish.forEach(drawFish);
    pads.forEach((p) => drawPad(p, time));
    if (pellet) { // the bait: one lime disc that settles
      const k = 1 - Math.min(1, pellet.t / 3);
      ctx.fillStyle = '#B8FF00'; ctx.beginPath(); ctx.arc(pellet.x, pellet.y, 3 + 6 * k, 0, TAU); ctx.fill();
    }
  }
  addEventListener('resize', () => { const ow = W, oh = H; resize(); placePads(); fish.forEach((f) => f.j.forEach((p) => { p.x *= W / ow; p.y *= H / oh; })); });
  requestAnimationFrame(frame);
  return {
    move(x, y, ghost) {
      ptr.x = x; ptr.y = y; ptr.has = true; ptr.ghost = !!ghost; wake();
      if (ghost && !reduce && performance.now() / 1000 > nextTap) { feed(x, y); nextTap = performance.now() / 1000 + 4.4; }
    },
    leave() { ptr.has = false; },
    feed
  };
})();
document.addEventListener('pointermove', (e) => pond.move(e.clientX, e.clientY, false));
document.addEventListener('pointerdown', (e) => pond.feed(e.clientX, e.clientY));
document.documentElement.addEventListener('pointerleave', () => pond.leave());
</script>
<script>
  QM.demo({ kind: 'pointer',
    move: (x, y, g) => pond.move(x, y, g),
    leave: () => pond.leave(),
    path: (t) => { const g = t * 0.9;
      return [innerWidth * (0.5 + 0.3 * Math.sin(g * 0.31) * Math.cos(g * 0.13)), innerHeight * (0.55 + 0.25 * Math.sin(g * 0.23 + 1))]; } });
</script>
</body>
</html>
