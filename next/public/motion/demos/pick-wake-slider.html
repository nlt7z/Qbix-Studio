<style data-code>
/* Wake slider — idea: bencho.dev wake-slider (MIT), redrawn for Qbix.
   Layout, sizes, radii and motion are the original's; colours are Qbix's: paper, white, ink, one lime. */
.pk {
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-6: 24px; --space-7: 32px;
  --radius-sm: 8px; --radius-lg: 14px; --radius-pill: 999px;
  --duration-base: 200ms; --ease-out: cubic-bezier(.16, 1, .3, 1);
  --muted: var(--fg2); --surface-muted: var(--sunk);
  font: 400 14px/1.5 var(--font-sans); letter-spacing: 0; color: var(--fg);
}
.card { width: min(680px, 100%); background: var(--surface); border-radius: var(--radius-lg); padding: var(--space-7) var(--space-6) var(--space-6); display: grid; gap: var(--space-6); }
.hd h1 { font: 400 20px/1.35 var(--font-sans); letter-spacing: -0.02em; }
.hd p { color: var(--muted); }
.read { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); }
.read .n { font-size: 42px; letter-spacing: -0.04em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.read .n small { font-size: 16px; color: var(--muted); letter-spacing: 0; margin-left: var(--space-1); }
.ends { display: flex; justify-content: space-between; color: var(--muted); }
.bars { position: relative; height: 84px; display: flex; align-items: center; justify-content: space-between; touch-action: none; cursor: ew-resize; user-select: none; -webkit-user-select: none; }
.bars:focus-visible { outline: 2px solid var(--fg); outline-offset: 6px; border-radius: var(--radius-sm); }
.bars i { flex: 0 0 3px; width: 3px; height: 28px; border-radius: 2px; background: var(--fg4); will-change: transform; }
.bars i.on { background: var(--fg); }
.list { display: grid; gap: 2px; }
.r { display: grid; grid-template-columns: 36px 1fr auto auto auto; align-items: center; gap: var(--space-3); height: 52px; padding: 0 var(--space-3); border-radius: var(--radius-sm); transition: background-color var(--duration-base) var(--ease-out); }
.r.top { background: var(--surface-muted); }
.r .th { width: 36px; height: 36px; border-radius: var(--radius-sm); background: var(--fg) center / cover; }
.r .nm { font-weight: 500; }
.r .p, .r .l { text-align: right; font-variant-numeric: tabular-nums; min-width: 84px; }

<body>
<div class="vp"><div class="page">
<!-- code -->
<div class="card pk">
  <div class="hd"><h1>What matters more</h1><p>Forma · three turnarounds</p></div>
  <div class="read"><span class="n"><span id="a">30</span><small>% price</small></span><span class="n"><span id="b">70</span><small>% speed</small></span></div>
  <div class="bars" id="bars" tabindex="0" role="slider" aria-label="Price or speed" aria-valuemin="0" aria-valuemax="100"></div>
  <div class="ends"><span>Price</span><span>Speed</span></div>
  <div class="list" id="list"></div>

<!-- /code -->
</div></div>
<div class="qm-ui"><span>Drag the bars: slow fills them, fast throws a wake</span></div>
<script src="../kit/stage.js"></script>
<script data-code>
/* Wake slider. Idea: bencho.dev wake-slider (MIT).
   The value drawn lags the hand a touch, so a throw is a sweep across the bars; every bar the sweep crosses
   gets a kick from its speed and rings on its own spring. Nothing draws the wake: it is the bars crossed
   longest ago that have fallen furthest. */
const $ = (s) => document.querySelector(s);
const bars = $('#bars');
const TIERS = [   // the Design service, by turnaround: [name, weeks, dollars, picture]
  ['Rush', 1, 1200, 'cross'],
  ['Priority', 2, 750, 'ring'],
  ['Standard', 3, 500, 'objects'],
];
const money = (n) => '$' + n.toLocaleString('en-US');
const minP = Math.min(...TIERS.map((t) => t[2])), maxP = Math.max(...TIERS.map((t) => t[2]));
const minL = Math.min(...TIERS.map((t) => t[1])), maxL = Math.max(...TIERS.map((t) => t[1]));
const rows = TIERS.map(([n, wk, p, pic]) => {
  const r = document.createElement('div');
  r.className = 'r';
  r.innerHTML = `<span class="th" style="background-image:url(../assets/art/${pic}.webp)"></span><span class="nm">${n}</span><span class="p">${money(p)}</span><span class="l">${wk} ${wk === 1 ? 'week' : 'weeks'}</span><span class="chipslot"></span>`;
  $('#list').appendChild(r);
  return r;
});

const PITCH = 8, K = 260, C = 11;   // a bar every 8px; each bar a spring that rings
let N = 0, els = [], st = [], value = 70, shown = 70, last = 70, speed = 0, dragging = false, said = -1, bestNow = -1;
const clamp = (v) => Math.max(0, Math.min(100, v));
function build() {
  const w = bars.clientWidth;
  N = Math.max(12, Math.floor((w + 5) / PITCH));
  bars.innerHTML = ''; els = []; st = [];
  for (let i = 0; i < N; i++) { const e = document.createElement('i'); bars.appendChild(e); els.push(e); st.push({ s: 0, v: 0 }); }
  said = -1;
  els.forEach((e, i) => e.classList.toggle('on', (i + 0.5) / N * 100 <= shown));
}
/* the weight is price at the left, speed at the right */
function reading() {
  const v = Math.round(value);
  if (v === said) return;
  said = v;
  $('#a').textContent = 100 - v; $('#b').textContent = v;
  bars.setAttribute('aria-valuenow', v);
  const w = (100 - value) / 100;
  const score = TIERS.map((t) => w * (maxP - t[2]) / (maxP - minP) + (1 - w) * (maxL - t[1]) / (maxL - minL));
  const best = score.indexOf(Math.max(...score));
  if (best === bestNow) return;
  bestNow = best;
  rows.forEach((r, i) => { r.classList.toggle('top', i === best); r.querySelector('.chipslot').innerHTML = i === best ? '<span class="chip">Our pick</span>' : ''; });
}
const set = (v) => { value = clamp(v); };
/* put it somewhere without a wake */
function jump(v) { value = shown = last = clamp(v); st.forEach((s) => { s.s = 0; s.v = 0; }); els.forEach((e, i) => { e.style.transform = ''; e.classList.toggle('on', (i + 0.5) / N * 100 <= shown); }); said = -1; reading(); }
const fromX = (x) => { const r = bars.getBoundingClientRect(); return ((x - r.left) / r.width) * 100; };
bars.addEventListener('pointerdown', (e) => { dragging = true; set(fromX(e.clientX)); });
window.addEventListener('pointermove', (e) => { if (dragging) set(fromX(e.clientX)); });
const up = () => { dragging = false; };
window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
bars.addEventListener('keydown', (e) => { const d = e.key === 'ArrowRight' ? 5 : e.key === 'ArrowLeft' ? -5 : 0; if (d) { e.preventDefault(); set(value + d); } });

const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let prev = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - prev) / 1000); prev = now;
  if (dt > 0) {
    shown += (value - shown) * Math.min(1, dt * 28);     // the drawn value lags the hand a touch…
    if (Math.abs(value - shown) < 0.004) shown = value;
    const sv = (shown - last) / Math.max(dt, 0.001);
    speed += (Math.abs(sv) - speed) * Math.min(1, dt * 18);
    const a = Math.min(last, shown) / 100 * N, b = Math.max(last, shown) / 100 * N;
    if (Math.abs(shown - last) > 0.0001) {
      const kick = Math.min(1, speed / 320) * (still ? 0 : 30);   // …so a throw is a sweep: every bar it crosses is kicked
      if (kick > 1.5) for (let i = Math.floor(a - 0.5); i <= Math.ceil(b - 0.5); i++) if (i >= 0 && i < N) st[i].v += kick;
    }
    last = shown;
    for (let i = 0; i < N; i++) {
      const s = st[i];
      s.v += (-K * s.s - C * s.v) * dt; s.s += s.v * dt;
      if (Math.abs(s.s) < 0.0005 && Math.abs(s.v) < 0.005) { s.s = 0; s.v = 0; }
      els[i].style.transform = s.s === 0 ? '' : `scaleY(${Math.max(0.15, 1 + s.s).toFixed(3)})`;
      const on = (i + 0.5) / N * 100 <= shown;
      if (on !== els[i].classList.contains('on')) els[i].classList.toggle('on', on);
    }
    reading();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => { if (bars.clientWidth && Math.max(12, Math.floor((bars.clientWidth + 5) / PITCH)) !== N) build(); });
build();
requestAnimationFrame(frame);
</script>
<script>
  /* ---- harness glue: the 1200 × 750 frame the original was drawn in, scaled to the window; a ghost hand plays it; real input takes over ---- */
  const ABORT = { abort: true };
  function vpfit() {
    const vp = document.querySelector('.vp'), ui = document.querySelector('.qm-ui');
    const go = () => {
      const bar = QM.tile || !ui ? 0 : 46;
      const k = Math.min(innerWidth / 1200, (innerHeight - bar) / 750);
      vp.style.transform = `translate(${(innerWidth - 1200 * k) / 2}px, ${(innerHeight - bar - 750 * k) / 2}px) scale(${k})`;
    };
    addEventListener('resize', go); go();
  }
  const hand = (() => {
    let x = innerWidth * 0.82, y = innerHeight * 0.86, held = null, over = null, gen = 0;
    const ease = QM.bezier(0.65, 0, 0.35, 1);
    const under = () => held || document.elementFromPoint(x, y) || document.body;
    const ev = (type, el, buttons) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, composed: true, pointerId: 7, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons }));
    const chain = (el) => { const s = []; for (let n = el; n; n = n.parentElement) s.push(n); return s; };
    function hover(el) {
      if (el === over) return;
      const keep = new Set(chain(el));
      chain(over).forEach((n) => { if (!keep.has(n)) n.classList.remove('is-hover'); });
      chain(el).forEach((n) => n.classList.add('is-hover'));
      over = el;
    }
    const api = {
      cancel() { gen++; },
      async wait(ms) { const my = gen; await QM.wait(ms); if (my !== gen) throw ABORT; },
      async to(tx, ty, ms = 700) {
        const my = gen, x0 = x, y0 = y, t0 = performance.now();
        QM.ghostShow();
        if (Math.hypot(tx - x0, ty - y0) < 1) { await Promise.resolve(); if (my !== gen) throw ABORT; return; }
        for (;;) {
          await new Promise(requestAnimationFrame);
          if (my !== gen) throw ABORT;
          const p = Math.min(1, (performance.now() - t0) / ms), k = ease(p);
          x = x0 + (tx - x0) * k; y = y0 + (ty - y0) * k;
          QM.ghostAt(x, y);
          const el = under(); hover(el); ev('pointermove', el, held ? 1 : 0);
          if (p >= 1) return;
        }
      },
      down() { held = under(); ev('pointerdown', held, 1); },
      up() { const el = held || under(); ev('pointerup', el, 0); held = null; },
      release() { if (held) api.up(); },
    };
    return api;
  })();

  async function story() {
    jump(70);
    const r = bars.getBoundingClientRect(), y = r.top + r.height / 2, X = (v) => r.left + r.width * v / 100;
    await hand.to(X(70), y, 500); hand.down();
    await hand.to(X(8), y, 450);                            // thrown left: a wake
    await hand.to(X(88), y, 520);                           // thrown right: another
    await hand.to(X(20), y, 520); await hand.wait(500);     // and back
    await hand.to(X(52), y, 1700); await hand.wait(300);    // slow: it just fills
    await hand.to(X(96), y, 420); hand.up();                // thrown again
    await hand.wait(1500);
  }
  let paused = false, running = false, lastReal = -1e9;
  function cancelStory() { hand.cancel(); QM.ghostHide(); hand.release(); running = false; }
  if (!QM.tile) {
    const real = (e) => { if (e.isTrusted) { lastReal = performance.now(); if (running) cancelStory(); } };
    ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  }
  addEventListener('message', (e) => { const m = e.data; if (m && m.qm === 'cmd' && m.cmd === 'pause') { paused = true; cancelStory(); } });
  (async function idle() {
    for (;;) {
      await QM.wait(250);
      if (QM.reduced || paused || document.hidden || (!QM.tile && performance.now() - lastReal < 2500)) continue;
      running = true;
      try { await story(); } catch (e) { if (e !== ABORT) throw e; }
      if (running) { QM.ghostHide(); hand.release(); }
      running = false;
    }
  })();
  vpfit();
  QM.demo({ kind: 'loop', restart() { paused = false; lastReal = -1e9; if (running) cancelStory(); } });
</script>
</body>
