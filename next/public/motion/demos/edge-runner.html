.er-svg path { fill: none; stroke-width: 3; stroke-linejoin: miter; }
.er-seg { stroke: #B8FF00; }

<script data-code>
/* The runner is drawn by hand each frame: head position p along the outline, a length len of it lit. */
const ER = (() => {
  const btn = document.getElementById('er'), seg = document.getElementById('er-seg'), svg = document.getElementById('er-svg');
  const LAP = 1600, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let p = 0, len = 33, raf = 0, last = 0, closeAt = 0, timers = [];
  const ease = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  function outline() {                       // the button's own outline, cut corner included, inset by half the stroke
    const W = btn.clientWidth, H = btn.clientHeight, c = parseFloat(getComputedStyle(btn).getPropertyValue('--cut')) * parseFloat(getComputedStyle(btn).fontSize), i = 1.5;
    const d = `M${i} ${i}H${W - c}L${W - i} ${c}V${H - i}H${i}Z`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    seg.setAttribute('d', d);
  }
  function draw() {
    seg.style.strokeDasharray = len >= 99.9 ? '100 0' : `${len} ${100 - len}`;
    seg.style.strokeDashoffset = (len - p).toFixed(3);
  }
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    p = (p + dt / LAP * 100) % 100;
    if (closeAt) len = 33 + 67 * ease(Math.min(1, (now - closeAt) / 560));
    draw();
    raf = requestAnimationFrame(frame);
  }
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function reset() {
    clear();
    btn.classList.add('nt');
    btn.classList.remove('is-done');
    len = 33; closeAt = 0;
    outline(); draw();
    void btn.offsetWidth;
    btn.classList.remove('nt');
  }
  function run() {                           // 3.2 s of work, then close the frame, then fill
    reset();
    if (still) { len = 100; draw(); btn.classList.add('nt', 'is-done'); return; }
    cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame);
    timers.push(setTimeout(() => { closeAt = performance.now(); }, 3200));
    timers.push(setTimeout(() => btn.classList.add('is-done'), 3200 + 560));
  }
  if (window.ResizeObserver) new ResizeObserver(outline).observe(btn);
  btn.addEventListener('click', run);
  return { run };
})();
</script>
<script>
  let run = 0, resumeT = 0;
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  async function start() {
    const my = ++run;
    ER.run();
    await w(3200 + 560 + 600 + 2200); if (my !== run) return;
    start();
  }
  document.getElementById('er').addEventListener('click', () => { run++; clearTimeout(resumeT); resumeT = setTimeout(start, 8000); });
  QM.demo({ kind: 'loop', restart: start });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(start));
</script>
