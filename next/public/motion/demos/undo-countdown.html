<style data-code>

<script data-code>
/* Undo countdown. One pending archive at a time; the bar's animation and the commit timer run on the same 5 s. */
const ufList = document.getElementById('uf-list'), ufToast = document.getElementById('uf-toast');
const ufName = document.getElementById('uf-name'), ufUndo = document.getElementById('uf-undo');
const HOLD = 5000;
let pending = null;

function setIn(on) { ufToast.classList.toggle('is-in', on); ufToast.inert = !on; if (!on) ufToast.classList.remove('is-held'); }
function arm(ms) { pending.t0 = performance.now(); pending.left = ms; pending.timer = setTimeout(commit, ms); }
function commit() {                       // the toast leaves; the file stays archived
  if (!pending) return;
  clearTimeout(pending.timer); pending = null;
  const had = ufToast.contains(document.activeElement);
  setIn(false);
  if (had) { const next = ufList.querySelector('.uf-slot:not(.is-gone) .uf-arc'); if (next) next.focus(); }
}
function archive(slot, byKey) {
  if (pending) commit();                  // a second archive commits the first
  slot.classList.add('is-gone'); slot.inert = true;
  ufName.textContent = slot.querySelector('.uf-nm').textContent;
  ufToast.classList.remove('is-in', 'is-held'); void ufToast.offsetWidth;   // restart the bar
  setIn(true);
  pending = { slot };
  arm(HOLD);
  if (byKey) ufUndo.focus({ preventScroll: true });    // the button that was pressed is gone, so Enter again is Undo
}
function undo() {
  if (!pending) return;
  clearTimeout(pending.timer);
  const slot = pending.slot, had = ufToast.contains(document.activeElement);
  pending = null;
  slot.inert = false; slot.classList.remove('is-gone');
  setIn(false);
  if (had) slot.querySelector('.uf-arc').focus({ preventScroll: true });
}
/* hover or focus on the toast holds the bar and the timer together, and gives back what was left */
function hold(on) {
  if (!pending) return;
  if (on && !pending.held) { pending.held = true; clearTimeout(pending.timer); pending.left -= performance.now() - pending.t0; ufToast.classList.add('is-held'); }
  else if (!on && pending.held) { pending.held = false; ufToast.classList.remove('is-held'); arm(Math.max(0, pending.left)); }
}
ufToast.addEventListener('pointerenter', (e) => { if (e.isTrusted) hold(true); });
ufToast.addEventListener('pointerleave', (e) => { if (e.isTrusted && !ufToast.contains(document.activeElement)) hold(false); });
ufToast.addEventListener('focusin', () => hold(true));
ufToast.addEventListener('focusout', () => { if (!ufToast.matches(':hover')) hold(false); });
ufList.addEventListener('click', (e) => {
  const b = e.target.closest('.uf-arc');
  if (b) archive(b.closest('.uf-slot'), e.detail === 0);
});
ufUndo.addEventListener('click', undo);
</script>
<script>
  /* ---- harness glue ---- */
  const rig = document.getElementById('rig');
  function fit() {
    const bar = QM.tile ? 0 : 46;
    const k = Math.min(innerWidth * 0.68 / 520, (innerHeight - bar - 48) / rig.offsetHeight, 2.2);
    const q = Math.max(0.5, Math.floor(k * 4) / 4);          // quarter steps: 1px things and the 8px grid land on whole pixels
    rig.style.transform = `scale(${q})`;
  }
  addEventListener('resize', fit); fit();

  const ABORT = { abort: true };
  let gen = 0, running = false, paused = false, lastReal = -1e9, round = 0;
  const sleep = (ms) => { const g = gen; return new Promise((res, rej) => setTimeout(() => (g === gen ? res() : rej(ABORT)), ms)); };
  function reset() {
    rig.classList.add('is-reset');
    if (pending) { clearTimeout(pending.timer); pending = null; }
    setIn(false);
    ufList.querySelectorAll('.uf-slot').forEach((s) => { s.classList.remove('is-gone'); s.inert = false; });
    ufList.querySelectorAll('.is-hover').forEach((r) => r.classList.remove('is-hover'));
    void rig.offsetWidth;
    rig.classList.remove('is-reset');
  }
  async function pointAt(el) {
    const r = el.getBoundingClientRect(), g = gen;
    QM.ghostShow();
    await QM.ghostTo(r.left + r.width * 0.5, r.top + r.height * 0.6, 800);
    if (g !== gen) throw ABORT;
  }
  async function press(el) {
    await sleep(110); el.classList.add('is-down'); await sleep(110); el.classList.remove('is-down');
    el.dispatchEvent(new MouseEvent('click', { bubbles: true, detail: 1 }));        // a pointer click, so nothing takes keyboard focus
  }
  /* a story never starts on a mess: whatever a viewer left behind is put back with the real motion, not snapped */
  async function settle() {
    if (pending && ufToast.contains(document.activeElement)) document.activeElement.blur();   // focus held the clock: let it run
    hold(false);
    while (pending) await sleep(200);
    const gone = ufList.querySelectorAll('.uf-slot.is-gone');
    if (gone.length) { gone.forEach((s) => { s.inert = false; s.classList.remove('is-gone'); }); await sleep(1000); }
  }
  async function story() {
    await settle(); reset(); await sleep(800);
    const row = ufList.children[1].firstElementChild, arc = row.querySelector('.uf-arc');
    await pointAt(arc); row.classList.add('is-hover');
    await press(arc); row.classList.remove('is-hover');
    QM.ghostTo(innerWidth * 0.84, innerHeight * 0.74, 700);          // off the list, so the rows closing up are not "hovered"
    await sleep(1700);
    if (round++ % 2 === 0) {                       // this round: Undo
      await pointAt(ufUndo); ufUndo.classList.add('is-hover');
      await press(ufUndo); ufUndo.classList.remove('is-hover');
      QM.ghostHide(); await sleep(2400);
    } else {                                       // next round: let it run out
      QM.ghostHide(); await sleep(HOLD - 2400 + 1200);
    }
  }
  function cancel() { gen++; running = false; QM.ghostHide(); ufUndo.classList.remove('is-down', 'is-hover'); ufList.querySelectorAll('.is-hover, .is-down').forEach((r) => r.classList.remove('is-hover', 'is-down')); }
  /* a real pointer or key stops the ghost; it comes back after 4 s without input */
  if (!QM.tile) {
    const real = (e) => {
      if (!e.isTrusted || (e.type === 'pointermove' && e.pointerType !== 'mouse')) return;
      lastReal = performance.now(); if (running) cancel();
    };
    ['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  }
  addEventListener('message', (e) => { const m = e.data; if (m && m.qm === 'cmd' && m.cmd === 'pause') { paused = true; cancel(); } });
  if (QM.reduced) { archive(ufList.children[1]); clearTimeout(pending.timer); }
  else (async function idle() {
    for (;;) {
      await new Promise((r) => setTimeout(r, 250));
      if (paused || document.hidden || running || (!QM.tile && performance.now() - lastReal < 4000)) continue;
      running = true;
      try { await story(); } catch (e) { if (e !== ABORT) throw e; }
      running = false;
    }
  })();
  QM.demo({ kind: 'loop', restart() { paused = false; lastReal = -1e9; if (running) cancel(); } });
</script>
