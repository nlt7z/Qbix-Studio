<style data-code>
/* Deal to grid. Tokens: --ease-move, --ease-out-expo; lime #B8FF00, ink #121417. */
.dg { --W: min(72vw, 98vh); width: var(--W); font-size: calc(var(--W) / 49); }

/* head: the kicker in a sleeve, the tag in another */
.dg-head { display: flex; align-items: center; justify-content: space-between; height: 2.667em; margin-bottom: 1.1em; }
.dg-ksl, .dg-tsl { display: grid; overflow: hidden; }
.dg-ksl { height: 1.34em; }
.dg-k { grid-area: 1 / 1; margin: 0; font: 400 1em/1.34 'Encode Sans', Geist, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(18, 20, 23, .64); white-space: nowrap; transition: transform 520ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)); }
.dg-k.a { transform: translateY(-110%); transition-delay: 1000ms; }
.dg-k.b { transition-delay: 1000ms; }
.dg-tag { display: inline-flex; align-items: center; height: 2.667em; padding: 0 1.2em; background: #B8FF00; color: #0c1300; font: 400 1em/1 'Encode Sans', Geist, sans-serif; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; clip-path: polygon(0 0, calc(100% - .667em) 0, 100% .667em, 100% 100%, 0 100%); transition: transform 560ms var(--ease-out-expo, cubic-bezier(.16, 1, .3, 1)) 1150ms; }

/* the board: a white surface, nine tinted slots, nine cards */
.dg-board { --pad: 2.2em; --gap: .75em; position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); padding: var(--pad); background: #fff; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
.dg-cell { position: relative; aspect-ratio: 3 / 2; background: rgba(18, 20, 23, .05); }
.dg-card { position: absolute; inset: 0; overflow: hidden; background: #eceef0; transition: transform 780ms var(--ease-move, cubic-bezier(.65, 0, .35, 1)) var(--d, 0ms); will-change: transform; }
.dg-card img { width: 100%; height: 100%; object-fit: cover; }
.dg-card .n { position: absolute; left: 0; bottom: 0; display: grid; place-items: center; min-width: 2.6em; height: 2em; padding: 0 .5em; background: #fff; color: #121417; font: 500 .85em/1 'Encode Sans', Geist, sans-serif; font-style: normal; letter-spacing: .08em; }

/* the two swatch cards and the type card */
.dg-sw { display: flex; height: 100%; }
.dg-sw b { flex: var(--f, 1); }
.dg-type { position: absolute; inset: 0; padding: .8em 1em; background: #eceef0; }
.dg-type .aa { font: 400 5.2em/1 'Eurostile', Geist, sans-serif; letter-spacing: -.03em; color: #121417; }
.dg-type .nm { position: absolute; right: 1em; top: 1em; font: 400 .85em/1 'Encode Sans', Geist, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: rgba(18, 20, 23, .64); }

/* the pile: every card at the board's centre (offsets set from the slots) */
.dg.is-pile .dg-card { transform: translate(var(--tx), var(--ty)) rotate(var(--r)); z-index: calc(20 - var(--i)); }
.dg.is-pile .dg-k.a { transform: none; transition-delay: 0ms; }
.dg.is-pile .dg-k.b { transform: translateY(110%); transition-delay: 0ms; }
.dg.is-pile .dg-tag { transform: translateY(110%); transition-delay: 0ms; }
.dg.is-reset *, .dg.is-reset { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .dg-card, .dg-k, .dg-tag { transition: none !important; }
}
</style>

<script data-code>
/* Deal to grid. The pile is each card's way back to the board's centre, measured from its slot.
   is-pile on .dg = gathered; without it = dealt. Delays are set per direction. */
const dg = document.getElementById('dg');
const dgBoard = document.getElementById('dg-board');
const dgCards = [...dgBoard.querySelectorAll('.dg-card')];
const dgJit = [[0, 0, -3], [-5, 3, 4], [4, -3, -6], [-3, 5, 2], [6, 2, 7], [-6, -4, -4], [3, 6, 5], [-4, -6, -7], [5, -2, 3]];
let dgTimers = [];
function dgMeasure() {
  const bw = dgBoard.clientWidth, bh = dgBoard.clientHeight;
  dgCards.forEach((card, i) => {
    const cell = card.parentElement;
    const [jx, jy, r] = dgJit[i];
    card.style.setProperty('--i', i);
    card.style.setProperty('--tx', (bw / 2 - (cell.offsetLeft + cell.offsetWidth / 2) + jx) + 'px');
    card.style.setProperty('--ty', (bh / 2 - (cell.offsetTop + cell.offsetHeight / 2) + jy) + 'px');
    card.style.setProperty('--r', r + 'deg');
  });
}
function dgClear() { dgTimers.forEach(clearTimeout); dgTimers = []; dgCards.forEach((c) => (c.style.zIndex = '')); }
// a card on its way rides above the board, then drops back
function dgFly(i, at) {
  dgTimers.push(setTimeout(() => (dgCards[i].style.zIndex = 40), at));
  dgTimers.push(setTimeout(() => (dgCards[i].style.zIndex = ''), at + 780));
}
function dgDeal() {
  dgClear();
  dgCards.forEach((c, i) => { c.style.setProperty('--d', i * 60 + 'ms'); dgFly(i, i * 60); });
  dg.classList.remove('is-pile');
}
function dgGather() {
  dgClear();
  dgCards.forEach((c, i) => { c.style.setProperty('--d', (8 - i) * 40 + 'ms'); dgFly(i, (8 - i) * 40); });
  dg.classList.add('is-pile');
}
function dgRest() {   // the pile, instantly
  dgClear();
  dg.classList.add('is-reset', 'is-pile');
  void dg.offsetWidth;
  dg.classList.remove('is-reset');
}
addEventListener('resize', dgMeasure);
dgMeasure();
</script>
<script>
(() => {
  const reduced = QM.reduced;
  const redo = () => { dgRest(); requestAnimationFrame(() => requestAnimationFrame(dgDeal)); };
  dgBoard.addEventListener('click', () => (dg.classList.contains('is-pile') ? dgDeal() : dgGather()));
  document.getElementById('again').addEventListener('click', redo);
  document.getElementById('gather').addEventListener('click', dgGather);
  if (reduced) { dg.classList.remove('is-pile'); return QM.demo({ kind: 'play', dur: 0, hold: 60000, reset() {}, play() {} }); }
  QM.demo({ kind: 'play', lead: 900, dur: 2400, hold: 2300, reset: () => { dgMeasure(); dgRest(); }, play: dgDeal });
})();
</script>
