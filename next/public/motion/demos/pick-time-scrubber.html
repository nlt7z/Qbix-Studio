}

<script data-code>
/* Go-live ruler. Idea: bencho.dev time-scrubber (MIT).
   One spring carries the throw and the snap: the landing is decided at release, from the hand's own speed. */
const $ = (s) => document.querySelector(s);
const dial = $('#dial'), face = $('#face');
const TODAY = new Date(2026, 10, 3), PROMISED = 7, MAXD = 90, PX = 18, POOL = 61;   // 7 days: Live in 7 days
const dateAt = (n) => new Date(2026, 10, 3 + n);
const pool = [];
for (let i = 0; i < POOL; i++) {
  const t = document.createElement('i'); t.className = 't';
  const l = document.createElement('span'); l.className = 'l';
  face.appendChild(t); face.appendChild(l); pool.push({ t, l });
}
let pos = PROMISED, vel = 0, target = PROMISED, drag = null, spring = false, samples = [], lastDay = -1;
const K = 120, C = 19;
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
const rubber = (p) => (p < 0 ? p * 0.35 : p > MAXD ? MAXD + (p - MAXD) * 0.35 : p);

function draw() {
  const w = dial.clientWidth, cx = w / 2, base = Math.round(pos);
  for (let k = 0; k < POOL; k++) {
    const day = base + k - 30, x = cx + (day - pos) * PX, el = pool[k];
    const dist = Math.abs(x - cx), f = Math.exp(-Math.pow(dist / 130, 2));
    const d = dateAt(day), dow = d.getDay(), ok = day >= 0 && day <= MAXD;
    el.t.style.left = x.toFixed(1) + 'px'; el.t.style.height = (ok ? 10 + 40 * f + (d.getDate() === 1 ? 12 : 0) : 0) + 'px';
    el.t.style.opacity = (0.18 + 0.82 * f).toFixed(3); el.t.classList.toggle('we', dow === 0 || dow === 6);
    const lab = ok && (d.getDate() === 1 ? d.toLocaleDateString('en-US', { month: 'short' }) : dow === 1 ? String(d.getDate()) : '');
    el.l.style.left = x.toFixed(1) + 'px'; el.l.textContent = lab || ''; el.l.style.opacity = (0.25 + 0.75 * f).toFixed(3);
  }
  const day = Math.max(0, Math.min(MAXD, Math.round(pos)));
  if (day !== lastDay) { lastDay = day; read(day); }
}
function read(day) {
  const d = dateAt(day);
  $('#d').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  $('#w').textContent = d.toLocaleDateString('en-US', { weekday: 'long' }) + ', ' + d.getFullYear();
  const diff = day - PROMISED;
  $('#chip').innerHTML = diff === 0 ? '<span class="chip on">On the promised date</span>' : diff > 0 ? `<span class="chip">${diff} ${diff === 1 ? 'day' : 'days'} later</span>` : `<span class="chip">${-diff} ${diff === -1 ? 'day' : 'days'} earlier</span>`;
  $('#gap').textContent = day === 0 ? 'Today' : `In ${day} ${day === 1 ? 'day' : 'days'}`;
  dial.setAttribute('aria-valuenow', day);
}
/* put it on a day with no spring */
function jump(d) { pos = target = d; vel = 0; spring = false; lastDay = -1; draw(); }

/* one spring carries the throw and the snap: the landing is decided at release */
let prev = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  if (spring) {
    if (still) { pos = target; vel = 0; }
    else { vel += (K * (target - pos) - C * vel) * dt; pos += vel * dt; }
    if (Math.abs(target - pos) < 0.002 && Math.abs(vel) < 0.01) { pos = target; vel = 0; spring = false; }
  }
  draw();
  requestAnimationFrame(loop);
}
const scale = () => dial.getBoundingClientRect().width / dial.offsetWidth || 1;   // the page may draw the piece scaled
dial.addEventListener('pointerdown', (e) => {
  try { dial.setPointerCapture(e.pointerId); } catch (x) { /* a scripted pointer */ }
  dial.classList.add('is-drag'); spring = false;
  drag = { x: e.clientX, p: pos }; samples = [{ x: e.clientX, t: performance.now() }];
});
dial.addEventListener('pointermove', (e) => {
  if (!drag) return;
  pos = rubber(drag.p - (e.clientX - drag.x) / scale() / PX);
  const now = performance.now(); samples.push({ x: e.clientX, t: now });
  while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
});
function release() {
  if (!drag) return;
  drag = null; dial.classList.remove('is-drag');
  const a = samples[0], b = samples[samples.length - 1];
  let v = b.t - a.t > 8 ? -((b.x - a.x) / scale() / (b.t - a.t)) * 1000 / PX : 0;     // days per second
  v = Math.max(-60, Math.min(60, v));
  target = Math.max(0, Math.min(MAXD, Math.round(pos + v * 0.3)));
  vel = v; spring = true;
}
dial.addEventListener('pointerup', release); dial.addEventListener('pointercancel', release);
dial.addEventListener('keydown', (e) => {
  const d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
  if (!d) return;
  e.preventDefault(); target = Math.max(0, Math.min(MAXD, Math.round(target) + d)); spring = true;
});
dial.addEventListener('wheel', (e) => { e.preventDefault(); target = Math.max(0, Math.min(MAXD, Math.round(pos) + Math.sign(e.deltaX || e.deltaY))); spring = true; }, { passive: false });
$('#set').addEventListener('click', () => { $('#set').textContent = 'Date set'; setTimeout(() => ($('#set').textContent = 'Set go-live date'), 1400); });
read(PROMISED);
requestAnimationFrame(loop);
</script>
<script>
  /* ---- harness glue: the 1200 × 750 frame the original was drawn in, scaled to the window; a ghost hand plays it; real input takes over ---- */
  const ABORT = { abort: true };
  function vpfit() {
    const vp = document.querySelector('.vp'), ui = document.querySelector('.qm-ui');
    const go = () => {
      const bar = QM.tile || !ui ? 0 : 46;
      const k = Math.min(innerWidth / 1200, (innerHeight - bar) / 750);
      vp.style.transform = `translate(${(innerWidth - 1200 * k) / 2}px, ${(innerHeight - bar - 750 * k) / 2}px) scale(${k})`;
    };
    addEventListener('resize', go); go();
  }
  const hand = (() => {
    let x = innerWidth * 0.82, y = innerHeight * 0.86, held = null, over = null, gen = 0;
    const ease = QM.bezier(0.65, 0, 0.35, 1);
    const under = () => held || document.elementFromPoint(x, y) || document.body;
    const ev = (type, el, buttons) => el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, composed: true, pointerId: 7, pointerType: 'mouse', isPrimary: true, clientX: x, clientY: y, button: 0, buttons }));
    const chain = (el) => { const s = []; for (let n = el; n; n = n.parentElement) s.push(n); return s; };
    function hover(el) {
      if (el === over) return;
      const keep = new Set(chain(el));
      chain(over).forEach((n) => { if (!keep.has(n)) n.classList.remove('is-hover'); });
      chain(el).forEach((n) => n.classList.add('is-hover'));
      over = el;
    }
    const api = {
      cancel() { gen++; },
      async wait(ms) { const my = gen; await QM.wait(ms); if (my !== gen) throw ABORT; },
      async to(tx, ty, ms = 700) {
        const my = gen, x0 = x, y0 = y, t0 = performance.now();
        QM.ghostShow();
        if (Math.hypot(tx - x0, ty - y0) < 1) { await Promise.resolve(); if (my !== gen) throw ABORT; return; }
        for (;;) {
          await new Promise(requestAnimationFrame);
          if (my !== gen) throw ABORT;
          const p = Math.min(1, (performance.now() - t0) / ms), k = ease(p);
          x = x0 + (tx - x0) * k; y = y0 + (ty - y0) * k;
          QM.ghostAt(x, y);
          const el = under(); hover(el); ev('pointermove', el, held ? 1 : 0);
          if (p >= 1) return;
        }
      },
      down() { held = under(); ev('pointerdown', held, 1); },
      up() { const el = held || under(); ev('pointerup', el, 0); held = null; },
      release() { if (held) api.up(); },
    };
    return api;
  })();

  async function story() {
    jump(PROMISED);
    const r = dial.getBoundingClientRect(), y = r.top + r.height * 0.4, cx = r.left + r.width / 2, k = r.width / dial.offsetWidth;
    await hand.to(cx - 60 * k, y, 600);
    hand.down();
    await hand.to(cx + 90 * k, y, 900);
    await hand.to(cx + 70 * k, y, 300);
    await hand.to(cx - 150 * k, y, 150);                    // the flick
    hand.up(); await hand.wait(1700);
    await hand.to(cx + 40 * k, y, 500);
    hand.down();
    await hand.to(cx - 55 * k, y, 700);
    hand.up(); await hand.wait(1200);
  }
  let paused = false, running = false, lastReal = -1e9;
  function cancelStory() { hand.cancel(); QM.ghostHide(); hand.release(); running = false; }
  if (!QM.tile) {
    const real = (e) => { if (e.isTrusted) { lastReal = performance.now(); if (running) cancelStory(); } };
    ['pointerdown', 'pointermove', 'keydown', 'touchstart'].forEach((n) => addEventListener(n, real, { capture: true, passive: true }));
  }
  addEventListener('message', (e) => { const m = e.data; if (m && m.qm === 'cmd' && m.cmd === 'pause') { paused = true; cancelStory(); } });
  (async function idle() {
    for (;;) {
      await QM.wait(250);
      if (QM.reduced || paused || document.hidden || (!QM.tile && performance.now() - lastReal < 2500)) continue;
      running = true;
      try { await story(); } catch (e) { if (e !== ABORT) throw e; }
      if (running) { QM.ghostHide(); hand.release(); }
      running = false;
    }
  })();
  vpfit();
  QM.demo({ kind: 'loop', restart() { paused = false; lastReal = -1e9; if (running) cancelStory(); } });
</script>
